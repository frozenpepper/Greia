name: Greia recovery cleanup

on:
  push:
    branches:
      - archive/pip-kids-os-v0.12-exact
    paths:
      - .recovery/cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary recovery transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Greia Recovery"
          git config user.email "recovery@greia.invalid"
          git rm -f \
            .github/workflows/greia-text-recovery.yml \
            .github/workflows/greia-recovery-cleanup.yml \
            .recovery/text-recovery-trigger \
            .recovery/cleanup-trigger \
            .recovery/text-bundle/chunk-00 \
            .recovery/text-bundle/chunk-01 \
            .recovery/text-bundle/chunk-02 \
            .recovery/text-bundle/chunk-03 \
            .recovery/text-bundle/chunk-04 \
            .recovery/text-bundle/chunk-05 \
            .recovery/text-bundle/chunk-06
          git commit -m "recovery: remove temporary text transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
