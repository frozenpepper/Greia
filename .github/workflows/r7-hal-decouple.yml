name: R7 HAL decoupling

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-hal-decouple.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r7-direct-graphics
          fetch-depth: 0

      - name: Install verification dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Apply R7-A HAL decoupling
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Generic HAL contains semantic contracts only; X implementation moves out.
          hal = Path('src/greia_platform/hal.py')
          text = hal.read_text(encoding='utf-8')
          text = text.replace('import os\n', '')
          text = text.replace('from .hardware_session import XSessionHardwareController\n', '')
          start = text.index('\n\nclass LegacyXDisplayHAL:')
          end = text.index('\n\n@dataclass(frozen=True, slots=True)\nclass LinuxAudioHAL:', start)
          text = text[:start] + text[end:]
          hal.write_text(text, encoding='utf-8')

          Path('src/greia_platform/hal_legacy_x.py').write_text('''from __future__ import annotations\n\nfrom .hal import DisplayState, InputState\nfrom .hardware_session import XSessionHardwareController\n\n\nclass LegacyXDisplayHAL:\n    """Compatibility DisplayHAL backed by the provisional X session."""\n\n    def __init__(self, controller: XSessionHardwareController | None = None):\n        self._controller = controller or XSessionHardwareController()\n\n    def probe(self) -> DisplayState:\n        display = self._controller.probe_display()\n        return DisplayState(\n            available=display.output_name is not None,\n            modes=display.modes,\n            backend="legacy-x11",\n        )\n\n\nclass LegacyXInputHAL:\n    """Compatibility InputHAL backed by XInput during the R7 migration."""\n\n    def __init__(self, controller: XSessionHardwareController | None = None):\n        self._controller = controller or XSessionHardwareController()\n\n    def probe(self) -> InputState:\n        return InputState(\n            pointer=self._controller.pointer_available(),\n            keyboard=self._controller.keyboard_available(),\n            backend="legacy-x11",\n        )\n''', encoding='utf-8')

          # The settings watcher is reusable orchestration and consumes a protocol.
          rep(
              'src/greia_platform/hardware_session.py',
              'class XSessionHardwareController:\n',
              'class HardwareSessionController(Protocol):\n    """Backend-neutral display/input settings controller used by the watcher."""\n\n    def topology_token(self) -> tuple[str, ...]: ...\n\n    def probe_display(self) -> DisplayProbe: ...\n\n    def apply(self, settings: HardwareSettings) -> ApplyResult: ...\n\n\nclass XSessionHardwareController:\n',
          )
          rep(
              'src/greia_platform/hardware_session.py',
              '    def pointer_available(self) -> bool:\n        """Return whether the provisional X backend currently exposes a pointer."""\n\n        return bool(self._list_pointer_devices())\n\n    def _list_pointer_devices(self) -> tuple[tuple[str, bool], ...]:\n',
              '    def pointer_available(self) -> bool:\n        """Return whether the provisional X backend currently exposes a pointer."""\n\n        return bool(self._list_pointer_devices())\n\n    def keyboard_available(self) -> bool:\n        """Return whether XInput exposes a real keyboard on the active seat."""\n\n        completed = self.runner.run(["xinput", "--list", "--short"])\n        if completed.returncode != 0:\n            return False\n        return any(\n            "id=" in line and "slave  keyboard" in line.casefold()\n            for line in completed.stdout.splitlines()\n        )\n\n    def _list_pointer_devices(self) -> tuple[tuple[str, bool], ...]:\n',
          )
          rep(
              'src/greia_platform/hardware_session.py',
              '    controller: XSessionHardwareController | None = None,\n) -> int:\n    controller = controller or XSessionHardwareController()\n',
              '    controller: HardwareSessionController | None = None,\n) -> int:\n    controller = controller or XSessionHardwareController()\n',
          )
          rep(
              'src/greia_platform/hardware_session.py',
              '    last_topology_token: tuple[str, str] | None = None\n',
              '    last_topology_token: tuple[str, ...] | None = None\n',
          )

          # Installed composition explicitly imports the compatibility backend.
          rep(
              'src/greia_launcher/composition.py',
              'from greia_platform.hal import (\n    GreiaHAL,\n    LegacyXDisplayHAL,\n    LegacyXInputHAL,\n    LinuxAudioHAL,\n',
              'from greia_platform.hal import (\n    GreiaHAL,\n    LinuxAudioHAL,\n',
          )
          rep(
              'src/greia_launcher/composition.py',
              ')\nfrom greia_platform.hardware_session import XSessionHardwareController\n',
              ')\nfrom greia_platform.hal_legacy_x import LegacyXDisplayHAL, LegacyXInputHAL\nfrom greia_platform.hardware_session import XSessionHardwareController\n',
          )

          # Existing X tests now include a real keyboard in XInput topology.
          rep(
              'tests/test_hardware_session.py',
              '            output = "↳ SynPS/2 Synaptics TouchPad id=12 [slave  pointer  (2)]\\n↳ USB Mouse id=13 [slave  pointer  (2)]\\n"\n',
              '            output = "↳ SynPS/2 Synaptics TouchPad id=12 [slave  pointer  (2)]\\n↳ USB Mouse id=13 [slave  pointer  (2)]\\n↳ AT Translated Set 2 keyboard id=14 [slave  keyboard (3)]\\n"\n',
          )
          rep(
              'tests/test_hardware_session.py',
              '        self.assertIn(\n            ("xrandr", "--output", "LVDS1", "--mode", "1024x600"),\n            runner.commands,\n        )\n',
              '        self.assertIn(\n            ("xrandr", "--output", "LVDS1", "--mode", "1024x600"),\n            runner.commands,\n        )\n        self.assertTrue(controller.pointer_available())\n        self.assertTrue(controller.keyboard_available())\n',
          )

          Path('tests/test_hal_legacy_x.py').write_text('''from __future__ import annotations\n\nimport os\nimport subprocess\nimport unittest\nfrom unittest.mock import patch\n\nfrom greia_platform.hal_legacy_x import LegacyXInputHAL\nfrom greia_platform.hardware_session import XSessionHardwareController\n\n\nclass _Runner:\n    def run(self, command):\n        command = tuple(command)\n        if command == ("xinput", "--list", "--short"):\n            output = (\n                "↳ USB Mouse id=13 [slave  pointer  (2)]\\n"\n                "↳ AT Translated Set 2 keyboard id=14 [slave  keyboard (3)]\\n"\n            )\n            return subprocess.CompletedProcess(command, 0, output, "")\n        return subprocess.CompletedProcess(command, 1, "", "unsupported")\n\n\nclass LegacyXHALTests(unittest.TestCase):\n    def test_input_capability_is_probed_not_inferred_from_display_environment(self) -> None:\n        controller = XSessionHardwareController(_Runner())\n        with patch.dict(os.environ, {}, clear=True):\n            state = LegacyXInputHAL(controller).probe()\n        self.assertTrue(state.pointer)\n        self.assertTrue(state.keyboard)\n        self.assertEqual(state.backend, "legacy-x11")\n\n    def test_generic_hal_module_contains_no_x_session_dependency(self) -> None:\n        import greia_platform.hal as hal\n\n        source = open(hal.__file__, encoding="utf-8").read()\n        self.assertNotIn("XSessionHardwareController", source)\n        self.assertNotIn("DISPLAY", source)\n        self.assertNotIn("hardware_session", source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Compile and focused R7 tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests tools activities
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_hal_legacy_x.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_hardware_session.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_device_capabilities.py' -v

      - name: Source boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'XSessionHardwareController' src/greia_platform/hal.py
          ! grep -F 'DISPLAY' src/greia_platform/hal.py
          grep -F 'class HardwareSessionController(Protocol):' src/greia_platform/hardware_session.py
          grep -F 'class LegacyXDisplayHAL:' src/greia_platform/hal_legacy_x.py
          grep -F 'class LegacyXInputHAL:' src/greia_platform/hal_legacy_x.py

      - name: Full provider-free gate
        run: make verify

      - name: Commit R7-A source decoupling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            src/greia_platform/hal.py \
            src/greia_platform/hal_legacy_x.py \
            src/greia_platform/hardware_session.py \
            src/greia_launcher/composition.py \
            tests/test_hardware_session.py \
            tests/test_hal_legacy_x.py
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'refactor: isolate legacy X below Greia HAL'
          git push origin HEAD:r7-direct-graphics
