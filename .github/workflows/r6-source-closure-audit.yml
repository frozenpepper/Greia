# executable source-closure audit trigger
name: R6 source closure audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-source-closure-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install verification dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile and run recoverable suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests tools activities
          PYTHONPATH=src python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/r6-tests.log
          grep -F 'Ran 172 tests' /tmp/r6-tests.log
          grep -F 'OK' /tmp/r6-tests.log

      - name: Verify R6 source architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'class GreiaHAL:' src/greia_platform/hal.py
          grep -F 'class DisplayHAL(Protocol):' src/greia_platform/hal.py
          grep -F 'class InputHAL(Protocol):' src/greia_platform/hal.py
          grep -F 'class DeviceCapabilityService:' src/greia_platform/device_capabilities.py
          grep -F 'class HALDeviceCapabilityProbe:' src/greia_platform/device_capabilities.py
          grep -F 'build_launcher_runtime_services(' src/greia_launcher/main.py
          grep -F 'device_capabilities = DeviceCapabilityService(' src/greia_launcher/composition.py
          grep -F 'device_capabilities=device_capabilities' src/greia_launcher/composition.py
          grep -F 'RuntimeManager(' src/greia_launcher/composition.py
          grep -F 'device_capabilities,' src/greia_launcher/composition.py
          grep -F 'storage_service=storage_service' src/greia_launcher/composition.py
          grep -F 'device_snapshot_token=device_snapshot.token' src/greia_platform/permissions.py
          grep -F 'expected_device_snapshot_token=authority.device_snapshot_token' src/greia_launcher/supervisor.py
          grep -F 'device capability snapshot changed after launch authority was issued' src/greia_launcher/runtime_adapter.py
          grep -F 'ActivityStorageService(StoragePolicy.load(storage_policy_path))' src/greia_launcher/composition.py
          grep -F 'GREIA_STORAGE_SOCKET' src/greia_launcher/supervisor.py
          grep -F 'GREIA_STORAGE_TOKEN' src/greia_launcher/supervisor.py
          grep -F 'ActivityStorageBroker.start' src/greia_launcher/supervisor.py
          grep -F 'class RuntimeCommand:' src/greia_launcher/runtime_adapter.py
          grep -F 'class RuntimeInvocation:' src/greia_launcher/runtime_adapter.py
          grep -F 'class RuntimeLifecycleBinding:' src/greia_launcher/runtime_adapter.py
          grep -F 'def create_lifecycle_binding(' src/greia_launcher/runtime_adapter.py
          grep -F 'def collect_exit(' src/greia_launcher/runtime_adapter.py
          grep -F 'def force_stop(' src/greia_launcher/runtime_adapter.py
          grep -F 'def cleanup(' src/greia_launcher/runtime_adapter.py
          grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/runtime_adapter.py
          grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/runtime_adapter.py
          ! grep -F 'ActivityControlChannel' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/supervisor.py
          ! grep -F 'subprocess.Popen' src/greia_launcher/supervisor.py
          ! grep -F 'signal_process_group' src/greia_launcher/supervisor.py
          grep -F 'GREIA_ACTIVITY_SESSION_ID' src/greia_launcher/supervisor.py
          grep -F 'class LegacyXDisplayHAL:' src/greia_platform/hal.py
          grep -F 'R7 replaces the legacy-X' src/greia_platform/hal.py

      - name: Confirm the only current full-gate blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          make verify >/tmp/r6-make-verify.log 2>&1
          status=$?
          set -e
          cat /tmp/r6-make-verify.log
          test "$status" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/r6-make-verify.log
          ! grep -F 'FAILED (' /tmp/r6-make-verify.log

      - name: Persist R6 source closure audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          audit = f'''# Greia R6 source-closure audit — 2026-08-09

**Audited checkout:** `{head}`  
**R6.2 implementation milestone:** `94f93941db32a91e77c8af09f0eab4bb7c28bc07`  
**Result:** **R6.2 SOURCE ARCHITECTURE PASS; R6 OVERALL NOT CLOSED**  
**Recoverable provider-free suite:** **172/172 PASS**

## Scope

This audit checks the R6 source architecture against ADR 0012, ADR 0014, ADR 0015 and the R6/R6.2 criteria in the active remediation plan. It deliberately separates source-architecture closure from the lost post-v0.12 R5 authority and from hardware-only evidence.

## R6.1 device/HAL boundary

PASS at source level:

- typed display/input/audio/removable/network/power HAL protocols exist below `GreiaHAL`;
- `DeviceCapabilityService` is the semantic hardware truth exposed upward;
- the installed composition creates one HAL-backed Device Capability Service and injects that same object into PermissionBroker and RuntimeManager;
- Activity manifest/environment strings cannot become hardware authority;
- legacy X display/input is explicitly a provisional HAL backend, not an interface-level dependency.

Physical Acer/Pi/direct-graphics behavior is **not** claimed by this source audit.

## R6.2 Runtime Adapter contract

PASS at source level:

1. Activity Registry remains runtime-neutral and owns shared package facts only.
2. Python static/package validation lives behind `PythonRuntimeAdapter`.
3. RuntimeManager owns runtime lookup and compatibility against trusted semantic device capability.
4. ActivityAuthority is bound to the device snapshot token used for permission/capability issuance.
5. Supervisor requires RuntimeManager compatibility to use the same device snapshot before process creation.
6. `RuntimeCommand` owns runtime-specific command, in-package cwd and bounded runtime environment; Python-only environment policy is not in Supervisor.
7. Runtime adapters own final runtime handle creation through `RuntimeInvocation`.
8. Runtime adapters own exit collection/normalization, force-stop and runtime-handle cleanup.
9. Platform session identity is allocated independently of runtime transport.
10. Runtime adapters own lifecycle transport through `RuntimeLifecycleBinding`; Python owns its READY/STOP marker implementation.
11. Supervisor contains no Python marker paths, no `ActivityControlChannel`, no direct `Popen`, and no process-group signaling.
12. R4 Universal Storage is shared platform authority: Supervisor opens the durable Activity namespace, exposes only broker socket/token, mounts only the ephemeral broker root, and tears it down with the session.

This is the intended polymorphic seam for future Web/native runtime adapters: they replace runtime validation/transport/handle behavior without forking Greia identity, permission, device, storage, session or progression policy.

## Executable evidence

Fresh GitHub checkout audit:

```text
Python compile: PASS
provider-free unit suite: 172/172 PASS
installed composition static invariants: PASS
snapshot-coherence static invariants: PASS
storage-broker launch transport invariants: PASS
runtime-command/session/lifecycle adapter ownership invariants: PASS
Supervisor runtime-neutrality static checks: PASS
```

The complete `make verify` command runs through the 172-test unit suite and then stops in `tools/validate_project.py` solely because:

```text
ModuleNotFoundError: No module named 'greia_platform.history'
```

No recoverable unit-test failure precedes that boundary.

## Why R6 is still not closed

This audit does **not** override R0 continuity rules. The post-v0.12 R5 source `src/greia_platform/history.py` (and associated historical tests) was never persisted and cannot currently be recovered. That missing authority prevents:

- full clean-clone `make verify` PASS;
- honest restoration of R5 History/Progression policy implementation;
- wiring/verification of the existing R5 event broker against its real History/Progression authority;
- a repository-complete proof that R1–R6 are all mutually coherent.

Therefore:

```text
R6.1 source architecture: PASS / hardware evidence remains later
R6.2 source architecture: PASS
R6 overall phase closure: BLOCKED by R0/R5 source continuity
R7: MUST NOT START
```

## Required decision to move forward

The exact historical R5 source has been exhaustively searched and is unavailable. Continuing now requires an explicit project decision to treat R5 History/Progression as a **new reviewed reimplementation from accepted ADR 0017 + surviving R5 policy/protocol/broker contracts**, not as recovered source. That reimplementation must be separately reviewed, tested and committed, after which full clean-clone verification can expose any remaining continuity gaps.
'''
          audit_path = Path('docs/reviews/2026-08-09_R6_SOURCE_CLOSURE_AUDIT.md')
          if audit_path.exists():
              raise SystemExit('R6 source closure audit already exists')
          audit_path.write_text(audit, encoding='utf-8')

          plan = Path('docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md')
          marker = '---\n\n# 9. Final completion criteria'
          entry = '''## 2026-08-09 — R6 source-closure audit\n\n- Implemented/audited: executable clean-checkout audit re-proved the typed HAL/device boundary, installed shared Device Capability Service composition, snapshot-bound launch authority, runtime-neutral Registry, adapter-owned runtime command/environment/cwd, adapter-owned runtime handle/exit/force-stop/cleanup, adapter-owned Python lifecycle transport, and platform-owned brokered Universal Storage launch transport.\n- Tests/evidence: Python compile PASS; **172/172** recoverable provider-free tests PASS; static R6 architecture checks PASS; `make verify` reaches project validation and stops only at the known lost post-v0.12 `greia_platform.history` import.\n- Decision: **R6.2 source architecture is PASS** against ADR 0012/0014/0015 and the active-plan runtime-adapter criteria. **R6 overall remains IN PROGRESS/BLOCKED**, because R0 requires a complete clean-clone gate and the lost R5 History/Progression authority also blocks honest event/session integration. Hardware/direct-graphics evidence is not promoted by source tests.\n- Remaining blocker: exact historical R5 History/Progression source is unavailable after exhaustive recovery. Further progress requires an explicit decision to reimplement that R5 authority as new reviewed code from accepted ADR 0017 and surviving contracts rather than pretending it is recovered.\n- Next exact step: if reimplementation is authorized, reconstruct R5 History/Progression behind the existing policy/event/storage boundaries, restore event broker/session integration, run the complete gate, then re-run R6 closure. Do not begin R7 before that.\n- Evidence document: `docs/reviews/2026-08-09_R6_SOURCE_CLOSURE_AUDIT.md`.\n\n'''
          text = plan.read_text(encoding='utf-8')
          if entry.splitlines()[0] in text or text.count(marker) != 1:
              raise SystemExit('active plan audit insertion precondition failed')
          plan.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')

          hand = Path('HANDOVER.md')
          marker = '---\n\n## 2. Mandatory resume order'
          section = '''## R6 source-closure audit — 2026-08-09\n\nAn executable fresh-checkout audit now classifies **R6.2 source architecture as PASS** with **172/172 recoverable provider-free tests PASS**. The installed launcher uses the shared HAL-backed Device Capability Service for PermissionBroker and RuntimeManager; launch authority is snapshot-bound; Universal Storage is brokered into real Activity sessions; runtime-specific validation, environment/cwd, runtime-handle creation, exit normalization, force-stop, cleanup and lifecycle transport all live behind the Runtime Adapter/RuntimeManager seam. Supervisor no longer contains Python marker paths, concrete `ActivityControlChannel`, direct `Popen`, or process-group signaling. R6 as a whole is **not closed**: full `make verify` still stops only at the lost post-v0.12 `src/greia_platform/history.py`, which also prevents honest R5 event/session/progression integration. The next project decision is whether to authorize a new reviewed R5 History/Progression reimplementation from ADR 0017 and surviving contracts. R7 must not start first. See `docs/reviews/2026-08-09_R6_SOURCE_CLOSURE_AUDIT.md`.\n\n'''
          text = hand.read_text(encoding='utf-8')
          if section.splitlines()[0] in text or text.count(marker) != 1:
              raise SystemExit('handover audit insertion precondition failed')
          hand.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Commit closure audit records
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            docs/reviews/2026-08-09_R6_SOURCE_CLOSURE_AUDIT.md \
            docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md \
            HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-audit
          git config user.email greia-r6-audit@users.noreply.github.com
          git commit -m 'docs: record executable R6 source closure audit'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
