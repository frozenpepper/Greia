name: R7 gate stale GRUB identity test correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-fix-stale-grub-test.yml"

permissions:
  contents: write

jobs:
  fix-gate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct stale test identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_system_overlay_contract.py')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace('set superusers="pip-recovery"', 'set superusers="greia-recovery"')
          text = text.replace('password_pbkdf2 pip-recovery', 'password_pbkdf2 greia-recovery')
          if text == old:
              raise SystemExit('expected stale pip-recovery assertions were not found')
          if 'pip-recovery' in text:
              raise SystemExit('stale pip-recovery reference remains in test contract')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow

      - name: Focused identity contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest \
            tests.test_boot_contract \
            tests.test_system_overlay_contract

      - name: Full provider-free gate
        shell: bash
        run: |
          set -euo pipefail
          make verify

      - name: Commit exact tested correction and remove gate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-fix-stale-grub-test.yml
          git add tests/test_system_overlay_contract.py
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'test: align overlay GRUB contract with Greia recovery identity'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
