name: R0 recover ADR 0012

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r0-recover-adr0012.yml"
      - "docs/recovery/r0-payload/adr0012-greia.xz.b64.*"

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Decode and verify canonical Greia ADR 0012
        shell: bash
        run: |
          set -euo pipefail
          cat docs/recovery/r0-payload/adr0012-greia.xz.b64.* \
            | tr -d '\n' \
            | base64 --decode > /tmp/adr0012.md.xz
          echo "04e940011f805c8601c6223673d9d83f2ae839d6fc7088b3c6c45b5689969e1b  /tmp/adr0012.md.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/adr0012.md.xz > /tmp/adr0012.md
          echo "1b5cfa483985d00cadcb99bbbe5e77ac2e4acf8c3aa40a7f21fef0db7f2ac0b9  /tmp/adr0012.md" | sha256sum --check --strict
          if grep -En 'Pip Kids OS|pip_platform|pip_launcher|pip_parent|pip_installer|/etc/pip-os|/var/lib/pip-profiles|/opt/pip-os|PIP_|globalThis\.Pip|org\.pipworkshop' /tmp/adr0012.md; then
            echo "obsolete Pip technical identity remains in canonical ADR" >&2
            exit 1
          fi
          install -m 0644 /tmp/adr0012.md docs/adr/0012-platform-architecture-constitution.md
          git diff --check

      - name: Commit recovered Greia constitution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greia-r0-recovery"
          git config user.email "greia-r0-recovery@users.noreply.github.com"
          git add docs/adr/0012-platform-architecture-constitution.md
          if git diff --cached --quiet; then
            echo "ADR 0012 already matches recovered canonical payload."
            exit 0
          fi
          git commit -m "restore: recover Greia platform architecture constitution"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
