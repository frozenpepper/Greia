name: R7 production image-builder reproducibility repair v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-builder-repro-fix-v2.yml"

permissions:
  contents: write

jobs:
  repair-verify-build-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bounded builder repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one repair anchor')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'build/build-image.sh',
              'rsync -a "$PROJECT_ROOT/build/overlay/" "$ROOTFS/"\n',
              '''# Repository checkout ownership is never target-filesystem authority.\n# Static appliance overlay files are installed as root regardless of the UID/GID\n# of the developer or CI checkout that produced the image.\nrsync -a --chown=root:root "$PROJECT_ROOT/build/overlay/" "$ROOTFS/"\n[[ "$(stat -c '%u:%g' "$ROOTFS")" == "0:0" ]] || {\n  echo "Greia overlay changed target root ownership away from root:root." >&2\n  exit 1\n}\n''',
          )
          replace_once(
              'build/build-image.sh',
              '''chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive \\\n  apt-get install -y --no-install-recommends "${packages[@]}"\n''',
              '''# Greia intentionally pre-seeds appliance conffiles in the overlay. dpkg's\n# conffile prompt is independent of debconf, so make product ownership explicit.\nchroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive \\\n  apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends "${packages[@]}"\n''',
          )
          replace_once(
              'build/build-installer-image.sh',
              'rsync -a "$SCRIPT_DIR/installer-overlay/" "$LIVE_ROOT/"\n',
              '''# Repository checkout ownership is never live-image filesystem authority.\nrsync -a --chown=root:root "$SCRIPT_DIR/installer-overlay/" "$LIVE_ROOT/"\n[[ "$(stat -c '%u:%g' "$LIVE_ROOT")" == "0:0" ]] || {\n  echo "Greia installer overlay changed live root ownership away from root:root." >&2\n  exit 1\n}\n''',
          )
          replace_once(
              'build/build-installer-image.sh',
              'chroot "$LIVE_ROOT" /usr/bin/env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"\n',
              '''# Keep intentionally pre-seeded Greia conffiles without any dpkg prompt.\nchroot "$LIVE_ROOT" /usr/bin/env DEBIAN_FRONTEND=noninteractive \\\n  apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends "${packages[@]}"\n''',
          )
          PY

          cat > build/lib/safe-cleanup.sh <<'SH'
          #!/usr/bin/env bash
          # Shared destructive-build cleanup helpers. Source from bash with set -Eeuo.

          safe_unmount_path_tree() {
            local path="$1"
            [[ -n "$path" ]] || return 0
            mountpoint -q -- "$path" || return 0

            local targets=()
            local index target failed=0
            mapfile -t targets < <(findmnt -rn -R -o TARGET --target "$path" 2>/dev/null || true)
            for (( index=${#targets[@]}-1; index>=0; index-- )); do
              target="${targets[$index]}"
              [[ -n "$target" ]] || continue
              case "$target" in
                "$path"|"$path"/*) ;;
                *)
                  echo "ERROR: refusing cleanup target outside requested mount tree: $target" >&2
                  failed=1
                  continue
                  ;;
              esac
              if mountpoint -q -- "$target"; then
                umount -- "$target" 2>/dev/null || true
              fi
              if mountpoint -q -- "$target"; then
                umount -l -- "$target" 2>/dev/null || true
              fi
              if mountpoint -q -- "$target"; then
                echo "ERROR: mount is still attached; preserving build directory: $target" >&2
                failed=1
              fi
            done
            return "$failed"
          }

          safe_unmount_paths() {
            local paths=("$@")
            local failed=0
            local index path
            for (( index=${#paths[@]}-1; index>=0; index-- )); do
              path="${paths[$index]}"
              [[ -n "$path" ]] || continue
              safe_unmount_path_tree "$path" || failed=1
            done
            return "$failed"
          }

          safe_detach_loop() {
            local loop_device="${1:-}"
            [[ -n "$loop_device" ]] || return 0
            local attempt
            for attempt in {1..20}; do
              if ! losetup "$loop_device" >/dev/null 2>&1; then
                return 0
              fi
              losetup -d "$loop_device" 2>/dev/null || true
              if ! losetup "$loop_device" >/dev/null 2>&1; then
                return 0
              fi
              sleep 0.05
            done
            echo "ERROR: loop device is still attached: $loop_device" >&2
            return 1
          }

          safe_remove_build_dir() {
            local build_dir="$1"
            [[ -n "$build_dir" && "$build_dir" != "/" ]] || return 1
            if findmnt -rn -R "$build_dir" 2>/dev/null | grep -q .; then
              echo "ERROR: refusing to remove build tree with live mounts: $build_dir" >&2
              return 1
            fi
            rm -rf --one-file-system -- "$build_dir"
          }
          SH

          cat > tests/test_build_reproducibility.py <<'PYTEST'
          from __future__ import annotations

          import unittest
          from pathlib import Path


          PROJECT_ROOT = Path(__file__).resolve().parents[1]


          class BuildReproducibilityTests(unittest.TestCase):
              def test_checkout_ownership_cannot_leak_into_image_roots(self) -> None:
                  target = (PROJECT_ROOT / "build/build-image.sh").read_text(encoding="utf-8")
                  installer = (PROJECT_ROOT / "build/build-installer-image.sh").read_text(encoding="utf-8")
                  self.assertIn("rsync -a --chown=root:root", target)
                  self.assertIn("rsync -a --chown=root:root", installer)
                  self.assertIn("target root ownership away from root:root", target)
                  self.assertIn("live root ownership away from root:root", installer)

              def test_product_conffiles_are_kept_without_dpkg_prompt(self) -> None:
                  target = (PROJECT_ROOT / "build/build-image.sh").read_text(encoding="utf-8")
                  installer = (PROJECT_ROOT / "build/build-installer-image.sh").read_text(encoding="utf-8")
                  for builder in (target, installer):
                      self.assertIn("DEBIAN_FRONTEND=noninteractive", builder)
                      self.assertIn("Dpkg::Options::=--force-confold", builder)

              def test_cleanup_walks_bind_submounts_and_retries_loop_detach(self) -> None:
                  helper = (PROJECT_ROOT / "build/lib/safe-cleanup.sh").read_text(encoding="utf-8")
                  self.assertIn("safe_unmount_path_tree", helper)
                  self.assertIn("findmnt -rn -R -o TARGET --target", helper)
                  self.assertIn('"$path"|"$path"/*', helper)
                  self.assertIn("mapfile -t targets", helper)
                  self.assertIn("for attempt in {1..20}", helper)


          if __name__ == "__main__":
              unittest.main()
          PYTEST
          chmod 0755 build/lib/safe-cleanup.sh
          git diff --check

      - name: Install gate and image-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync

      - name: Focused builder regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests tools activities
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_build_reproducibility.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_system_overlay_contract.py' -v

      - name: Full provider-free gate
        shell: bash
        run: |
          set -euo pipefail
          make verify

      - name: Persist verified builder repair
        shell: bash
        run: |
          set -euo pipefail
          git add build/build-image.sh build/build-installer-image.sh build/lib/safe-cleanup.sh tests/test_build_reproducibility.py
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'build: make image assembly ownership-safe and noninteractive'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          git rev-parse HEAD | tee /tmp/r7-builder-repair-sha

      - name: Build production modern-amd64 image
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          mkdir -p "$out"
          sudo build/build-image.sh modern-amd64 "$out"
          image="$out/greia-os-modern-amd64.img"
          test -s "$image"
          test -s "$out/greia-os-modern-amd64-footprint.txt"
          sha256sum "$image" | tee /tmp/r7-image-sha256
          cp "$out/greia-os-modern-amd64-footprint.txt" /tmp/r7-footprint.txt
          if sudo losetup -a | grep -F "$image"; then
            echo 'production builder leaked a loop device after successful completion' >&2
            exit 1
          fi

      - name: Inspect exact installed SDL build
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          root="$RUNNER_TEMP/greia-r7-mounted"
          mkdir -p "$root"
          loop="$(sudo losetup --find --show --partscan "$image")"
          cleanup_probe() {
            set +e
            mountpoint -q "$root" && sudo umount "$root"
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup_probe EXIT INT TERM
          for _ in $(seq 1 20); do test -b "${loop}p1" && break; sleep 0.2; done
          test -b "${loop}p1"
          sudo mount -o ro,noload "${loop}p1" "$root"
          test "$(stat -c '%u:%g' "$root")" = '0:0'
          sudo chroot "$root" /usr/bin/env \
            PYGAME_HIDE_SUPPORT_PROMPT=1 PYTHONPATH=/opt/greia-os/src PYTHONNOUSERSITE=1 \
            python3 -m greia_platform.direct_graphics_probe \
            | tee /tmp/r7-direct-graphics-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          assert payload['schema_version'] == 1
          assert payload['passive'] is True
          assert isinstance(payload['sdl']['video_drivers'], list)
          print('compiled SDL video drivers:', ', '.join(payload['sdl']['video_drivers']))
          print('kmsdrm_compiled:', payload['sdl']['kmsdrm_compiled'])
          PY
          sudo chroot "$root" dpkg-query -W '-f=${Package}\t${Version}\t${Architecture}\n' \
            libsdl2-2.0-0 python3-pygame libdrm2 libgbm1 libegl1 \
            > /tmp/r7-graphics-packages.tsv
          cleanup_probe
          trap - EXIT INT TERM

      - name: Persist built-image evidence and remove this gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews/evidence
          cp /tmp/r7-direct-graphics-probe.json docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.json
          cp /tmp/r7-graphics-packages.tsv docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_GRAPHICS_PACKAGES.tsv
          python3 - <<'PY'
          import json
          from pathlib import Path
          source_sha = Path('/tmp/r7-builder-repair-sha').read_text().strip()
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          probe = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          packages = Path('/tmp/r7-graphics-packages.tsv').read_text().strip()
          footprint = Path('/tmp/r7-footprint.txt').read_text()
          facts = {}
          for line in footprint.splitlines():
              if '=' in line and not line.startswith((' ', '\t')):
                  key, value = line.split('=', 1)
                  facts.setdefault(key, value)
          kms = bool(probe['sdl']['kmsdrm_compiled'])
          classification = 'SDL_KMSDRM_COMPILED_ACTIVE_TEST_NEXT' if kms else 'SDL_KMSDRM_NOT_COMPILED_PACKAGING_WORK_REQUIRED'
          drivers = ', '.join(probe['sdl']['video_drivers'])
          body = f'''# R7 modern-amd64 built-image direct-graphics probe\n\n**Date:** 2026-08-09  \n**Source commit:** `{source_sha}`  \n**Build profile:** `modern-amd64`  \n**Image SHA-256:** `{image_sha}`  \n**Classification:** `{classification}`\n\nThis evidence came from the production `build/build-image.sh` path after its ownership/noninteractive-build repair. The finished raw image was mounted read-only and the installed `greia_platform.direct_graphics_probe` executed inside that exact image. No DRM master or display takeover occurred.\n\n## Installed SDL result\n\n- compiled SDL video drivers: `{drivers}`\n- `kmsdrm_compiled`: **{str(kms).lower()}**\n- Pygame metadata: `{probe['pygame']}`\n- libraries visible inside image: `{probe['libraries']}`\n- active KMSDRM test remains required: **true**\n\nThe mounted-image chroot intentionally had no guest DRM device/sysfs bound into it, so empty DRM-node/connector observations are not hardware evidence.\n\n## Image facts\n\n- architecture: `{facts.get('architecture', 'unknown')}`\n- Debian suite: `{facts.get('suite', 'unknown')}`\n- accounted filesystem use: `{facts.get('accounted_mib', 'unknown')} MiB`\n- preferred limit: `{facts.get('preferred_limit_mib', 'unknown')} MiB`\n- required limit: `{facts.get('required_limit_mib', 'unknown')} MiB`\n\n## Relevant packages\n\n```text\n{packages}\n```\n\n## Decision\n\n'''
          if kms:
              body += 'The exact production-built image enumerates SDL `kmsdrm`. Proceed to controlled active guest/physical acquisition; an SDL rebuild is not justified by packaging assumptions.\n'
          else:
              body += 'The exact production-built image does **not** enumerate SDL `kmsdrm`. Active takeover is blocked at packaging; provide and re-probe a maintained KMSDRM-capable SDL package before altering boot/session ownership.\n'
          Path('docs/reviews/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.md').write_text(body, encoding='utf-8')
          PY
          git rm .github/workflows/r7-builder-repro-fix-v2.yml
          git add docs/reviews/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.md docs/reviews/evidence
          git diff --cached --check
          git commit -m 'r7: record production-built SDL direct-graphics evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
