name: R7 production loop teardown diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-loop-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install production image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync gpgv udev util-linux

      - name: Build and preserve real exit status
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/greia-r7-loop-diagnostic"
          mkdir -p "$out"
          image="$out/greia-os-modern-amd64.img"
          set +e
          sudo build/build-image.sh modern-amd64 "$out"
          status=$?
          set -e
          printf 'BUILDER_EXIT=%s\n' "$status" | tee /tmp/r7-builder-exit.txt
          printf 'IMAGE=%s\n' "$image" | tee /tmp/r7-image-path.txt
          exit 0

      - name: Capture residual loop state before any diagnostic cleanup
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-image-path.txt
          echo '===== builder status ====='
          cat /tmp/r7-builder-exit.txt
          echo '===== exact backing-file associations ====='
          sudo losetup -j "$IMAGE" || true
          echo '===== all loop state ====='
          sudo losetup --list --output NAME,BACK-FILE,AUTOCLEAR,PARTSCAN,RO,OFFSET,SIZELIMIT || true
          echo '===== mount tree under build output ====='
          sudo findmnt -rn -R "$RUNNER_TEMP/greia-r7-loop-diagnostic" || true
          echo '===== matching loop details ====='
          loops="$(sudo losetup -j "$IMAGE" | cut -d: -f1 || true)"
          for loop in $loops; do
            echo "--- LOOP $loop ---"
            sudo losetup "$loop" || true
            sudo partx --show "$loop" || true
            sudo lsblk -o NAME,KNAME,TYPE,MAJ:MIN,SIZE,RO,MOUNTPOINTS "$loop" || true
            base="$(basename "$loop")"
            echo "sysfs backing_file:"
            sudo cat "/sys/block/$base/loop/backing_file" 2>/dev/null || true
            echo "sysfs holders:"
            sudo find "/sys/block/$base/holders" -maxdepth 1 -mindepth 1 -printf '%f -> %l\n' 2>/dev/null || true
            echo "partition holders:"
            for part in /sys/class/block/"$base"p*; do
              [ -e "$part" ] || continue
              printf '%s\n' "$part"
              sudo find "$part/holders" -maxdepth 1 -mindepth 1 -printf '%f -> %l\n' 2>/dev/null || true
            done
            echo "mounts sourced from loop:"
            sudo findmnt -rn -S "$loop" || true
            sudo findmnt -rn -S "${loop}p1" || true
            echo "process file descriptors referencing loop or partition:"
            sudo python3 - "$loop" <<'PY'
          import os
          import sys
          from pathlib import Path

          loop = Path(sys.argv[1])
          names = {str(loop), str(loop) + 'p1'}
          hits = []
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              fdroot = proc / 'fd'
              try:
                  fds = list(fdroot.iterdir())
              except OSError:
                  continue
              for fd in fds:
                  try:
                      target = os.readlink(fd)
                  except OSError:
                      continue
                  if target in names:
                      try:
                          comm = (proc / 'comm').read_text(errors='replace').strip()
                      except OSError:
                          comm = '?'
                      hits.append((proc.name, comm, fd.name, target))
          for hit in hits:
              print('\t'.join(hit))
          PY
          done

      - name: Diagnostic cleanup of only the matching image loops
        if: always()
        shell: bash
        run: |
          set -u
          . /tmp/r7-image-path.txt 2>/dev/null || exit 0
          loops="$(sudo losetup -j "$IMAGE" | cut -d: -f1 || true)"
          for loop in $loops; do
            echo "Cleaning diagnostic loop only: $loop"
            sudo partx -d "$loop" 2>/dev/null || true
            sudo udevadm settle --timeout=5 >/dev/null 2>&1 || true
            sudo blockdev --flushbufs "$loop" 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
            sudo udevadm settle --timeout=5 >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              sudo losetup "$loop" >/dev/null 2>&1 || break
              sleep 0.1
            done
          done
          echo '===== associations after diagnostic cleanup ====='
          sudo losetup -j "$IMAGE" || true
          test -z "$(sudo losetup -j "$IMAGE" 2>/dev/null || true)"
