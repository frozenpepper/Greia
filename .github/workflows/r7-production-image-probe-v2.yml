name: R7 production image SDL probe v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-production-image-probe-v2.yml"

permissions:
  contents: write

jobs:
  build-probe-record:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/r7-source-sha
          test -z "$(git status --short)"

      - name: Install production image build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync gpgv udev util-linux

      - name: Build exact modern-amd64 production image
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/greia-r7-image"
          mkdir -p "$out"
          set +e
          sudo build/build-image.sh modern-amd64 "$out"
          status=$?
          set -e
          printf '%s\n' "$status" | tee /tmp/r7-build-exit
          exit 0

      - name: Assert builder released all loop mappings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          leaked="$(sudo losetup -j "$image" 2>/dev/null || true)"
          if [ -n "$leaked" ]; then
            echo "FAIL: production builder left loop association(s):" >&2
            printf '%s\n' "$leaked" >&2
            exit 1
          fi
          echo 'PASS: production builder left no loop association.'

      - name: Require successful production build
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/r7-build-exit)"
          if [ "$status" -ne 0 ]; then
            echo "FAIL: production image builder exited $status; SDL inspection is blocked." >&2
            exit "$status"
          fi
          out="$RUNNER_TEMP/greia-r7-image"
          image="$out/greia-os-modern-amd64.img"
          test -s "$image"
          test -s "$out/greia-os-modern-amd64-footprint.txt"
          test -s "$out/greia-os-modern-amd64-image-profile.json"
          sha256sum "$image" | tee /tmp/r7-image-sha256
          cp "$out/greia-os-modern-amd64-footprint.txt" /tmp/r7-footprint.txt
          cp "$out/greia-os-modern-amd64-image-profile.json" /tmp/r7-image-profile.json

      - name: Mount finished image read-only and enumerate installed SDL
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          root="$RUNNER_TEMP/greia-r7-mounted"
          mkdir -p "$root"
          loop="$(sudo losetup --find --show --partscan --read-only "$image")"
          cleanup_probe() {
            set +e
            mountpoint -q "$root" && sudo umount "$root"
            sudo partx -d "$loop" >/dev/null 2>&1 || true
            sudo udevadm settle --timeout=5 >/dev/null 2>&1 || true
            sudo losetup -d "$loop" >/dev/null 2>&1 || true
            sudo udevadm settle --timeout=5 >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT INT TERM
          for _ in $(seq 1 20); do
            test -b "${loop}p1" && break
            sleep 0.2
          done
          test -b "${loop}p1"
          sudo mount -o ro,noload "${loop}p1" "$root"
          test "$(stat -c '%u:%g' "$root")" = '0:0'
          test -s "$root/opt/greia-os/src/greia_platform/direct_graphics_probe.py"
          test -s "$root/etc/greia-os/base-system-manifest"

          sudo chroot "$root" /usr/bin/env \
            PYGAME_HIDE_SUPPORT_PROMPT=1 \
            PYTHONPATH=/opt/greia-os/src \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -m greia_platform.direct_graphics_probe \
            | tee /tmp/r7-direct-graphics-probe.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          assert payload['schema_version'] == 1
          assert payload['passive'] is True
          assert payload['assessment']['active_kmsdrm_test_required'] is True
          assert isinstance(payload['sdl']['video_drivers'], list)
          print('SDL compiled video drivers:', ', '.join(payload['sdl']['video_drivers']))
          print('kmsdrm_compiled:', payload['sdl']['kmsdrm_compiled'])
          PY

          sudo chroot "$root" dpkg-query -W \
            '-f=${Package}\t${Version}\t${Architecture}\n' \
            libsdl2-2.0-0 python3-pygame libdrm2 libgbm1 libegl1 plymouth plymouth-label e2fsprogs \
            > /tmp/r7-graphics-packages.tsv
          cat /tmp/r7-graphics-packages.tsv
          cp "$root/etc/greia-os/base-system-manifest" /tmp/r7-base-system-manifest.txt
          cleanup_probe
          trap - EXIT INT TERM
          test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"

      - name: Record exact image evidence and next decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews/evidence
          cp /tmp/r7-direct-graphics-probe.json \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.json
          cp /tmp/r7-graphics-packages.tsv \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_GRAPHICS_PACKAGES.tsv
          cp /tmp/r7-base-system-manifest.txt \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_BASE_SYSTEM_MANIFEST.txt
          cp /tmp/r7-image-profile.json \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_PROFILE.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = Path('/tmp/r7-source-sha').read_text().strip()
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          probe = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          packages = Path('/tmp/r7-graphics-packages.tsv').read_text().strip()
          profile = json.loads(Path('/tmp/r7-image-profile.json').read_text())
          manifest = Path('/tmp/r7-base-system-manifest.txt').read_text()
          footprint = Path('/tmp/r7-footprint.txt').read_text()
          facts = {}
          for source in (manifest, footprint):
              for line in source.splitlines():
                  if '=' in line and not line.startswith((' ', '\t')):
                      key, value = line.split('=', 1)
                      facts.setdefault(key, value)

          kms = bool(probe['sdl']['kmsdrm_compiled'])
          drivers = probe['sdl']['video_drivers']
          classification = (
              'SDL_KMSDRM_COMPILED_ACTIVE_GUEST_TEST_NEXT'
              if kms else
              'SDL_KMSDRM_NOT_COMPILED_PACKAGING_WORK_REQUIRED'
          )
          body = f'''# R7 production-built modern-amd64 SDL/direct-graphics evidence\n\n**Date:** 2026-08-09  \n**Source commit:** `{source_sha}`  \n**Image profile:** `{profile['profile']['profile_id']}`  \n**Image SHA-256:** `{image_sha}`  \n**Classification:** `{classification}`\n\nThis is evidence from the exact raw image produced by Greia's production `build/build-image.sh`. The builder completed successfully and independently released every loop association before inspection. The finished image was then mounted read-only and its installed passive graphics probe executed inside that filesystem. The build used Greia's pinned Debian archive trust root and forced Debian Release signature verification. No display backend was initialized and no DRM master was acquired.\n\n## Installed SDL/Pygame\n\n- SDL compiled video drivers: `{', '.join(drivers)}`\n- `kmsdrm_compiled`: **{str(kms).lower()}**\n- Pygame metadata: `{probe['pygame']}`\n- graphics libraries visible in image: `{probe['libraries']}`\n- active KMSDRM acquisition remains required: **true**\n\nThe offline chroot intentionally did not bind a host DRM device or sysfs into the image, so DRM-node/connector fields are not hardware evidence.\n\n## Image/build facts\n\n- suite: `{facts.get('suite', 'unknown')}`\n- architecture: `{facts.get('architecture', 'unknown')}`\n- Debian version: `{facts.get('debian_version', 'unknown')}`\n- accounted filesystem use: `{facts.get('accounted_mib', 'unknown')} MiB`\n- preferred limit: `{facts.get('preferred_limit_mib', 'unknown')} MiB`\n- required limit: `{facts.get('required_limit_mib', 'unknown')} MiB`\n\n## Relevant installed packages\n\n```text\n{packages}\n```\n\n## Decision\n\n'''
          if kms:
              body += 'The exact production image enumerates SDL `kmsdrm`. Do **not** rebuild SDL. Next: boot a disposable copy in QEMU with a DRM-capable virtual GPU and run the existing active KMSDRM acceptance primitive as the only graphical session. Production boot remains Xorg until that evidence passes.\n'
          else:
              body += 'The exact production image does **not** enumerate SDL `kmsdrm`. Do not attempt active takeover. Next: establish a maintained KMSDRM-capable SDL packaging path, rebuild this exact image lineage, and repeat installed-driver enumeration before altering session ownership.\n'
          Path('docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md').write_text(body, encoding='utf-8')
          PY
          git diff --check

      - name: Commit evidence and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-production-image-probe-v2.yml
          git add docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md docs/reviews/evidence
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'r7: record exact production image SDL evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
