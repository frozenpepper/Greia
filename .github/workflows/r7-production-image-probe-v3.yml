name: R7 exact image, compositor deltas, active QEMU KMSDRM, and serial handoff evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-production-image-probe-v3.yml"
      - "build/**"
      - "src/greia_platform/direct_graphics_probe.py"
      - "src/greia_platform/kmsdrm_acceptance.py"
      - "src/greia_platform/kmsdrm_serial_handoff.py"
      - "tools/r7_compositor_package_probe.py"
      - "tools/r7_qemu_kmsdrm_acceptance.py"
      - "tools/r7_qemu_kmsdrm_handoff_acceptance.py"
      - "tests/test_kmsdrm_serial_handoff.py"
      - "tests/test_r7_compositor_package_probe.py"
      - "tests/test_r7_qemu_kmsdrm_harness.py"
      - "tests/test_r7_qemu_kmsdrm_handoff_harness.py"

permissions:
  contents: write

jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.edge.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - id: edge
        name: Run expensive probe only for a relevant latest change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(build/|src/greia_platform/(direct_graphics_probe|kmsdrm_acceptance|kmsdrm_serial_handoff)\.py$|tools/r7_(compositor_package_probe|qemu_kmsdrm(_handoff)?_acceptance)\.py$|tests/test_(kmsdrm_serial_handoff|r7_compositor_package_probe|r7_qemu_kmsdrm(_handoff)?_harness)\.py$|\.github/workflows/r7-production-image-probe-v3\.yml$)'; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi

  build-probe-record:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/r7-source-sha
          test -z "$(git status --short)"

      - name: Install production build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync gpgv udev util-linux

      - name: Build production modern-amd64 image
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          mkdir -p "$out"
          set +e
          sudo build/build-image.sh modern-amd64 "$out"
          status=$?
          set -e
          printf '%s\n' "$status" | tee /tmp/r7-build-status
          image="$out/greia-os-modern-amd64.img"
          if test -s "$image"; then
            sha256sum "$image" | tee /tmp/r7-image-sha256
          fi
          exit 0

      - name: Require builder success and zero surviving resources
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          image="$out/greia-os-modern-amd64.img"
          status="$(cat /tmp/r7-build-status)"
          leaked=""
          if test -e "$image"; then
            leaked="$(sudo losetup -j "$image" 2>/dev/null || true)"
          fi

          if test -n "$leaked"; then
            echo '=== R7 unexpected post-builder loop association ==='
            printf '%s\n' "$leaked"
            sudo losetup --list --json --output NAME,BACK-FILE,AUTOCLEAR,PARTSCAN,RO,OFFSET,SIZELIMIT || true
            sudo lsblk -a -o NAME,KNAME,MAJ:MIN,TYPE,PKNAME,MOUNTPOINTS || true
            sudo findmnt -rn -R --target "$RUNNER_TEMP" || true
            while IFS= read -r loop; do
              test -n "$loop" || continue
              name="${loop#/dev/}"
              echo "=== exact loop: $loop ==="
              sudo losetup --list --noheadings --output NAME,BACK-FILE,AUTOCLEAR,PARTSCAN,RO,OFFSET,SIZELIMIT "$loop" || true
              sudo find "/sys/class/block/$name/holders" -maxdepth 1 -mindepth 1 -printf 'holder=%f\n' 2>/dev/null || true
              sudo find "/sys/class/block/$name" -maxdepth 1 -mindepth 1 -name "${name}p*" -printf 'child=%f\n' 2>/dev/null || true
              sudo bash -c "source '$PWD/build/lib/safe-cleanup.sh'; safe_detach_loop '$loop'" || true
            done < <(printf '%s\n' "$leaked" | cut -d: -f1)
          fi

          test "$status" -eq 0 || {
            echo "production builder exited $status" >&2
            exit "$status"
          }
          test -s "$image"
          test -s "$out/greia-os-modern-amd64-footprint.txt"
          test -s "$out/greia-os-modern-amd64-image-profile.json"
          test -z "$leaked" || {
            echo 'builder returned success with a surviving loop association' >&2
            exit 1
          }
          test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"
          cp "$out/greia-os-modern-amd64-footprint.txt" /tmp/r7-footprint.txt
          cp "$out/greia-os-modern-amd64-image-profile.json" /tmp/r7-image-profile.json
          sha256sum "$image" | tee /tmp/r7-image-sha256

      - name: Inspect installed SDL in the exact finished image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          root="$RUNNER_TEMP/greia-r7-mounted"
          mkdir -p "$root"
          loop="$(sudo losetup --find --show --partscan --read-only "$image")"
          cleanup_probe() {
            set +e
            mountpoint -q "$root" && sudo umount "$root"
            sudo bash -c "source '$PWD/build/lib/safe-cleanup.sh'; safe_detach_loop '$loop'" || true
          }
          trap cleanup_probe EXIT INT TERM
          for _ in $(seq 1 30); do test -b "${loop}p1" && break; sleep 0.1; done
          test -b "${loop}p1"
          sudo mount -o ro,noload "${loop}p1" "$root"
          test "$(stat -c '%u:%g' "$root")" = '0:0'

          sudo chroot "$root" /usr/bin/env \
            PYGAME_HIDE_SUPPORT_PROMPT=1 \
            PYTHONPATH=/opt/greia-os/src \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -m greia_platform.direct_graphics_probe \
            | tee /tmp/r7-direct-graphics-probe.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          assert p['schema_version'] == 1
          assert p['passive'] is True
          assert p['assessment']['active_kmsdrm_test_required'] is True
          Path('/tmp/r7-kmsdrm-compiled').write_text(
              '1\n' if p['sdl']['kmsdrm_compiled'] else '0\n',
              encoding='utf-8',
          )
          print('SDL_COMPILED_VIDEO_DRIVERS=' + ','.join(p['sdl']['video_drivers']))
          print('KMSDRM_COMPILED=' + str(p['sdl']['kmsdrm_compiled']).lower())
          PY

          sudo chroot "$root" dpkg-query -W \
            '-f=${Package}\t${Version}\t${Architecture}\n' \
            libsdl2-2.0-0 python3-pygame libdrm2 libgbm1 libegl1 plymouth plymouth-label e2fsprogs \
            > /tmp/r7-graphics-packages.tsv
          cp "$root/etc/greia-os/base-system-manifest" /tmp/r7-base-system-manifest.txt
          cleanup_probe
          trap - EXIT INT TERM
          test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"

      - name: Measure compositor package deltas in disposable image clones
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          out="$RUNNER_TEMP/greia-r7-compositor-packages"
          mkdir -p "$out"
          image_sha="$(cat /tmp/r7-image-sha256 | awk '{print $1}')"

          for candidate in cage weston wlroots-runtime; do
            sudo python3 tools/r7_compositor_package_probe.py \
              --image "$image" \
              --output-dir "$out" \
              --candidate "$candidate" \
              > "/tmp/r7-${candidate}-package-stdout.log" \
              2> "/tmp/r7-${candidate}-package-stderr.log"
          done
          sudo chown -R "$(id -u):$(id -g)" "$out"

          for candidate in cage weston wlroots-runtime; do
            report="$out/greia-r7-${candidate}-package-probe.json"
            test -s "$report"
            cp "$report" "/tmp/r7-${candidate}-package-probe.json"
            cat "$report"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          for candidate in ('cage', 'weston', 'wlroots-runtime'):
              payload = json.loads(
                  Path(f'/tmp/r7-{candidate}-package-probe.json').read_text()
              )
              assert payload['schema_version'] == 1
              assert payload['ok'] is True
              assert payload['candidate'] == candidate
              assert payload['source_image_sha256'] == image_sha
              assert payload['source_image_sha256_after'] == image_sha
              assert payload['source_image_mutated'] is False
              assert payload['host_run_exposed'] is False
              assert payload['boot_or_service_changes'] is False
              assert payload['apt_policy'] == {
                  'install_recommends': False,
                  'upgrades_allowed': False,
                  'removals_allowed': False,
              }
              assert payload['packages']['removed'] == []
              assert payload['packages']['upgraded_or_changed'] == []
          PY

          test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"

      - name: Run active and serial-handoff QEMU evidence when KMSDRM is compiled
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/r7-kmsdrm-compiled)" != 1; then
            echo 'KMSDRM is not compiled in the exact image; active and handoff QEMU tests are intentionally skipped.'
            printf 'not-run-kmsdrm-not-compiled\n' > /tmp/r7-qemu-status
            exit 0
          fi

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86
          qout="$RUNNER_TEMP/greia-r7-qemu-active-handoff"
          mkdir -p "$qout"
          set +e
          sudo python3 tools/r7_qemu_kmsdrm_handoff_acceptance.py \
            --image "$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img" \
            --output-dir "$qout" \
            --timeout-seconds 240 \
            > /tmp/r7-qemu-stdout.log 2> /tmp/r7-qemu-stderr.log
          qstatus=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$qout" 2>/dev/null || true
          cat /tmp/r7-qemu-stdout.log || true
          cat /tmp/r7-qemu-stderr.log >&2 || true
          printf '%s\n' "$qstatus" > /tmp/r7-qemu-exit-status

          if test -s "$qout/greia-r7-qemu-kmsdrm-report.json"; then
            cp "$qout/greia-r7-qemu-kmsdrm-report.json" /tmp/r7-qemu-kmsdrm-report.json
            cat /tmp/r7-qemu-kmsdrm-report.json
          fi
          if test -s "$qout/greia-r7-qemu-kmsdrm-handoff-report.json"; then
            cp "$qout/greia-r7-qemu-kmsdrm-handoff-report.json" /tmp/r7-qemu-kmsdrm-handoff-report.json
            cat /tmp/r7-qemu-kmsdrm-handoff-report.json
          fi

          test "$qstatus" -eq 0 || {
            echo "active/serial QEMU KMSDRM harness failed with status $qstatus" >&2
            exit "$qstatus"
          }
          test -s /tmp/r7-qemu-kmsdrm-report.json
          test -s /tmp/r7-qemu-kmsdrm-handoff-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          active = json.loads(Path('/tmp/r7-qemu-kmsdrm-report.json').read_text())
          handoff = json.loads(Path('/tmp/r7-qemu-kmsdrm-handoff-report.json').read_text())
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]

          assert active['schema_version'] == 1
          assert active['ok'] is True
          assert active['classification'] == 'ACTIVE_QEMU_KMSDRM_PASS'
          assert active['source_image_sha256'] == image_sha

          assert handoff['schema_version'] == 1
          assert handoff['ok'] is True
          assert handoff['classification'] == 'SERIAL_QEMU_KMSDRM_HANDOFF_PASS'
          assert handoff['source_image_sha256'] == image_sha
          assert handoff['baseline']['classification'] == 'ACTIVE_QEMU_KMSDRM_PASS'
          recovery = handoff['handoff']['recovery']
          assert recovery['clean_child_reacquired'] is True
          assert recovery['crash_child_reacquired'] is True
          PY
          printf 'active-and-serial-handoff-qemu-pass\n' > /tmp/r7-qemu-status

      - name: Reconfirm provider-free source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          make verify

      - name: Record exact evidence and decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews/evidence
          cp /tmp/r7-direct-graphics-probe.json docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.json
          cp /tmp/r7-graphics-packages.tsv docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_GRAPHICS_PACKAGES.tsv
          cp /tmp/r7-base-system-manifest.txt docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_BASE_SYSTEM_MANIFEST.txt
          cp /tmp/r7-image-profile.json docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_PROFILE.json
          cp /tmp/r7-cage-package-probe.json docs/reviews/evidence/2026-08-09_R7_CAGE_PACKAGE_DELTA.json
          cp /tmp/r7-weston-package-probe.json docs/reviews/evidence/2026-08-09_R7_WESTON_PACKAGE_DELTA.json
          cp /tmp/r7-wlroots-runtime-package-probe.json docs/reviews/evidence/2026-08-09_R7_WLROOTS_RUNTIME_PACKAGE_DELTA.json
          if test -s /tmp/r7-qemu-kmsdrm-report.json; then
            cp /tmp/r7-qemu-kmsdrm-report.json docs/reviews/evidence/2026-08-09_R7_QEMU_ACTIVE_KMSDRM_REPORT.json
          fi
          if test -s /tmp/r7-qemu-kmsdrm-handoff-report.json; then
            cp /tmp/r7-qemu-kmsdrm-handoff-report.json docs/reviews/evidence/2026-08-09_R7_QEMU_SERIAL_KMSDRM_HANDOFF_REPORT.json
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = Path('/tmp/r7-source-sha').read_text().strip()
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          probe = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          profile = json.loads(Path('/tmp/r7-image-profile.json').read_text())
          packages = Path('/tmp/r7-graphics-packages.tsv').read_text().strip()
          manifest = Path('/tmp/r7-base-system-manifest.txt').read_text()
          footprint = Path('/tmp/r7-footprint.txt').read_text()
          qemu_status = Path('/tmp/r7-qemu-status').read_text().strip()
          active_path = Path('/tmp/r7-qemu-kmsdrm-report.json')
          handoff_path = Path('/tmp/r7-qemu-kmsdrm-handoff-report.json')
          active_qemu = json.loads(active_path.read_text()) if active_path.exists() else None
          handoff_qemu = json.loads(handoff_path.read_text()) if handoff_path.exists() else None
          compositor_reports = {
              candidate: json.loads(
                  Path(f'/tmp/r7-{candidate}-package-probe.json').read_text()
              )
              for candidate in ('cage', 'weston', 'wlroots-runtime')
          }

          facts = {}
          for source in (manifest, footprint):
              for line in source.splitlines():
                  if '=' in line and not line.startswith((' ', '\t')):
                      key, value = line.split('=', 1)
                      facts.setdefault(key, value)

          kms = bool(probe['sdl']['kmsdrm_compiled'])
          if kms:
              if not active_qemu or active_qemu.get('classification') != 'ACTIVE_QEMU_KMSDRM_PASS':
                  raise SystemExit('KMSDRM compiled but active QEMU PASS evidence is missing')
              if not handoff_qemu or handoff_qemu.get('classification') != 'SERIAL_QEMU_KMSDRM_HANDOFF_PASS':
                  raise SystemExit('KMSDRM compiled but serial handoff QEMU PASS evidence is missing')
              classification = 'SDL_KMSDRM_COMPILED_QEMU_ACTIVE_AND_SERIAL_HANDOFF_PASS'
          else:
              if active_qemu is not None or handoff_qemu is not None:
                  raise SystemExit('QEMU evidence exists even though installed SDL lacks kmsdrm')
              classification = 'SDL_KMSDRM_NOT_COMPILED_PACKAGING_WORK_REQUIRED'

          drivers = ', '.join(probe['sdl']['video_drivers'])
          lines = [
              '# R7 exact production image, compositor deltas, active KMSDRM, and serial handoff evidence',
              '',
              '**Date:** 2026-08-09  ',
              f'**Source commit:** `{source_sha}`  ',
              f'**Image profile:** `{profile["profile"]["profile_id"]}`  ',
              f'**Image SHA-256:** `{image_sha}`  ',
              f'**Classification:** `{classification}`',
              '',
              'The exact production `modern-amd64` image completed through `build/build-image.sh`, including its fail-closed cleanup contract, with no surviving loop association. The finished raw image was then mounted read-only and its installed passive graphics probe executed inside that filesystem.',
              '',
              '## Installed SDL/Pygame result',
              '',
              f'- SDL compiled video drivers: `{drivers}`',
              f'- `kmsdrm_compiled`: **{str(kms).lower()}**',
              f'- Pygame metadata: `{probe["pygame"]}`',
              f'- graphics libraries visible in the offline image: `{probe["libraries"]}`',
              '- active KMSDRM test required by the passive probe: **true**',
              '',
              'The offline probe does not bind host DRM/sysfs and therefore does not itself claim display ownership.',
              '',
              '## Image facts',
              '',
              f'- suite: `{facts.get("suite", "unknown")}`',
              f'- architecture: `{facts.get("architecture", "unknown")}`',
              f'- Debian version: `{facts.get("debian_version", "unknown")}`',
              f'- accounted filesystem use: `{facts.get("accounted_mib", "unknown")} MiB`',
              f'- preferred limit: `{facts.get("preferred_limit_mib", "unknown")} MiB`',
              f'- required limit: `{facts.get("required_limit_mib", "unknown")} MiB`',
              '',
              '## Relevant packages',
              '',
              '```text',
              packages,
              '```',
              '',
              '## Disposable compositor/reference package deltas',
              '',
              'Each candidate was installed with `--no-install-recommends --no-upgrade --no-remove` into its own disposable clone of this exact image. Host `/run` was not exposed, `/etc/systemd/system` had to remain unchanged, APT/probe plumbing was cleaned, and the source-image SHA had to remain identical.',
              '',
              '| Candidate | Classification | Added packages | Installed-size delta | File delta | Filesystem-used delta | New X server components |',
              '| --- | --- | ---: | ---: | ---: | ---: | --- |',
          ]
          for candidate in ('cage', 'weston', 'wlroots-runtime'):
              report = compositor_reports[candidate]
              package = report['packages']
              filesystem = report['filesystem']
              x_components = ', '.join(package['x_server_components']) or 'none'
              lines.append(
                  f'| `{candidate}` | `{report["classification"]}` | '
                  f'{package["added_count"]} | '
                  f'{package["added_installed_size_kib"] / 1024:.2f} MiB | '
                  f'{filesystem["file_delta_bytes"] / 1024 / 1024:.2f} MiB | '
                  f'{filesystem["used_delta_bytes"] / 1024 / 1024:.2f} MiB | '
                  f'`{x_components}` |'
              )
          lines.extend(
              [
                  '',
                  'These are **incremental package-closure measurements relative to the current Xorg production image**, not runtime/compositor acceptance. No candidate is enabled or booted by this measurement.',
                  '',
                  '## Active QEMU gate',
                  '',
                  f'- harness status: `{qemu_status}`',
              ]
          )

          if active_qemu and handoff_qemu:
              active = active_qemu['active']
              passive = active_qemu['passive']
              handoff = handoff_qemu['handoff']
              lines.extend(
                  [
                      f'- QEMU version: `{active_qemu["qemu_version"]}`',
                      f'- guest DRM cards: `{passive["drm"]["card_nodes"]}`',
                      f'- guest connectors: `{passive["drm"]["connectors"]}`',
                      f'- requested SDL driver: `{active["requested_video_driver"]}`',
                      f'- actual SDL driver: `{active["actual_video_driver"]}`',
                      f'- surface: `{active["surface"]}`',
                      f'- rendered frames: `{active["frame_count"]}`',
                      '',
                      'The first disposable-guest boot proves active SDL/Pygame KMSDRM acquisition and rendering against the QEMU `virtio-vga` DRM device with no X launcher, no guest network, and the Greia PAM/VT session.',
                      '',
                      '## Serial shell/Activity ownership candidate gate',
                      '',
                      f'- initial shell driver: `{handoff["shell_initial"]["actual_video_driver"]}`',
                      f'- shell after clean child driver: `{handoff["shell_after_clean"]["actual_video_driver"]}`',
                      f'- clean child duration: `{handoff["clean_child"]["duration_seconds"]}` seconds',
                      f'- shell after crashed child driver: `{handoff["shell_after_crash"]["actual_video_driver"]}`',
                      f'- crashed child duration: `{handoff["crash_child"]["duration_seconds"]}` seconds',
                      f'- shell reacquired after clean child: `{handoff["recovery"]["clean_child_reacquired"]}`',
                      f'- shell reacquired after abrupt child death: `{handoff["recovery"]["crash_child_reacquired"]}`',
                      '',
                      'The second boot uses the same already-disposable clone and measures the serial-ownership candidate: shell acquires KMSDRM, releases it, a separate child acquires and exits cleanly, shell reacquires, another child acquires and dies via an intentional abrupt process exit without SDL cleanup, and shell reacquires again.',
                      '',
                      'This is **mechanical ownership-recovery evidence only**. It does not authorize giving arbitrary Activities DRM/input devices and it does not select serial handoff over a tiny Greia-owned compositor/session broker. The R7 security and measurement comparison remains open.',
                      '',
                      'Production boot therefore remains on Xorg. Legacy Intel/Acer physical scanout/input/suspend/crash evidence is still mandatory before any migration, and Pi physical evidence remains an R8/R14 gate.',
                  ]
              )
          else:
              lines.extend(
                  [
                      '',
                      'The installed image does not enumerate `kmsdrm`, so the active and serial-handoff QEMU acquisitions were intentionally not attempted. SDL/package work is required before session migration.',
                  ]
              )

          Path('docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Commit exact evidence and retire one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-production-image-probe-v3.yml
          git add docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md docs/reviews/evidence
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'r7: record exact image compositor, KMSDRM, and handoff evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
