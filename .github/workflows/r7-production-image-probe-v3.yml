name: R7 exact production image SDL evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-production-image-probe-v3.yml"
      - "build/**"

permissions:
  contents: write

jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.edge.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - id: edge
        name: Run expensive probe only for latest build/probe change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(build/|\.github/workflows/r7-production-image-probe-v3\.yml$)'; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi

  build-probe-record:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/r7-source-sha
          test -z "$(git status --short)"

      - name: Install production build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync gpgv udev util-linux

      - name: Build production modern-amd64 image
        id: build
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          mkdir -p "$out"
          set +e
          sudo build/build-image.sh modern-amd64 "$out"
          status=$?
          set -e
          printf '%s\n' "$status" | tee /tmp/r7-build-status
          image="$out/greia-os-modern-amd64.img"
          if test -s "$image"; then
            sha256sum "$image" | tee /tmp/r7-image-sha256
          fi
          if test "$status" -eq 0; then
            test -s "$image"
            test -s "$out/greia-os-modern-amd64-footprint.txt"
            test -s "$out/greia-os-modern-amd64-image-profile.json"
            cp "$out/greia-os-modern-amd64-footprint.txt" /tmp/r7-footprint.txt
            cp "$out/greia-os-modern-amd64-image-profile.json" /tmp/r7-image-profile.json
          fi
          exit 0

      - name: Verify cleanup or capture exact leaked-loop state
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          image="$out/greia-os-modern-amd64.img"
          build_status="$(cat /tmp/r7-build-status)"
          leaked="$(sudo losetup -j "$image" 2>/dev/null || true)"

          if test -n "$leaked"; then
            echo '=== R7 LEAKED LOOP DIAGNOSTIC: BEFORE RECOVERY ==='
            printf '%s\n' "$leaked"
            sudo losetup --list --json --output NAME,BACK-FILE,AUTOCLEAR,PARTSCAN,RO,OFFSET,SIZELIMIT || true
            sudo lsblk -a -o NAME,KNAME,MAJ:MIN,TYPE,PKNAME,MOUNTPOINTS || true
            sudo findmnt -rn -R --target "$RUNNER_TEMP" || true

            while IFS= read -r loop; do
              test -n "$loop" || continue
              name="${loop#/dev/}"
              echo "=== exact loop: $loop ==="
              sudo losetup --list --noheadings --output NAME,BACK-FILE,AUTOCLEAR,PARTSCAN,RO,OFFSET,SIZELIMIT "$loop" || true
              sudo partx --show "$loop" || true
              for attr in autoclear backing_file dio offset sizelimit; do
                if test -r "/sys/block/$name/loop/$attr"; then
                  printf 'sysfs.%s=' "$attr"
                  sudo cat "/sys/block/$name/loop/$attr" || true
                fi
              done
              echo 'holders:'
              sudo find "/sys/block/$name/holders" -maxdepth 1 -mindepth 1 -printf '%f\n' 2>/dev/null || true
              echo 'partition nodes:'
              sudo find "/sys/block/$name" -maxdepth 1 -mindepth 1 -name "${name}p*" -printf '%f\n' 2>/dev/null || true
              echo 'process fds referencing loop:'
              sudo bash -c '
                shopt -s nullglob
                for fd in /proc/[0-9]*/fd/*; do
                  target=$(readlink "$fd" 2>/dev/null || true)
                  case "$target" in
                    /dev/'"$name"'|/dev/'"$name"'p*) printf "%s -> %s\n" "$fd" "$target" ;;
                  esac
                done
              ' || true

              # Recovery experiment: target only this image loop. Re-flush on
              # every attempt and wait on BACKING-FILE disassociation, which is
              # the actual lifecycle condition we care about after lazy detach.
              sudo partx -d "$loop" 2>/dev/null || true
              for attempt in $(seq 1 80); do
                sudo blockdev --flushbufs "$loop" 2>/dev/null || true
                sudo losetup -d "$loop" 2>/dev/null || true
                sudo udevadm settle --timeout=2 >/dev/null 2>&1 || true
                if test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"; then
                  echo "R7_DIAGNOSTIC_DETACHED_AFTER_ATTEMPT=$attempt"
                  break
                fi
                sleep 0.25
              done
            done < <(printf '%s\n' "$leaked" | cut -d: -f1)

            echo '=== R7 LEAKED LOOP DIAGNOSTIC: AFTER RECOVERY ==='
            sudo losetup -j "$image" || true
          fi

          remaining="$(sudo losetup -j "$image" 2>/dev/null || true)"
          test -z "$remaining" || { echo "diagnostic could not detach exact image loop: $remaining" >&2; exit 1; }
          test "$build_status" -eq 0 || { echo "production builder exited $build_status; diagnostic cleanup succeeded but build remains failed" >&2; exit "$build_status"; }

      - name: Inspect installed SDL in finished image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          root="$RUNNER_TEMP/greia-r7-mounted"
          mkdir -p "$root"
          loop="$(sudo losetup --find --show --partscan --read-only "$image")"
          cleanup_probe() {
            set +e
            mountpoint -q "$root" && sudo umount "$root"
            sudo partx -d "$loop" >/dev/null 2>&1 || true
            for _ in $(seq 1 40); do
              sudo blockdev --flushbufs "$loop" >/dev/null 2>&1 || true
              sudo losetup -d "$loop" >/dev/null 2>&1 || true
              sudo udevadm settle --timeout=2 >/dev/null 2>&1 || true
              test -z "$(sudo losetup -j "$image" 2>/dev/null || true)" && break
              sleep 0.25
            done
          }
          trap cleanup_probe EXIT INT TERM
          for _ in $(seq 1 20); do test -b "${loop}p1" && break; sleep 0.2; done
          test -b "${loop}p1"
          sudo mount -o ro,noload "${loop}p1" "$root"
          test "$(stat -c '%u:%g' "$root")" = '0:0'

          sudo chroot "$root" /usr/bin/env \
            PYGAME_HIDE_SUPPORT_PROMPT=1 \
            PYTHONPATH=/opt/greia-os/src \
            PYTHONNOUSERSITE=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -m greia_platform.direct_graphics_probe \
            | tee /tmp/r7-direct-graphics-probe.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          assert p['schema_version'] == 1
          assert p['passive'] is True
          assert p['assessment']['active_kmsdrm_test_required'] is True
          print('SDL_COMPILED_VIDEO_DRIVERS=' + ','.join(p['sdl']['video_drivers']))
          print('KMSDRM_COMPILED=' + str(p['sdl']['kmsdrm_compiled']).lower())
          PY

          sudo chroot "$root" dpkg-query -W \
            '-f=${Package}\t${Version}\t${Architecture}\n' \
            libsdl2-2.0-0 python3-pygame libdrm2 libgbm1 libegl1 plymouth plymouth-label e2fsprogs \
            > /tmp/r7-graphics-packages.tsv
          cp "$root/etc/greia-os/base-system-manifest" /tmp/r7-base-system-manifest.txt
          cleanup_probe
          trap - EXIT INT TERM
          test -z "$(sudo losetup -j "$image" 2>/dev/null || true)"

      - name: Record exact evidence and decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews/evidence
          cp /tmp/r7-direct-graphics-probe.json docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.json
          cp /tmp/r7-graphics-packages.tsv docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_GRAPHICS_PACKAGES.tsv
          cp /tmp/r7-base-system-manifest.txt docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_BASE_SYSTEM_MANIFEST.txt
          cp /tmp/r7-image-profile.json docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_PROFILE.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = Path('/tmp/r7-source-sha').read_text().strip()
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          probe = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          profile = json.loads(Path('/tmp/r7-image-profile.json').read_text())
          packages = Path('/tmp/r7-graphics-packages.tsv').read_text().strip()
          manifest = Path('/tmp/r7-base-system-manifest.txt').read_text()
          footprint = Path('/tmp/r7-footprint.txt').read_text()
          facts = {}
          for source in (manifest, footprint):
              for line in source.splitlines():
                  if '=' in line and not line.startswith((' ', '\t')):
                      k, v = line.split('=', 1)
                      facts.setdefault(k, v)
          kms = bool(probe['sdl']['kmsdrm_compiled'])
          classification = 'SDL_KMSDRM_COMPILED_ACTIVE_GUEST_TEST_NEXT' if kms else 'SDL_KMSDRM_NOT_COMPILED_PACKAGING_WORK_REQUIRED'
          drivers = ', '.join(probe['sdl']['video_drivers'])
          body = f'''# R7 exact production image SDL evidence\n\n**Date:** 2026-08-09  \n**Source commit:** `{source_sha}`  \n**Image profile:** `{profile['profile']['profile_id']}`  \n**Image SHA-256:** `{image_sha}`  \n**Classification:** `{classification}`\n\nThe exact production `modern-amd64` image completed through `build/build-image.sh` with its cleanup contract satisfied and no surviving loop association. The finished raw image was then mounted read-only and its installed passive graphics probe executed inside that filesystem. No display backend was initialized and no DRM master was acquired.\n\n## Installed SDL/Pygame result\n\n- SDL compiled video drivers: `{drivers}`\n- `kmsdrm_compiled`: **{str(kms).lower()}**\n- Pygame metadata: `{probe['pygame']}`\n- graphics libraries visible: `{probe['libraries']}`\n- active KMSDRM acquisition remains required: **true**\n\nThe offline inspection deliberately did not bind a host DRM device or host sysfs, so DRM-node/connector fields are not hardware evidence.\n\n## Image facts\n\n- suite: `{facts.get('suite', 'unknown')}`\n- architecture: `{facts.get('architecture', 'unknown')}`\n- Debian version: `{facts.get('debian_version', 'unknown')}`\n- accounted filesystem use: `{facts.get('accounted_mib', 'unknown')} MiB`\n- preferred limit: `{facts.get('preferred_limit_mib', 'unknown')} MiB`\n- required limit: `{facts.get('required_limit_mib', 'unknown')} MiB`\n\n## Relevant packages\n\n```text\n{packages}\n```\n\n## Decision\n\n'''
          if kms:
              body += 'The exact production image enumerates SDL `kmsdrm`. Do not rebuild SDL. Proceed to a disposable QEMU guest active-acquisition test using this production image lineage; production boot remains Xorg until guest and hardware evidence support migration.\n'
          else:
              body += 'The exact production image does not enumerate SDL `kmsdrm`. Do not attempt active takeover. The next R7 source tranche must establish a maintained KMSDRM-capable SDL package/build, then rebuild and repeat this exact installed-driver probe before any session migration.\n'
          Path('docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md').write_text(body, encoding='utf-8')
          PY
          git diff --check

      - name: Commit evidence and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-production-image-probe-v3.yml
          git add docs/reviews/2026-08-09_R7_PRODUCTION_IMAGE_SDL_EVIDENCE.md docs/reviews/evidence
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'r7: record exact production image SDL evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
