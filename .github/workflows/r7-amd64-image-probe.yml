name: R7 amd64 image direct-graphics probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-amd64-image-probe.yml"

permissions:
  contents: write

jobs:
  build-and-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/r7-source-sha
          test -z "$(git status --short)"

      - name: Install image-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap parted e2fsprogs grub-pc-bin grub-common rsync

      - name: Build normal Greia modern-amd64 compatibility image
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/greia-r7-image"
          mkdir -p "$out"
          sudo build/build-image.sh modern-amd64 "$out"
          test -s "$out/greia-os-modern-amd64.img"
          test -s "$out/greia-os-modern-amd64-footprint.txt"
          sha256sum "$out/greia-os-modern-amd64.img" | tee /tmp/r7-image-sha256
          cp "$out/greia-os-modern-amd64-footprint.txt" /tmp/r7-footprint.txt

      - name: Mount finished image and execute installed passive probe
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/greia-r7-image/greia-os-modern-amd64.img"
          root="$RUNNER_TEMP/greia-r7-mounted"
          mkdir -p "$root"
          loop="$(sudo losetup --find --show --partscan "$image")"
          cleanup() {
            set +e
            mountpoint -q "$root" && sudo umount "$root"
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          for _ in $(seq 1 20); do
            test -b "${loop}p1" && break
            sleep 0.2
          done
          test -b "${loop}p1"
          sudo mount -o ro,noload "${loop}p1" "$root"
          test -r "$root/opt/greia-os/src/greia_platform/direct_graphics_probe.py"

          probe="$(sudo chroot "$root" /usr/bin/env \
            PYGAME_HIDE_SUPPORT_PROMPT=1 \
            PYTHONPATH=/opt/greia-os/src \
            PYTHONNOUSERSITE=1 \
            python3 -m greia_platform.direct_graphics_probe)"
          printf '%s\n' "$probe" | tee /tmp/r7-direct-graphics-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          assert payload['schema_version'] == 1
          assert payload['passive'] is True
          assert payload['assessment']['active_kmsdrm_test_required'] is True
          assert isinstance(payload['sdl']['video_drivers'], list)
          print('compiled SDL video drivers:', ', '.join(payload['sdl']['video_drivers']))
          print('kmsdrm_compiled:', payload['sdl']['kmsdrm_compiled'])
          PY

          sudo chroot "$root" dpkg-query -W \
            '-f=${Package}\t${Version}\t${Architecture}\n' \
            libsdl2-2.0-0 python3-pygame libdrm2 libgbm1 libegl1 \
            > /tmp/r7-graphics-packages.tsv 2>/tmp/r7-graphics-packages.err || true
          cat /tmp/r7-graphics-packages.tsv
          cleanup
          trap - EXIT INT TERM

      - name: Persist exact image-level evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reviews/evidence
          cp /tmp/r7-direct-graphics-probe.json \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.json
          cp /tmp/r7-graphics-packages.tsv \
            docs/reviews/evidence/2026-08-09_R7_MODERN_AMD64_GRAPHICS_PACKAGES.tsv

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = Path('/tmp/r7-source-sha').read_text().strip()
          image_sha = Path('/tmp/r7-image-sha256').read_text().split()[0]
          probe = json.loads(Path('/tmp/r7-direct-graphics-probe.json').read_text())
          packages = Path('/tmp/r7-graphics-packages.tsv').read_text().strip()
          footprint = Path('/tmp/r7-footprint.txt').read_text()
          facts = {}
          for line in footprint.splitlines():
              if '=' in line and not line.startswith((' ', '\t')):
                  key, value = line.split('=', 1)
                  facts.setdefault(key, value)

          drivers = probe['sdl']['video_drivers']
          kms = probe['sdl']['kmsdrm_compiled']
          classification = (
              'SDL_KMSDRM_COMPILED_ACTIVE_TEST_NEXT'
              if kms else
              'SDL_KMSDRM_NOT_COMPILED_PACKAGING_WORK_REQUIRED'
          )
          body = f'''# R7 modern-amd64 built-image direct-graphics probe\n\n**Date:** 2026-08-09  \n**Source commit:** `{source_sha}`  \n**Build profile:** `modern-amd64`  \n**Image SHA-256:** `{image_sha}`  \n**Classification:** `{classification}`\n\nThis evidence was produced by the production `build/build-image.sh` path, then by mounting the finished raw image read-only and executing the installed `greia_platform.direct_graphics_probe` inside that image. It is package/image evidence only; no DRM master or display takeover occurred.\n\n## Installed SDL result\n\n- compiled SDL video drivers: `{', '.join(drivers)}`\n- `kmsdrm_compiled`: **{str(kms).lower()}**\n- Pygame: `{probe['pygame']}`\n- libraries visible inside the image: `{probe['libraries']}`\n- active KMSDRM test remains required: **true**\n\nThe mounted image intentionally had no host `/dev/dri` bound into its chroot, so empty DRM-node/connector observations here are expected and are **not** a hardware result.\n\n## Key image facts\n\n- architecture: `{facts.get('architecture', 'unknown')}`\n- Debian suite: `{facts.get('suite', 'unknown')}`\n- accounted image use: `{facts.get('accounted_mib', 'unknown')} MiB`\n- preferred limit: `{facts.get('preferred_limit_mib', 'unknown')} MiB`\n- required limit: `{facts.get('required_limit_mib', 'unknown')} MiB`\n\n## Relevant package versions\n\n```text\n{packages or '(dpkg-query returned no matching package lines)'}\n```\n\n## Decision\n\n'''
          if kms:
              body += 'The exact Greia image contains an SDL build that enumerates `kmsdrm`. Proceed to controlled guest/physical active KMSDRM acquisition; do not rebuild SDL merely from package assumptions.\n'
          else:
              body += 'The exact Greia image SDL build does **not** enumerate `kmsdrm`. Do not attempt the active takeover yet. The next R7 source tranche must provide a maintained SDL/KMSDRM package path and re-run this image probe before changing boot/session ownership.\n'
          Path('docs/reviews/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.md').write_text(body, encoding='utf-8')
          PY

          git diff --check
          git rm --ignore-unmatch \
            .github/workflows/r7-amd64-image-probe.yml \
            .github/workflows/r7-source-checkpoint.yml \
            .github/workflows/r7-kms-maintenance-hardening.yml \
            .github/workflows/r7-kms-maintenance-hardening-v2.yml
          git add docs/reviews/2026-08-09_R7_MODERN_AMD64_IMAGE_DIRECT_GRAPHICS_PROBE.md docs/reviews/evidence
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'r7: record built-image SDL direct-graphics evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
