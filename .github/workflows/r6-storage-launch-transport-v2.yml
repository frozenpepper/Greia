name: R6 runtime-neutral storage launch transport v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-storage-launch-transport-v2.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reapply reviewed storage integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/r6-storage-launch-transport.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          end = "\n          PY\n\n      - name: Install test dependency"
          if workflow.count(marker) != 1 or workflow.count(end) != 1:
              raise SystemExit('cannot locate reviewed storage patch payload')
          payload = workflow.split(marker, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(payload), '<storage-integration-payload>', 'exec'), {})
          PY

      - name: Isolate broker runtime in tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/test_supervisor.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from greia_launcher.runtime_adapter import PythonRuntimeAdapter, RuntimeManager\n'
          replacement = anchor + 'from greia_launcher.storage_broker import ActivityStorageBroker\n'
          if text.count(anchor) != 1:
              raise SystemExit('storage broker test import anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          helper_anchor = '''def _storage_service() -> ActivityStorageService:\n    return ActivityStorageService(\n        StoragePolicy(\n            policy_schema_version=1,\n            namespace_quota_bytes=1024 * 1024,\n            max_kv_bytes=64 * 1024,\n            max_kv_value_bytes=16 * 1024,\n            max_key_bytes=128,\n            max_file_bytes=256 * 1024,\n            max_files=32,\n            max_path_bytes=256,\n            protected_free_bytes=0,\n            max_rollback_snapshots=1,\n        )\n    )\n'''
          helper = helper_anchor + '''\n\ndef _broker_factory(runtime_root: Path):\n    def start(storage, session_id: str, *, sandboxed: bool):\n        return ActivityStorageBroker.start(\n            storage,\n            session_id,\n            runtime_root=runtime_root,\n            sandboxed=sandboxed,\n        )\n\n    return start\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('storage helper anchor mismatch')
          text = text.replace(helper_anchor, helper, 1)

          call_anchor = '                storage_service=_storage_service(),\n                process_factory=factory,\n'
          if text.count(call_anchor) != 3:
              raise SystemExit(f'expected three storage test launch sites, found {text.count(call_anchor)}')
          text = text.replace(
              call_anchor,
              '                storage_service=_storage_service(),\n'
              '                storage_broker_factory=_broker_factory(root / "brokers"),\n'
              '                process_factory=factory,\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Focused storage and supervisor tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v
          PYTHONPATH=src python3 - <<'PY'
          from pathlib import Path
          from greia_platform.storage import StoragePolicy
          policy = StoragePolicy.load(Path('runtime/storage-policy.toml'))
          assert policy.namespace_quota_bytes == 33554432
          print('storage policy load PASS')
          PY

      - name: Complete currently recoverable unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Confirm known R5 source-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 tools/validate_project.py >/tmp/v.out 2>&1
          s=$?
          set -e
          cat /tmp/v.out
          test "$s" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/v.out

      - name: Commit coherent R6.2 storage tranche
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            src/greia_launcher/composition.py \
            src/greia_launcher/main.py \
            src/greia_launcher/supervisor.py \
            tests/test_supervisor.py \
            docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md \
            HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-implementation
          git config user.email greia-r6-implementation@users.noreply.github.com
          git commit -m 'feat: wire universal storage into Activity launch sessions'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
