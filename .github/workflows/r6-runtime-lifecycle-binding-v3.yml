name: R6 runtime lifecycle binding v3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-runtime-lifecycle-binding-v3.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reapply reviewed lifecycle v2 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/r6-runtime-lifecycle-binding-v2.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if len(blocks) != 2:
              raise SystemExit(f'expected two reviewed lifecycle patch blocks, found {len(blocks)}')
          for index, block in enumerate(blocks, start=1):
              exec(compile(textwrap.dedent(block), f'<lifecycle-v2-block-{index}>', 'exec'), {})
          PY

      - name: Correct lifecycle test import
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/test_supervisor.py')
          text = path.read_text(encoding='utf-8')
          old = 'from dataclasses import dataclass\n'
          new = 'from dataclasses import dataclass, replace\n'
          if text.count(old) != 1:
              raise SystemExit('supervisor dataclasses import anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Focused lifecycle/runtime tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_activity_api.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_runtime_manager.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v

      - name: Static runtime-neutrality check
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'ActivityControlChannel' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/supervisor.py
          grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/runtime_adapter.py
          grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/runtime_adapter.py

      - name: Complete currently recoverable unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Confirm known R5 source-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 tools/validate_project.py >/tmp/v.out 2>&1
          status=$?
          set -e
          cat /tmp/v.out
          test "$status" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/v.out

      - name: Commit coherent lifecycle-binding tranche
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/greia_launcher/lifecycle.py src/greia_launcher/runtime_adapter.py src/greia_launcher/supervisor.py tests/test_runtime_manager.py tests/test_supervisor.py docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-implementation
          git config user.email greia-r6-implementation@users.noreply.github.com
          git commit -m 'refactor: move lifecycle transport behind runtime adapters'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
