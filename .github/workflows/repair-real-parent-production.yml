name: Repair real Parent production path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-real-parent-production.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fail-closed Parent API corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/greia_parent/api_server.py",
              "    DemoWifiBackend,\n    IwdWifiBackend,",
              "    IwdWifiBackend,",
          )
          replace_once(
              "src/greia_parent/api_server.py",
              '''        self.wifi_backend: WifiBackend = wifi_backend or (\n            IwdWifiBackend() if Path("/var/lib/iwd").exists() else DemoWifiBackend()\n        )''',
              '''        self.wifi_backend: WifiBackend = (\n            wifi_backend if wifi_backend is not None else IwdWifiBackend()\n        )''',
          )
          replace_once(
              "src/greia_parent/api_server.py",
              '''    def authorized(\n''',
              '''    def index_payload(self) -> dict[str, object]:\n        """Advertise only Parent capabilities backed by this Greia."""\n\n        return api_index_payload(\n            {"network.manage": self.wifi_backend.available()}\n        )\n\n    def authorized(\n''',
          )
          replace_once(
              "src/greia_parent/api_server.py",
              '''    def wifi_payload(self) -> dict[str, object]:\n        return {\n            "available": self.wifi_backend.available(),\n            "networks": [\n                {\n                    "ssid": net.ssid,\n                    "security": net.security.value,\n                    "signal_dbm": net.signal_dbm,\n                }\n                for net in self.wifi_backend.scan()\n            ],\n        }\n\n    def connect_wifi(self, ssid: str, passphrase: str = "") -> dict[str, object]:\n        candidates = [net for net in self.wifi_backend.scan() if net.ssid == ssid]\n''',
              '''    def wifi_payload(self) -> dict[str, object]:\n        if not self.wifi_backend.available():\n            return {"available": False, "networks": []}\n        return {\n            "available": True,\n            "networks": [\n                {\n                    "ssid": net.ssid,\n                    "security": net.security.value,\n                    "signal_dbm": net.signal_dbm,\n                }\n                for net in self.wifi_backend.scan()\n            ],\n        }\n\n    def connect_wifi(self, ssid: str, passphrase: str = "") -> dict[str, object]:\n        if not self.wifi_backend.available():\n            raise WifiError("Wi-Fi management is unavailable on this Greia")\n        candidates = [net for net in self.wifi_backend.scan() if net.ssid == ssid]\n''',
          )
          replace_once(
              "src/greia_parent/api_server.py",
              '''            self._send_json(200, api_index_payload())\n''',
              '''            self._send_json(200, self.app.index_payload())\n''',
          )

          replace_once(
              "src/greia_parent/package_api.py",
              '''from greia_parent.protocol import API_BASE, api_index_payload\n''',
              '''from greia_parent.protocol import API_BASE\n''',
          )
          replace_once(
              "src/greia_parent/package_api.py",
              '''    def index_payload(self) -> dict[str, object]:\n        return api_index_payload(\n            {\n                "activities.install": self.activity_install_enabled,\n                "activities.remove": self.activity_remove_enabled,\n            }\n        )\n''',
              '''    def index_payload(self) -> dict[str, object]:\n        payload = super().index_payload()\n        capabilities = dict(payload["capabilities"])\n        capabilities.update(\n            {\n                "activities.install": self.activity_install_enabled,\n                "activities.remove": self.activity_remove_enabled,\n            }\n        )\n        payload["capabilities"] = capabilities\n        return payload\n''',
          )

          replace_once(
              "src/greia_parent/update_api.py",
              '''from greia_parent.protocol import API_BASE, api_index_payload\n''',
              '''from greia_parent.protocol import API_BASE\n''',
          )
          replace_once(
              "src/greia_parent/update_api.py",
              '''    def index_payload(self) -> dict[str, object]:\n        return api_index_payload(\n            {\n                "activities.install": self.activity_install_enabled,\n                "system.update.upload": self.system_update_upload_enabled,\n                # No current single-root Greia profile has a proven transactional\n                # slot backend. Do not infer activation from upload availability.\n                "system.update.activate": False,\n                # This concrete top-level composition owns the typed AudioService.\n                "settings.audio": True,\n                "settings.system_controls": True,\n                "profiles.presentation": True,\n            }\n        )\n''',
              '''    def index_payload(self) -> dict[str, object]:\n        payload = super().index_payload()\n        capabilities = dict(payload["capabilities"])\n        capabilities.update(\n            {\n                "activities.install": self.activity_install_enabled,\n                "system.update.upload": self.system_update_upload_enabled,\n                # No current single-root Greia profile has a proven transactional\n                # slot backend. Do not infer activation from upload availability.\n                "system.update.activate": False,\n                # This concrete top-level composition owns the typed AudioService.\n                "settings.audio": True,\n                "settings.system_controls": True,\n                "profiles.presentation": True,\n            }\n        )\n        payload["capabilities"] = capabilities\n        return payload\n''',
          )

          Path("tests/test_parent_real_backends.py").write_text(r'''from __future__ import annotations

import tempfile
import unittest
from pathlib import Path

from greia_parent.api_server import ParentApiApplication
from greia_platform.wifi import IwdWifiBackend, WifiError


ROOT = Path(__file__).resolve().parents[1]


class _UnavailableWifiBackend:
    def available(self) -> bool:
        return False

    def scan(self):
        raise AssertionError("unavailable Wi-Fi backend must not be scanned")

    def connect(self, network, passphrase=""):
        raise AssertionError("unavailable Wi-Fi backend must not connect")


class ParentRealBackendTests(unittest.TestCase):
    def _app(self, root: Path, *, wifi_backend=None) -> ParentApiApplication:
        return ParentApiApplication(
            ROOT,
            root / "parent-state",
            hardware_settings_dir=root / "hardware-settings",
            hardware_status_path=root / "hardware-status.json",
            profiles_dir=root / "profiles",
            active_profile_status_path=root / "active-profile.json",
            wifi_backend=wifi_backend,
        )

    def test_production_default_is_real_iwd_backend(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            app = self._app(Path(temporary))
            self.assertIsInstance(app.wifi_backend, IwdWifiBackend)

    def test_unavailable_wifi_fails_closed_without_sample_data(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            app = self._app(Path(temporary), wifi_backend=_UnavailableWifiBackend())
            self.assertFalse(app.index_payload()["capabilities"]["network.manage"])
            self.assertEqual(app.wifi_payload(), {"available": False, "networks": []})
            with self.assertRaisesRegex(WifiError, "unavailable"):
                app.connect_wifi("Made Up Network", "password123")


if __name__ == "__main__":
    unittest.main()
''')
      - name: Focused tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest -v tests.test_parent_real_backends
          PYTHONPATH=src python3 -m pytest -q tests/test_parent_api.py tests/test_parent_update_api.py tests/test_parent_real_backends.py
      - name: Full verification
        run: make verify
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name "Greia verification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/greia_parent/api_server.py src/greia_parent/package_api.py src/greia_parent/update_api.py tests/test_parent_real_backends.py
          git diff --cached --check
          git commit -m "Make production Parent API fail closed without real backends"
          git push origin HEAD:main
