name: R0 R5 R6 integrated closure continuity v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/continuity-r5-r6-close-v2.yml"

permissions:
  contents: write

jobs:
  persist:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replay reviewed continuity generation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source = Path('.github/workflows/continuity-r5-r6-close.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"        run: \|\n(.*?)(?=\n      - name:|\Z)", source, re.S)
          if not blocks:
              raise SystemExit('cannot locate reviewed continuity generation block')
          script = textwrap.dedent(blocks[0])
          replay = Path('/tmp/replay-continuity.sh')
          replay.write_text(script, encoding='utf-8')
          subprocess.run(['bash', str(replay)], check=True)

          # Preserve content while complying with repository whitespace policy.
          for name in (
              'HANDOVER.md',
              'docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md',
              'docs/reviews/2026-08-09_R5_REIMPLEMENTATION_AND_R6_INTEGRATED_CLOSURE.md',
          ):
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY

      - name: Commit continuity and remove one-off workflows
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm \
            .github/workflows/continuity-r5-r6-close.yml \
            .github/workflows/continuity-r5-r6-close-v2.yml
          git add \
            HANDOVER.md \
            docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md \
            docs/reviews/2026-08-09_R5_REIMPLEMENTATION_AND_R6_INTEGRATED_CLOSURE.md
          git diff --cached --check
          git config user.name greia-continuity
          git config user.email greia-continuity@users.noreply.github.com
          git commit -m 'docs: close R0 R5 R6 source spine and hand over R7'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
