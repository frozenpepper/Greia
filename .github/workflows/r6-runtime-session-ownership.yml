name: R6 runtime session ownership

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-runtime-session-ownership.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply runtime-session ownership refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime adapter owns process/runtime handle mechanics.
          rep(
              'src/greia_launcher/runtime_adapter.py',
              'import os\nimport sys\nimport tomllib\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Mapping, Protocol, Sequence\n',
              'import os\nimport subprocess\nimport sys\nimport tomllib\nfrom dataclasses import dataclass\nfrom enum import StrEnum\nfrom pathlib import Path\nfrom typing import Callable, Mapping, Protocol, Sequence\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              'from greia_platform.device_capabilities import DeviceCapabilityService\n',
              'from greia_platform.device_capabilities import DeviceCapabilityService\n\nfrom .lifecycle import ProcessHandle, signal_process_group\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              'class RuntimeCommand:\n    command: tuple[str, ...]\n    cwd: Path\n    environment: tuple[tuple[str, str], ...] = ()\n\n\n@dataclass(frozen=True, slots=True)\nclass RuntimeLifecycleSupport:',
              'class RuntimeCommand:\n    command: tuple[str, ...]\n    cwd: Path\n    environment: tuple[tuple[str, str], ...] = ()\n\n\n@dataclass(frozen=True, slots=True)\nclass RuntimeInvocation:\n    command: tuple[str, ...]\n    cwd: Path | None\n    environment: tuple[tuple[str, str], ...]\n\n\nclass RuntimeExitKind(StrEnum):\n    NORMAL = "normal"\n    CRASH = "crash"\n\n\n@dataclass(frozen=True, slots=True)\nclass RuntimeExit:\n    return_code: int\n    kind: RuntimeExitKind\n\n\n@dataclass(frozen=True, slots=True)\nclass RuntimeLifecycleSupport:',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '    def command_for(self, manifest: ActivityManifest) -> RuntimeCommand: ...\n\n\n@dataclass(frozen=True, slots=True)\nclass PythonRuntimePolicy:',
              '    def command_for(self, manifest: ActivityManifest) -> RuntimeCommand: ...\n\n    def launch(self, invocation: RuntimeInvocation) -> ProcessHandle: ...\n\n    def collect_exit(self, process: ProcessHandle) -> RuntimeExit | None: ...\n\n    def force_stop(self, process: ProcessHandle) -> None: ...\n\n    def cleanup(self, process: ProcessHandle) -> None: ...\n\n\nProcessFactory = Callable[..., ProcessHandle]\n\n\n@dataclass(frozen=True, slots=True)\nclass PythonRuntimePolicy:',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '        policy: PythonRuntimePolicy | None = None,\n    ):\n        self._python_executable = python_executable\n        self._policy = policy\n',
              '        policy: PythonRuntimePolicy | None = None,\n        process_factory: ProcessFactory = subprocess.Popen,\n    ):\n        self._python_executable = python_executable\n        self._policy = policy\n        self._process_factory = process_factory\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '    def resolve_interpreter(self) -> Path:\n',
              '    def launch(self, invocation: RuntimeInvocation) -> ProcessHandle:\n        try:\n            return self._process_factory(\n                list(invocation.command),\n                cwd=invocation.cwd,\n                env=dict(invocation.environment),\n                shell=False,\n                stdin=subprocess.DEVNULL,\n                stdout=subprocess.DEVNULL,\n                stderr=subprocess.DEVNULL,\n                close_fds=True,\n                start_new_session=True,\n            )\n        except OSError as exc:\n            raise RuntimeAdapterError(f"Python runtime process launch failed: {exc}") from exc\n\n    def collect_exit(self, process: ProcessHandle) -> RuntimeExit | None:\n        return_code = process.poll()\n        if return_code is None:\n            return None\n        return RuntimeExit(\n            return_code=return_code,\n            kind=RuntimeExitKind.NORMAL if return_code == 0 else RuntimeExitKind.CRASH,\n        )\n\n    def force_stop(self, process: ProcessHandle) -> None:\n        signal_process_group(process, force=True)\n\n    def cleanup(self, process: ProcessHandle) -> None:\n        if process.poll() is None:\n            self.force_stop(process)\n\n    def resolve_interpreter(self) -> Path:\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '    def prepare_launch(\n        self,\n        manifest: ActivityManifest,\n',
              '    def launch(\n        self, preparation: RuntimeLaunchPreparation, invocation: RuntimeInvocation\n    ) -> ProcessHandle:\n        adapter = self.adapter_for(preparation.compatibility.runtime_type)\n        return adapter.launch(invocation)\n\n    def collect_exit(\n        self, preparation: RuntimeLaunchPreparation, process: ProcessHandle\n    ) -> RuntimeExit | None:\n        adapter = self.adapter_for(preparation.compatibility.runtime_type)\n        return adapter.collect_exit(process)\n\n    def force_stop(\n        self, preparation: RuntimeLaunchPreparation, process: ProcessHandle\n    ) -> None:\n        self.adapter_for(preparation.compatibility.runtime_type).force_stop(process)\n\n    def cleanup(\n        self, preparation: RuntimeLaunchPreparation, process: ProcessHandle\n    ) -> None:\n        self.adapter_for(preparation.compatibility.runtime_type).cleanup(process)\n\n    def prepare_launch(\n        self,\n        manifest: ActivityManifest,\n',
          )

          # Supervisor no longer constructs/signals/interprets a runtime process itself.
          rep(
              'src/greia_launcher/supervisor.py',
              'import os\nimport subprocess\nfrom pathlib import Path\nfrom typing import Callable, Mapping, Protocol\n',
              'import os\nfrom pathlib import Path\nfrom typing import Callable, Mapping, Protocol\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '    monotonic_now,\n    signal_process_group,\n)\n',
              '    monotonic_now,\n)\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '    RuntimeCommand,\n    RuntimeLaunchAdapter,\n    RuntimeManager,\n)',
              '    RuntimeCommand,\n    RuntimeExit,\n    RuntimeExitKind,\n    RuntimeInvocation,\n    RuntimeLaunchAdapter,\n    RuntimeLaunchPreparation,\n    RuntimeManager,\n)',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              'ProcessFactory = Callable[..., subprocess.Popen[bytes]]\nStorageBrokerFactory = Callable[..., ActivityStorageBroker]\n',
              'StorageBrokerFactory = Callable[..., ActivityStorageBroker]\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        storage_service: ActivityStorageService | None = None,\n        storage_broker_factory: StorageBrokerFactory = ActivityStorageBroker.start,\n        process_factory: ProcessFactory = subprocess.Popen,\n    ):\n',
              '        storage_service: ActivityStorageService | None = None,\n        storage_broker_factory: StorageBrokerFactory = ActivityStorageBroker.start,\n    ):\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        self._session_resources: dict[str, tuple[SessionResource, ...]] = {}\n        self._ready_timeout_seconds = ready_timeout_seconds\n        self._graceful_stop_seconds = graceful_stop_seconds\n        self._process_factory = process_factory\n',
              '        self._session_resources: dict[str, tuple[SessionResource, ...]] = {}\n        self._runtime_preparations: dict[str, RuntimeLaunchPreparation] = {}\n        self._ready_timeout_seconds = ready_timeout_seconds\n        self._graceful_stop_seconds = graceful_stop_seconds\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        started = monotonic_now()\n        try:\n            process = self._process_factory(\n                command,\n                cwd=cwd,\n                env=environment,\n                shell=False,\n                stdin=subprocess.DEVNULL,\n                stdout=subprocess.DEVNULL,\n                stderr=subprocess.DEVNULL,\n                close_fds=True,\n                start_new_session=True,\n            )\n        except OSError:\n',
              '        invocation = RuntimeInvocation(\n            command=tuple(command),\n            cwd=cwd,\n            environment=tuple(sorted(environment.items())),\n        )\n        started = monotonic_now()\n        try:\n            process = self._runtime_manager.launch(preparation, invocation)\n        except RuntimeAdapterError:\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        self._session_resources[session.session_id] = resources\n        self._active_session = session\n',
              '        self._session_resources[session.session_id] = resources\n        self._runtime_preparations[session.session_id] = preparation\n        self._active_session = session\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        now = monotonic_now()\n        return_code = process.poll()\n        if return_code is not None:\n',
              '        preparation = self._runtime_preparations.get(session.session_id)\n        if preparation is None:\n            raise ActivityLifecycleError("session has no runtime preparation")\n\n        now = monotonic_now()\n        runtime_exit = self._runtime_manager.collect_exit(preparation, process)\n        if runtime_exit is not None:\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '            return self._finish_session(session, return_code, now)\n',
              '            return self._finish_session(session, runtime_exit, now)\n',
          )
          # second poll occurrence
          rep(
              'src/greia_launcher/supervisor.py',
              '        return_code = process.poll()\n        if return_code is not None:\n            return self._finish_session(session, return_code, monotonic_now())\n',
              '        runtime_exit = self._runtime_manager.collect_exit(preparation, process)\n        if runtime_exit is not None:\n            return self._finish_session(session, runtime_exit, monotonic_now())\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        process = session.process\n        if process is not None:\n            signal_process_group(process, force=True)\n            return_code = process.poll()\n            if return_code is not None:\n                return self._finish_session(session, return_code, monotonic_now())\n',
              '        process = session.process\n        preparation = self._runtime_preparations.get(session.session_id)\n        if process is not None and preparation is not None:\n            self._runtime_manager.force_stop(preparation, process)\n            runtime_exit = self._runtime_manager.collect_exit(preparation, process)\n            if runtime_exit is not None:\n                return self._finish_session(session, runtime_exit, monotonic_now())\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        return_code: int,\n        ended_at: float,\n    ) -> ActivityResult:\n        if session.forced_reason is not None:\n            reason = session.forced_reason\n        elif session.stop_requested_at is not None and return_code == 0:\n            reason = ActivityExitReason.GRACEFUL_STOP\n        elif return_code == 0:\n            reason = ActivityExitReason.NORMAL\n        else:\n            reason = ActivityExitReason.CRASH\n\n        if not self._cleanup_session_resources(session.session_id):\n            reason = ActivityExitReason.PLATFORM_FAILURE\n',
              '        runtime_exit: RuntimeExit,\n        ended_at: float,\n    ) -> ActivityResult:\n        if session.forced_reason is not None:\n            reason = session.forced_reason\n        elif (\n            session.stop_requested_at is not None\n            and runtime_exit.kind is RuntimeExitKind.NORMAL\n        ):\n            reason = ActivityExitReason.GRACEFUL_STOP\n        elif runtime_exit.kind is RuntimeExitKind.NORMAL:\n            reason = ActivityExitReason.NORMAL\n        else:\n            reason = ActivityExitReason.CRASH\n\n        runtime_clean = self._cleanup_runtime_session(session)\n        resources_clean = self._cleanup_session_resources(session.session_id)\n        if not runtime_clean or not resources_clean:\n            reason = ActivityExitReason.PLATFORM_FAILURE\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '            return_code=return_code,\n',
              '            return_code=runtime_exit.return_code,\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '    def _cleanup_session_resources(self, session_id: str) -> bool:\n',
              '    def _cleanup_runtime_session(self, session: ActivitySession) -> bool:\n        preparation = self._runtime_preparations.pop(session.session_id, None)\n        process = session.process\n        if preparation is None or process is None:\n            return preparation is None and process is None\n        try:\n            self._runtime_manager.cleanup(preparation, process)\n        except Exception:\n            return False\n        return True\n\n    def _cleanup_session_resources(self, session_id: str) -> bool:\n',
          )

          # Test process factories belong to Python adapter/RuntimeManager, not supervisor.
          rep(
              'tests/test_supervisor.py',
              'def _manager(capabilities: set[str]) -> RuntimeManager:\n    return RuntimeManager(\n        [PythonRuntimeAdapter(Path("/usr/bin/python3"))],\n',
              'def _manager(capabilities: set[str], *, process_factory=None) -> RuntimeManager:\n    adapter = (\n        PythonRuntimeAdapter(Path("/usr/bin/python3"))\n        if process_factory is None\n        else PythonRuntimeAdapter(\n            Path("/usr/bin/python3"), process_factory=process_factory\n        )\n    )\n    return RuntimeManager(\n        [adapter],\n',
          )
          # Replace each supervisor-level process factory injection.
          text_path = Path('tests/test_supervisor.py')
          text = text_path.read_text(encoding='utf-8')
          text = text.replace(
              'runtime_manager=_manager({"display", "pointer"}),\n                process_factory=factory,',
              'runtime_manager=_manager(\n                    {"display", "pointer"}, process_factory=factory\n                ),',
          )
          text = text.replace(
              'runtime_manager=_manager({"display", "pointer"}),\n                storage_service=_storage_service(),\n                storage_broker_factory=_broker_factory(root / "brokers"),\n                process_factory=factory,',
              'runtime_manager=_manager(\n                    {"display", "pointer"}, process_factory=factory\n                ),\n                storage_service=_storage_service(),\n                storage_broker_factory=_broker_factory(root / "brokers"),',
          )
          text = text.replace(
              'runtime_manager=_manager({"display", "pointer"}),\n                process_factory=lambda *args, **kwargs: _FakeProcess(),',
              'runtime_manager=_manager(\n                    {"display", "pointer"},\n                    process_factory=lambda *args, **kwargs: _FakeProcess(),\n                ),',
          )
          if 'process_factory=' in text and 'PythonRuntimeAdapter(' not in text:
              raise SystemExit('unexpected process_factory rewrite state')
          text_path.write_text(text, encoding='utf-8')

          # Fake process returns a terminal code after runtime force-stop so the
          # adapter-owned path can be asserted synchronously.
          rep(
              'tests/test_supervisor.py',
              '    def kill(self) -> None:\n        self.killed = True\n',
              '    def kill(self) -> None:\n        self.killed = True\n        self.returncode = -9\n',
          )
          rep(
              'tests/test_supervisor.py',
              '    def test_storage_broker_is_exposed_for_launch_and_removed_on_exit(self) -> None:\n',
              '    def test_runtime_adapter_owns_forced_stop_and_exit_normalization(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            manifest = _manifest(root / "activity")\n            profile = _ProfileContext(root / "profile")\n            authority = _Authority(\n                manifest.activity_id, capabilities={"display", "pointer"}\n            )\n            process = _FakeProcess()\n            supervisor = ActivitySupervisor(\n                require_sandbox=False,\n                runtime_manager=_manager(\n                    {"display", "pointer"},\n                    process_factory=lambda *args, **kwargs: process,\n                ),\n            )\n            session = supervisor.start(manifest, profile, authority)\n            result = supervisor.force_stop(session)\n\n        self.assertTrue(process.killed)\n        self.assertIsNotNone(result)\n        self.assertEqual(result.exit_reason, ActivityExitReason.FORCED_STOP)\n        self.assertEqual(result.return_code, -9)\n\n    def test_storage_broker_is_exposed_for_launch_and_removed_on_exit(self) -> None:\n',
          )

          # RuntimeManager direct evidence for adapter-owned launch/collect.
          rep(
              'tests/test_runtime_manager.py',
              '    RuntimeLifecycleSupport,\n    RuntimeManager,\n',
              '    RuntimeInvocation,\n    RuntimeLifecycleSupport,\n    RuntimeManager,\n',
          )
          rep(
              'tests/test_runtime_manager.py',
              '    def test_activity_environment_cannot_forge_runtime_device_truth(self) -> None:\n',
              '    def test_runtime_manager_delegates_launch_and_exit_collection_to_adapter(self) -> None:\n        shape = next(\n            item for item in self._built_in_manifests()\n            if item.activity_id == "org.greia.shape-garden"\n        )\n        process = mock.Mock()\n        process.poll.return_value = 7\n        factory = mock.Mock(return_value=process)\n        manager = RuntimeManager(\n            [\n                PythonRuntimeAdapter(\n                    Path("/usr/bin/python3"),\n                    policy=self.python_policy,\n                    process_factory=factory,\n                )\n            ],\n            DeviceCapabilityService.static(\n                {"display", "pointer"}, source_id="runtime-manager-test"\n            ),\n        )\n        preparation = manager.prepare_launch(shape)\n        invocation = RuntimeInvocation(\n            command=preparation.command.command,\n            cwd=preparation.command.cwd,\n            environment=preparation.command.environment,\n        )\n        launched = manager.launch(preparation, invocation)\n        runtime_exit = manager.collect_exit(preparation, launched)\n\n        self.assertIs(launched, process)\n        self.assertEqual(runtime_exit.return_code, 7)\n        self.assertEqual(runtime_exit.kind.value, "crash")\n        factory.assert_called_once()\n\n    def test_activity_environment_cannot_forge_runtime_device_truth(self) -> None:\n',
          )

          plan = Path('docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md')
          marker = '---\n\n# 9. Final completion criteria'
          entry = '''## 2026-08-09 — R6.2 runtime session ownership\n\n- Implemented: runtime adapters now own final runtime process creation, exit collection/normalization, force-stop and runtime cleanup through `RuntimeInvocation`/`RuntimeExit`; RuntimeManager delegates those operations to the selected adapter. ActivitySupervisor still owns Greia sandbox policy, lifecycle deadlines and platform session resources, but no longer calls `Popen`, process-group signals or interprets raw runtime return codes itself.\n- Tests/evidence: direct RuntimeManager launch/exit delegation test, Supervisor forced-stop through adapter, focused runtime/supervisor tests, and complete recoverable suite.\n- Decisions: Bubblewrap command construction remains platform/sandbox policy; the selected adapter launches the resulting invocation so future Web/native adapters can own their runtime handle semantics without duplicating Greia isolation/storage/session policy. Exit classification is runtime-owned; Greia overlays platform reasons such as ready timeout, forced return and platform cleanup failure.\n- Remaining gap: Python READY/STOP marker transport is still created by the Supervisor rather than an adapter-owned lifecycle transport. That is the final R6.2 runtime-specific lifecycle seam to close before source-level R6.2 can be called complete.\n- Next exact step: move Python lifecycle READY/STOP transport construction and SDK environment behind the runtime adapter while preserving the same platform session ID and Supervisor state machine.\n- Commit(s): this tranche commit.\n\n'''
          current = plan.read_text(encoding='utf-8')
          if entry.splitlines()[0] in current or current.count(marker) != 1:
              raise SystemExit('plan insertion precondition failed')
          plan.write_text(current.replace(marker, entry + marker, 1), encoding='utf-8')

          hand = Path('HANDOVER.md')
          marker = '---\n\n## 2. Mandatory resume order'
          section = '''## R6.2 runtime session ownership — 2026-08-09\n\nThe Runtime Adapter now owns actual runtime handle mechanics rather than stopping at command generation. `RuntimeInvocation` is the final platform-approved invocation (including Bubblewrap when installed); the selected adapter launches it, collects and normalizes runtime exit, performs force-stop, and cleans up its runtime handle. RuntimeManager delegates those operations. Supervisor retains Greia sandbox policy, READY/STOP deadlines, platform resource brokers and final Activity result composition, but it no longer creates `Popen` processes, sends process-group signals, or decides whether a raw runtime return code means normal/crash. The remaining runtime-specific lifecycle leak is the Python READY/STOP file-marker transport, which is still constructed by Supervisor and is the next R6.2 closure item.\n\n'''
          current = hand.read_text(encoding='utf-8')
          if section.splitlines()[0] in current or current.count(marker) != 1:
              raise SystemExit('handover insertion precondition failed')
          hand.write_text(current.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Focused runtime session tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_runtime_manager.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v

      - name: Complete currently recoverable unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Confirm known R5 source-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 tools/validate_project.py >/tmp/v.out 2>&1
          status=$?
          set -e
          cat /tmp/v.out
          test "$status" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/v.out

      - name: Commit coherent runtime-session tranche
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/greia_launcher/runtime_adapter.py src/greia_launcher/supervisor.py tests/test_runtime_manager.py tests/test_supervisor.py docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-implementation
          git config user.email greia-r6-implementation@users.noreply.github.com
          git commit -m 'refactor: move runtime session mechanics behind adapters'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
