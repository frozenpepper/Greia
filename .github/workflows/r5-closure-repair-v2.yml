name: R5 closure repair v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r5-closure-repair-v2.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install verification dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Replay reviewed closure patch and fix parent registry authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/r5-closure-repair.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python3 <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if len(blocks) != 1:
              raise SystemExit(f'expected one reviewed closure patch block, found {len(blocks)}')
          exec(compile(textwrap.dedent(blocks[0]), '<r5-closure-replay>', 'exec'), {})

          def rep(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one parent registry anchor, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          rep(
              'src/greia_parent/server.py',
              'from greia_platform.profiles import ActiveProfileSession, ProfileError, ProfileStore\nfrom greia_parent.progress import ParentProgressReader\n',
              'from greia_platform.profiles import ActiveProfileSession, ProfileError, ProfileStore\nfrom greia_platform.trust import ActivitySource, PackageTrust\nfrom greia_parent.progress import ParentProgressReader\n',
          )
          rep(
              'src/greia_parent/server.py',
              '        self.runtime = RuntimeCatalogue.load(self.root / "runtime" / "child-runtime.toml")\n        self.registry = ActivityRegistry([self.root / "activities"], self.runtime)\n',
              '        self.runtime = RuntimeCatalogue.load(self.root / "runtime" / "child-runtime.toml")\n        self.registry = ActivityRegistry(\n            [\n                ActivitySource(\n                    self.root / "activities",\n                    trust=PackageTrust.BUILT_IN,\n                    source_id="greia-system",\n                )\n            ],\n            self.runtime,\n        )\n',
          )
          PY

      - name: Compile and focused R5 closure tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests tools activities
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_history.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_r5_integration.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_parent_status.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v

      - name: Full provider-free gate
        run: make verify

      - name: Commit R5 closure repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            src/greia_launcher/supervisor.py \
            src/greia_parent/server.py \
            tests/test_r5_integration.py \
            tests/test_parent_status.py
          git diff --cached --check
          git config user.name greia-r5-reimplementation
          git config user.email greia-r5-reimplementation@users.noreply.github.com
          git commit -m 'fix: close R5 launch failures and expose bounded parent progress'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
