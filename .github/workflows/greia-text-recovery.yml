name: Greia text recovery

on:
  push:
    branches:
      - archive/pip-kids-os-v0.12-exact
    paths:
      - .recovery/text-recovery-trigger

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing validated baseline files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import hashlib
          import io
          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = "1787c4a91c6f116d693a584a87a98d980076b4b178111af2bac82bff71cfaeff"
          parts = sorted(Path(".recovery/text-bundle").glob("chunk-*"))
          if len(parts) != 7:
              raise SystemExit(f"expected 7 bundle chunks, found {len(parts)}")
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"recovery payload SHA-256 mismatch: {actual}")

          added = []
          skipped = []
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as archive:
              members = archive.getmembers()
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts or not pure.parts:
                      raise SystemExit(f"unsafe recovery path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported recovery member type: {member.name}")

              for member in members:
                  if not member.isfile():
                      continue
                  destination = Path(*PurePosixPath(member.name).parts)
                  if destination.exists():
                      skipped.append(member.name)
                      continue
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read recovery member: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("wb") as handle:
                      shutil.copyfileobj(source, handle)
                  os.chmod(destination, member.mode & 0o777)
                  added.append(member.name)

          print(f"recovery payload verified: {actual}")
          print(f"added {len(added)} missing files; preserved {len(skipped)} existing files")
          for name in added:
              print(f"ADD {name}")
          PY

      - name: Commit recovered files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Greia Recovery"
          git config user.email "recovery@greia.invalid"
          git add Makefile VERSION activities build runtime src tests tools
          if git diff --cached --quiet; then
            echo "No missing baseline files required restoration."
            exit 0
          fi
          git commit -m "recovery: restore missing v0.13 baseline text tree"
          git push origin "HEAD:${GITHUB_REF_NAME}"
