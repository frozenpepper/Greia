name: R7 build cleanup exit-status contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-cleanup-exit-contract.yml"

permissions:
  contents: write

jobs:
  verify-and-persist:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply cleanup status repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for path, message in (
              ('build/build-image.sh', 'Build cleanup was incomplete. Inspect and detach resources manually; no recursive deletion was attempted.'),
              ('build/build-installer-image.sh', 'Installer-image cleanup was incomplete. Inspect resources manually; build data was preserved.'),
          ):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = f'''  if (( cleanup_failed != 0 )); then\n    echo "{message}" >&2\n  fi\n  return "$original_status"\n'''
              new = f'''  if (( cleanup_failed != 0 )); then\n    echo "{message}" >&2\n    if (( original_status == 0 )); then\n      return 1\n    fi\n  fi\n  return "$original_status"\n'''
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: cleanup status anchor mismatch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/test_build_cleanup_contract.py <<'PYTEST'
          from __future__ import annotations

          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          class BuildCleanupContractTests(unittest.TestCase):
              def test_successful_build_cannot_hide_cleanup_failure(self) -> None:
                  for relative in ("build/build-image.sh", "build/build-installer-image.sh"):
                      text = (ROOT / relative).read_text(encoding="utf-8")
                      cleanup_start = text.index("cleanup() {")
                      trap_start = text.index("trap cleanup EXIT", cleanup_start)
                      cleanup = text[cleanup_start:trap_start]
                      self.assertIn("if (( cleanup_failed != 0 )); then", cleanup)
                      self.assertIn("if (( original_status == 0 )); then", cleanup)
                      self.assertIn("return 1", cleanup)
                      self.assertIn('return "$original_status"', cleanup)

              def test_original_build_failure_remains_authoritative(self) -> None:
                  for relative in ("build/build-image.sh", "build/build-installer-image.sh"):
                      text = (ROOT / relative).read_text(encoding="utf-8")
                      cleanup = text[text.index("cleanup() {"):text.index("trap cleanup EXIT")]
                      self.assertLess(
                          cleanup.index("if (( original_status == 0 )); then"),
                          cleanup.rindex('return "$original_status"'),
                      )


          if __name__ == "__main__":
              unittest.main()
          PYTEST
          git diff --check

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_build_cleanup_contract.py' -v
          make verify

      - name: Persist verified repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-cleanup-exit-contract.yml
          git add build/build-image.sh build/build-installer-image.sh tests/test_build_cleanup_contract.py
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'build: fail when image resource cleanup is incomplete'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
