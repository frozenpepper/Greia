name: R0 reconcile restored baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r0-reconcile-restored-baseline.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile restored v0.12 tests with current R6 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          replacements = {
              root / 'tests/test_boot_contract.py': {
                  'pip-recovery': 'greia-recovery',
                  'pip.live_media_id': 'greia.live_media_id',
              },
              root / 'tests/test_installer_engine.py': {
                  'pip-recovery': 'greia-recovery',
                  '/tmp/pip-test-mount': '/tmp/greia-test-mount',
                  'LABEL=PIP_ROOT': 'LABEL=GREIA_ROOT',
              },
              root / 'tests/test_system_overlay_contract.py': {
                  'pipsettings': 'greiasettings',
                  'pipprofiles': 'greiaprofiles',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          activity_contract = '''from __future__ import annotations

import shutil
import tempfile
import unittest
from pathlib import Path

from greia_platform.activities import ActivityRegistry, ActivityValidationError, RuntimeCatalogue
from greia_platform.trust import ActivitySource, PackageTrust


PROJECT_ROOT = Path(__file__).resolve().parents[1]
RUNTIME_PATH = PROJECT_ROOT / "runtime" / "child-runtime.toml"


class ActivityContractTests(unittest.TestCase):
    def setUp(self) -> None:
        self.runtime = RuntimeCatalogue.load(RUNTIME_PATH)

    def test_sample_activities_are_discovered_from_built_in_source(self) -> None:
        source = ActivitySource(
            PROJECT_ROOT / "activities",
            trust=PackageTrust.BUILT_IN,
            source_id="builtin",
        )
        activities = ActivityRegistry([source], self.runtime).discover()
        self.assertEqual(
            [activity.activity_id for activity in activities],
            ["org.greia.shape-garden", "org.greia.workshop-settings"],
        )
        self.assertEqual(activities[0].legacy_ids, ("shape_garden",))
        self.assertEqual(activities[0].icon_id, "garden")
        self.assertIn("customization.manage", activities[1].requested_permissions)

    def test_external_package_cannot_claim_legacy_alias(self) -> None:
        with self._copy_sample(keep_legacy_alias=True) as root:
            with self.assertRaisesRegex(ActivityValidationError, "legacy Activity aliases require built-in"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_forbidden_dependency_file_is_rejected(self) -> None:
        with self._copy_sample() as root:
            (root / "requirements.txt").write_text("requests\\n", encoding="utf-8")
            with self.assertRaisesRegex(ActivityValidationError, "forbidden package file"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_forbidden_dependency_directory_is_rejected(self) -> None:
        with self._copy_sample() as root:
            (root / ".venv").mkdir()
            with self.assertRaisesRegex(ActivityValidationError, "forbidden package directory"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_executable_file_is_rejected(self) -> None:
        with self._copy_sample() as root:
            payload = root / "payload"
            payload.write_text("not executable code", encoding="utf-8")
            payload.chmod(0o755)
            with self.assertRaisesRegex(ActivityValidationError, "executable activity files"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_entrypoint_escape_is_rejected(self) -> None:
        with self._copy_sample() as root:
            manifest = (root / "activity.toml").read_text(encoding="utf-8")
            manifest = manifest.replace('entrypoint = "main.py"', 'entrypoint = "../main.py"')
            (root / "activity.toml").write_text(manifest, encoding="utf-8")
            with self.assertRaisesRegex(ActivityValidationError, "safe relative path"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_symlink_is_rejected(self) -> None:
        with self._copy_sample() as root:
            target = root / "linked.py"
            try:
                target.symlink_to(root / "main.py")
            except OSError:
                self.skipTest("symlinks unavailable")
            with self.assertRaisesRegex(ActivityValidationError, "symlinks are forbidden"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_unknown_capability_is_rejected(self) -> None:
        with self._copy_sample() as root:
            manifest = (root / "activity.toml").read_text(encoding="utf-8")
            manifest = manifest.replace(
                'required_capabilities = ["display", "pointer"]',
                'required_capabilities = ["display", "kernel.root"]',
            )
            (root / "activity.toml").write_text(manifest, encoding="utf-8")
            with self.assertRaisesRegex(ActivityValidationError, "unknown Activity capabilities"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_duplicate_required_capabilities_are_rejected(self) -> None:
        with self._copy_sample() as root:
            manifest = (root / "activity.toml").read_text(encoding="utf-8")
            manifest = manifest.replace(
                'required_capabilities = ["display", "pointer"]',
                'required_capabilities = ["display", "display"]',
            )
            (root / "activity.toml").write_text(manifest, encoding="utf-8")
            with self.assertRaisesRegex(ActivityValidationError, "must not contain duplicates"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_api_mismatch_is_rejected(self) -> None:
        with self._copy_sample() as root:
            manifest = (root / "activity.toml").read_text(encoding="utf-8")
            manifest = manifest.replace('api_version = "0.1"', 'api_version = "9.9"')
            (root / "activity.toml").write_text(manifest, encoding="utf-8")
            with self.assertRaisesRegex(ActivityValidationError, "does not match platform"):
                ActivityRegistry([root.parent], self.runtime).validate_package(root)

    def test_discovery_token_changes_when_manifest_changes(self) -> None:
        with self._copy_sample() as root:
            registry = ActivityRegistry([root.parent], self.runtime)
            before = registry.discovery_token()
            manifest = root / "activity.toml"
            manifest.write_text(manifest.read_text(encoding="utf-8") + "\\n", encoding="utf-8")
            self.assertNotEqual(before, registry.discovery_token())

    def _copy_sample(self, *, keep_legacy_alias: bool = False):
        temporary = tempfile.TemporaryDirectory()
        root = Path(temporary.name) / "shape_garden"
        shutil.copytree(PROJECT_ROOT / "activities" / "shape_garden", root)
        if not keep_legacy_alias:
            manifest = root / "activity.toml"
            text = manifest.read_text(encoding="utf-8")
            text = text.replace('legacy_ids = ["shape_garden"]\\n', 'legacy_ids = []\\n')
            manifest.write_text(text, encoding="utf-8")

        class Context:
            def __enter__(self_nonlocal):
                return root

            def __exit__(self_nonlocal, *args: object):
                temporary.cleanup()

        return Context()


if __name__ == "__main__":
    unittest.main()
'''
          (root / 'tests/test_activity_contract.py').write_text(activity_contract, encoding='utf-8')

          gitignore = root / '.gitignore'
          existing = gitignore.read_text(encoding='utf-8') if gitignore.exists() else ''
          required = ['__pycache__/', '*.py[cod]']
          lines = existing.splitlines()
          for value in required:
              if value not in lines:
                  lines.append(value)
          gitignore.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          tracked_cache=$(git ls-files | grep -E '(^|/)__pycache__/|\\.py[co]$' || true)
          if [ -n "$tracked_cache" ]; then
            printf '%s\n' "$tracked_cache" | xargs -d '\n' git rm -f --
          fi
          python3 -m compileall -q src tests tools activities
          git diff --check

      - name: Commit reconciled baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greia-r0-recovery"
          git config user.email "greia-r0-recovery@users.noreply.github.com"
          git add .gitignore tests/test_activity_contract.py tests/test_boot_contract.py tests/test_installer_engine.py tests/test_system_overlay_contract.py
          git commit -m "recovery: reconcile restored baseline tests with R6 contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
