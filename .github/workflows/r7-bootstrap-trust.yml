name: R7 pin Debian bootstrap trust root

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r7-bootstrap-trust.yml"

permissions:
  contents: write

jobs:
  verify-and-persist:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Acquire pinned Debian archive keyring
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/debian-archive-keyring_2025.1_all.deb"
          extracted="$RUNNER_TEMP/debian-keyring-extracted"
          url='https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb'
          expected='9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac'
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" -o "$package"
          printf '%s  %s\n' "$expected" "$package" | sha256sum -c -
          mkdir -p "$extracted" build/trust
          dpkg-deb -x "$package" "$extracted"
          source_keyring="$extracted/usr/share/keyrings/debian-archive-keyring.gpg"
          test -s "$source_keyring"
          cp "$source_keyring" build/trust/debian-archive-keyring-2025.1.gpg
          keyring_sha="$(sha256sum build/trust/debian-archive-keyring-2025.1.gpg | awk '{print $1}')"
          cat > build/trust/debian-archive-keyring-2025.1.provenance <<EOF
          upstream_package=debian-archive-keyring_2025.1_all.deb
          upstream_url=$url
          upstream_package_sha256=$expected
          extracted_path=/usr/share/keyrings/debian-archive-keyring.gpg
          extracted_keyring_sha256=$keyring_sha
          reviewed_utc=2026-08-09
          purpose=Greia debootstrap Release signature trust root
          EOF

      - name: Bind builders to pinned trust root
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for name, root_name in (
              ('build/build-image.sh', 'ROOTFS'),
              ('build/build-installer-image.sh', 'LIVE_ROOT'),
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              anchor = 'PACKAGE_SET_ROOT="$SCRIPT_DIR/package-sets"\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'{name}: package-root anchor mismatch')
              trust = (
                  anchor
                  + 'DEBIAN_ARCHIVE_KEYRING="$PROJECT_ROOT/build/trust/debian-archive-keyring-2025.1.gpg"\n'
              )
              text = text.replace(anchor, trust, 1)
              debootstrap_old = (
                  'debootstrap --arch="$ARCH" --variant=minbase --include=ca-certificates '
                  + '"$SUITE" "$' + root_name + '" "$MIRROR"\n'
              )
              debootstrap_new = (
                  '[[ -r "$DEBIAN_ARCHIVE_KEYRING" ]] || { echo "Pinned Debian archive keyring is missing: $DEBIAN_ARCHIVE_KEYRING" >&2; exit 1; }\n'
                  + 'debootstrap --arch="$ARCH" --variant=minbase --include=ca-certificates '
                  + '--keyring="$DEBIAN_ARCHIVE_KEYRING" --force-check-gpg '
                  + '"$SUITE" "$' + root_name + '" "$MIRROR"\n'
              )
              if text.count(debootstrap_old) != 1:
                  raise SystemExit(f'{name}: debootstrap anchor mismatch')
              path.write_text(text.replace(debootstrap_old, debootstrap_new, 1), encoding='utf-8')
          PY

          cat > tests/test_bootstrap_trust.py <<'PYTEST'
          from __future__ import annotations

          import hashlib
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          KEYRING = ROOT / "build/trust/debian-archive-keyring-2025.1.gpg"
          PROVENANCE = ROOT / "build/trust/debian-archive-keyring-2025.1.provenance"


          class BootstrapTrustTests(unittest.TestCase):
              def test_pinned_keyring_has_matching_recorded_digest(self) -> None:
                  self.assertTrue(KEYRING.is_file())
                  self.assertGreater(KEYRING.stat().st_size, 1024)
                  facts = dict(
                      line.split("=", 1)
                      for line in PROVENANCE.read_text(encoding="utf-8").splitlines()
                      if "=" in line
                  )
                  digest = hashlib.sha256(KEYRING.read_bytes()).hexdigest()
                  self.assertEqual(facts["extracted_keyring_sha256"], digest)
                  self.assertEqual(
                      facts["upstream_package_sha256"],
                      "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac",
                  )
                  self.assertTrue(facts["upstream_url"].startswith("https://deb.debian.org/"))

              def test_both_builders_force_release_signature_verification(self) -> None:
                  for name in ("build/build-image.sh", "build/build-installer-image.sh"):
                      text = (ROOT / name).read_text(encoding="utf-8")
                      self.assertIn("DEBIAN_ARCHIVE_KEYRING=", text)
                      self.assertIn('--keyring="$DEBIAN_ARCHIVE_KEYRING"', text)
                      self.assertIn("--force-check-gpg", text)
                      self.assertIn("Pinned Debian archive keyring is missing", text)
                      self.assertNotIn("--no-check-gpg", text)
                      self.assertNotIn("--no-check-sig", text)


          if __name__ == "__main__":
              unittest.main()
          PYTEST
          git diff --check

      - name: Verify trust patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bootstrap_trust.py' -v
          make verify

      - name: Persist trust root and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r7-bootstrap-trust.yml
          git add build/build-image.sh build/build-installer-image.sh build/trust tests/test_bootstrap_trust.py
          git diff --cached --check
          git config user.name greia-r7
          git config user.email greia-r7@users.noreply.github.com
          git commit -m 'build: pin and enforce Debian bootstrap trust root'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
