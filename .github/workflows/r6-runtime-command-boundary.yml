name: R6 runtime command boundary cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-runtime-command-boundary.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply runtime-command boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # RuntimeCommand carries only runtime-family-specific process facts.
          rep(
              'src/greia_launcher/runtime_adapter.py',
              'PRODUCTION_ROOT = Path("/opt/greia-os")\n\n\nclass RuntimeAdapterError',
              'PRODUCTION_ROOT = Path("/opt/greia-os")\n_PLATFORM_OWNED_ENVIRONMENT = frozenset(\n    {\n        "DISPLAY",\n        "HOME",\n        "LANG",\n        "LC_ALL",\n        "PATH",\n        "PULSE_SERVER",\n        "PYTHONPATH",\n        "SDL_AUDIODRIVER",\n        "SDL_VIDEODRIVER",\n        "WAYLAND_DISPLAY",\n        "XAUTHORITY",\n        "XDG_CACHE_HOME",\n        "XDG_CONFIG_HOME",\n        "XDG_DATA_HOME",\n        "XDG_RUNTIME_DIR",\n    }\n)\n\n\nclass RuntimeAdapterError',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              'class RuntimeCommand:\n    command: tuple[str, ...]\n    cwd: Path\n',
              'class RuntimeCommand:\n    command: tuple[str, ...]\n    cwd: Path\n    environment: tuple[tuple[str, str], ...] = ()\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '        return RuntimeCommand(\n            command=(str(self.resolve_interpreter()), str(manifest.launch_path)),\n            cwd=manifest.root,\n        )\n',
              '        return RuntimeCommand(\n            command=(str(self.resolve_interpreter()), str(manifest.launch_path)),\n            cwd=manifest.root,\n            environment=(\n                ("PYTHONNOUSERSITE", "1"),\n                ("PYTHONDONTWRITEBYTECODE", "1"),\n            ),\n        )\n',
          )
          rep(
              'src/greia_launcher/runtime_adapter.py',
              '        return RuntimeLaunchPreparation(\n            command=adapter.command_for(manifest),\n            compatibility=compatibility,\n            lifecycle_support=adapter.lifecycle_support,\n        )\n\n\ndef _string_set',
              '        runtime_command = adapter.command_for(manifest)\n        _validate_runtime_command(runtime_command, manifest)\n        return RuntimeLaunchPreparation(\n            command=runtime_command,\n            compatibility=compatibility,\n            lifecycle_support=adapter.lifecycle_support,\n        )\n\n\ndef _validate_runtime_command(\n    runtime_command: RuntimeCommand, manifest: ActivityManifest\n) -> None:\n    command = runtime_command.command\n    if (\n        not isinstance(command, tuple)\n        or not command\n        or not all(isinstance(item, str) and item and "\\x00" not in item for item in command)\n    ):\n        raise RuntimeValidationError("runtime command must be non-empty NUL-free text")\n\n    try:\n        package_root = manifest.root.resolve(strict=True)\n        working_directory = runtime_command.cwd.resolve(strict=True)\n    except OSError as exc:\n        raise RuntimeValidationError(f"runtime working directory is unavailable: {exc}") from exc\n    if not working_directory.is_dir():\n        raise RuntimeValidationError("runtime working directory is not a directory")\n    if working_directory != package_root and package_root not in working_directory.parents:\n        raise RuntimeValidationError("runtime working directory escapes Activity package root")\n\n    environment = runtime_command.environment\n    if not isinstance(environment, tuple):\n        raise RuntimeValidationError("runtime environment must be an immutable tuple")\n    seen: set[str] = set()\n    for item in environment:\n        if (\n            not isinstance(item, tuple)\n            or len(item) != 2\n            or not isinstance(item[0], str)\n            or not isinstance(item[1], str)\n        ):\n            raise RuntimeValidationError("runtime environment entries must be text pairs")\n        name, value = item\n        if not _environment_name(name) or "\\x00" in value or len(value) > 8192:\n            raise RuntimeValidationError("runtime environment contains an invalid entry")\n        if name in seen:\n            raise RuntimeValidationError(f"runtime environment duplicates {name!r}")\n        if (\n            name.startswith("GREIA_")\n            or name.startswith("XDG_")\n            or name in _PLATFORM_OWNED_ENVIRONMENT\n        ):\n            raise RuntimeValidationError(\n                f"runtime environment may not override platform-owned name {name!r}"\n            )\n        seen.add(name)\n\n\ndef _environment_name(value: str) -> bool:\n    if not value or len(value) > 128 or value[0].isdigit():\n        return False\n    return all(character.isascii() and (character.isalnum() or character == "_") for character in value)\n\n\ndef _string_set',
          )

          # Supervisor consumes, but does not invent, runtime-family process environment.
          rep(
              'src/greia_launcher/supervisor.py',
              '    RuntimeAdapterError,\n    RuntimeLaunchAdapter,\n    RuntimeManager,\n)',
              '    RuntimeAdapterError,\n    RuntimeCommand,\n    RuntimeLaunchAdapter,\n    RuntimeManager,\n)',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '            sandboxed=sandboxed,\n            storage_broker=storage_broker,\n        )\n',
              '            sandboxed=sandboxed,\n            storage_broker=storage_broker,\n            runtime_environment=runtime_command.environment,\n        )\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '                runtime_command.command,\n                manifest,\n',
              '                runtime_command,\n                manifest,\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        runtime_command: tuple[str, ...],\n        manifest: ActivityManifest,\n',
              '        runtime_command: RuntimeCommand,\n        manifest: ActivityManifest,\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        command.extend(["--chdir", str(manifest.root), *runtime_command])\n',
              '        command.extend(\n            ["--chdir", str(runtime_command.cwd), *runtime_command.command]\n        )\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        sandboxed: bool = False,\n        storage_broker: ActivityStorageBroker | None = None,\n    ) -> dict[str, str]:\n',
              '        sandboxed: bool = False,\n        storage_broker: ActivityStorageBroker | None = None,\n        runtime_environment: tuple[tuple[str, str], ...] = (),\n    ) -> dict[str, str]:\n',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '                "XDG_DATA_HOME": str(env_data),\n                "PYTHONNOUSERSITE": "1",\n                "PYTHONDONTWRITEBYTECODE": "1",\n                "GREIA_OS_ROOT":',
              '                "XDG_DATA_HOME": str(env_data),\n                "GREIA_OS_ROOT":',
          )
          rep(
              'src/greia_launcher/supervisor.py',
              '        if storage_broker is not None:\n            environment["GREIA_STORAGE_SOCKET"] = str(storage_broker.child_socket)\n',
              '        environment.update(dict(runtime_environment))\n        if storage_broker is not None:\n            environment["GREIA_STORAGE_SOCKET"] = str(storage_broker.child_socket)\n',
          )

          # RuntimeManager regression helpers and tests.
          rep(
              'tests/test_runtime_manager.py',
              '    PythonRuntimePolicy,\n    RuntimeCompatibilityError,\n    RuntimeManager,\n',
              '    PythonRuntimePolicy,\n    RuntimeCommand,\n    RuntimeCompatibilityError,\n    RuntimeLifecycleSupport,\n    RuntimeManager,\n',
          )
          rep(
              'tests/test_runtime_manager.py',
              'RUNTIME_PATH = PROJECT_ROOT / "runtime" / "child-runtime.toml"\n\n\nclass RuntimeManagerTests',
              'RUNTIME_PATH = PROJECT_ROOT / "runtime" / "child-runtime.toml"\n\n\nclass _CommandAdapter:\n    runtime_type = "python"\n    lifecycle_support = RuntimeLifecycleSupport()\n    required_device_capabilities = frozenset()\n\n    def __init__(self, command: RuntimeCommand):\n        self.command = command\n\n    def validate_package(self, manifest) -> None:\n        return None\n\n    def command_for(self, manifest) -> RuntimeCommand:\n        return self.command\n\n\nclass RuntimeManagerTests',
          )
          rep(
              'tests/test_runtime_manager.py',
              '    def test_activity_environment_cannot_forge_runtime_device_truth(self) -> None:\n',
              '    def test_python_runtime_owns_python_specific_environment(self) -> None:\n        shape = next(\n            item for item in self._built_in_manifests()\n            if item.activity_id == "org.greia.shape-garden"\n        )\n        preparation = self._manager({"display", "pointer"}).prepare_launch(shape)\n        self.assertEqual(\n            dict(preparation.command.environment),\n            {"PYTHONNOUSERSITE": "1", "PYTHONDONTWRITEBYTECODE": "1"},\n        )\n\n    def test_runtime_environment_cannot_override_platform_authority(self) -> None:\n        shape = next(\n            item for item in self._built_in_manifests()\n            if item.activity_id == "org.greia.shape-garden"\n        )\n        manager = RuntimeManager(\n            [\n                _CommandAdapter(\n                    RuntimeCommand(\n                        command=("runtime",),\n                        cwd=shape.root,\n                        environment=(("GREIA_PROFILE_ID", "forged"),),\n                    )\n                )\n            ],\n            DeviceCapabilityService.static(\n                {"display", "pointer"}, source_id="runtime-manager-test"\n            ),\n        )\n        with self.assertRaisesRegex(RuntimeValidationError, "platform-owned"):\n            manager.prepare_launch(shape)\n\n    def test_runtime_working_directory_cannot_escape_package(self) -> None:\n        shape = next(\n            item for item in self._built_in_manifests()\n            if item.activity_id == "org.greia.shape-garden"\n        )\n        manager = RuntimeManager(\n            [\n                _CommandAdapter(\n                    RuntimeCommand(command=("runtime",), cwd=PROJECT_ROOT)\n                )\n            ],\n            DeviceCapabilityService.static(\n                {"display", "pointer"}, source_id="runtime-manager-test"\n            ),\n        )\n        with self.assertRaisesRegex(RuntimeValidationError, "escapes Activity package"):\n            manager.prepare_launch(shape)\n\n    def test_activity_environment_cannot_forge_runtime_device_truth(self) -> None:\n',
          )

          # Supervisor evidence: generic env is Python-free; Python adapter contributes flags;
          # sandbox honors adapter-selected in-package cwd.
          rep(
              'tests/test_supervisor.py',
              'from greia_launcher.runtime_adapter import PythonRuntimeAdapter, RuntimeManager\n',
              'from greia_launcher.runtime_adapter import (\n    PythonRuntimeAdapter,\n    RuntimeCommand,\n    RuntimeManager,\n)\n',
          )
          rep(
              'tests/test_supervisor.py',
              '        self.assertEqual(Path(command[1]), manifest.launch_path)\n',
              '        self.assertEqual(Path(command[1]), manifest.launch_path)\n        environment = calls[0][1]["env"]\n        self.assertEqual(environment["PYTHONNOUSERSITE"], "1")\n        self.assertEqual(environment["PYTHONDONTWRITEBYTECODE"], "1")\n',
          )
          rep(
              'tests/test_supervisor.py',
              '        self.assertNotIn("GREIA_CUSTOMIZATION_DIR", environment)\n\n    def test_sandbox_launch_mounts_only_ephemeral_storage_broker',
              '        self.assertNotIn("GREIA_CUSTOMIZATION_DIR", environment)\n        self.assertNotIn("PYTHONNOUSERSITE", environment)\n        self.assertNotIn("PYTHONDONTWRITEBYTECODE", environment)\n\n    def test_sandbox_command_honors_runtime_working_directory(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            manifest = _manifest(root / "activity")\n            nested = manifest.root / "runtime-work"\n            nested.mkdir()\n            profile = _ProfileContext(root / "profile")\n            authority = _Authority(\n                manifest.activity_id, capabilities={"display", "pointer"}\n            )\n            command = ActivitySupervisor._sandbox_command(\n                root / "bwrap",\n                RuntimeCommand(command=("runtime", "--start"), cwd=nested),\n                manifest,\n                profile,\n                authority,\n            )\n            chdir = command.index("--chdir")\n            self.assertEqual(Path(command[chdir + 1]), nested)\n            self.assertEqual(command[chdir + 2 :], ["runtime", "--start"])\n\n    def test_sandbox_launch_mounts_only_ephemeral_storage_broker',
          )

          plan = Path('docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md')
          marker = '---\n\n# 9. Final completion criteria'
          entry = '''## 2026-08-09 — R6.2 runtime-command authority boundary\n\n- Implemented: `RuntimeCommand` now carries runtime-family-specific environment alongside command/cwd; `PythonRuntimeAdapter` owns Python-only process flags; RuntimeManager validates command text, package-bounded working directory and runtime environment before launch; ActivitySupervisor no longer injects Python settings and honors adapter cwd in Bubblewrap.\n- Tests/evidence: Python-specific environment ownership, platform-environment override rejection, cwd escape rejection, generic supervisor environment remaining Python-neutral, adapter cwd honored in sandbox, focused runtime/supervisor tests, and complete recoverable suite.\n- Decisions: runtime adapters may add bounded runtime-family process settings but cannot overwrite Greia/session/profile/storage authority, `PATH/HOME/XDG_*`, or inherited display/audio transport. Runtime-specific cwd must remain inside the Activity package.\n- Remaining blocker: R5 event/session/progression integration remains blocked by lost `greia_platform.history`; RuntimeLifecycleSupport pause/checkpoint remains declarative and is not promoted until a real runtime requires it.\n- Next exact step: perform an R6 closure audit against ADRs 0012/0014/0015 and the active plan, separating code-complete R6.2 items from the explicit R5 continuity blocker and any hardware-only evidence gates.\n- Commit(s): this tranche commit.\n\n'''
          text = plan.read_text(encoding='utf-8')
          if entry.splitlines()[0] in text or text.count(marker) != 1:
              raise SystemExit('plan insertion precondition failed')
          plan.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')

          hand = Path('HANDOVER.md')
          marker = '---\n\n## 2. Mandatory resume order'
          section = '''## R6.2 runtime-command authority boundary — 2026-08-09\n\nRuntime-family process details are now cleanly separated from the runtime-neutral Supervisor. `RuntimeCommand` includes command, an in-package working directory, and a bounded runtime-specific environment. `PythonRuntimeAdapter` supplies `PYTHONNOUSERSITE=1` and `PYTHONDONTWRITEBYTECODE=1`; the Supervisor no longer hardcodes Python policy. RuntimeManager rejects malformed commands, cwd escaping the Activity package, duplicate/invalid environment entries, and attempts to override Greia/profile/session/storage variables or platform-owned `PATH/HOME/XDG/display/audio` transport. Bubblewrap uses the adapter-prepared cwd rather than replacing it with the manifest root.\n\n'''
          text = hand.read_text(encoding='utf-8')
          if section.splitlines()[0] in text or text.count(marker) != 1:
              raise SystemExit('handover insertion precondition failed')
          hand.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Focused runtime boundary tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_runtime_manager.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v

      - name: Complete currently recoverable unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Confirm known R5 source-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 tools/validate_project.py >/tmp/v.out 2>&1
          s=$?
          set -e
          cat /tmp/v.out
          test "$s" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/v.out

      - name: Commit coherent R6.2 runtime boundary tranche
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/greia_launcher/runtime_adapter.py src/greia_launcher/supervisor.py tests/test_runtime_manager.py tests/test_supervisor.py docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-implementation
          git config user.email greia-r6-implementation@users.noreply.github.com
          git commit -m 'refactor: isolate runtime-specific launch command policy'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
