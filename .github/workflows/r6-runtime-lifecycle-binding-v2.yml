name: R6 runtime lifecycle binding v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r6-runtime-lifecycle-binding-v2.yml"

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reapply reviewed lifecycle refactor with corrected constructor patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/r6-runtime-lifecycle-binding.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n\n      - name: Install test dependency"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('cannot locate reviewed lifecycle patch payload')
          payload = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])

          old_helper = '''def rep(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text(encoding='utf-8')\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')\n'''
          new_helper = '''def rep(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text(encoding='utf-8')\n    count = text.count(old)\n    if count == 0 and new in text:\n        return\n    constructor_pair = (\n        path == 'src/greia_launcher/supervisor.py'\n        and old == '            package_digest=authority.package_digest,\\n            control=control,\\n'\n    )\n    if constructor_pair and count == 2:\n        p.write_text(text.replace(old, new), encoding='utf-8')\n        return\n    if count != 1:\n        raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')\n'''
          if payload.count(old_helper) != 1:
              raise SystemExit('cannot patch lifecycle helper deterministically')
          payload = payload.replace(old_helper, new_helper, 1)
          exec(compile(payload, '<lifecycle-binding-payload>', 'exec'), {})
          PY

      - name: Harden invalid lifecycle-binding cleanup and test it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patch anchor mismatch: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          rep(
              'src/greia_launcher/runtime_adapter.py',
              '        binding = adapter.create_lifecycle_binding(\n            session_id, host_activity_data, child_activity_data\n        )\n        _validate_lifecycle_binding(binding, session_id)\n        return binding\n',
              '        binding = adapter.create_lifecycle_binding(\n            session_id, host_activity_data, child_activity_data\n        )\n        try:\n            _validate_lifecycle_binding(binding, session_id)\n        except RuntimeAdapterError:\n            try:\n                binding.control.cleanup()\n            except Exception:\n                pass\n            raise\n        return binding\n',
          )

          path = Path('tests/test_runtime_manager.py')
          text = path.read_text(encoding='utf-8')
          class_anchor = '''class _CommandAdapter:\n    runtime_type = "python"\n    lifecycle_support = RuntimeLifecycleSupport()\n    required_device_capabilities = frozenset()\n\n    def __init__(self, command: RuntimeCommand):\n        self.command = command\n\n    def validate_package(self, manifest) -> None:\n        return None\n\n    def command_for(self, manifest) -> RuntimeCommand:\n        return self.command\n'''
          class_replacement = class_anchor + '''\n\nclass _WrongSessionPythonAdapter(PythonRuntimeAdapter):\n    def create_lifecycle_binding(\n        self, session_id, host_activity_data, child_activity_data\n    ):\n        return super().create_lifecycle_binding(\n            "b" * 32, host_activity_data, child_activity_data\n        )\n'''
          if text.count(class_anchor) != 1:
              raise SystemExit('runtime-manager helper class anchor mismatch')
          text = text.replace(class_anchor, class_replacement, 1)

          test_anchor = '''    def test_runtime_manager_delegates_launch_and_exit_collection_to_adapter(self) -> None:\n'''
          test = '''    def test_lifecycle_binding_cannot_replace_platform_session_identity(self) -> None:\n        shape = next(\n            item for item in self._built_in_manifests()\n            if item.activity_id == "org.greia.shape-garden"\n        )\n        manager = RuntimeManager(\n            [\n                _WrongSessionPythonAdapter(\n                    Path("/usr/bin/python3"), policy=self.python_policy\n                )\n            ],\n            DeviceCapabilityService.static(\n                {"display", "pointer"}, source_id="runtime-manager-test"\n            ),\n        )\n        preparation = manager.prepare_launch(shape)\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            host = root / "host"\n            with self.assertRaisesRegex(\n                RuntimeValidationError, "changed the platform session identity"\n            ):\n                manager.create_lifecycle_binding(\n                    preparation, "a" * 32, host, root / "child"\n                )\n            runtime_root = host / ".greia" / "runtime"\n            self.assertFalse(runtime_root.exists() and any(runtime_root.iterdir()))\n\n'''
          if text.count(test_anchor) != 1:
              raise SystemExit('runtime-manager lifecycle test anchor mismatch')
          path.write_text(text.replace(test_anchor, test + test_anchor, 1), encoding='utf-8')
          PY

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Focused lifecycle/runtime tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_activity_api.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_runtime_manager.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_supervisor.py' -v

      - name: Static runtime-neutrality check
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'ActivityControlChannel' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/supervisor.py
          ! grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/supervisor.py
          grep -F 'GREIA_ACTIVITY_READY_PATH' src/greia_launcher/runtime_adapter.py
          grep -F 'GREIA_ACTIVITY_STOP_PATH' src/greia_launcher/runtime_adapter.py

      - name: Complete currently recoverable unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Confirm known R5 source-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 tools/validate_project.py >/tmp/v.out 2>&1
          status=$?
          set -e
          cat /tmp/v.out
          test "$status" -ne 0
          grep -F "ModuleNotFoundError: No module named 'greia_platform.history'" /tmp/v.out

      - name: Commit coherent lifecycle-binding tranche
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/greia_launcher/lifecycle.py src/greia_launcher/runtime_adapter.py src/greia_launcher/supervisor.py tests/test_runtime_manager.py tests/test_supervisor.py docs/plans/2026-08-08_ARCHITECTURE_REMEDIATION_AND_PLATFORM_COMPLETION.md HANDOVER.md
          git diff --cached --check
          git config user.name greia-r6-implementation
          git config user.email greia-r6-implementation@users.noreply.github.com
          git commit -m 'refactor: move lifecycle transport behind runtime adapters'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
