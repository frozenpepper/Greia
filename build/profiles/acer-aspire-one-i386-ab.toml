schema_version = 1

[profile]
id = "acer-aspire-one-i386-ab"
certification_state = "unverified"
description = "Acer Aspire One A/B product installer candidate (legacy BIOS A/B target with GRUB A/B boot backend)."

[platform]
family = "legacy-x86"
board = "none"
compatibility_class = "C0"

[base]
suite = "bookworm"
architecture = "i386"
mirror = "https://deb.debian.org/debian"
security_mirror = "https://security.debian.org/debian-security"
support_end_date = "2028-06-30"
kernel_package = "linux-image-686-pae"

[image]
layout = "bios-single-ext4"
# Installer/live image artifact size (MiB) for building the live/installer
# image itself; it is NOT the target-device minimum. The target device is
# validated separately at install time by the real layout planner
# (ProfileSizing/plan_for_profile): 64 MiB layout overhead + 2x1536 MiB
# system slots + 1024 MiB PERSIST minimum = 4160 MiB layout capacity
# minimum. image.size_mib must cover that minimum; 4352 MiB leaves 192 MiB
# headroom above it (PERSIST grows to fill the remainder on larger targets).
size_mib = 4352
hostname = "greia"

[boot]
installed_adapter = "grub-pc-bios"
installer_adapter = "grub-pc-bios-live"
cover_backend = "greia-early-framebuffer-v1"

[display]
adapter = "xorg"
video_packages = ["xserver-xorg-video-intel", "xserver-xorg-video-vesa", "xserver-xorg-video-fbdev"]

[runtimes]
enabled = ["python"]

[packages]
target_sets = [
  "platform-base",
  "platform-shell-pygame",
  "activity-sandbox",
  "network-basic",
  "removable-media-common",
  "parent-recovery",
  "system-update",
]
installer_sets = ["installer-base", "system-update"]
extra_packages = ["xserver-xorg-legacy"]

[resources]
preferred_core_mib = 800
required_core_mib = 1000
architecture_review_mib = 1250

# A/B product target: legacy BIOS A/B layout (SYSTEM_A/SYSTEM_B/PERSIST) with
# the GRUB A/B boot backend. The legacy single-root recovery path stays
# explicit in acer-aspire-one-i386.toml (bios-single-ext4 + none-v1); an A/B
# profile never silently routes to the legacy single-partition engine.
[storage]
layout_adapter = "legacy-bios-ab-v1"
# Lifecycle plan A21 product default: 1536 MiB A/B system slots
# (1610612736 bytes). PERSIST takes the remainder (minimum 1024 MiB
# on device; the profile floor below is the product PERSIST minimum
# enforced by the real layout planner, not an installer-image scratch value).
system_slot_bytes = 1610612736
persistent_minimum_bytes = 1073741824

[installer]
target_policy = "pc-internal-v1"

[updates]
boot_backend = "grub-ab-v1"
required = true

[setup]
live_boot_adapter = "pc-live-syslinux-v1"
