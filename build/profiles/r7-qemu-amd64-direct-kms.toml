schema_version = 1

[profile]
id = "r7-qemu-amd64-direct-kms"
certification_state = "unverified"
description = "R7 QEMU-only direct-KMS experiment; not release eligible and not a hardware support claim."

[platform]
family = "standard-x86-64"
compatibility_class = "R7-DIRECT-KMS-EXPERIMENTAL"

[base]
suite = "trixie"
architecture = "amd64"
mirror = "https://deb.debian.org/debian"
security_mirror = "https://security.debian.org/debian-security"
support_end_date = "2030-06-30"
kernel_package = "linux-image-amd64"

[image]
layout = "bios-single-ext4"
size_mib = 3072
hostname = "greia-r7-kms"

[boot]
installed_adapter = "grub-pc-bios"
installer_adapter = "grub-pc-bios-live"
cover_backend = "stock-plymouth-provisional"

[display]
adapter = "direct-kms"
video_packages = []

[runtimes]
enabled = ["python"]

[packages]
target_sets = [
  "platform-base",
  "platform-shell-pygame",
  "activity-sandbox",
  "network-basic",
  "removable-media-common",
  "parent-recovery",
]
installer_sets = ["installer-base"]
extra_packages = []

[resources]
preferred_core_mib = 800
required_core_mib = 1000
architecture_review_mib = 1250
