schema_version = 1

[profile]
id = "acer-aspire-one-i386-nonpae"
certification_state = "unverified"
description = "Acer Aspire One compatibility candidate using the Debian 12 i386 non-PAE kernel."

[platform]
family = "legacy-x86"
board = "none"
compatibility_class = "C0"

[base]
suite = "bookworm"
architecture = "i386"
mirror = "https://deb.debian.org/debian"
security_mirror = "https://security.debian.org/debian-security"
support_end_date = "2028-06-30"
kernel_package = "linux-image-686"

[image]
layout = "bios-single-ext4"
size_mib = 2048
hostname = "greia"

[boot]
installed_adapter = "grub-pc-bios"
installer_adapter = "grub-pc-bios-live"
cover_backend = "greia-early-framebuffer-v1"

[display]
adapter = "xorg"
video_packages = ["xserver-xorg-video-intel", "xserver-xorg-video-vesa", "xserver-xorg-video-fbdev"]

[runtimes]
enabled = ["python"]

[packages]
target_sets = [
  "platform-base",
  "platform-shell-pygame",
  "activity-sandbox",
  "network-basic",
  "removable-media-common",
  "parent-recovery",
]
installer_sets = ["installer-base"]
extra_packages = ["xserver-xorg-legacy"]

[resources]
# Owner decision 2026-10-21: installed images up to 1,500 MiB are accepted
# (AGENTS.md contract 6), raised from 1,300 MiB to cover the four-language
# @2x art and EFI boot payloads. build/build-image.sh fails at >= required_core_mib.
preferred_core_mib = 800
required_core_mib = 1500
architecture_review_mib = 1500

[storage]
layout_adapter = "bios-single-ext4"
system_slot_bytes = 1073741824
persistent_minimum_bytes = 268435456

[installer]
target_policy = "pc-internal-v1"

[updates]
boot_backend = "none-v1"
required = false

[setup]
live_boot_adapter = "pc-live-syslinux-v1"
