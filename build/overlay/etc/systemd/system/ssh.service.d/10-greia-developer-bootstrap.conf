[Service]
# Debian's stock ssh.service validates sshd before ExecStart. Reset that
# pre-start list so Greia can first generate this machine's missing host keys
# and repair the historical developer-only AuthenticationMethods typo, then
# run the canonical sshd validation.
ExecStartPre=
ExecStartPre=+/bin/sh /usr/local/lib/greia-os/prepare-developer-ssh
ExecStartPre=/usr/sbin/sshd -t
