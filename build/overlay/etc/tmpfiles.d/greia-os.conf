# 0751: the child shell must traverse this to reach its own activity package
# tree. At 0750 greiakid could not stat it at all, which surfaced as
# PermissionError during activity discovery and killed the launcher on every
# boot. Traversal only - the parent service's own files stay unreadable.
d /var/lib/greia-os 0751 greiapanel greiapanel -
d /var/lib/greia-os/software-updates 0750 greiapanel greiapanel -
f /var/lib/greia-os/software-updates/job.lock 0660 greiapanel greiapanel -
# Created explicitly: activity discovery stats this root, and a missing root
# that merely happens to be unreadable looks like a permission fault rather than
# an absent directory.
d /var/lib/greia-os/activity-packages 0755 greiakid greiakid -
d /var/lib/greia-kid 0750 greiakid greiakid -
d /var/lib/greia-profiles 2770 greiakid pipprofiles -
d /media/greia 0755 root root -
d /run/greia-os 0770 greiakid pipprofiles -
d /var/lib/greia-admin 0700 greiaadmin greiaadmin -
d /var/lib/greia-system-settings 2770 greiapanel pipsettings -
f /var/lib/greia-system-settings/.system-controls.lock 0660 greiapanel pipsettings -
d /run/greia-hardware 2750 greiakid greiapanel -
