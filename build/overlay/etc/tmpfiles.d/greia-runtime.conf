# Greia volatile runtime roots.
# /run is tmpfs and starts empty on every boot, so these directories must be
# recreated by recurring boot infrastructure, never by the one-time first-boot
# initializer or whichever application service happens to win a startup race.
#
# /run/greia-os is writable by the child launcher and parent profile/settings
# group; /run/greia-hardware is written by the child-owned hardware session and
# readable/traversable by the parent service.
d /run/greia-os       0770 greiakid pipprofiles -
d /run/greia-hardware 2750 greiakid greiapanel   -
