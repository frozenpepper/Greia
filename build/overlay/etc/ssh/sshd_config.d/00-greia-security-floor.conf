# Greia security floor. This file sorts before profile/developer drop-ins and
# deliberately uses directives whose first value wins in sshd_config parsing.
# The managed `greia` account is deliberately not denied here: on base images
# SSH is disabled and the account is password-locked, while explicit developer
# provisioning rewrites this floor to permit the owner-approved greia/greia
# development login and keeps root denied.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
DenyUsers root
