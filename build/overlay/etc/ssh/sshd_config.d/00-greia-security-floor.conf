# Greia security floor. This file sorts before profile/developer drop-ins and
# deliberately uses directives whose first value wins in sshd_config parsing.
# It also denies the historical bootstrap account names explicitly, so stale
# builder convenience configuration cannot make a raw image remotely reachable
# by a known password.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
DenyUsers root greia
