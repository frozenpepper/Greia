# Greia developer/recovery SSH hardening.
# Normal/release images do not enable SSH merely because this static policy
# exists in the common overlay. When an explicit developer image is provisioned
# it enables the owner-approved greia/greia development login, keeps root
# denied, and retains the operator key as an additional automation path. Base
# images keep the greia account locked and SSH off.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
