# Greia developer/recovery SSH hardening.
# Normal/release images do not enable SSH merely because this static policy
# exists in the common overlay. When an explicit developer image installs and
# enables OpenSSH, access is key-only and bounded to the Greia admin account.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers greiaadmin
