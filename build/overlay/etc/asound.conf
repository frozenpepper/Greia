# Greia platform-owned microphone endpoints (ADR 0031).
#
# The physical capture slave below is Greia-owned configuration and must stay
# hidden behind the logical endpoint name; Activities only ever receive the
# route selected by the Greia AudioService (greia_mic_light | default).
#
# Composition note: the denoise ExtPlug cannot convert rate, and an ALSA rate
# conversion below it stalls the capture read path on this reference stack.
# The outer plug therefore pins the whole denoise stage to the hardware-native
# 48 kHz mono S16_LE contract and performs every application-side conversion
# itself (16 kHz probes, SDL 22.05 kHz, ... all verified working).
#
# Architecture neutrality: the plugin is named by bare file name. alsa-lib
# expands a relative module name to its own compiled plugin directory
# (/usr/lib/<multiarch>/alsa-lib on Debian; verified on the i686 Acer), so the
# same file serves i386, amd64 and arm64 images. Never hard-code a multiarch
# path here.
#
# Card selection: the capture slave follows ALSA's own default card/device
# (defaults.pcm.card / defaults.pcm.device), exactly like the raw `default`
# route, so processing on and processing off always capture from the same
# physical device and one ALSA setting selects it.

pcm_type.greia_denoise {
	lib "libasound_module_pcm_greia_mic_light.so"
}

pcm.greia_mic_light {
	type plug
	slave {
		pcm {
			type greia_denoise
			slave {
				pcm {
					@func concat
					strings [
						"plughw:CARD="
						{ @func refer name defaults.pcm.card }
						",DEV="
						{ @func refer name defaults.pcm.device }
					]
				}
			}
		}
		format S16_LE
		channels 1
		rate 48000
	}
}
