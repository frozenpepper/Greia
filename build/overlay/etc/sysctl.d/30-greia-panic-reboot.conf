# TAKEOVER-4/D55 failure class 4: automatic panic reboot.
#
# A panicking kernel cannot run userspace recovery, so the kernel itself
# must reboot: reboot ~10 seconds after a panic, including oops-induced
# panics. The consumed boot one-shot then returns the machine to the
# previous accepted slot (persistent default untouched), where the journal
# reconciles the candidate as rolled back / failed.
#
# Rendered from greia_platform.boot_transaction.PANIC_REBOOT_SYSCTL (one
# source of truth; tests assert exact agreement).
kernel.panic = 10
kernel.panic_on_oops = 1
