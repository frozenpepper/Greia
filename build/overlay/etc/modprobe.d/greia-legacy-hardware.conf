# Greia: legacy Mac / netbook kernel-module policy (2026-10-21 reviews
# 2026-10-21_PRE_M1_MAC_HARDWARE_SUPPORT.md (archived; see git history) section 3 and
# ..._LEGACY_X86_NETBOOK_HARDWARE_RISKS.md section 3.2). UNPROVEN on hardware.
# Only in-tree modules are configured here; nothing is compiled on the target.

# Apple keyboards (hid_apple): fnmode=1 makes the media keys (volume,
# brightness, mute) work without holding fn; fn+Fx gives the plain F-key.
# Children use arrows + Space, so the plain F-keys are not needed by default.
# (The review wrote "fnmode=2"; mode 2 is F-keys-first, the opposite.)
options hid_apple fnmode=1

# Broadcom Wi-Fi: b43 and brcmsmac can both claim the same bcma-attached
# BCM43224/43225 chip. brcmsmac has redistributable firmware
# (firmware-brcm80211) and is the driver Greia supports; b43 needs firmware
# that Debian cannot ship (contrib downloader only), so on an offline Greia
# image it can never work. Keep it from racing brcmsmac. A parent who
# supplies b43 firmware by hand removes this line. b43legacy (ssb-only
# BCM4301/4306/4309) cannot conflict with brcmsmac and stays loadable.
blacklist b43

# applesmc, bcm5974 and applespi are in-tree Debian kernel modules that load
# through their DMI / USB / ACPI aliases; no modules-load.d entry is wanted
# because it would fail noisily on every non-Apple PC.
