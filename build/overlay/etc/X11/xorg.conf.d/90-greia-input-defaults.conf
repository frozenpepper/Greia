# Fail-safe defaults before the parent-owned session controller applies state.
#
# Some older laptops expose one physical touchpad through both a modern
# /dev/input/event* node and a legacy /dev/input/mouse* compatibility node.
# libinput must own only the event device. Matching the compatibility node can
# make the entire pointer appear frozen even though the real event device is
# healthy. Keep this hardware-family-neutral: ignore the legacy mouse-node
# namespace rather than naming a particular touchpad model.
Section "InputClass"
    Identifier "Greia ignore legacy mouse compatibility nodes"
    MatchDevicePath "/dev/input/mouse*"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Greia touchpad defaults"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "off"
    Option "AccelSpeed" "0.35"
EndSection

Section "InputClass"
    Identifier "Greia mouse defaults"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    Driver "libinput"
    Option "AccelSpeed" "0.2"
EndSection
