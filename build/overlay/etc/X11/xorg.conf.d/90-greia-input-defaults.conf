# Fail-safe defaults before the parent-owned session controller applies state.
Section "InputClass"
    Identifier "Pip touchpad defaults"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "off"
    Option "NaturalScrolling" "off"
    Option "AccelSpeed" "0.0"
EndSection

Section "InputClass"
    Identifier "Pip mouse defaults"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    Driver "libinput"
    Option "AccelSpeed" "0.0"
EndSection
