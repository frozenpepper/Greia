# Keep the appliance inside its graphical child/installer surface. Root-owned
# recovery helpers may still switch VTs explicitly with chvt/openvt.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "DontZoom" "true"
    Option "DisableVidModeExtension" "true"
EndSection
