# /run/greia-os for socket-activated Greia services on the installed system.
# systemd-tmpfiles-setup runs before sockets.target, so the system-update
# socket (and other runtime markers under /run/greia-os) has its directory
# before bind. The directory is traversal-only for unprivileged users; each
# socket node keeps its own owner/mode (the update socket stays 0600 root).
d /run/greia-os 0755 root root -
