# Intentionally declares no directories.
#
# /run/greia-os used to be declared here as "d /run/greia-os 0755 root root",
# duplicating the path that /etc/tmpfiles.d/greia-os.conf already owns. Both
# files are applied, and /usr/lib/tmpfiles.d sorts after /etc/tmpfiles.d, so
# this copy won: Xorg runs as greiakid and could not create Xorg.0.log, exited,
# and greia-launcher.service restart-looped. The boot-marker spool lives in the
# same directory, so the loop was also silent. tests/test_image_tmpfiles_
# identities.py pins the owner, but only ever read greia-os.conf, so the second
# declaration was invisible to it.
#
# greia-os.conf is the single owner of record for this path and systemd-
# tmpfiles-setup runs before sockets.target, which is all the system-update
# socket needed. Do not re-declare /run/greia-os here; assert against
# greia-os.conf instead.
