[Service]
# Run Greia's developer-only host-key/auth preparation before Debian's normal
# sshd configuration validation. The helper is a no-op on non-development
# images; ssh.service is disabled there anyway.
ExecStartPre=
ExecStartPre=+/bin/sh /usr/local/lib/greia-os/prepare-developer-ssh
ExecStartPre=/usr/sbin/sshd -t
