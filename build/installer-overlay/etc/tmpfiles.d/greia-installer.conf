# Early /run/greia-os for the live installer session.
# systemd-tmpfiles-setup runs before sockets.target, so the transaction
# socket has its directory before bind. The unprivileged UI only needs to
# traverse and connect (0755); the socket node itself stays 0600 nobody.
d /run/greia-os 0755 root root -
# Writable staging for the root install-transaction service (POSTR1-P2): the
# exact ReadWritePaths the unit grants. PERSIST and shared boot-control mount
# points, plus the slot mount root. All are root-owned tmpfs staging; target-
# disk effects go through block devices, never through these paths.
d /run/greia-install 0755 root root -
d /run/greia-install/persist 0700 root root -
d /run/greia-install/boot-control 0700 root root -
d /run/greia-slots 0700 root root -
