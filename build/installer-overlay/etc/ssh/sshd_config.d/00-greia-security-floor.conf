# Live installer security floor. The managed `greia` account is not denied
# here; explicit developer-installer provisioning may rewrite this floor so the
# owner-approved greia/greia development login works while root stays denied.
# Base installer images keep SSH disabled and the account password-locked.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
DenyUsers root
