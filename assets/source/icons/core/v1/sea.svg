<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: curling sea wave with a leaping fish (sea discovery theme). Flat Greia vector. -->
  <defs>
    <!-- ocean light -> ocean -->
    <linearGradient id="sea_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
    <!-- turquoise light -> turquoise -->
    <linearGradient id="sea_wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85D1CA"/>
      <stop offset="1" stop-color="#44B8AE"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="232" rx="92" ry="10" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="wave">
    <path d="M24 196 C20 128 62 70 124 64 C176 60 210 96 206 132 C203 156 182 168 162 162 C144 156 140 134 154 124 C166 116 180 126 176 138 C176 112 156 96 130 98 C94 102 72 144 76 196 Z" fill="url(#sea_wave)" stroke="#4B372F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M44 150 C52 112 82 84 120 80" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g id="water">
    <path d="M22 186 C40 172 58 172 76 184 C94 196 112 196 130 184 C148 172 166 172 184 184 C202 196 220 196 234 186 L234 212 C234 222 226 230 216 230 L40 230 C30 230 22 222 22 212 Z" fill="url(#sea_water)" stroke="#4B372F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M50 206 L74 206 M148 210 L178 210" fill="none" stroke="#CFEAF7" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="fish" transform="translate(-10 6)" stroke="#4B372F" stroke-linejoin="round">
    <path d="M228 40 L240 22 L242 56 Z" fill="#F46F61" stroke-width="5"/>
    <ellipse cx="206" cy="46" rx="28" ry="17" transform="rotate(-24 206 46)" fill="#F46F61" stroke-width="5"/>
    <circle cx="192" cy="47" r="4.5" fill="#342C35" stroke="none"/>
    <ellipse cx="200" cy="36" rx="7" ry="3.5" transform="rotate(-24 200 36)" fill="#FFFFFF" opacity="0.75" stroke="none"/>
  </g>
</svg>
