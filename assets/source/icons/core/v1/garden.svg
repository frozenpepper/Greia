<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: flower in a pot (nature). Flat Greia vector. -->
  <defs>
    <!-- orange light -> orange -->
    <linearGradient id="garden_pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C288"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- raspberry light -> raspberry -->
    <linearGradient id="garden_petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E89AB5"/>
      <stop offset="1" stop-color="#D85683"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="230" rx="62" ry="9.5" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="stem" stroke-linecap="round" fill="none">
    <path d="M128 160 L128 96" stroke="#4B372F" stroke-width="14"/>
    <path d="M128 160 L128 96" stroke="#59B86A" stroke-width="6"/>
  </g>
  <g id="leaves" fill="#59B86A" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round">
    <path d="M126 146 C108 116 76 112 54 122 C68 150 100 158 126 146 Z"/>
    <path d="M130 138 C150 110 184 108 204 120 C190 146 158 152 130 138 Z"/>
    <path d="M70 124 C88 126 104 132 118 142" fill="none" stroke="#9BD4A6" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g id="pot">
    <path d="M82 170 L174 170 L164 222 C163 228 158 232 152 232 L104 232 C98 232 93 228 92 222 Z" fill="url(#garden_pot)" stroke="#4B372F" stroke-width="5" stroke-linejoin="round"/>
    <rect x="70" y="154" width="116" height="26" rx="9" fill="#CE8436" stroke="#4B372F" stroke-width="5"/>
    <path d="M84 162 L120 162" stroke="#F8C288" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="flower">
    <g fill="url(#garden_petal)" stroke="#4B372F" stroke-width="4.5">
    <circle cx="128" cy="50" r="22"/>
    <circle cx="154" cy="65" r="22"/>
    <circle cx="154" cy="95" r="22"/>
    <circle cx="128" cy="110" r="22"/>
    <circle cx="102" cy="95" r="22"/>
    <circle cx="102" cy="65" r="22"/>
    </g>
    <circle cx="128" cy="80" r="20" fill="#FFC234" stroke="#4B372F" stroke-width="4.5"/>
    <ellipse cx="121" cy="73" rx="6" ry="4" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
