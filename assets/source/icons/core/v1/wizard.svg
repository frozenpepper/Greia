    <path d="M84 94 C98 102 150 102 166 94" fill="none" stroke="#FFC234" stroke-width="10" stroke-linecap="round"/>
    <path d="M116 56 L119.5 63.1 L127.3 64.2 L121.6 69.8 L123 77.6 L116 73.9 L109 77.6 L110.4 69.8 L104.7 64.2 L112.5 63.1 Z" fill="#FFC234" stroke-width="2.5"/>
