    <linearGradient id="wizard_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFA2DF"/>
      <stop offset="1" stop-color="#9464C9"/>
    </linearGradient>
    <!-- peach light -> peach -->
    <linearGradient id="wizard_face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEADB"/>
      <stop offset="1" stop-color="#F8D8BD"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="124" cy="228" rx="64" ry="10" fill="#6A5147" opacity="0.14"/>
  </g>
