    <circle cx="110.5" cy="133.5" r="2.5" fill="#FFFFFF"/>
    <circle cx="140" cy="136" r="7" fill="#342C35"/>
    <circle cx="142.5" cy="133.5" r="2.5" fill="#FFFFFF"/>
