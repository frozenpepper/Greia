<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: check badge (accept / done). Flat Greia vector. -->
  <defs>
    <!-- leaf light -> leaf -->
    <linearGradient id="check_disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD4A6"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
  </defs>
  <g id="badge">
    <circle cx="128" cy="128" r="104" fill="url(#check_disc)" stroke="#4B372F" stroke-width="5"/>
    <ellipse cx="80" cy="70" rx="24" ry="12" fill="#FFFFFF" opacity="0.5" transform="rotate(-35 80 70)"/>
  </g>
  <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 134 L112 168 L180 92" stroke="#4B372F" stroke-width="38"/>
    <path d="M78 134 L112 168 L180 92" stroke="#FFFBEB" stroke-width="26"/>
  </g>
</svg>
