<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: beamed notes with a star (music). Flat Greia vector. -->
  <defs>
    <!-- grape light -> grape -->
    <linearGradient id="music_note" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#BFA2DF"/>
      <stop offset="1" stop-color="#9464C9"/>
    </linearGradient>
  </defs>
  <g id="notes_outline" fill="#4B372F">
    <ellipse cx="72" cy="184" rx="30" ry="22" transform="rotate(-20 72 184)" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="160" cy="162" rx="30" ry="22" transform="rotate(-20 160 162)" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
    <rect x="88" y="74" width="14" height="114" rx="4" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
    <rect x="176" y="52" width="14" height="114" rx="4" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
    <path d="M88 74 L190 48 L190 78 L88 104 Z" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g id="notes" fill="url(#music_note)">
