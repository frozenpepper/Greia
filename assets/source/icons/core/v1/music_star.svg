  </g>
  <g id="star">
    <path d="M211.9 118.5 L218.2 140.2 L239.7 147.3 L221 160 L220.9 182.6 L203 168.7 L181.5 175.6 L189.2 154.4 L176 136 L198.5 136.7 Z" fill="#FFC234" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
