<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: gold star trophy cup (achievement avatar). Flat Greia vector. -->
  <defs>
    <!-- gold light -> gold -->
    <linearGradient id="star_trophy_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDD97C"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <!-- coral light -> coral -->
    <linearGradient id="star_trophy_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A9A0"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="228" rx="70" ry="11" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="handles" fill="none" stroke-linecap="round">
    <path d="M70 62 C34 60 30 110 78 118" stroke="#4B372F" stroke-width="20"/>
    <path d="M70 62 C34 60 30 110 78 118" stroke="#FBBF24" stroke-width="10"/>
    <path d="M186 62 C222 60 226 110 178 118" stroke="#4B372F" stroke-width="20"/>
    <path d="M186 62 C222 60 226 110 178 118" stroke="#FBBF24" stroke-width="10"/>
  </g>
  <g id="cup" stroke="#4B372F" stroke-linejoin="round">
    <path d="M114 140 L142 140 L148 178 L108 178 Z" fill="#F59E0B" stroke-width="5"/>
    <path d="M62 40 L194 40 L192 70 C190 118 164 146 128 146 C92 146 66 118 64 70 Z" fill="url(#star_trophy_gold)" stroke-width="5"/>
    <rect x="56" y="30" width="144" height="20" rx="10" fill="#FBBF24" stroke-width="5"/>
    <path d="M128 66 L138.6 86.4 L161.3 90.3 L145.2 106.7 L148.5 129.5 L128 119.2 L107.5 129.5 L110.8 106.7 L94.7 90.3 L117.4 86.4 Z" fill="#F59E0B" stroke="#98651F" stroke-width="3.5"/>
    <path d="M82 62 C84 88 92 106 104 118" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  </g>
  <g id="base" stroke="#4B372F" stroke-linejoin="round">
    <rect x="92" y="172" width="72" height="18" rx="8" fill="#FBBF24" stroke-width="5"/>
    <rect x="72" y="186" width="112" height="36" rx="10" fill="url(#star_trophy_base)" stroke-width="5"/>
    <rect x="104" y="196" width="48" height="16" rx="5" fill="#FDD97C" stroke-width="3.5"/>
  </g>
</svg>
