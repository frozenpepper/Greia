<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia core icon: spiral notebook and pencil (writing). Flat Greia vector. -->
  <defs>
    <!-- ocean light -> ocean -->
    <linearGradient id="notebook_cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92BDE8"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="124" cy="230" rx="74" ry="11.4" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="notebook">
    <rect x="34" y="54" width="148" height="170" rx="18" fill="url(#notebook_cover)" stroke="#4B372F" stroke-width="5"/>
    <rect x="48" y="68" width="120" height="142" rx="10" fill="#FFFBEB" stroke="#4B372F" stroke-width="3.5"/>
    <g fill="none" stroke="#92BDE8" stroke-width="5" stroke-linecap="round">
      <path d="M64 108 L152 108"/>
      <path d="M64 134 L152 134"/>
      <path d="M64 160 L132 160"/>
      <path d="M64 186 L118 186"/>
    </g>
  </g>
  <g id="spiral" stroke-linecap="round">
    <path d="M72 74 L72 42" stroke="#4B372F" stroke-width="11"/>
    <path d="M72 72 L72 44" stroke="#FAF3E0" stroke-width="4"/>
    <path d="M98 74 L98 42" stroke="#4B372F" stroke-width="11"/>
    <path d="M98 72 L98 44" stroke="#FAF3E0" stroke-width="4"/>
    <path d="M124 74 L124 42" stroke="#4B372F" stroke-width="11"/>
    <path d="M124 72 L124 44" stroke="#FAF3E0" stroke-width="4"/>
    <path d="M150 74 L150 42" stroke="#4B372F" stroke-width="11"/>
    <path d="M150 72 L150 44" stroke="#FAF3E0" stroke-width="4"/>
  </g>
  <g id="pencil" transform="rotate(-52 176 130)">
    <rect x="96" y="114" width="26" height="32" rx="9" fill="#F46F61" stroke="#4B372F" stroke-width="4.5"/>
    <rect x="114" y="114" width="16" height="32" fill="#D1C3A9" stroke="#4B372F" stroke-width="4.5"/>
    <rect x="128" y="114" width="92" height="32" fill="#FFC234" stroke="#4B372F" stroke-width="4.5"/>
    <path d="M132 122 L214 122" stroke="#FFDA85" stroke-width="5" stroke-linecap="round"/>
    <path d="M220 114 L252 130 L220 146 Z" fill="#F8D8BD" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M242 125 L252 130 L242 135 Z" fill="#4B372F" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
