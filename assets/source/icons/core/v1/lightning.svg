    <linearGradient id="lightning_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA85"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
  </defs>
  <g id="bolt">
    <path d="M140 18 L50 140 L112 140 L88 238 L210 100 L148 100 L190 18 Z" fill="url(#lightning_fill)" stroke="#4B372F" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M138 34 L74 122" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
