<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ui.award.bronze default: round copper medal; centre slot (128,100) r56 receives the emblem at runtime -->
  <defs>
    <!-- orange light (40% white) -> orange shade (20% ink) -->
    <linearGradient id="award_bronze_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C288"/>
      <stop offset="1" stop-color="#D18636"/>
    </linearGradient>
    <!-- ocean light (35% white) -> ocean -->
    <linearGradient id="award_bronze_ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="ribbons" stroke-linejoin="round" stroke-linecap="round">
    <path d="M120 150 L88 144 L74 210 L90 192 L106 218 Z" fill="url(#award_bronze_ribbon)" stroke="#4B372F" stroke-width="4.5"/>
    <path d="M104 156 L92 184" fill="none" stroke="#FFFBEB" stroke-width="5" opacity="0.85"/>
    <path d="M136 150 L168 144 L182 210 L166 192 L150 218 Z" fill="url(#award_bronze_ribbon)" stroke="#4B372F" stroke-width="4.5"/>
    <path d="M152 156 L164 184" fill="none" stroke="#FFFBEB" stroke-width="5" opacity="0.85"/>
  </g>
  <g id="medal" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="128" cy="100" r="80" fill="url(#award_bronze_body)" stroke="#4B372F" stroke-width="5"/>
    <circle cx="128" cy="100" r="64" fill="none" stroke="#B07234" stroke-width="5"/>
    <circle cx="128" cy="100" r="56" fill="#FFFBEB" stroke="#4B372F" stroke-width="3.5"/>
    <path d="M66 74 A70 70 0 0 1 100 38" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.7"/>
  </g>
</svg>
