    <path d="M113 88 V79 A15 15 0 0 1 143 79 V88" fill="none" stroke="#ACB5C0" stroke-width="6"/>
    <rect x="103" y="86" width="50" height="40" rx="9" fill="#818D9F" stroke="#4B372F" stroke-width="4"/>
    <path d="M111 95 H125.5" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>
    <circle cx="128" cy="102.8" r="5.5" fill="#4B372F"/>
    <path d="M128 102.8 V114.8" fill="none" stroke="#4B372F" stroke-width="5"/>
  </g>
