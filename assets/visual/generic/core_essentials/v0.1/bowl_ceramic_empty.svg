<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bowlInteriorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <radialGradient id="bowlFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.25)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="bowlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="100" cy="125" rx="75" ry="10" fill="url(#bowlFloorShadow)" />

  <!-- Bowl Outer Body -->
  <path d="M 25,45 Q 100,55 175,45 Q 165,120 100,120 Q 35,120 25,45 Z" fill="url(#bowlBodyGrad)" filter="url(#bowlShadow)" />

  <!-- Foot Ring -->
  <ellipse cx="100" cy="118" rx="35" ry="6" fill="#B45309" />
  <ellipse cx="100" cy="116" rx="32" ry="4" fill="#FDE68A" />

  <!-- Interior Well (Empty, Deep) -->
  <ellipse cx="100" cy="45" rx="75" ry="22" fill="url(#bowlInteriorGrad)" />
  <ellipse cx="100" cy="47" rx="68" ry="17" fill="#FFFBEB" />

  <!-- Rolled Rim Highlight -->
  <ellipse cx="100" cy="45" rx="75" ry="22" fill="none" stroke="#FEF08A" stroke-width="2" />
  <path d="M 45,55 Q 100,62 155,55" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
  <path d="M 40,80 Q 100,105 160,80" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.5" />
</svg>