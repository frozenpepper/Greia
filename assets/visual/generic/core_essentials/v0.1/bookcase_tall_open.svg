<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBookcase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="shelfBacking" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="bookcaseFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.3)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="bcDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="180" cy="485" rx="160" ry="12" fill="url(#bookcaseFloor)" />

  <!-- Main Cabinet Outer Frame -->
  <rect x="30" y="25" width="300" height="455" rx="6" fill="url(#woodBookcase)" filter="url(#bcDrop)" />

  <!-- Molded Crown Top -->
  <polygon points="20,25 340,25 330,45 30,45" fill="#D97706" />
  <rect x="18" y="15" width="324" height="12" rx="3" fill="#F59E0B" />

  <!-- Inner Backing (Beadboard lines) -->
  <rect x="45" y="45" width="270" height="425" fill="url(#shelfBacking)" />
  <!-- Vertical beadboard grooving -->
  <line x1="90" y1="45" x2="90" y2="470" stroke="#D97706" stroke-width="1" opacity="0.3" />
  <line x1="135" y1="45" x2="135" y2="470" stroke="#D97706" stroke-width="1" opacity="0.3" />
  <line x1="180" y1="45" x2="180" y2="470" stroke="#D97706" stroke-width="1" opacity="0.3" />
  <line x1="225" y1="45" x2="225" y2="470" stroke="#D97706" stroke-width="1" opacity="0.3" />
  <line x1="270" y1="45" x2="270" y2="470" stroke="#D97706" stroke-width="1" opacity="0.3" />

  <!-- Shelf 1 (y: 145) -->
  <rect x="40" y="145" width="280" height="14" rx="2" fill="#78350F" />
  <rect x="40" y="145" width="280" height="4" fill="#F59E0B" />
  <!-- Books on Shelf 1 -->
  <rect x="60" y="65" width="18" height="80" rx="2" fill="#EF4444" />
  <rect x="80" y="70" width="16" height="75" rx="2" fill="#3B82F6" />
  <rect x="98" y="60" width="22" height="85" rx="2" fill="#10B981" />
  <polygon points="122,145 138,145 158,80 142,80" fill="#F59E0B" />

  <!-- Shelf 2 (y: 255) -->
  <rect x="40" y="255" width="280" height="14" rx="2" fill="#78350F" />
  <rect x="40" y="255" width="280" height="4" fill="#F59E0B" />
  <!-- Books on Shelf 2 -->
  <rect x="230" y="175" width="24" height="80" rx="2" fill="#8B5CF6" />
  <rect x="256" y="180" width="18" height="75" rx="2" fill="#EC4899" />
  <rect x="276" y="170" width="22" height="85" rx="2" fill="#06B6D4" />

  <!-- Shelf 3 (y: 365) -->
  <rect x="40" y="365" width="280" height="14" rx="2" fill="#78350F" />
  <rect x="40" y="365" width="280" height="4" fill="#F59E0B" />
  <!-- Stacked volumes & scroll on Shelf 3 -->
  <rect x="60" y="335" width="80" height="14" rx="2" fill="#D97706" />
  <rect x="65" y="320" width="70" height="14" rx="2" fill="#3B82F6" />
  <rect x="70" y="305" width="60" height="14" rx="2" fill="#10B981" />

  <!-- Bottom Plinth Base -->
  <rect x="25" y="465" width="310" height="20" rx="3" fill="#78350F" />
  <rect x="25" y="465" width="310" height="4" fill="#F59E0B" />
</svg>