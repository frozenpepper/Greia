<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="cupMint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cupInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="cupFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.25)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="cupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="100" cy="138" rx="80" ry="8" fill="url(#cupFloor)" />

  <!-- Saucer -->
  <ellipse cx="100" cy="120" rx="80" ry="18" fill="url(#cupMint)" filter="url(#cupShadow)" />
  <ellipse cx="100" cy="119" rx="72" ry="14" fill="#ECFDF5" />
  <ellipse cx="100" cy="120" rx="45" ry="8" fill="#A7F3D0" opacity="0.6" />

  <!-- Cup Handle Right -->
  <path d="M 135,60 C 175,60 175,100 130,105" fill="none" stroke="url(#cupMint)" stroke-width="8" stroke-linecap="round" filter="url(#cupShadow)" />
  <path d="M 135,60 C 175,60 175,100 130,105" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" />

  <!-- Cup Body -->
  <path d="M 55,45 Q 100,52 145,45 Q 138,115 100,115 Q 62,115 55,45 Z" fill="url(#cupMint)" filter="url(#cupShadow)" />

  <!-- Cup Interior Well (Empty) -->
  <ellipse cx="100" cy="45" rx="45" ry="14" fill="url(#cupInside)" />
  <ellipse cx="100" cy="46" rx="40" ry="11" fill="#FFFFFF" />

  <!-- Specular Highlights -->
  <ellipse cx="100" cy="45" rx="45" ry="14" fill="none" stroke="#D1FAE5" stroke-width="1.5" />
  <path d="M 68,60 Q 100,72 132,60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
</svg>