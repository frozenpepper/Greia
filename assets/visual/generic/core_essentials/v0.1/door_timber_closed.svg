<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="doorPlank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="panelBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="brassKnob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="shadowFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.3)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="150" cy="485" rx="130" ry="12" fill="url(#shadowFloor)" />

  <!-- Outer Frame -->
  <rect x="25" y="20" width="250" height="460" rx="8" fill="url(#frameGrad)" filter="url(#shadow)" />
  <rect x="35" y="30" width="230" height="445" rx="4" fill="#451A03" />

  <!-- Door Leaf -->
  <rect x="40" y="35" width="220" height="435" rx="4" fill="url(#doorPlank)" />

  <!-- Upper Left Panel -->
  <rect x="58" y="55" width="84" height="175" rx="4" fill="url(#panelBevel)" />
  <rect x="62" y="59" width="76" height="167" rx="3" fill="#B45309" />
  <rect x="66" y="63" width="68" height="159" rx="2" fill="#D97706" />

  <!-- Upper Right Panel -->
  <rect x="158" y="55" width="84" height="175" rx="4" fill="url(#panelBevel)" />
  <rect x="162" y="59" width="76" height="167" rx="3" fill="#B45309" />
  <rect x="166" y="63" width="68" height="159" rx="2" fill="#D97706" />

  <!-- Lower Left Panel -->
  <rect x="58" y="255" width="84" height="185" rx="4" fill="url(#panelBevel)" />
  <rect x="62" y="259" width="76" height="177" rx="3" fill="#B45309" />
  <rect x="66" y="263" width="68" height="169" rx="2" fill="#D97706" />

  <!-- Lower Right Panel -->
  <rect x="158" y="255" width="84" height="185" rx="4" fill="url(#panelBevel)" />
  <rect x="162" y="259" width="76" height="177" rx="3" fill="#B45309" />
  <rect x="166" y="263" width="68" height="169" rx="2" fill="#D97706" />

  <!-- Hinges Left -->
  <rect x="36" y="80" width="8" height="24" rx="2" fill="#78350F" stroke="#451A03" stroke-width="1" />
  <rect x="36" y="380" width="8" height="24" rx="2" fill="#78350F" stroke="#451A03" stroke-width="1" />

  <!-- Brass Knob & Plate Right -->
  <rect x="228" y="235" width="16" height="50" rx="3" fill="url(#brassKnob)" stroke="#78350F" stroke-width="1" filter="url(#shadow)" />
  <circle cx="236" cy="255" r="9" fill="url(#brassKnob)" stroke="#92400E" stroke-width="1.5" />
  <circle cx="234" cy="253" r="3" fill="#FEF08A" opacity="0.8" />
  <circle cx="236" cy="272" r="2.5" fill="#451A03" />
</svg>