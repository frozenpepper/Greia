      <stop offset="0" stop-color="#FBEAD6"/>
      <stop offset="1" stop-color="#EFC79C"/>
    </linearGradient>
    <clipPath id="snail_peek_clip"><rect x="0" y="0" width="256" height="200"/></clipPath>
  </defs>
