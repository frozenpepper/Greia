<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia creature.woodland.firefly - full. Non-cast creature, flat Greia vector. -->
  <defs>
    <!-- plum light steps (firefly) -->
    <linearGradient id="firefly_open_head" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7C6A80"/>
      <stop offset="1" stop-color="#4F3F55"/>
    </linearGradient>
    <!-- sunshine light -> sunshine -->
    <linearGradient id="firefly_open_tail" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
    <radialGradient id="firefly_open_glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE08A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>
  </defs>
