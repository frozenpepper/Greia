    <radialGradient id="firefly_asleep_glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE08A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>
  </defs>
