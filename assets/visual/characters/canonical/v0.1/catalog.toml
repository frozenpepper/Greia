[pack]
id = "greia.characters.canonical.v0.1"
name = "Greia Canonical Character Cast"
version = "0.1.0"
status = "stable-source"
authority = "2026-08-22_CANONICAL_CAST_V01_PROMOTION_RUNTIME_SIMULATOR.md (archived; see git history)"
notes = "Promoted stable source masters, registered 5-state vector sets, shared cast poses (pose_cheer, pose_point, pose_think, pose_wave, pose_play), extra expressions (sad, angry, silly), and authoring components for Greia's six canonical mascots."

[provenance]
canonical_ensemble = ["character.lilli", "character.leo", "character.flash", "character.dani", "character.tito", "character.momo"]
promotion_commit = "0ed5eba1"
historical_nino_provenance = "leo/source_master.svg (the retired Nino owl base was refined into Leo with signature glasses before promotion; the pre-promotion candidate sources are preserved in git history at commit 0ed5eba1, not as a current asset folder)"

[[characters]]
id = "character.lilli"
display_name = "Lilli"
archetype = "unicorn_puff"
species = "unicorn"
logical_artboard = [256, 256]
min_recommended_px = 64
max_recommended_px = 512
primary_domain = "creativity / stories / art / imagination"
provenance = "lilli/source_master.svg (canonical v0.1 master; pre-promotion candidate history in git at commit 0ed5eba1)"
source_master = "lilli/source_master.svg"
states = { neutral = "lilli/neutral.svg", blink = "lilli/blink.svg", happy = "lilli/happy.svg", surprised = "lilli/surprised.svg", sleepy = "lilli/sleepy.svg" }
poses = { pose_cheer = "lilli/pose_cheer.svg", pose_point = "lilli/pose_point.svg", pose_think = "lilli/pose_think.svg", pose_wave = "lilli/pose_wave.svg", pose_play = "lilli/pose_play.svg" }
expressions = { sad = "lilli/sad.svg", angry = "lilli/angry.svg", silly = "lilli/silly.svg" }
components = ["lilli/components/horn.svg", "lilli/components/forelock.svg", "lilli/components/eyes_blink.svg"]

