<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Momo pose_play: canonical v0.1 paths verbatim; dancing - 6 degree sway and 8 px hop, one appendage up and one out about their roots, canonical happy eyes and open smile, two music notes. -->
  <defs>
    <linearGradient id="momoBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="229" rx="43" ry="7" fill="#6A5147" opacity="0.11"/>
  </g>

  <g id="character" transform="translate(0 -8) rotate(-6 128 217)">
    <!-- Asymmetric Antennae -->
    <g id="antennae">
      <path d="M105 77 C95 57 96 45 105 37" stroke="#6D4BB6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="105" cy="35" r="8" fill="#FBBF24" stroke="#4B372F" stroke-width="2.5"/>
      <path d="M151 76 C164 59 165 47 159 39" stroke="#6D4BB6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="158" cy="37" r="7" fill="#F43F5E" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Stub Arms -->
    <g id="stub_arms">
      <ellipse cx="65" cy="150" rx="12" ry="21" fill="#7E22CE" stroke="#4B372F" stroke-width="2.5" transform="translate(-17 -42) rotate(-30 65 150)"/>
        <ellipse cx="191" cy="148" rx="12" ry="21" fill="#7E22CE" stroke="#4B372F" stroke-width="2.5" transform="translate(18 2) rotate(62 191 148)"/>
    </g>

    <!-- Main Scalloped Fluff Body -->
    <g id="fluff_body">
      <path d="M128 68 C144 64 155 72 163 83 C180 80 190 91 187 107 C203 116 202 132 190 142 C198 159 191 174 177 179 C176 194 164 205 149 203 C142 215 126 220 114 212 C98 218 84 211 79 198 C63 197 55 185 59 171 C45 160 46 145 58 136 C49 120 55 105 69 99 C68 84 82 75 96 80 C105 68 117 65 128 68 Z" fill="url(#momoBody)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Belly Glow -->
    <g id="belly_glow">
      <ellipse cx="128" cy="145" rx="48" ry="44" fill="#E9D5FF" opacity="0.36"/>
    </g>

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="103" cy="209" rx="14" ry="8.5" fill="#2DD4BF" stroke="#4B372F" stroke-width="2.5"/>
      <ellipse cx="153" cy="209" rx="14" ry="8.5" fill="#2DD4BF" stroke="#4B372F" stroke-width="2.5" transform="translate(4 -9) rotate(-18 153 209)"/>
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Cheeks -->
      <g id="cheeks">
        <ellipse cx="88" cy="154" rx="10" ry="6" fill="#FDA4AF" opacity="0.55"/>
        <ellipse cx="169" cy="153" rx="10" ry="6" fill="#FDA4AF" opacity="0.55"/>
      </g>

      <!-- Eyes -->
      <g id="eyes">
        <path d="M97 133 Q107 121 117 133" stroke="#352B3A" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M139 131 Q149 119 159 131" stroke="#352B3A" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Mouth with Single Tooth -->
      <g id="mouth">
        <path d="M106 158 Q128 186 150 158 Q148 190 128 193 Q108 188 106 158 Z" fill="#581C87" stroke="#352B3A" stroke-width="1.5"/>
        <path d="M125 159 L135 159 L130 171 Z" fill="#FFFBEB"/>
        <path d="M116 174 Q128 185 140 174" fill="#F43F5E"/>
      </g>
    </g>

    <!-- Spots -->
    <g id="spots">
      <circle cx="91" cy="105" r="5.5" fill="#F3E8FF" opacity="0.7"/>
      <circle cx="163" cy="102" r="4.5" fill="#F3E8FF" opacity="0.7"/>
      <circle cx="170" cy="176" r="4" fill="#F3E8FF" opacity="0.7"/>
    </g>
  </g>
  <g id="fx" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <path d="M33 84 L33 54 Q46 56 49 70 Q44 64 38.5 64 L38.5 84 Z" fill="#44B8AE" stroke-width="2.5"/>
    <ellipse cx="30" cy="84" rx="8" ry="6.5" fill="#44B8AE" stroke-width="2.5" transform="rotate(-20 30 84)"/>
    <path d="M217 64 L217 34 Q230 36 233 50 Q228 44 222.5 44 L222.5 64 Z" fill="#FDE68A" stroke-width="2.5"/>
    <ellipse cx="214" cy="64" rx="8" ry="6.5" fill="#FDE68A" stroke-width="2.5" transform="rotate(-20 214 64)"/>
  </g>
</svg>