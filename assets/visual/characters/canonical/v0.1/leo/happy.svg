<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="leoBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="229" rx="55" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character">
    <!-- Ear Tufts -->
    <g id="ear_tufts">
      <path d="M84 79 L76 42 L105 68 Z" fill="#92400E" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M151 68 L181 42 L172 79 Z" fill="#92400E" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bean Body -->
    <g id="body">
      <path d="M128 58 C163 58 184 84 182 119 C180 148 190 176 171 199 C159 214 143 220 128 220 C112 220 94 214 84 199 C67 174 76 149 74 120 C72 85 94 58 128 58 Z" fill="url(#leoBody)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wings -->
    <g id="wings">
      <path d="M82 120 C54 125 50 155 74 175 C84 160 89 140 82 120 Z" fill="#92400E" stroke="#4B372F" stroke-width="2.5"/>
        <path d="M174 120 C202 125 206 155 182 175 C172 160 167 140 174 120 Z" fill="#92400E" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Belly -->
    <g id="belly">
      <path d="M128 108 C151 108 166 129 163 163 C160 192 146 207 128 207 C109 207 95 191 93 163 C91 132 105 108 128 108 Z" fill="#FEF3C7" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Face Mask (Integrated for glasses) -->
    <g id="face_mask">
      <path d="M83 106 C91 81 110 72 128 84 C146 72 166 81 173 106 C162 125 148 132 128 127 C108 132 94 125 83 106 Z" fill="#FFFBEB"/>
      <!-- Soft eye socket background panels -->
      <rect x="89" y="95" width="34" height="30" rx="6" ry="6" fill="#FFFDF7" opacity="0.9"/>
      <rect x="133" y="95" width="34" height="30" rx="6" ry="6" fill="#FFFDF7" opacity="0.9"/>
    </g>

    <!-- Eyes (under glasses) -->
    <g id="eyes">
      <path d="M96 110 Q106 98 116 110" stroke="#342C35" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M140 110 Q150 98 160 110" stroke="#342C35" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Signature Glasses -->
    <!-- Glasses Frame -->
      <g id="glasses">
        <rect x="87" y="93" width="38" height="34" rx="8" ry="8" fill="none" stroke="#0D9488" stroke-width="4.5"/>
        <rect x="131" y="93" width="38" height="34" rx="8" ry="8" fill="none" stroke="#0D9488" stroke-width="4.5"/>
        <path d="M125 110 L131 110" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Glasses Rim Highlight -->
        <path d="M91 97 L105 97 M135 97 L149 97" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round"/>
      </g>

    <!-- Beak & Smile -->
    <g id="beak">
      <path d="M119 125 L137 125 L128 138 Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.2"/>
        <ellipse cx="128" cy="134" rx="4" ry="2" fill="#B45309"/>
        <path d="M112 148 Q128 162 144 148" stroke="#72513F" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Feet -->
    <g id="feet">
      <path d="M103 211 Q112 202 121 211 Q112 218 103 211Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.5"/>
      <path d="M135 211 Q144 202 153 211 Q144 218 135 211Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.5"/>
    </g>
  </g>
</svg>