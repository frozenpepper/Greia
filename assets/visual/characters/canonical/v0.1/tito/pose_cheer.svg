<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Tito pose_cheer: canonical v0.1 paths verbatim; front paws swung up about the hip, canonical happy tail and face, 12 px hop. -->
  <defs>
    <linearGradient id="titoBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="228" rx="44" ry="7" fill="#6A5147" opacity="0.11"/>
  </g>

  <g id="fx" stroke="#8A5A12" stroke-width="2.5" stroke-linejoin="round">
    <path d="M26 64 Q28 74 38 76 Q28 78 26 88 Q24 78 14 76 Q24 74 26 64 Z" fill="#FDE68A"/>
    <path d="M230 64 Q232 74 242 76 Q232 78 230 88 Q228 78 218 76 Q228 74 230 64 Z" fill="#FDE68A"/>
  </g>

  <g id="character" transform="translate(0 -12)">
    <!-- Tail behind -->
    <g id="tail">
      <path d="M179 136 C224 110 236 142 214 172 C200 189 184 191 170 182 C189 174 193 156 179 136 Z" fill="#EA580C" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M207 150 C221 140 227 148 217 163 C210 173 201 176 193 174 C203 167 208 160 207 150 Z" fill="#FFFBEB" stroke="#4B372F" stroke-width="2"/>
    </g>

    <!-- Ears -->
    <g id="ears">
      <path d="M88 82 L76 42 L110 72 Z" fill="#EA580C" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M148 72 L181 42 L168 82 Z" fill="#EA580C" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M88 68 L82 51 L101 68 Z" fill="#FCA5A5"/>
      <path d="M155 68 L175 51 L168 69 Z" fill="#FCA5A5"/>
    </g>

    <!-- Body -->
    <g id="body">
      <path d="M128 67 C169 67 195 94 196 132 C197 164 179 193 153 204 C134 212 110 209 94 202 C67 190 55 165 59 135 C64 96 89 67 128 67 Z" fill="url(#titoBody)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Cream Muzzle / Chest -->
    <g id="muzzle">
      <path d="M94 119 C104 104 118 104 128 115 C138 104 153 104 163 119 C171 134 164 158 151 168 C144 174 136 176 128 176 C118 176 109 173 102 167 C88 155 86 134 94 119 Z" fill="#FFFBEB"/>
    </g>

    <!-- Paws -->
    <g id="paws">
      <ellipse cx="101" cy="207" rx="14" ry="8.5" fill="#FFFBEB" stroke="#4B372F" stroke-width="2.5" transform="translate(-45 -79) rotate(35 101 207)"/>
      <ellipse cx="153" cy="207" rx="14" ry="8.5" fill="#FFFBEB" stroke="#4B372F" stroke-width="2.5" transform="translate(47 -79) rotate(-35 153 207)"/>
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Cheeks -->
      <g id="cheeks">
        <ellipse cx="91" cy="151" rx="9" ry="5.5" fill="#FDA4AF" opacity="0.5"/>
        <ellipse cx="165" cy="151" rx="9" ry="5.5" fill="#FDA4AF" opacity="0.5"/>
      </g>

      <!-- Eyes -->
      <g id="eyes">
        <path d="M99 133 Q108 122 117 133" stroke="#3C2D33" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M139 133 Q148 122 157 133" stroke="#3C2D33" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Nose & Mouth -->
      <g id="mouth">
        <path d="M119 145 Q128 139 137 145 Q134 153 128 156 Q122 153 119 145Z" fill="#594047" stroke="#4B372F" stroke-width="2"/>
        <path d="M112 160 Q128 180 144 160 Z" fill="#BE123C"/>
        <path d="M118 168 Q128 176 138 168" fill="#FB7185"/>
      </g>
    </g>

    <!-- Forehead Stripe -->
    <g id="forehead_stripe">
      <path d="M128 82 C119 91 116 102 118 114 C124 107 129 103 136 101 C135 93 133 87 128 82 Z" fill="#C2410C" opacity="0.75"/>
    </g>
  </g>
</svg>