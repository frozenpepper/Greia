<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="daniBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="daniBulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="228" rx="56" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character">
    <!-- Top Antenna with Glowing Light Bulb -->
    <g id="antenna">
      <path d="M128 62 L128 34" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="128" cy="28" r="9" fill="url(#daniBulb)" stroke="#4B372F" stroke-width="2.5"/>
      <circle cx="125" cy="25" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Side Jointed Arms -->
    <g id="arms">
      <rect x="50" y="122" width="14" height="26" rx="7" ry="7" fill="#0284C7" stroke="#4B372F" stroke-width="2.5" transform="rotate(-20 57 135)"/>
        <rect x="192" y="122" width="14" height="26" rx="7" ry="7" fill="#0284C7" stroke="#4B372F" stroke-width="2.5" transform="rotate(20 199 135)"/>
    </g>

    <!-- Soft Rounded Robot Casing / Body -->
    <g id="body">
      <rect x="66" y="62" width="124" height="136" rx="34" ry="34" fill="url(#daniBody)" stroke="#4B372F" stroke-width="3.5"/>
      <!-- Subtle top bevel highlight -->
      <path d="M96 68 Q128 64 160 68" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Front Face Display Screen (Cream/Ice White Panel) -->
    <g id="face_screen">
      <rect x="80" y="86" width="96" height="96" rx="20" ry="20" fill="#F8FAFC" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Robot Feet Pads / Rollers -->
    <g id="feet">
      <rect x="94" y="198" width="24" height="15" rx="7" ry="7" fill="#0369A1" stroke="#4B372F" stroke-width="2.5"/>
      <rect x="138" y="198" width="24" height="15" rx="7" ry="7" fill="#0369A1" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Soft Pink Cheek Lights -->
      <g id="cheeks">
        <circle cx="94" cy="148" r="6" fill="#FDA4AF" opacity="0.6"/>
        <circle cx="162" cy="148" r="6" fill="#FDA4AF" opacity="0.6"/>
      </g>

      <!-- Digital/Display Eyes -->
      <g id="eyes">
        <path d="M96 133 Q106 120 116 133" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M140 133 Q150 120 160 133" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Digital Smile -->
      <g id="mouth">
        <path d="M114 153 Q128 174 142 153 Z" fill="#0284C7"/>
        <path d="M118 163 Q128 170 138 163" fill="#38BDF8"/>
      </g>
    </g>

    <!-- Side Ear Cogs / Dials -->
    <g id="ear_dials">
      <rect x="58" y="104" width="8" height="18" rx="3" ry="3" fill="#FBBF24" stroke="#4B372F" stroke-width="1.8"/>
      <rect x="190" y="104" width="8" height="18" rx="3" ry="3" fill="#FBBF24" stroke="#4B372F" stroke-width="1.8"/>
    </g>
  </g>
</svg>