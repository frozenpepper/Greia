<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="bush-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="bush-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9EF294"/>
    <stop offset="50%" stop-color="#5CD068"/>
    <stop offset="100%" stop-color="#329C48"/>
  </linearGradient>
  <linearGradient id="bush-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#60D26E"/>
    <stop offset="55%" stop-color="#38A54A"/>
    <stop offset="100%" stop-color="#1E7532"/>
  </linearGradient>
  <linearGradient id="bush-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#2D8D3D"/>
    <stop offset="60%" stop-color="#1B6029"/>
    <stop offset="100%" stop-color="#10401A"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows (Solidly Anchored Base) -->
<ellipse cx="256" cy="228" rx="200" ry="18" fill="#2E2015" opacity="0.18" filter="url(#bush-shadow)"/>
<ellipse cx="256" cy="226" rx="160" ry="10" fill="#1C120A" opacity="0.30"/>

<!-- Back / Under-Bush Shadow Mass (Flat Grounded Bottom Line) -->
<path d="M65 226 C50 180 68 128 110 112 C135 75 188 68 225 85 C258 60 318 65 350 95 C388 80 438 105 448 152 C462 188 448 215 425 226 L65 226 Z" fill="url(#bush-dark)"/>

<!-- Mid-Layer Foliage Billows (Flat Base $y=226$) -->
<g fill="url(#bush-mid)">
  <!-- Left Billow -->
  <path d="M55 226 C42 175 62 125 105 110 C132 100 162 112 178 135 C192 158 190 190 175 215 C165 224 150 226 135 226 L55 226 Z"/>
  <!-- Right Billow -->
  <path d="M335 226 C322 195 335 150 372 130 C405 112 445 125 458 155 C468 185 455 212 430 226 L335 226 Z"/>
  <!-- Center Main Billow -->
  <path d="M125 226 C105 160 138 95 190 82 C222 75 258 88 278 112 C308 90 350 95 370 128 C388 160 378 200 352 226 L125 226 Z"/>
</g>

<!-- Fore / Sunlit Crest Billows -->
<g fill="url(#bush-sun)">
  <!-- Top Crown -->
  <path d="M168 125 C152 82 190 45 235 42 C270 38 308 60 318 92 C342 88 370 105 372 135 C375 165 352 192 320 200 C288 208 248 198 225 182 C192 190 162 170 158 140 C155 132 160 126 168 125 Z"/>
  <!-- Lower-Left Sunlit Bulge -->
  <path d="M92 168 C78 132 105 98 140 92 C168 90 192 105 202 128 C185 158 158 185 125 188 C105 188 98 178 92 168 Z"/>
  <!-- Lower-Right Sunlit Bulge -->
  <path d="M308 155 C300 120 330 92 365 95 C395 98 418 120 412 150 C408 175 385 198 358 200 C330 200 312 180 308 155 Z"/>
</g>

<!-- Sunlight Sheen on Crests -->
<g fill="#D8FCD0" opacity="0.65">
  <ellipse cx="235" cy="62" rx="45" ry="22" transform="rotate(-6 235 62)"/>
  <ellipse cx="145" cy="112" rx="32" ry="16" transform="rotate(-15 145 112)"/>
  <ellipse cx="330" cy="108" rx="32" ry="16" transform="rotate(12 330 108)"/>
</g>

<!-- Foliage Crevice Shadows -->
<g fill="#10401A" opacity="0.45">
  <path d="M115 152 C145 162 178 158 200 145 C172 162 138 168 110 158 Z"/>
  <path d="M285 155 C320 165 358 160 382 145 C355 162 318 168 280 158 Z"/>
</g>

<!-- Clean Storybook Woodland Flowers (Charming Accents) -->
<g>
  <!-- Soft Pink Rose Blossom -->
  <g fill="#F48FB1">
    <circle cx="145" cy="130" r="5"/>
    <circle cx="139" cy="126" r="4.5"/>
    <circle cx="151" cy="126" r="4.5"/>
    <circle cx="141" cy="135" r="4.5"/>
    <circle cx="149" cy="135" r="4.5"/>
    <circle cx="145" cy="130" r="2.8" fill="#FFF59D"/>
  </g>

  <!-- Golden Buttercup Blossom -->
  <g fill="#FFD54F">
    <circle cx="230" cy="98" r="5.2"/>
    <circle cx="224" cy="94" r="4.5"/>
    <circle cx="236" cy="94" r="4.5"/>
    <circle cx="226" cy="104" r="4.5"/>
    <circle cx="234" cy="104" r="4.5"/>
    <circle cx="230" cy="98" r="3" fill="#FFFDE7"/>
  </g>

  <!-- Sky Blue Blossom -->
  <g fill="#90CAF9">
    <circle cx="310" cy="120" r="4.8"/>
    <circle cx="304" cy="116" r="4.2"/>
    <circle cx="316" cy="116" r="4.2"/>
    <circle cx="306" cy="125" r="4.2"/>
    <circle cx="314" cy="125" r="4.2"/>
    <circle cx="310" cy="120" r="2.8" fill="#FFF59D"/>
  </g>
</g>

</svg>