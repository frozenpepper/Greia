<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="hollow-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="hollow-trunk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9C5E35"/>
    <stop offset="35%" stop-color="#7B4522"/>
    <stop offset="70%" stop-color="#5B2F14"/>
    <stop offset="100%" stop-color="#3E1D09"/>
  </linearGradient>
  <linearGradient id="hollow-interior" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#1A0C04"/>
    <stop offset="45%" stop-color="#0E0602"/>
    <stop offset="100%" stop-color="#050201"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#A2EA88"/>
    <stop offset="50%" stop-color="#62C65A"/>
    <stop offset="100%" stop-color="#3A9838"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#5EC256"/>
    <stop offset="55%" stop-color="#369634"/>
    <stop offset="100%" stop-color="#1E6822"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#287A2B"/>
    <stop offset="60%" stop-color="#18521C"/>
    <stop offset="100%" stop-color="#0E3812"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows (Solidly Anchored Base) -->
<ellipse cx="256" cy="456" rx="150" ry="20" fill="#2E2015" opacity="0.20" filter="url(#hollow-shadow)"/>
<ellipse cx="256" cy="454" rx="115" ry="11" fill="#1C120A" opacity="0.35"/>

<!-- Back / Under-Canopy Shadow Mass -->
<path d="M135 220 C100 175 125 115 172 102 C192 65 248 50 292 65 C330 42 395 62 410 110 C448 125 458 182 430 230 C445 270 410 312 360 318 C325 322 288 310 258 318 C220 328 170 315 142 285 C118 260 118 235 135 220 Z" fill="url(#hollow-canopy-dark)"/>

<!-- Ancient Gnarly Trunk Architecture with Outward Root Flares -->
<g>
  <!-- Main Trunk Body -->
  <path d="M150 455 C175 452 200 440 205 385 C208 335 198 280 168 230 C195 245 218 270 228 300 C235 255 250 210 282 165 C295 142 310 125 328 110 C315 138 312 168 315 200 C320 235 332 260 348 282 C368 252 395 230 428 212 C402 242 382 278 368 318 C358 355 358 395 365 435 C370 448 390 452 410 455 L150 455 Z" fill="url(#hollow-trunk)"/>

  <!-- Outward Root Flares -->
  <path d="M150 455 C170 453 190 446 202 428 C208 405 206 370 204 335" fill="none" stroke="#B57648" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <path d="M410 455 C390 453 372 446 364 425 C356 400 356 365 362 330" fill="none" stroke="#2E1405" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <!-- THE INTERACTIVE HOLLOW (Deep Inviting Cavity) -->
  <!-- Outer Hollow Rim Lip -->
  <path d="M218 315 C208 340 206 378 218 405 C228 428 275 432 288 410 C300 382 298 342 286 318 C274 298 230 295 218 315 Z" fill="#2B1406"/>
  <!-- Hollow Interior Deep Cavity -->
  <path d="M222 320 C214 342 212 374 222 400 C230 420 270 424 282 404 C292 378 290 345 280 322 C268 304 232 302 222 320 Z" fill="url(#hollow-interior)"/>
  <!-- Top Rim Wood Highlight -->
  <path d="M230 305 C248 298 268 300 278 310 C266 306 246 306 234 314 Z" fill="#C48858" opacity="0.8"/>
</g>

<!-- Mid-Canopy Form Masses -->
<g fill="url(#hollow-canopy-mid)">
  <!-- Left Billow -->
  <path d="M105 250 C82 212 100 168 140 152 C170 140 205 150 222 170 C236 190 238 220 225 245 C210 272 172 290 142 285 C118 282 108 268 105 250 Z"/>
  <!-- Right Billow -->
  <path d="M315 278 C300 240 318 198 355 180 C388 165 428 175 445 205 C460 235 450 270 422 295 C392 318 342 310 315 278 Z"/>
  <!-- Center Main Dome -->
  <path d="M160 205 C138 152 172 95 228 85 C260 78 298 90 320 112 C350 92 392 98 410 132 C428 168 418 210 390 238 C355 270 302 278 255 270 C208 262 175 238 160 205 Z"/>
</g>

<!-- Fore / Sunlit Upper-Canopy Form Masses -->
<g fill="url(#hollow-canopy-sun)">
  <!-- Top Center Crown -->
  <path d="M205 112 C188 70 225 25 275 22 C312 18 352 38 365 70 C390 65 422 82 428 115 C432 145 408 178 375 188 C340 198 295 190 270 172 C232 182 196 162 194 130 C192 122 198 115 205 112 Z"/>
  <!-- Upper-Left Sunlit Crest -->
  <path d="M140 160 C122 122 152 82 195 78 C222 74 248 88 260 110 C240 142 208 170 172 172 C152 172 142 168 140 160 Z"/>
  <!-- Upper-Right Sunlit Crest -->
  <path d="M318 128 C312 88 345 58 382 62 C415 65 438 90 435 120 C432 148 408 172 382 175 C350 178 325 155 318 128 Z"/>
</g>

<!-- Sunlight Sheen on Crown -->
<g fill="#D8FCD0" opacity="0.65">
  <ellipse cx="270" cy="50" rx="52" ry="24" transform="rotate(-6 270 50)"/>
  <ellipse cx="185" cy="108" rx="40" ry="18" transform="rotate(-12 185 108)"/>
  <ellipse cx="372" cy="92" rx="36" ry="16" transform="rotate(10 372 92)"/>
</g>

<!-- Canopy Overlap Shadows -->
<g fill="#0E3812" opacity="0.45">
  <path d="M150 185 C180 195 215 190 238 178 C210 195 175 200 145 190 Z"/>
  <path d="M275 188 C315 198 358 192 388 178 C352 195 310 200 270 190 Z"/>
</g>

</svg>