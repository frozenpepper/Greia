<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="hollow-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="hollow-trunk-grad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#9C5E35"/>
    <stop offset="40%" stop-color="#7B4522"/>
    <stop offset="80%" stop-color="#5B2F14"/>
    <stop offset="100%" stop-color="#3E1D09"/>
  </linearGradient>
  <linearGradient id="hollow-interior" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#1A0C04"/>
    <stop offset="45%" stop-color="#0E0602"/>
    <stop offset="100%" stop-color="#050201"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9EEA94"/>
    <stop offset="45%" stop-color="#5EC86B"/>
    <stop offset="100%" stop-color="#349A47"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#64D071"/>
    <stop offset="50%" stop-color="#3CA54F"/>
    <stop offset="100%" stop-color="#227434"/>
  </linearGradient>
  <linearGradient id="hollow-canopy-shadow" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#329043"/>
    <stop offset="60%" stop-color="#1E652C"/>
    <stop offset="100%" stop-color="#12441C"/>
  </linearGradient>
  <radialGradient id="hollow-canopy-hl" cx="0.35" cy="0.3" r="0.6">
    <stop offset="0%" stop-color="#D7FCD3" stop-opacity="0.85"/>
    <stop offset="60%" stop-color="#A8F6A2" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#73DC7B" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="256" cy="466" rx="145" ry="24" fill="#2E2015" opacity="0.18" filter="url(#hollow-shadow)"/>
<ellipse cx="256" cy="465" rx="105" ry="14" fill="#1C120A" opacity="0.24"/>

