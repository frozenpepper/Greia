<g>
  <!-- Warm Golden Buttercup Blossoms -->
  <g fill="#FFD54F">
    <circle cx="152" cy="138" r="4.5"/>
    <circle cx="147" cy="135" r="4"/>
    <circle cx="157" cy="135" r="4"/>
    <circle cx="149" cy="143" r="4"/>
    <circle cx="155" cy="143" r="4"/>
