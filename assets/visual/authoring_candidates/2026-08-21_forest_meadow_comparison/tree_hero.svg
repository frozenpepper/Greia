  <path d="M448 145 C456 142 462 148 460 156 C454 154 449 150 448 145 Z"/>
  <path d="M460 230 C468 228 472 236 468 243 C463 241 460 236 460 230 Z"/>
</g>

<!-- Organic Foliage Overlap Shadows (Crevice Depth) -->
<g fill="#165223" opacity="0.55">
  <path d="M150 185 C175 192 205 190 225 180 C200 195 170 200 145 192 Z"/>
  <path d="M270 190 C305 198 345 195 375 182 C345 198 305 202 265 195 Z"/>
  <path d="M205 255 C235 262 270 260 295 250 C265 265 230 268 200 260 Z"/>
</g>

