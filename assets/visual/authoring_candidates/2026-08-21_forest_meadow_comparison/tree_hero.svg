  <path d="M205 115 C190 75 225 35 270 30 C305 25 340 45 352 75 C375 70 405 85 412 115 C420 145 398 175 368 185 C335 195 295 190 270 175 C235 185 200 165 195 135 C192 128 198 120 205 115 Z"/>
  <!-- Upper Left Crest -->
  <path d="M140 160 C125 125 150 90 190 85 C215 82 240 95 252 115 C235 145 205 170 170 172 C150 172 142 168 140 160 Z"/>
  <!-- Upper Right Crest -->
  <path d="M315 130 C310 95 340 68 375 70 C405 72 428 95 428 125 C428 150 405 175 380 178 C350 180 325 160 315 130 Z"/>
</g>

<!-- Tactile Volume Highlights & Sunlight Dapples -->
<g fill="url(#highlight-burst)">
  <ellipse cx="270" cy="55" rx="55" ry="30" transform="rotate(-8 270 55)"/>
  <ellipse cx="185" cy="110" rx="42" ry="24" transform="rotate(-15 185 110)"/>
  <ellipse cx="370" cy="95" rx="40" ry="22" transform="rotate(12 370 95)"/>
  <ellipse cx="145" cy="180" rx="35" ry="20" transform="rotate(-20 145 180)"/>
  <ellipse cx="250" cy="135" rx="50" ry="28" transform="rotate(-5 250 135)"/>
</g>

