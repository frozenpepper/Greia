  <path d="M100 250 C80 215 95 175 130 160 C155 150 185 158 205 175 C220 190 225 215 215 240 C205 265 175 285 145 285 C120 285 105 270 100 250 Z"/>
  <!-- Lower Right Foliage Mass -->
