  <!-- Left Secondary Branch -->
  <path d="M220 285 C190 265 160 258 125 260 C155 250 185 252 212 268 Z" fill="#6A3D1C"/>
  <!-- Right Secondary Branch -->
  <path d="M335 265 C365 245 400 238 435 242 C405 232 370 234 342 250 Z" fill="#583115"/>

