<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="c-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="trunk-grad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#A5673E"/>
    <stop offset="35%" stop-color="#844E28"/>
    <stop offset="70%" stop-color="#643818"/>
    <stop offset="100%" stop-color="#48240D"/>
  </linearGradient>
  <linearGradient id="bark-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C2875A" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#C2875A" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bark-dark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3A1C08" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3A1C08" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="canopy-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9DEE94"/>
    <stop offset="40%" stop-color="#62CE6E"/>
    <stop offset="100%" stop-color="#369E4A"/>
  </linearGradient>
  <linearGradient id="canopy-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#65D272"/>
    <stop offset="50%" stop-color="#3CAB52"/>
    <stop offset="100%" stop-color="#237936"/>
  </linearGradient>
  <linearGradient id="canopy-shadow" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#349646"/>
    <stop offset="60%" stop-color="#206B30"/>
    <stop offset="100%" stop-color="#144C20"/>
  </linearGradient>
  <radialGradient id="highlight-burst" cx="0.35" cy="0.3" r="0.6">
    <stop offset="0%" stop-color="#D7FCD3" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#A6F4A0" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#73DC7B" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="256" cy="466" rx="140" ry="24" fill="#2E2015" opacity="0.18" filter="url(#c-shadow)"/>
<ellipse cx="256" cy="465" rx="95" ry="14" fill="#1C120A" opacity="0.24"/>

<!-- Back / Deep Under-Canopy Layer -->
<g fill="url(#canopy-shadow)">
  <path d="M120 220 C100 170 125 120 170 110 C185 80 230 65 270 75 C310 50 370 65 395 105 C435 115 455 165 440 215 C460 255 435 305 385 315 C355 325 310 315 285 325 C245 335 195 325 160 305 C115 285 100 245 120 220 Z"/>
</g>

