  <!-- Center Main Canopy Bulge -->
  <path d="M165 205 C145 155 175 105 225 95 C255 88 288 98 308 118 C335 100 375 105 395 135 C415 165 410 205 385 230 C355 260 305 270 260 265 C215 260 180 240 165 205 Z"/>
</g>

<!-- Fore / Sunlit Upper-Canopy Form Masses -->
<g fill="url(#canopy-sun)">
