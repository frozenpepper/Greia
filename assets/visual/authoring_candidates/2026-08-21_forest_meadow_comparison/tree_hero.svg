  <path d="M210 456 C215 410 222 360 218 310 C214 260 196 220 165 185 C190 200 215 225 228 255 C235 220 250 180 282 145 C295 125 312 110 330 95 C318 120 312 150 315 180 C320 215 330 240 345 260 C365 235 390 215 425 200 C398 225 380 255 366 288 C355 315 352 350 358 390 C364 425 378 448 392 458 C350 454 310 448 256 448 C240 448 225 452 210 456 Z" fill="url(#trunk-grad)"/>

