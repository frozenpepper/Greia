  <!-- Shadow Stripe Right Edge -->
  <path d="M380 450 C368 420 358 385 354 345 C350 305 358 275 372 245 C364 268 358 298 360 338 C364 380 374 418 385 445 Z" fill="url(#bark-dark)"/>

  <!-- Tactile Bark Grain Ridges -->
  <path d="M242 435 C246 380 245 320 248 265 C250 230 262 200 285 168" fill="none" stroke="#B87B4C" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M272 438 C278 375 272 315 280 255 C285 215 300 180 320 150" fill="none" stroke="#3A1C08" stroke-width="4.5" stroke-linecap="round" opacity="0.38"/>
  <path d="M298 436 C304 395 302 345 308 295" fill="none" stroke="#B87B4C" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M256 360 C258 375 264 385 268 382 C272 378 270 365 266 355 Z" fill="#2E1505" opacity="0.7"/>
</g>

<!-- Mid-Canopy Billowing Mass Groups -->
<g fill="url(#canopy-mid)">
