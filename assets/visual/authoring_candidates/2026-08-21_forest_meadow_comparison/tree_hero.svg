  </g>
  <g fill="#FFD54F">
    <circle cx="375" cy="155" r="4.5"/>
    <circle cx="370" cy="152" r="4"/>
    <circle cx="380" cy="152" r="4"/>
    <circle cx="372" cy="160" r="4"/>
    <circle cx="378" cy="160" r="4"/>
    <circle cx="375" cy="155" r="2.5" fill="#FFF9C4"/>
  </g>
  <g fill="#FFD54F">
    <circle cx="282" cy="102" r="4"/>
    <circle cx="278" cy="99" r="3.5"/>
    <circle cx="286" cy="99" r="3.5"/>
    <circle cx="279" cy="106" r="3.5"/>
    <circle cx="285" cy="106" r="3.5"/>
