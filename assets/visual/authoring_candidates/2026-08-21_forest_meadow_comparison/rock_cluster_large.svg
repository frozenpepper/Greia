<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="rock-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="rock-lit" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#D6DFE2"/>
    <stop offset="45%" stop-color="#A8B8BC"/>
    <stop offset="100%" stop-color="#708286"/>
  </linearGradient>
  <linearGradient id="rock-shadow-side" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#78898D"/>
    <stop offset="60%" stop-color="#4B5A5E"/>
    <stop offset="100%" stop-color="#2C373A"/>
  </linearGradient>
  <linearGradient id="moss-sun" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#9BE68C"/>
    <stop offset="50%" stop-color="#55C058"/>
    <stop offset="100%" stop-color="#2E8838"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows (Solid Flat Base) -->
<ellipse cx="258" cy="228" rx="200" ry="18" fill="#1C2324" opacity="0.20" filter="url(#rock-shadow)"/>
<ellipse cx="258" cy="226" rx="160" ry="10" fill="#0F1415" opacity="0.35"/>

<!-- Left Boulder (Flat Base $y=226$) -->
<g>
  <!-- Shadow Base -->
  <path d="M68 226 C64 175 82 135 120 115 C150 98 185 108 208 135 C222 155 224 190 216 226 L68 226 Z" fill="url(#rock-shadow-side)"/>
  <!-- Lit Upper Facet -->
  <path d="M72 226 C70 178 86 138 120 120 C145 105 178 112 195 135 C175 145 145 160 125 185 C108 205 92 215 72 226 Z" fill="url(#rock-lit)"/>
  <!-- Facet Crease -->
  <path d="M120 120 C142 155 158 185 162 226" fill="none" stroke="#2C373A" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
</g>

<!-- Right Boulder (Flat Base $y=226$) -->
<g>
  <!-- Shadow Base -->
  <path d="M312 226 C308 168 335 130 375 118 C415 105 455 125 468 160 C476 185 470 210 458 226 L312 226 Z" fill="url(#rock-shadow-side)"/>
  <!-- Lit Upper Facet -->
  <path d="M316 226 C315 175 336 138 375 124 C410 112 445 128 455 155 C435 165 405 175 375 195 C350 210 332 218 316 226 Z" fill="url(#rock-lit)"/>
  <!-- Facet Crease -->
  <path d="M375 124 C390 152 402 185 405 226" fill="none" stroke="#2C373A" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
</g>

<!-- Center Large Boulder (Flat Base $y=226$) -->
<g>
  <!-- Main Shadow Body -->
  <path d="M172 226 C165 155 198 85 255 62 C305 42 360 75 376 135 C388 175 378 210 362 226 L172 226 Z" fill="url(#rock-shadow-side)"/>
  <!-- Front Lit Facet Plane -->
  <path d="M176 226 C172 158 202 92 255 68 C298 48 345 75 362 125 C335 138 295 155 260 182 C230 205 205 218 176 226 Z" fill="url(#rock-lit)"/>
  <!-- Top Sunlit Crest -->
  <path d="M210 92 C235 65 275 52 312 62 C275 70 240 90 218 118 Z" fill="#F0F5F6" opacity="0.85"/>
  <!-- Facet Creases -->
  <path d="M255 68 C280 115 298 165 304 226" fill="none" stroke="#253032" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M280 115 C255 138 230 160 205 180" fill="none" stroke="#253032" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
</g>

<!-- Velvet Moss Caps -->
<g fill="url(#moss-sun)">
  <!-- Center Boulder Moss -->
  <path d="M215 90 C235 62 272 50 305 58 C325 64 340 78 335 92 C325 88 310 95 295 90 C275 82 255 95 235 88 C225 85 220 88 215 90 Z"/>
  <circle cx="242" cy="94" r="5"/>
  <circle cx="270" cy="95" r="6"/>
  <circle cx="305" cy="96" r="5.5"/>

  <!-- Left Boulder Moss -->
  <path d="M110 128 C125 110 152 108 172 118 C160 125 145 122 132 130 C122 135 115 132 110 128 Z"/>
  <circle cx="135" cy="132" r="4.5"/>
  <circle cx="155" cy="128" r="4"/>

  <!-- Right Boulder Moss -->
  <path d="M355 128 C375 112 405 115 425 128 C410 132 395 130 382 136 C370 140 362 135 355 128 Z"/>
  <circle cx="388" cy="136" r="4.5"/>
</g>

</svg>