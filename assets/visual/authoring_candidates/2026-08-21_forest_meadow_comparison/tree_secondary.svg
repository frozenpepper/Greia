<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="c-shadow-sec" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="sec-trunk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B27848"/>
    <stop offset="35%" stop-color="#955B32"/>
    <stop offset="70%" stop-color="#76411F"/>
    <stop offset="100%" stop-color="#552B12"/>
  </linearGradient>
  <linearGradient id="sec-canopy-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#B8F492"/>
    <stop offset="50%" stop-color="#76D868"/>
    <stop offset="100%" stop-color="#44AB45"/>
  </linearGradient>
  <linearGradient id="sec-canopy-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#6ED062"/>
    <stop offset="55%" stop-color="#41A843"/>
    <stop offset="100%" stop-color="#24782A"/>
  </linearGradient>
  <linearGradient id="sec-canopy-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#35903A"/>
    <stop offset="60%" stop-color="#1F6625"/>
    <stop offset="100%" stop-color="#124416"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows (Solidly Anchored) -->
<ellipse cx="260" cy="456" rx="115" ry="18" fill="#2E2015" opacity="0.18" filter="url(#c-shadow-sec)"/>
<ellipse cx="260" cy="454" rx="85" ry="10" fill="#1C120A" opacity="0.30"/>

<!-- Back / Under-Canopy Shadow Mass -->
<path d="M175 250 C145 200 168 145 215 132 C238 95 290 85 330 100 C370 85 420 112 422 160 C445 202 430 252 388 272 C348 292 295 285 260 292 C215 305 182 285 175 250 Z" fill="url(#sec-canopy-dark)"/>

<!-- Slender Trunk Architecture with Outward-Flared Ground Base -->
<g>
  <!-- Main Trunk Body -->
  <path d="M195 455 C215 452 232 442 238 395 C242 345 240 295 212 245 C232 260 248 285 254 315 C262 270 275 225 305 185 C292 215 288 252 290 295 C295 350 302 405 312 440 C318 452 335 454 355 455 L195 455 Z" fill="url(#sec-trunk)"/>

  <!-- Outward Root Anchor Flares -->
  <path d="M195 455 C210 453 225 448 234 435 C238 415 238 385 238 350" fill="none" stroke="#C88E5E" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M355 455 C340 453 328 448 320 435 C314 415 312 385 310 350" fill="none" stroke="#3A1C08" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M272 455 C274 435 272 395 275 350" fill="none" stroke="#C88E5E" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Left Slender Branch -->
  <path d="M235 275 C210 252 180 245 145 245 C175 238 205 240 230 255 Z" fill="#76411F"/>
  <!-- Right Slender Branch -->
  <path d="M288 240 C318 218 352 208 388 210 C358 202 325 205 298 222 Z" fill="#552B12"/>
</g>

<!-- Mid-Canopy Billows -->
<g fill="url(#sec-canopy-mid)">
  <!-- Left Billow -->
  <path d="M145 240 C122 202 138 160 175 148 C202 140 232 150 248 172 C262 192 262 222 245 245 C225 268 188 275 162 268 C148 262 145 250 145 240 Z"/>
  <!-- Right Billow -->
  <path d="M315 255 C298 220 315 182 352 168 C382 155 422 165 435 195 C448 225 438 258 410 278 C382 295 340 288 315 255 Z"/>
  <!-- Center Main Billow -->
  <path d="M198 195 C178 150 210 102 258 92 C288 85 322 95 340 118 C368 102 405 110 420 142 C438 175 428 212 402 238 C370 265 322 272 280 265 C238 258 210 232 198 195 Z"/>
</g>

<!-- Fore / Sunlit Canopy Crests -->
<g fill="url(#sec-canopy-sun)">
  <!-- Top Crown Dome -->
  <path d="M230 115 C215 75 252 35 298 32 C332 28 368 50 378 82 C402 78 430 95 432 125 C435 152 415 180 385 188 C352 195 315 188 290 172 C258 182 228 162 225 132 C222 125 225 118 230 115 Z"/>
  <!-- Left Sunlit Bulge -->
  <path d="M170 172 C152 138 180 102 218 98 C245 95 268 108 278 130 C258 158 230 182 198 185 C180 185 172 178 170 172 Z"/>
  <!-- Right Sunlit Bulge -->
  <path d="M312 152 C305 118 335 92 368 95 C398 98 420 118 418 148 C415 170 392 190 368 192 C340 192 318 175 312 152 Z"/>
</g>

<!-- Tactile Volume Sunlight Sheen -->
<g fill="#E3FED4" opacity="0.65">
  <ellipse cx="295" cy="58" rx="48" ry="24" transform="rotate(-6 295 58)"/>
  <ellipse cx="210" cy="122" rx="36" ry="18" transform="rotate(-12 210 122)"/>
  <ellipse cx="370" cy="112" rx="35" ry="16" transform="rotate(10 370 112)"/>
</g>

<!-- Foliage Overlap Shadows -->
<g fill="#124416" opacity="0.45">
  <path d="M190 178 C218 188 250 185 272 172 C245 188 212 192 185 184 Z"/>
  <path d="M292 182 C325 190 362 188 388 175 C360 190 322 194 288 186 Z"/>
</g>

</svg>