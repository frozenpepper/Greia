<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="c-shadow-sec" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="sec-trunk-grad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#BA7F52"/>
    <stop offset="40%" stop-color="#935B35"/>
    <stop offset="80%" stop-color="#6F3F20"/>
    <stop offset="100%" stop-color="#512A12"/>
  </linearGradient>
  <linearGradient id="sec-canopy-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#B2F298"/>
    <stop offset="45%" stop-color="#76DC70"/>
    <stop offset="100%" stop-color="#46AE4D"/>
  </linearGradient>
  <linearGradient id="sec-canopy-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#72D975"/>
    <stop offset="50%" stop-color="#44B251"/>
    <stop offset="100%" stop-color="#288138"/>
  </linearGradient>
  <linearGradient id="sec-canopy-shadow" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#3AA34B"/>
    <stop offset="60%" stop-color="#227231"/>
    <stop offset="100%" stop-color="#144E20"/>
  </linearGradient>
  <radialGradient id="sec-highlight" cx="0.35" cy="0.3" r="0.6">
    <stop offset="0%" stop-color="#E1FEDC" stop-opacity="0.85"/>
    <stop offset="60%" stop-color="#B7F8AC" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#84E57B" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="258" cy="466" rx="110" ry="20" fill="#2E2015" opacity="0.16" filter="url(#c-shadow-sec)"/>
<ellipse cx="258" cy="465" rx="72" ry="12" fill="#1C120A" opacity="0.22"/>

<!-- Back / Under-Canopy Shadow Mass -->
<g fill="url(#sec-canopy-shadow)">
  <path d="M165 240 C145 190 170 140 215 130 C235 95 285 85 320 100 C360 85 410 110 415 155 C440 195 425 245 385 265 C345 285 295 280 260 288 C215 298 175 280 165 240 Z"/>
</g>

<!-- Graceful Slender Trunk & Branch Architecture -->
<g>
  <!-- Main Trunk Path -->
  <path d="M228 456 C236 405 242 355 240 305 C237 258 226 218 206 178 C228 195 245 222 254 252 C262 210 276 172 304 140 C290 170 286 208 288 248 C291 300 298 360 306 410 C310 435 320 450 332 458 C298 454 266 450 228 456 Z" fill="url(#sec-trunk-grad)"/>

