<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512">
<defs>
  <linearGradient id="ray-main" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.65"/>
    <stop offset="25%" stop-color="#FFF9C4" stop-opacity="0.45"/>
    <stop offset="65%" stop-color="#FFE082" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#FFE082" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ray-soft" x1="0.15" y1="0" x2="0.85" y2="1">
    <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.48"/>
    <stop offset="35%" stop-color="#FFF9C4" stop-opacity="0.30"/>
    <stop offset="75%" stop-color="#FFECB3" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#FFECB3" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ray-narrow" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    <stop offset="20%" stop-color="#FFF9C4" stop-opacity="0.50"/>
    <stop offset="60%" stop-color="#FFE082" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#FFE082" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sun-origin" cx="0.1" cy="0" r="0.4">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    <stop offset="50%" stop-color="#FFF9C4" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFE082" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Subtle Top-Left Ambient Canopy Sun Burst -->
<ellipse cx="120" cy="0" rx="350" ry="180" fill="url(#sun-origin)"/>

<!-- Beam 1: Primary Wide Central Shaft -->
<path d="M40 0 L260 0 L680 512 L380 512 Z" fill="url(#ray-main)"/>

<!-- Beam 2: Intense Narrow Accent Shaft (Inside Beam 1) -->
<path d="M120 0 L200 0 L560 512 L440 512 Z" fill="url(#ray-narrow)" opacity="0.65"/>

<!-- Beam 3: Secondary Mid-Right Shaft -->
<path d="M280 0 L440 0 L860 512 L660 512 Z" fill="url(#ray-soft)"/>

<!-- Beam 4: Intense Slender Shaft (Inside Beam 3) -->
<path d="M330 0 L390 0 L770 512 L680 512 Z" fill="url(#ray-narrow)" opacity="0.5"/>

<!-- Beam 5: Left Edge Ambient Glow Shaft -->
<path d="M0 0 L110 0 L420 512 L220 512 Z" fill="url(#ray-soft)" opacity="0.55"/>

<!-- Beam 6: Far Right Soft Warm Shaft -->
<path d="M480 0 L600 0 L1024 480 L920 512 L840 512 Z" fill="url(#ray-soft)" opacity="0.4"/>

<!-- Floating Luminous Golden Forest Dust Motes (Caught in Sunbeams) -->
<g fill="#FFFDE7" opacity="0.75">
  <circle cx="210" cy="110" r="3.5"/>
  <circle cx="175" cy="165" r="2.5"/>
  <circle cx="290" cy="140" r="3.0"/>
  <circle cx="345" cy="95" r="2.8"/>
  <circle cx="380" cy="180" r="3.2"/>
  <circle cx="430" cy="240" r="2.5"/>
  <circle cx="490" cy="190" r="3.0"/>
  <circle cx="530" cy="290" r="3.2"/>
  <circle cx="590" cy="340" r="2.5"/>
  <circle cx="640" cy="310" r="3.0"/>
  <circle cx="720" cy="410" r="2.8"/>
  <circle cx="780" cy="380" r="2.5"/>
</g>
<g fill="#FFFFFF" opacity="0.9">
  <circle cx="210" cy="110" r="1.5"/>
  <circle cx="380" cy="180" r="1.5"/>
  <circle cx="530" cy="290" r="1.5"/>
</g>

</svg>