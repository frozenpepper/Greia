<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nino — Greia owl Bean specimen">
<defs>
<style>
  .ol { stroke:#4B372F; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .ol2 { stroke:#4B372F; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>

<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#B88458"/>
  <stop offset="1" stop-color="#8E603F"/>
</linearGradient>
</defs>

<ellipse cx="128" cy="229" rx="55" ry="9" fill="#6A5147" opacity=".12"/>
<g id="character">
  <!-- ear tufts -->
  <path class="ol" fill="#9A6946" d="M84 79 L76 42 L105 68 Z"/>
  <path class="ol" fill="#9A6946" d="M151 68 L181 42 L172 79 Z"/>
  <!-- bean body -->
  <path class="ol" fill="url(#body)" d="M128 58
    C163 58 184 84 182 119
    C180 148 190 176 171 199
    C159 214 143 220 128 220
    C112 220 94 214 84 199
    C67 174 76 149 74 120
    C72 85 94 58 128 58 Z"/>
  <!-- belly -->
  <path class="ol2" fill="#F2E7D1" d="M128 108 C151 108 166 129 163 163 C160 192 146 207 128 207 C109 207 95 191 93 163 C91 132 105 108 128 108 Z"/>
  <!-- face mask -->
  <path fill="#F8F0DF" d="M83 106
    C91 81 110 72 128 84
    C146 72 166 81 173 106
    C162 125 148 132 128 127
    C108 132 94 125 83 106 Z"/>
  <!-- wings -->
  <path class="ol2" fill="#82583E" d="M82 125 C60 136 59 168 79 184 C87 168 91 147 82 125 Z"/>
  <path class="ol2" fill="#82583E" d="M174 125 C196 136 197 168 177 184 C169 168 165 147 174 125 Z"/>
  <path d="M70 151 Q79 148 85 154 M171 154 Q179 148 187 151" stroke="#A77A59" stroke-width="2.5" fill="none"/>
  <!-- eyes white disks -->
  <circle cx="108" cy="108" r="17" fill="#FFFDF7"/>
  <circle cx="148" cy="108" r="17" fill="#FFFDF7"/>
  <circle cx="108" cy="109" r="9" fill="#342C35"/>
  <circle cx="148" cy="109" r="9" fill="#342C35"/>
  <circle cx="111" cy="106" r="3" fill="#fff"/>
  <circle cx="151" cy="106" r="3" fill="#fff"/>
  <!-- beak -->
  <path class="ol2" fill="#F3A63A" d="M119 125 L137 125 L128 136 Z"/>
  <!-- happy hint -->
  <path d="M112 147 Q128 156 144 147" stroke="#72513F" stroke-width="2.7" stroke-linecap="round" fill="none"/>
  <!-- feet -->
  <path class="ol2" fill="#E8A340" d="M103 211 Q112 202 121 211 Q112 218 103 211Z"/>
  <path class="ol2" fill="#E8A340" d="M135 211 Q144 202 153 211 Q144 218 135 211Z"/>
  <!-- bookish identity cue: tiny teal feather badge -->
  <path d="M153 166 C164 157 172 162 168 171 C165 178 157 181 150 178 C154 174 155 171 153 166 Z" fill="#44B8AE"/>
</g>

</svg>
