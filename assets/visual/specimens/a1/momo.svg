<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Momo — Greia friendly monster Puff specimen">
<defs>
<style>
  .ol { stroke:#4B372F; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .ol2 { stroke:#4B372F; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>

<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#A37AE7"/>
  <stop offset="1" stop-color="#7A54C8"/>
</linearGradient>
</defs>

<ellipse cx="128" cy="229" rx="57" ry="9" fill="#6A5147" opacity=".12"/>
<g id="character">
  <!-- antennae -->
  <path d="M105 77 C95 57 96 45 105 37" stroke="#6D4BB6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle class="ol2" cx="105" cy="35" r="8" fill="#FFC234"/>
  <path d="M151 76 C164 59 165 47 159 39" stroke="#6D4BB6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle class="ol2" cx="158" cy="37" r="7" fill="#F46F61"/>
  <!-- main fluff -->
  <path class="ol" fill="url(#body)" d="M128 68
    C144 64 155 72 163 83
    C180 80 190 91 187 107
    C203 116 202 132 190 142
    C198 159 191 174 177 179
    C176 194 164 205 149 203
    C142 215 126 220 114 212
    C98 218 84 211 79 198
    C63 197 55 185 59 171
    C45 160 46 145 58 136
    C49 120 55 105 69 99
    C68 84 82 75 96 80
    C105 68 117 65 128 68 Z"/>
  <!-- belly glow -->
  <ellipse cx="128" cy="145" rx="48" ry="44" fill="#B999F0" opacity=".36"/>
  <!-- stub arms -->
  <ellipse class="ol2" cx="65" cy="150" rx="12" ry="21" fill="#8B63D4" transform="rotate(-18 65 150)"/>
  <ellipse class="ol2" cx="191" cy="148" rx="12" ry="21" fill="#8B63D4" transform="rotate(18 191 148)"/>
  <!-- feet -->
  <ellipse class="ol2" cx="103" cy="209" rx="14" ry="8.5" fill="#44B8AE"/>
  <ellipse class="ol2" cx="153" cy="209" rx="14" ry="8.5" fill="#44B8AE"/>
  <!-- eyes, intentionally slightly asymmetric -->
  <ellipse cx="107" cy="132" rx="10" ry="13" fill="#352B3A"/>
  <ellipse cx="149" cy="130" rx="9" ry="12" fill="#352B3A"/>
  <ellipse cx="110" cy="128" rx="3" ry="4" fill="#fff"/>
  <ellipse cx="152" cy="126" rx="2.8" ry="3.8" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="88" cy="154" rx="10" ry="6" fill="#F59AAA" opacity=".52"/>
  <ellipse cx="169" cy="153" rx="10" ry="6" fill="#F59AAA" opacity=".52"/>
  <!-- mouth with tiny tooth -->
  <path d="M110 160 Q128 179 146 160 Q144 182 128 185 Q112 181 110 160 Z" fill="#66445E"/>
  <path d="M126 163 L134 163 L130 171 Z" fill="#FFF8EE"/>
  <!-- three simple spots -->
  <circle cx="91" cy="105" r="5.5" fill="#C3ABF5" opacity=".65"/>
  <circle cx="163" cy="102" r="4.5" fill="#C3ABF5" opacity=".65"/>
  <circle cx="170" cy="176" r="4" fill="#C3ABF5" opacity=".65"/>
</g>

</svg>
