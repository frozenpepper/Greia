<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Lilli — Greia unicorn Puff specimen">
<defs>
<style>
  .ol { stroke:#4B372F; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .ol2 { stroke:#4B372F; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>

<linearGradient id="body" x1="0" y1="0" x2="0.8" y2="1">
  <stop offset="0" stop-color="#FFF9EC"/>
  <stop offset="1" stop-color="#F4DFCC"/>
</linearGradient>
<linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFE66B"/>
  <stop offset="1" stop-color="#F5AE2B"/>
</linearGradient>
</defs>

<g id="shadow"><ellipse cx="128" cy="226" rx="61" ry="10" fill="#6A5147" opacity=".12"/></g>
<g id="character">
  <!-- ears behind tuft -->
  <path class="ol" fill="#FFF3E9" d="M81 78 C67 54 71 38 88 53 C99 62 102 74 99 85 Z"/>
  <path fill="#F59AAA" d="M84 72 C78 59 80 52 87 58 C92 63 94 70 94 77 Z"/>
  <path class="ol" fill="#FFF3E9" d="M164 79 C174 52 190 43 190 62 C189 73 182 82 171 89 Z"/>
  <path fill="#F59AAA" d="M169 74 C175 61 183 57 182 66 C181 72 177 77 173 80 Z"/>
  <!-- horn -->
  <path class="ol" fill="url(#horn)" d="M128 73 L141 26 L151 77 Z"/>
  <path d="M133 55 L145 50 M136 44 L147 40" stroke="#FFF2AE" stroke-width="2.2" stroke-linecap="round"/>
  <!-- main puff -->
  <path class="ol" fill="url(#body)" d="M128 72
    C169 69 196 95 198 133
    C199 161 184 188 157 201
    C142 209 119 210 101 205
    C71 198 55 174 57 142
    C59 112 72 91 96 80
    C105 75 116 72 128 72 Z"/>
  <!-- lower fluff scallops -->
  <path fill="#F7E6D4" opacity=".65" d="M76 181 C89 193 99 197 111 198 C109 207 98 210 88 204 C82 200 78 191 76 181 Z"/>
  <path fill="#F7E6D4" opacity=".55" d="M174 182 C163 196 152 200 140 201 C143 209 155 211 164 203 C169 198 173 190 174 182 Z"/>
  <!-- tiny hooves -->
  <ellipse class="ol2" cx="101" cy="207" rx="14" ry="9" fill="#E980A1"/>
  <ellipse class="ol2" cx="153" cy="207" rx="14" ry="9" fill="#E980A1"/>
  <path d="M92 204 C98 201 104 201 111 204" stroke="#F6B6C9" stroke-width="2.5" fill="none"/>
  <path d="M144 204 C150 201 156 201 163 204" stroke="#F6B6C9" stroke-width="2.5" fill="none"/>
  <!-- rainbow tuft: 3 simple ribbons -->
  <path class="ol2" fill="#F45E9B" d="M92 91 C103 66 127 64 146 76 C132 77 119 87 111 100 C104 93 99 90 92 91 Z"/>
  <path class="ol2" fill="#8F69D5" d="M111 99 C123 75 150 71 163 88 C148 84 136 93 128 109 C122 104 117 101 111 99 Z"/>
  <path class="ol2" fill="#45B9C8" d="M129 108 C143 87 168 90 174 108 C160 101 149 110 143 124 C139 117 135 112 129 108 Z"/>
  <!-- face panel / muzzle -->
  <ellipse cx="127" cy="146" rx="46" ry="39" fill="#FFFDF8" opacity=".74"/>
  <!-- eyes -->
  <ellipse cx="108" cy="137" rx="9.5" ry="13" fill="#3E3048"/>
  <ellipse cx="148" cy="137" rx="9.5" ry="13" fill="#3E3048"/>
  <ellipse cx="111" cy="133" rx="3" ry="4" fill="#FFFFFF"/>
  <ellipse cx="151" cy="133" rx="3" ry="4" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="90" cy="158" rx="10" ry="6" fill="#F6A1B4" opacity=".55"/>
  <ellipse cx="166" cy="158" rx="10" ry="6" fill="#F6A1B4" opacity=".55"/>
  <!-- nose/mouth -->
  <path d="M123 153 Q128 157 133 153 Q130 163 128 164 Q126 163 123 153Z" fill="#B66C79"/>
  <path d="M113 166 Q128 177 143 166" class="ol2" stroke="#7B4E58" fill="none"/>
  <!-- tiny flank star identity mark -->
  <path d="M175 155 l3.2 6.6 7.3 1.1-5.3 5.2 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.2 7.3-1.1z" fill="#FFC234" opacity=".9"/>
</g>

</svg>
