static_required = false

[[expressions]]
id = "thinking"
energy = "focused"
eye_cues = ["look_up_or_side", "mild_asymmetry_optional"]
mouth_cues = ["small_side_curve_or_neutral"]
body_cues = ["tiny_tilt_optional"]
static_required = false

[[expressions]]
id = "proud"
energy = "calm_positive"
eye_cues = ["relaxed_bright_or_closed_happy"]
mouth_cues = ["small_upward_smile_or_smirk"]
body_cues = ["small_lift"]
static_required = false

[[expressions]]
id = "silly"
energy = "playful"
eye_cues = ["readable_asymmetry", "pupil_offset_optional"]
mouth_cues = ["playful_open_mouth_or_tongue_optional"]
body_cues = ["tiny_tilt_optional"]
prohibited_cues = ["distorted_identity", "scary_face"]
static_required = false

[[transient_states]]
id = "blink"
duration_min_ms = 150
duration_max_ms = 300
eye_cues = ["closed"]
mouth_cues = ["preserve_current_emotion_or_neutral"]
semantic_meaning_required = false
