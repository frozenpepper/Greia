notes = "Semantic visual-authoring templates. These are not runtime face geometry or an asset API."

[[expressions]]
id = "neutral"
energy = "calm"
eye_cues = ["open_relaxed", "large_readable"]
mouth_cues = ["small_friendly_curve"]
body_cues = ["balanced"]
static_required = true

[[expressions]]
id = "happy"
energy = "positive"
eye_cues = ["closed_happy_or_bright_open"]
mouth_cues = ["clear_wider_smile"]
body_cues = ["slight_upward_energy_optional"]
static_required = true

[[expressions]]
id = "excited"
energy = "high_positive"
eye_cues = ["bright_open", "large_highlights_optional"]
mouth_cues = ["open_happy_or_large_smile"]
body_cues = ["upward_energy"]
static_required = false

[[expressions]]
id = "surprised"
energy = "reaction"
eye_cues = ["wider_rounder"]
mouth_cues = ["small_o"]
body_cues = ["recoil_optional"]
static_required = true

[[expressions]]
id = "sleepy"
energy = "low"
eye_cues = ["closed_or_half_lid"]
mouth_cues = ["small_relaxed"]
body_cues = ["soft_compression", "gentle_tilt_optional"]
static_required = true

[[expressions]]
id = "sad_gentle"
energy = "low_gentle"
eye_cues = ["softened", "slightly_smaller_or_lower"]
mouth_cues = ["shallow_down_curve"]
body_cues = ["small_low_energy_tilt_optional"]
