<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="blow-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="blow-deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#184C1C"/>
    <stop offset="100%" stop-color="#08220A"/>
  </linearGradient>
  <linearGradient id="blow-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#4EAC42"/>
    <stop offset="55%" stop-color="#32882A"/>
    <stop offset="100%" stop-color="#16561A"/>
  </linearGradient>
  <linearGradient id="blow-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#98D46E"/>
    <stop offset="50%" stop-color="#5EBA44"/>
    <stop offset="100%" stop-color="#32862A"/>
  </linearGradient>
  <linearGradient id="bilberry-col" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#6B7280"/>
    <stop offset="50%" stop-color="#3B4262"/>
    <stop offset="100%" stop-color="#1F2438"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="170" ry="16" fill="#241B12" opacity="0.18" filter="url(#blow-sh)"/>
<ellipse cx="256" cy="226" rx="130" ry="9" fill="#140D07" opacity="0.32"/>

