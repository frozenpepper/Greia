<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="br-sh-v3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="br-cane-v3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A57E54"/>
    <stop offset="100%" stop-color="#552F12"/>
  </linearGradient>
  <linearGradient id="br-fol-mid-v3" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#54B248"/>
    <stop offset="55%" stop-color="#328E2C"/>
    <stop offset="100%" stop-color="#165E1A"/>
  </linearGradient>
  <linearGradient id="br-fol-sun-v3" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#A8E272"/>
    <stop offset="50%" stop-color="#68C852"/>
    <stop offset="100%" stop-color="#389830"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="180" ry="18" fill="#241B12" opacity="0.18" filter="url(#br-sh-v3)"/>
<ellipse cx="256" cy="226" rx="140" ry="10" fill="#140D07" opacity="0.32"/>

<!-- 1. BOLD ARCHING WOODY CANES (Visible upright skeletal structure) -->
<g stroke="url(#br-cane-v3)" stroke-linecap="round" fill="none">
  <path d="M 215,226 C 200,175 155,130 90,95" stroke-width="6"/>
  <path d="M 232,226 C 222,170 190,115 130,68" stroke-width="6.5"/>
  <path d="M 252,226 C 250,165 248,105 252,38" stroke-width="7"/>
  <path d="M 272,226 C 282,170 315,115 375,68" stroke-width="6.5"/>
  <path d="M 288,226 C 305,175 350,130 415,95" stroke-width="6"/>
</g>

<!-- 2. GROUPED BOTANICAL LEAF SPRAYS (Substantial masses readable at 64px) -->

<!-- Outer Left Spray Cluster -->
<g>
  <path d="M 90,95 C 65,85 55,58 78,42 C 105,62 118,80 102,98 C 88,115 65,130 82,140 C 102,122 108,105 90,95 Z" fill="url(#br-fol-mid-v3)"/>
  <path d="M 88,80 C 72,70 68,52 82,44 C 100,58 108,70 98,82 L 88,80 Z" fill="url(#br-fol-sun-v3)"/>
</g>

<!-- Mid-Left Cane Spray Cluster -->
<g>
  <path d="M 130,68 C 105,58 98,32 122,18 C 145,35 155,50 142,68 C 160,52 182,48 190,65 C 172,78 155,82 142,75 C 160,95 178,115 168,135 C 150,118 142,95 130,68 Z" fill="url(#br-fol-mid-v3)"/>
  <path d="M 128,52 C 112,42 108,28 122,22 C 138,32 145,45 135,55 L 128,52 Z" fill="url(#br-fol-sun-v3)"/>
</g>

<!-- Center Upright Spray Cluster -->
<g>
  <path d="M 252,38 C 228,22 232,2 255,0 C 278,2 282,22 258,38 C 282,32 298,48 285,65 C 265,58 258,48 252,38 C 222,48 215,68 235,78 C 248,70 252,55 252,38 Z" fill="url(#br-fol-mid-v3)"/>
  <path d="M 252,25 C 238,12 242,2 255,2 C 268,2 272,12 258,25 Z" fill="url(#br-fol-sun-v3)"/>
  <!-- Center Mid Mass -->
  <path d="M 248,110 C 220,98 218,75 242,65 C 262,80 268,98 255,115 C 275,102 288,118 275,135 C 255,128 248,118 248,110 Z" fill="url(#br-fol-mid-v3)"/>
</g>

<!-- Mid-Right Cane Spray Cluster -->
<g>
  <path d="M 375,68 C 400,58 408,32 382,18 C 360,35 350,50 362,68 C 345,52 322,48 315,65 C 332,78 350,82 362,75 C 345,95 328,115 338,135 C 355,118 362,95 375,68 Z" fill="url(#br-fol-mid-v3)"/>
  <path d="M 378,52 C 392,42 398,28 382,22 C 368,32 360,45 370,55 L 378,52 Z" fill="url(#br-fol-sun-v3)"/>
</g>

<!-- Outer Right Spray Cluster -->
<g>
  <path d="M 415,95 C 440,85 450,58 428,42 C 400,62 388,80 402,98 C 418,115 440,130 422,140 C 402,122 398,105 415,95 Z" fill="url(#br-fol-mid-v3)"/>
  <path d="M 418,80 C 432,70 438,52 422,44 C 405,58 398,70 408,82 L 418,80 Z" fill="url(#br-fol-sun-v3)"/>
</g>

<!-- Meadow Buttercup Blossoms (Large & clear at 64px) -->
<g fill="#FFD54F">
  <circle cx="90" cy="95" r="5.5"/>
  <circle cx="90" cy="95" r="2.8" fill="#FFFDE7"/>
  <circle cx="415" cy="95" r="5.5"/>
  <circle cx="415" cy="95" r="2.8" fill="#FFFDE7"/>
  <circle cx="252" cy="38" r="6"/>
  <circle cx="252" cy="38" r="3" fill="#FFFDE7"/>
  <circle cx="150" cy="120" r="5"/>
  <circle cx="150" cy="120" r="2.5" fill="#FFFDE7"/>
  <circle cx="355" cy="120" r="5"/>
  <circle cx="355" cy="120" r="2.5" fill="#FFFDE7"/>
</g>
</svg>