<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="rs-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="rock-shade-sm" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#627478"/>
    <stop offset="60%" stop-color="#3C4B4F"/>
    <stop offset="100%" stop-color="#1E2A2C"/>
  </linearGradient>
  <linearGradient id="rock-lit-sm" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#D5DFE2"/>
    <stop offset="50%" stop-color="#A5B5BA"/>
    <stop offset="100%" stop-color="#708286"/>
  </linearGradient>
  <linearGradient id="moss-sm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9AE288"/>
    <stop offset="100%" stop-color="#2C8435"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="150" ry="15" fill="#1C2324" opacity="0.20" filter="url(#rs-sh)"/>
<ellipse cx="256" cy="226" rx="110" ry="8" fill="#0F1415" opacity="0.35"/>

<!-- Left Medium Stone -->
<path d="M 140,226 L 132,185 L 160,145 L 210,140 L 245,175 L 250,226 Z" fill="url(#rock-shade-sm)"/>
<path d="M 140,185 L 160,145 L 210,140 L 220,170 L 175,175 Z" fill="url(#rock-lit-sm)"/>

<!-- Center Main Boulder -->
<path d="M 215,226 L 205,165 L 245,110 L 320,105 L 375,155 L 385,226 Z" fill="url(#rock-shade-sm)"/>
<path d="M 215,165 L 245,110 L 320,105 L 335,145 L 265,150 Z" fill="url(#rock-lit-sm)"/>

<!-- Right Small Pebble -->
<path d="M 360,226 L 355,195 L 378,170 L 415,175 L 425,226 Z" fill="url(#rock-shade-sm)"/>
<path d="M 360,195 L 378,170 L 415,175 L 410,195 Z" fill="url(#rock-lit-sm)"/>

<!-- Velvet Moss Accents -->
<path d="M 245,115 C 265,108 295,110 310,118 C 295,125 270,125 255,130 Z" fill="url(#moss-sm)"/>
<path d="M 160,148 C 175,142 195,145 205,152 C 195,158 178,158 168,162 Z" fill="url(#moss-sm)"/>
</svg>