<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greia forest meadow parallax proof</title><style>*{box-sizing:border-box}html,body{margin:0;background:#252f36;color:#fff;font-family:system-ui,sans-serif}.wrap{width:min(1024px,100vw);margin:0 auto;padding:12px}.scene{position:relative;width:100%;aspect-ratio:1024/600;overflow:hidden;border-radius:18px;background:linear-gradient(#caeaf7 0%,#e7f2d8 64%,#72cf83 64%);box-shadow:0 18px 44px #0005}.layer{position:absolute;pointer-events:none;will-change:transform,opacity}.hills{left:-2%;bottom:18%;width:104%}.treeline{left:-2%;bottom:27%;width:104%}.cloudA{left:7%;top:7%;width:22%;animation:cloudA 48s ease-in-out infinite alternate}.cloudB{right:13%;top:15%;width:15%;animation:cloudB 62s ease-in-out infinite alternate}.hero{left:8%;bottom:15%;width:30%;transform-origin:50% 90%;animation:treeSway 5.6s ease-in-out infinite alternate}.secondary{right:11%;bottom:24%;width:19%;transform-origin:50% 92%;animation:treeSway2 6.4s ease-in-out infinite alternate}.bushA{left:24%;bottom:13%;width:22%;transform-origin:50% 90%;animation:smallSway 4.9s ease-in-out infinite alternate}.bushB{right:5%;bottom:12%;width:25%;transform-origin:50% 90%;animation:smallSway 5.3s ease-in-out infinite alternate}.rocks{left:48%;bottom:12%;width:18%}.log{left:34%;bottom:7%;width:25%}.mushrooms{right:15%;bottom:7%;width:13%}.fern{left:1%;bottom:-1%;width:24%;transform-origin:50% 100%;animation:nearSway 4.7s ease-in-out infinite alternate}.lowBush{right:-6%;bottom:-2%;width:28%;transform-origin:50% 100%;animation:nearSway2 5.1s ease-in-out infinite alternate}.grassBack{left:-2%;bottom:-2%;width:104%}.grassFront{left:-3%;bottom:-10%;width:106%;transform:scaleY(1.25)}.light{inset:0;width:100%;height:100%;animation:lightBreath 8s ease-in-out infinite alternate}.fog{left:-3%;bottom:17%;width:106%;animation:fogDrift 34s ease-in-out infinite alternate}.fireflies{inset:0;width:100%;height:100%;animation:firefly 5.8s ease-in-out infinite alternate}.controls{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:#d7e2e7}button{border:0;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.scene.paused *{animation-play-state:paused!important}@keyframes cloudA{from{transform:translateX(-6px)}to{transform:translateX(12px)}}@keyframes cloudB{from{transform:translateX(4px)}to{transform:translateX(-8px)}}@keyframes treeSway{from{transform:rotate(-.45deg)}to{transform:rotate(.55deg)}}@keyframes treeSway2{from{transform:rotate(.35deg)}to{transform:rotate(-.45deg)}}@keyframes smallSway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}@keyframes nearSway{from{transform:rotate(-1deg) translateX(-1px)}to{transform:rotate(1.1deg) translateX(1px)}}@keyframes nearSway2{from{transform:rotate(.8deg)}to{transform:rotate(-.9deg)}}@keyframes lightBreath{from{opacity:.42}to{opacity:.58}}@keyframes fogDrift{from{transform:translateX(-4px);opacity:.65}to{transform:translateX(8px);opacity:.8}}@keyframes firefly{from{opacity:.45;transform:translate(0,2px)}to{opacity:.9;transform:translate(2px,-2px)}}@media(prefers-reduced-motion:reduce){.layer{animation:none!important}}</style></head><body><div class="wrap"><div class="scene" id="scene"><img class="layer hills" src="distant_hills.svg"><img class="layer treeline" src="distant_treeline.svg"><img class="layer cloudA" src="cloud_large.svg"><img class="layer cloudB" src="cloud_small.svg"><img class="layer grassBack" src="grass_edge.svg"><img class="layer hero" src="tree_hero.svg"><img class="layer secondary" src="tree_secondary.svg"><img class="layer bushA" src="bush_round.svg"><img class="layer rocks" src="rock_cluster_large.svg"><img class="layer log" src="fallen_log.svg"><img class="layer mushrooms" src="mushroom_cluster.svg"><img class="layer bushB" src="bush_flowering.svg"><img class="layer fern" src="fern_cluster.svg"><img class="layer lowBush" src="bush_low.svg"><img class="layer fog" src="fog_strip.svg"><img class="layer light" src="sunlight_rays.svg"><img class="layer fireflies" src="fx_fireflies.svg"><img class="layer grassFront" src="grass_edge.svg"></div><div class="controls"><button id="toggle">Pause motion</button><span>Committed reusable SVG layers · 1024×600 design proof · no runtime authority</span></div></div><script>const s=document.getElementById('scene'),b=document.getElementById('toggle');b.onclick=()=>{s.classList.toggle('paused');b.textContent=s.classList.contains('paused')?'Resume motion':'Pause motion'};</script></body></html>
