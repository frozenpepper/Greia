[[layers]]
id = "playfield_props"
assets = ["beanbag.svg", "reading_chair.svg", "open_storybook.svg", "book_stack.svg", "toy_basket.svg", "floor_cushion.svg"]
z = 40

[[layers]]
id = "decor"
assets = ["bunting.svg", "potted_plant.svg", "hanging_mobile.svg"]
