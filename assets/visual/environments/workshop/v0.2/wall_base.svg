<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600">
<defs>
  <linearGradient id="wall-plaster" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F8F4EC"/>
    <stop offset="60%" stop-color="#EDE4D4"/>
    <stop offset="100%" stop-color="#DFD2BE"/>
  </linearGradient>
  <linearGradient id="wainscot-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D8BA94"/>
    <stop offset="100%" stop-color="#B28E66"/>
  </linearGradient>
</defs>

<!-- Upper Plaster Wall -->
<rect x="0" y="0" width="1024" height="420" fill="url(#wall-plaster)"/>

<!-- Wainscot Chair Rail Molding -->
<rect x="0" y="415" width="1024" height="16" rx="2" fill="#E8CCA0" stroke="#7A5228" stroke-width="1.5"/>
<line x1="0" y1="417" x2="1024" y2="417" stroke="#FFF2DC" stroke-width="2" opacity="0.9"/>

<!-- Lower Wainscot Paneling Area -->
<rect x="0" y="430" width="1024" height="140" fill="url(#wainscot-wood)"/>
<!-- Vertical Wainscot Slat Grooves -->
<g stroke="#8A643E" stroke-width="1.5" opacity="0.5">
  <line x1="128" y1="430" x2="128" y2="570"/>
  <line x1="256" y1="430" x2="256" y2="570"/>
  <line x1="384" y1="430" x2="384" y2="570"/>
  <line x1="512" y1="430" x2="512" y2="570"/>
  <line x1="640" y1="430" x2="640" y2="570"/>
  <line x1="768" y1="430" x2="768" y2="570"/>
  <line x1="896" y1="430" x2="896" y2="570"/>
</g>

<!-- Baseboard Floor Molding -->
<rect x="0" y="565" width="1024" height="35" fill="#8E6238" stroke="#583818" stroke-width="2"/>
<line x1="0" y1="567" x2="1024" y2="567" stroke="#D8A874" stroke-width="2" opacity="0.8"/>
</svg>