<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <filter id="pal-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="pal-wood" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#EEDAB8"/>
    <stop offset="50%" stop-color="#D8BA8E"/>
    <stop offset="100%" stop-color="#A88254"/>
  </linearGradient>
</defs>

<!-- Cast Shadow -->
<ellipse cx="200" cy="165" rx="160" ry="105" fill="#241B12" opacity="0.20" filter="url(#pal-sh)"/>

<!-- Classic Kidney Palette with Thumbhole -->
<path d="M 80,180 C 40,110 90,40 200,35 C 310,30 365,95 355,175 C 345,245 285,265 220,245 C 195,238 180,248 165,260 C 130,285 95,225 80,180 Z" fill="url(#pal-wood)" stroke="#7A562C" stroke-width="3"/>

<!-- Thumbhole -->
<ellipse cx="280" cy="205" rx="22" ry="28" fill="#F8F9FA" stroke="#68441E" stroke-width="2.5" transform="rotate(-15 280 205)"/>

<!-- Glossy 3D Paint Dollops -->
<!-- Red -->
<ellipse cx="115" cy="115" rx="18" ry="16" fill="#E53935"/>
<ellipse cx="110" cy="110" rx="6" ry="4" fill="#FF8A80"/>
<!-- Yellow -->
<ellipse cx="165" cy="70" rx="18" ry="16" fill="#FDD835"/>
<ellipse cx="160" cy="66" rx="6" ry="4" fill="#FFF59D"/>
<!-- Blue -->
<ellipse cx="230" cy="65" rx="18" ry="16" fill="#1E88E5"/>
<ellipse cx="225" cy="61" rx="6" ry="4" fill="#90CAF9"/>
<!-- Green -->
<ellipse cx="295" cy="90" rx="18" ry="16" fill="#43A047"/>
<ellipse cx="290" cy="86" rx="6" ry="4" fill="#A5D6A7"/>
<!-- Purple -->
<ellipse cx="330" cy="150" rx="18" ry="16" fill="#8E24AA"/>
<ellipse cx="325" cy="146" rx="6" ry="4" fill="#CE93D8"/>
<!-- White -->
<ellipse cx="115" cy="185" rx="16" ry="14" fill="#ECEFF1"/>
<ellipse cx="112" cy="182" rx="5" ry="3" fill="#FFFFFF"/>
</svg>