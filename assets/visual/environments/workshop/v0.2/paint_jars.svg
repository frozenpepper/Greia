<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
<defs>
  <filter id="pj-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="glass-refl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.2"/>
    <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.4"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="225" cy="270" rx="180" ry="16" fill="#241B12" opacity="0.20" filter="url(#pj-sh)"/>
<ellipse cx="225" cy="268" rx="140" ry="9" fill="#140D07" opacity="0.35"/>

<!-- Jar 1 (Ruby Red - Left) -->
<g transform="translate(60, 80)">
  <!-- Jar Body -->
  <rect x="15" y="40" width="80" height="135" rx="14" fill="#C8DDE8" fill-opacity="0.4" stroke="#486878" stroke-width="2.5"/>
  <!-- Paint Fill -->
  <rect x="20" y="70" width="70" height="100" rx="8" fill="#E53935"/>
  <ellipse cx="55" cy="70" rx="35" ry="8" fill="#FF8A80"/>
  <!-- Glass Reflection -->
  <rect x="15" y="40" width="80" height="135" rx="14" fill="url(#glass-refl)"/>
  <!-- Jar Lid -->
  <rect x="10" y="22" width="90" height="22" rx="5" fill="#D4A26A" stroke="#5A3A16" stroke-width="2"/>
</g>

<!-- Jar 2 (Ultramarine Blue - Center) -->
<g transform="translate(170, 65)">
  <rect x="15" y="40" width="80" height="150" rx="14" fill="#C8DDE8" fill-opacity="0.4" stroke="#486878" stroke-width="2.5"/>
  <rect x="20" y="85" width="70" height="100" rx="8" fill="#1E88E5"/>
  <ellipse cx="55" cy="85" rx="35" ry="8" fill="#90CAF9"/>
  <rect x="15" y="40" width="80" height="150" rx="14" fill="url(#glass-refl)"/>
  <rect x="10" y="22" width="90" height="22" rx="5" fill="#D4A26A" stroke="#5A3A16" stroke-width="2"/>
</g>

<!-- Jar 3 (Sunny Yellow - Right) -->
<g transform="translate(280, 95)">
  <rect x="15" y="40" width="80" height="120" rx="14" fill="#C8DDE8" fill-opacity="0.4" stroke="#486878" stroke-width="2.5"/>
  <rect x="20" y="60" width="70" height="95" rx="8" fill="#FDD835"/>
  <ellipse cx="55" cy="60" rx="35" ry="8" fill="#FFF59D"/>
  <rect x="15" y="40" width="80" height="120" rx="14" fill="url(#glass-refl)"/>
  <rect x="10" y="22" width="90" height="22" rx="5" fill="#D4A26A" stroke="#5A3A16" stroke-width="2"/>
</g>
</svg>