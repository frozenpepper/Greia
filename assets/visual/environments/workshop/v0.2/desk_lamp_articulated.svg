<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <filter id="dl-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="mint-enamel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A8D8C8"/>
    <stop offset="50%" stop-color="#64B49E"/>
    <stop offset="100%" stop-color="#347864"/>
  </linearGradient>
  <linearGradient id="brass-joint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFE082"/>
    <stop offset="60%" stop-color="#CA9B32"/>
    <stop offset="100%" stop-color="#785012"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="200" cy="460" rx="70" ry="15" fill="#241B12" opacity="0.22" filter="url(#dl-sh)"/>
<ellipse cx="200" cy="458" rx="50" ry="8" fill="#140D07" opacity="0.38"/>

<!-- Heavy Base -->
<rect x="150" y="435" width="100" height="25" rx="6" fill="url(#mint-enamel)" stroke="#285C4C" stroke-width="2.5"/>
<ellipse cx="200" cy="435" rx="50" ry="10" fill="#A8D8C8"/>

<!-- Lower Articulated Arms (Parallel Bars) -->
<g stroke="#37474F" stroke-width="4" stroke-linecap="round">
  <line x1="195" y1="435" x2="145" y2="275"/>
  <line x1="205" y1="435" x2="155" y2="275"/>
</g>
<!-- Tension Spring -->
<line x1="198" y1="410" x2="152" y2="300" stroke="#78909C" stroke-width="2" stroke-dasharray="4 3"/>

<!-- Lower Pivot Joint -->
<circle cx="200" cy="435" r="9" fill="url(#brass-joint)"/>
<!-- Mid Pivot Joint -->
<circle cx="150" cy="275" r="10" fill="url(#brass-joint)"/>

<!-- Upper Articulated Arms -->
<g stroke="#37474F" stroke-width="4" stroke-linecap="round">
  <line x1="145" y1="275" x2="235" y2="155"/>
  <line x1="155" y1="275" x2="245" y2="155"/>
</g>
<!-- Upper Pivot Joint -->
<circle cx="240" cy="155" r="9" fill="url(#brass-joint)"/>

<!-- Lamp Head & Enamel Dome Shade -->
<g transform="translate(240, 155) rotate(35)">
  <!-- Shade Dome -->
  <path d="M -35,25 C -35,-15 35,-15 35,25 Z" fill="url(#mint-enamel)" stroke="#285C4C" stroke-width="2.5"/>
  <!-- Inner White Reflector Lip -->
  <ellipse cx="0" cy="25" rx="35" ry="12" fill="#FFFDE7" stroke="#285C4C" stroke-width="2"/>
  <!-- Warm Bulb Glow -->
  <circle cx="0" cy="22" r="12" fill="#FFE082"/>
</g>
</svg>