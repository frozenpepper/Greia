<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
<defs>
  <filter id="rug-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<!-- Ground Shadow -->
<ellipse cx="300" cy="155" rx="260" ry="110" fill="#1C140E" opacity="0.22" filter="url(#rug-sh)"/>

<!-- Outer Braided Ring (Sage Green) -->
<ellipse cx="300" cy="150" rx="250" ry="100" fill="#608A72" stroke="#446652" stroke-width="3"/>
<!-- Stitch Texture Outer -->
<ellipse cx="300" cy="150" rx="235" ry="92" fill="none" stroke="#7CA68E" stroke-width="3" stroke-dasharray="8 6"/>

<!-- Mid Braided Ring (Mustard Gold) -->
<ellipse cx="300" cy="150" rx="210" ry="80" fill="#DCA03E" stroke="#A87424" stroke-width="3"/>
<ellipse cx="300" cy="150" rx="195" ry="72" fill="none" stroke="#F5BF62" stroke-width="3" stroke-dasharray="8 6"/>

<!-- Inner Braided Ring (Terracotta Rust) -->
<ellipse cx="300" cy="150" rx="165" ry="60" fill="#BA583C" stroke="#8A3822" stroke-width="3"/>
<ellipse cx="300" cy="150" rx="145" ry="50" fill="none" stroke="#D8785C" stroke-width="3" stroke-dasharray="8 6"/>

<!-- Center Medallion (Cream Wool) -->
<ellipse cx="300" cy="150" rx="115" ry="40" fill="#EFE8D8" stroke="#C4B8A0" stroke-width="2.5"/>
<ellipse cx="300" cy="150" rx="80" ry="25" fill="#DFD4BE"/>
</svg>