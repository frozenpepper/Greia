<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
<defs>
  <filter id="pc-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="cup-glaze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4DB6AC"/>
    <stop offset="40%" stop-color="#00897B"/>
    <stop offset="100%" stop-color="#004D40"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="150" cy="370" rx="90" ry="16" fill="#241B12" opacity="0.20" filter="url(#pc-sh)"/>
<ellipse cx="150" cy="368" rx="65" ry="8" fill="#140D07" opacity="0.35"/>

<!-- Sharpened Colored Pencils -->
<!-- Red (Left tilt) -->
<g transform="translate(100, 150) rotate(-16)">
  <rect x="-8" y="-120" width="16" height="150" fill="#E53935"/>
  <polygon points="-8,-120 8,-120 0,-150" fill="#F5DEB3"/>
  <polygon points="-3,-138 3,-138 0,-150" fill="#E53935"/>
</g>
<!-- Yellow (Mid left) -->
<g transform="translate(125, 140) rotate(-7)">
  <rect x="-8" y="-140" width="16" height="170" fill="#FDD835"/>
  <polygon points="-8,-140 8,-140 0,-170" fill="#F5DEB3"/>
  <polygon points="-3,-158 3,-158 0,-170" fill="#FDD835"/>
</g>
<!-- Green (Center) -->
<g transform="translate(150, 140)">
  <rect x="-8" y="-150" width="16" height="180" fill="#43A047"/>
  <polygon points="-8,-150 8,-150 0,-180" fill="#F5DEB3"/>
  <polygon points="-3,-168 3,-168 0,-180" fill="#43A047"/>
</g>
<!-- Blue (Mid right) -->
<g transform="translate(175, 140) rotate(8)">
  <rect x="-8" y="-135" width="16" height="165" fill="#1E88E5"/>
  <polygon points="-8,-135 8,-135 0,-165" fill="#F5DEB3"/>
  <polygon points="-3,-153 3,-153 0,-165" fill="#1E88E5"/>
</g>
<!-- Purple (Right tilt) -->
<g transform="translate(200, 150) rotate(18)">
  <rect x="-8" y="-115" width="16" height="145" fill="#8E24AA"/>
  <polygon points="-8,-115 8,-115 0,-145" fill="#F5DEB3"/>
  <polygon points="-3,-133 3,-133 0,-145" fill="#8E24AA"/>
</g>

<!-- Glazed Ceramic Mug -->
<!-- Handle -->
<path d="M 215,220 C 265,220 265,300 215,300" stroke="#00897B" stroke-width="18" stroke-linecap="round" fill="none"/>
<path d="M 215,220 C 265,220 265,300 215,300" stroke="#004D40" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4"/>

<!-- Cup Body -->
<path d="M 90,190 L 105,355 C 105,365 195,365 195,355 L 210,190 Z" fill="url(#cup-glaze)" stroke="#004D40" stroke-width="3"/>
<!-- Cup Rim -->
<ellipse cx="150" cy="190" rx="60" ry="14" fill="#80CBC4" stroke="#004D40" stroke-width="2"/>
<ellipse cx="150" cy="190" rx="48" ry="10" fill="#004D40"/>
<!-- Terracotta Base Ring -->
<path d="M 107,345 L 105,355 C 105,365 195,365 195,355 L 193,345 Z" fill="#D87A4A"/>
</svg>