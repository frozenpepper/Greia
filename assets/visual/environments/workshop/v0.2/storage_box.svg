<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350">
<defs>
  <filter id="sb-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="crate-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#DFB078"/>
    <stop offset="50%" stop-color="#C28E54"/>
    <stop offset="100%" stop-color="#8E5E2E"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="225" cy="320" rx="170" ry="18" fill="#241B12" opacity="0.20" filter="url(#sb-sh)"/>
<ellipse cx="225" cy="318" rx="130" ry="10" fill="#140D07" opacity="0.35"/>

<!-- Crate Main Body -->
<rect x="65" y="120" width="320" height="195" rx="8" fill="url(#crate-wood)" stroke="#5E3816" stroke-width="3.5"/>

<!-- Finger Joint Corners (Left & Right) -->
<g fill="#7A481C">
  <rect x="65" y="145" width="16" height="25"/>
  <rect x="65" y="195" width="16" height="25"/>
  <rect x="65" y="245" width="16" height="25"/>
  <rect x="369" y="145" width="16" height="25"/>
  <rect x="369" y="195" width="16" height="25"/>
  <rect x="369" y="245" width="16" height="25"/>
</g>

<!-- Top Rim & Bevel -->
<rect x="55" y="110" width="340" height="22" rx="5" fill="#E8BC84" stroke="#5E3816" stroke-width="3"/>
<line x1="58" y1="112" x2="392" y2="112" stroke="#FFF2D4" stroke-width="2.5" opacity="0.9"/>

<!-- Cut-out Oval Handle -->
<rect x="175" y="160" width="100" height="32" rx="16" fill="#3D200A" stroke="#5E3816" stroke-width="2.5"/>

<!-- Brass Label Holder Plate -->
<rect x="185" y="225" width="80" height="40" rx="4" fill="#CFA034" stroke="#785012" stroke-width="2"/>
<rect x="195" y="232" width="60" height="26" fill="#FDFBF7"/>
<line x1="200" y1="245" x2="250" y2="245" stroke="#A89078" stroke-width="2"/>
</svg>