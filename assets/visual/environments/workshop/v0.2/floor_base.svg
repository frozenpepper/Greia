<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 250">
<defs>
  <linearGradient id="floor-oak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#CFA068"/>
    <stop offset="50%" stop-color="#B2804A"/>
    <stop offset="100%" stop-color="#7C5024"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="1024" height="250" fill="url(#floor-oak)"/>

<!-- Horizontal Plank Seams -->
<g stroke="#583412" stroke-width="3">
  <line x1="0" y1="65" x2="1024" y2="65"/>
  <line x1="0" y1="135" x2="1024" y2="135"/>
  <line x1="0" y1="205" x2="1024" y2="205"/>
</g>

<!-- Plank Highlight Bevels -->
<g stroke="#E8BE88" stroke-width="2" opacity="0.7">
  <line x1="0" y1="68" x2="1024" y2="68"/>
  <line x1="0" y1="138" x2="1024" y2="138"/>
  <line x1="0" y1="208" x2="1024" y2="208"/>
</g>

<!-- Staggered Vertical Butt Joints & Nailheads -->
<g stroke="#583412" stroke-width="2.5">
  <line x1="320" y1="0" x2="320" y2="65"/>
  <line x1="740" y1="0" x2="740" y2="65"/>
  <line x1="180" y1="65" x2="180" y2="135"/>
  <line x1="560" y1="65" x2="560" y2="135"/>
  <line x1="880" y1="65" x2="880" y2="135"/>
  <line x1="420" y1="135" x2="420" y2="205"/>
  <line x1="820" y1="135" x2="820" y2="205"/>
  <line x1="260" y1="205" x2="260" y2="250"/>
  <line x1="680" y1="205" x2="680" y2="250"/>
</g>
</svg>