<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
<defs>
  <linearGradient id="sky-win" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#80D0F4"/>
    <stop offset="70%" stop-color="#C2E8F8"/>
    <stop offset="100%" stop-color="#E8F6FC"/>
  </linearGradient>
  <linearGradient id="win-frame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E8CCA0"/>
    <stop offset="50%" stop-color="#C69E68"/>
    <stop offset="100%" stop-color="#8E6838"/>
  </linearGradient>
</defs>

<!-- Outer Wooden Frame with Arch -->
<path d="M 75,540 L 75,200 C 75,80 425,80 425,200 L 425,540 Z" fill="url(#win-frame)" stroke="#5A3A16" stroke-width="4"/>

<!-- Glass Pane Apertures -->
<g fill="url(#sky-win)" stroke="#5A3A16" stroke-width="3">
  <!-- Top Arch Panes -->
  <path d="M 105,190 C 105,120 240,110 240,190 Z"/>
  <path d="M 260,190 C 260,110 395,120 395,190 Z"/>
  <!-- Middle Panes -->
  <rect x="105" y="210" width="135" height="145" rx="3"/>
  <rect x="260" y="210" width="135" height="145" rx="3"/>
  <!-- Lower Panes -->
  <rect x="105" y="375" width="135" height="145" rx="3"/>
  <rect x="260" y="375" width="135" height="145" rx="3"/>
</g>

<!-- Distant Sunny Meadow View through Glass -->
<g opacity="0.85">
  <!-- Far Green Hill -->
  <ellipse cx="200" cy="520" rx="160" ry="70" fill="#78C274"/>
  <ellipse cx="340" cy="520" rx="140" ry="60" fill="#58A854"/>
  <!-- Distant Fluffy Cloud -->
  <ellipse cx="180" cy="270" rx="40" ry="18" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="320" cy="320" rx="35" ry="16" fill="#FFFFFF" opacity="0.9"/>
</g>

<!-- Wide Wooden Window Sill -->
<rect x="50" y="535" width="400" height="35" rx="6" fill="#E8CCA0" stroke="#5A3A16" stroke-width="3.5"/>
<line x1="55" y1="537" x2="445" y2="537" stroke="#FFF2DC" stroke-width="3" opacity="0.9"/>

<!-- Tiny Potted Studio Plant on Sill -->
<polygon points="125,535 145,535 142,505 128,505" fill="#D87A4A" stroke="#8A3C18" stroke-width="2"/>
<!-- Green Leaves -->
<ellipse cx="135" cy="495" rx="12" ry="7" fill="#43A047" transform="rotate(-25 135 495)"/>
<ellipse cx="135" cy="495" rx="12" ry="7" fill="#66BB6A" transform="rotate(25 135 495)"/>
<circle cx="135" cy="488" r="6" fill="#81C784"/>
</svg>