    <g><path d="M190 506 L190 490" stroke="#51714A" stroke-width="2.5" stroke-linecap="round"/><g fill="#F5A3C0" stroke="#4B372F" stroke-width="1.8"><circle cx="185" cy="487" r="4.5"/><circle cx="195" cy="487" r="4.5"/><circle cx="190" cy="482" r="4.5"/><circle cx="190" cy="492" r="4.5"/></g><circle cx="190" cy="487" r="2.6" fill="#FFC234"/></g>
