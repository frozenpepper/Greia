    <g><path d="M884 514 L884 500" stroke="#51714A" stroke-width="2.5" stroke-linecap="round"/><g fill="#F5A3C0" stroke="#4B372F" stroke-width="1.8"><circle cx="879" cy="497" r="4.5"/><circle cx="889" cy="497" r="4.5"/><circle cx="884" cy="492" r="4.5"/><circle cx="884" cy="502" r="4.5"/></g><circle cx="884" cy="497" r="2.6" fill="#FFC234"/></g>
    <g><path d="M120 560 L120 544" stroke="#51714A" stroke-width="2.5" stroke-linecap="round"/><g fill="#FFFBEB" stroke="#4B372F" stroke-width="1.8"><circle cx="115" cy="541" r="4.5"/><circle cx="125" cy="541" r="4.5"/><circle cx="120" cy="536" r="4.5"/><circle cx="120" cy="546" r="4.5"/></g><circle cx="120" cy="541" r="2.6" fill="#FFC234"/></g>
    <g><path d="M940 560 L940 544" stroke="#51714A" stroke-width="2.5" stroke-linecap="round"/><g fill="#FFFBEB" stroke="#4B372F" stroke-width="1.8"><circle cx="935" cy="541" r="4.5"/><circle cx="945" cy="541" r="4.5"/><circle cx="940" cy="536" r="4.5"/><circle cx="940" cy="546" r="4.5"/></g><circle cx="940" cy="541" r="2.6" fill="#FFC234"/></g>
  </g>

  <g id="foreground">
    <path d="M0 600 C4 584 10 572 16 566 C18 578 22 584 26 588 C28 572 34 560 40 552 C42 568 42 580 44 588 C50 578 58 572 66 570 C62 582 62 592 64 600 Z" fill="#6DB25A" stroke="#51714A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M1024 600 C1020 584 1014 572 1008 566 C1006 578 1002 584 998 588 C996 572 990 560 984 552 C982 568 982 580 980 588 C974 578 966 572 958 570 C962 582 962 592 960 600 Z" fill="#6DB25A" stroke="#51714A" stroke-width="2.5" stroke-linejoin="round"/>
