<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <!-- Greia Shell Home / profile-picker backdrop: meadow_day landscape layer.
       Transparent sky so the child's chosen theme background shows through.
       Interaction-critical area x112-912 is kept calm; decoration lives at the edges.
       Recipe: docs/design/GREIA_SVG_AUTHORING_RULES.md (scene layer). -->
  <defs>
    <!-- leaf light (mix 40% white) -> leaf -->
    <linearGradient id="home_landscape_meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD4A6"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
    <!-- sky light -> sky (far hills haze) -->
    <linearGradient id="home_landscape_far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DDF0"/>
      <stop offset="1" stop-color="#DDEBF2"/>
    </linearGradient>
    <!-- sunshine glow -->
    <radialGradient id="home_landscape_sun_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE7A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="sky">
    <circle cx="902" cy="206" r="64" fill="url(#home_landscape_sun_glow)"/>
    <circle cx="902" cy="206" r="32" fill="#FFD35C" stroke="#E9A93B" stroke-width="3"/>
    <path d="M884 194 C889 187 897 183 905 183" fill="none" stroke="#FFF1C2" stroke-width="5" stroke-linecap="round"/>
    <!-- No baked clouds: the Shell draws the sky clouds as sprites
         (cloud.large.01 / cloud.small.01) so Home can drift them; static
         surfaces compose them at rest (greia_launcher.home_scenery). -->
  </g>

  <g id="far">
    <path d="M0 384 C60 352 130 344 200 362 C260 330 340 328 410 360 C470 342 540 340 610 362 C680 334 770 330 840 356 C910 340 980 342 1024 360 L1024 460 L0 460 Z" fill="url(#home_landscape_far)"/>
  </g>

  <g id="mid">
    <path d="M0 418 C90 392 190 390 280 410 C370 396 470 400 560 418 C650 398 760 392 860 410 C930 400 990 402 1024 412 L1024 500 L0 500 Z" fill="#B5DDA6" stroke="#7FA877" stroke-width="2" stroke-linejoin="round"/>
    <path d="M40 412 C110 398 190 397 250 406" fill="none" stroke="#D3EDC6" stroke-width="5" stroke-linecap="round"/>
    <path d="M610 410 C680 397 760 395 830 404" fill="none" stroke="#D3EDC6" stroke-width="5" stroke-linecap="round"/>
    <g id="mid_trees" stroke="#51714A" stroke-width="2" stroke-linejoin="round">
      <path d="M318 410 L318 396" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M306 398 C298 396 299 382 308 381 C307 370 322 366 327 374 C335 369 345 378 340 386 C347 390 343 400 335 398 C328 403 313 403 306 398 Z" fill="#7CBF73"/>
      <path d="M708 406 L708 392" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M697 394 C690 392 691 380 699 379 C698 370 711 366 715 373 C722 369 731 377 727 384 C733 387 730 396 723 394 C717 399 704 399 697 394 Z" fill="#86C67A"/>
    </g>
  </g>

  <g id="ground">
    <path d="M0 478 C120 462 250 460 380 472 C470 480 560 482 650 472 C770 458 900 460 1024 474 L1024 600 L0 600 Z" fill="url(#home_landscape_meadow)" stroke="#51714A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M14 476 C120 464 240 463 360 473" fill="none" stroke="#C8EBC4" stroke-width="5" stroke-linecap="round"/>
    <path d="M664 472 C780 460 900 461 1010 473" fill="none" stroke="#C8EBC4" stroke-width="5" stroke-linecap="round"/>
    <g fill="none" stroke="#4E9A5C" stroke-width="3" stroke-linecap="round" opacity="0.55">
