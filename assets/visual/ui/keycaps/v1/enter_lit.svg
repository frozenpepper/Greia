<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- ui.keycap.enter lit (pressed, sunshine top): keyboard Enter key; sand skirt, cream top, ink return arrow -->
  <defs>
    <!-- sunshine light (mix 40% white) -> sunshine -->
    <linearGradient id="key_enter_lit_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA85"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
  </defs>
  <g id="key" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <rect x="8" y="10" width="80" height="76" rx="16" fill="#DBA633" stroke-width="4"/>
    <rect x="14" y="19" width="68" height="60" rx="12" fill="url(#key_enter_lit_top)" stroke-width="3"/>
    <path d="M22 28 L36 28" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
  </g>
  <g id="symbol" transform="translate(0 6)" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <path d="M64 27 L64 49 L42 49" fill="none" stroke-width="6"/>
