<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96">
  <!-- ui.keycap.space lit (pressed, sunshine top): keyboard space bar; sand skirt, cream top, ink space mark -->
  <defs>
    <!-- sunshine light (mix 40% white) -> sunshine -->
    <linearGradient id="key_space_lit_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA85"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
  </defs>
  <g id="key" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <rect x="8" y="10" width="224" height="76" rx="16" fill="#DBA633" stroke-width="4"/>
    <rect x="14" y="19" width="212" height="60" rx="12" fill="url(#key_space_lit_top)" stroke-width="3"/>
    <path d="M24 28 L54 28" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
  </g>
  <g id="symbol" transform="translate(0 6)">
    <path d="M90 34 L90 50 L150 50 L150 34" fill="none" stroke="#4B372F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
