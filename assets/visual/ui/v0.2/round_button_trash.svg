<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 120" width="112" height="120">
  <!-- Greia round control button (trash, coral face). Canvas 112x120: face r46 at (56,52),
       slab (physical thickness) at (56,60), contact shadow y110. The glyph is part of the art;
       the Shell only lifts the whole button on hover. Recipe: GREIA_SVG_AUTHORING_RULES.md. -->
  <defs>
    <!-- coral light -> coral -->
    <linearGradient id="round_button_trash_face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A198"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="56" cy="110" rx="40" ry="6" fill="#6A5147" opacity="0.16"/>
  </g>
  <g id="slab">
    <circle cx="56" cy="60" r="46" fill="#CA6154" stroke="#4B372F" stroke-width="4"/>
  </g>
  <g id="body">
    <circle cx="56" cy="52" r="46" fill="url(#round_button_trash_face)" stroke="#4B372F" stroke-width="4"/>
    <path d="M22 44 C24 30 34 18 48 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  </g>
  <g id="glyph">
    <path d="M47 30 L49 24 L63 24 L65 30" fill="none" stroke="#4B372F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M39 38 L73 38 L69 76 C69 79 66 81 63 81 L49 81 C46 81 43 79 43 76 Z" fill="#FFFBEB" stroke="#4B372F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M51 46 L52 72 M61 46 L60 72" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
    <rect x="33" y="30" width="46" height="9" rx="4.5" fill="#FFFBEB" stroke="#4B372F" stroke-width="4"/>
  </g>
</svg>
