<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="hollow-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="h-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9E5E32"/>
    <stop offset="30%" stop-color="#7B4520"/>
    <stop offset="70%" stop-color="#552B10"/>
    <stop offset="100%" stop-color="#351605"/>
  </linearGradient>
  <linearGradient id="cavity-falloff" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#241005"/>
    <stop offset="35%" stop-color="#120501"/>
    <stop offset="100%" stop-color="#020000"/>
  </linearGradient>
  <linearGradient id="h-fol-deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E5C22"/>
    <stop offset="100%" stop-color="#0B2A0D"/>
  </linearGradient>
  <linearGradient id="h-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#52B246"/>
    <stop offset="55%" stop-color="#358C2E"/>
    <stop offset="100%" stop-color="#1A5E1D"/>
  </linearGradient>
  <linearGradient id="h-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#94D66E"/>
    <stop offset="50%" stop-color="#5EBC44"/>
    <stop offset="100%" stop-color="#348A2C"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="460" rx="155" ry="20" fill="#241B12" opacity="0.22" filter="url(#hollow-sh)"/>
<ellipse cx="256" cy="456" rx="120" ry="12" fill="#140D07" opacity="0.38"/>

<!-- 1. DEEP UNDER-CANOPY SHADOW (Sheltering weeping crown silhouette) -->
<path d="M 135,230 C 105,190 115,135 155,115 C 180,75 235,55 285,65 C 320,45 375,58 395,102 C 425,122 435,175 410,218 C 428,255 405,295 362,305 C 330,312 295,298 268,305 C 235,315 185,308 158,280 C 138,260 132,245 135,230 Z" fill="url(#h-fol-deep)"/>

<!-- 2. ANCIENT GNARLED TRUNK WITH LIVING CAVITY INTEGRATION -->
<g fill="url(#h-bark)">
  <!-- Gnarled stout trunk swelling organically around hollow -->
  <path d="M 142,456 C 165,453 192,445 198,395 C 202,345 188,290 152,242 C 182,258 208,285 218,315 C 225,270 240,225 272,178 C 285,155 300,138 318,122 C 305,152 302,182 305,215 C 310,250 322,275 338,298 C 358,268 385,245 418,228 C 392,258 372,295 358,335 C 348,372 348,412 355,442 C 360,452 378,454 395,456 L 142,456 Z"/>

  <!-- THE INTERACTIVE HOLLOW -->
  <!-- 1. Outer Dark Bark Collar -->
  <path d="M 208,305 C 192,338 190,385 208,418 C 222,442 278,446 298,420 C 312,388 308,338 295,308 C 278,282 225,280 208,305 Z" fill="#240E03"/>

  <!-- 2. Thick Weathered Wooden Rim Chamfer -->
  <path d="M 214,310 C 200,340 198,382 214,412 C 226,435 274,438 290,415 C 302,385 298,342 288,314 C 272,292 228,290 214,310 Z" fill="#4E240A"/>

  <!-- 3. Deep Asymmetrical Living Hollow Aperture (Falloff into pitch blackness) -->
  <path d="M 218,316 C 208,344 206,376 218,405 C 228,426 268,428 282,408 C 294,380 290,348 282,320 C 270,300 230,298 218,316 Z" fill="url(#cavity-falloff)"/>

  <!-- 4. Sunlit Upper Lip Highlight -->
  <path d="M 225,298 C 248,288 272,290 286,302 C 272,298 248,298 232,308 Z" fill="#C88E5A" opacity="0.9"/>

  <!-- 5. Interior Wooden Floor Shelf -->
  <path d="M 218,405 C 238,420 268,422 282,408 C 268,415 238,414 222,402 Z" fill="#75411C" opacity="0.85"/>
</g>

<!-- 3. SHELTERING WEEPING CANOPY (Drooping crown framing the upper trunk) -->
<!-- Left Weeping Lobe -->
<g>
  <path d="M 125,225 C 105,190 115,150 148,135 C 178,122 215,130 228,155 C 238,180 232,215 212,238 C 190,262 152,270 128,258 L 125,225 Z" fill="url(#h-fol-mid)"/>
  <path d="M 138,200 C 122,172 132,145 160,135 C 185,125 210,135 218,152 C 205,178 182,202 152,205 L 138,200 Z" fill="url(#h-fol-sun)"/>
</g>

<!-- Right Weeping Lobe -->
<g>
  <path d="M 305,245 C 290,210 305,170 342,155 C 375,142 415,155 425,185 C 435,215 422,250 395,270 C 365,288 325,280 305,245 Z" fill="url(#h-fol-mid)"/>
  <path d="M 322,220 C 310,192 325,165 358,152 C 385,142 412,152 418,172 C 405,198 380,220 350,225 L 322,220 Z" fill="url(#h-fol-sun)"/>
</g>

<!-- Overhead Sheltering Dome -->
<g>
  <path d="M 185,155 C 165,105 200,55 255,45 C 292,38 335,50 355,75 C 388,58 432,70 442,105 C 452,140 435,178 405,202 C 370,228 318,232 272,225 C 230,218 195,192 185,155 Z" fill="url(#h-fol-mid)"/>
  <path d="M 205,118 C 188,80 218,45 265,38 C 300,32 335,45 352,68 C 340,95 310,118 272,122 C 238,125 212,120 205,118 Z" fill="url(#h-fol-sun)"/>
</g>
</svg>