<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="br-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="br-cane" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A57E54"/>
    <stop offset="100%" stop-color="#552F12"/>
  </linearGradient>
  <linearGradient id="br-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#5CB850"/>
    <stop offset="55%" stop-color="#389430"/>
    <stop offset="100%" stop-color="#1A641E"/>
  </linearGradient>
  <linearGradient id="br-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#AEE678"/>
    <stop offset="50%" stop-color="#72CE58"/>
    <stop offset="100%" stop-color="#3E9E36"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="180" ry="18" fill="#241B12" opacity="0.18" filter="url(#br-sh)"/>
<ellipse cx="256" cy="226" rx="140" ry="10" fill="#140D07" opacity="0.32"/>

<!-- 1. ARCHING WOODY CANES (Visible upright skeletal structure) -->
<g stroke="url(#br-cane)" stroke-linecap="round" fill="none">
  <!-- Far Left Arch -->
  <path d="M 215,226 C 200,180 160,135 95,95" stroke-width="4.5"/>
  <!-- Mid Left Arch -->
  <path d="M 230,226 C 220,175 190,120 135,70" stroke-width="5"/>
  <!-- Center Main Cane -->
  <path d="M 252,226 C 250,165 248,105 252,38" stroke-width="5.5"/>
  <!-- Mid Right Arch -->
  <path d="M 272,226 C 282,175 315,120 375,70" stroke-width="5"/>
  <!-- Far Right Arch -->
  <path d="M 285,226 C 302,180 345,135 415,95" stroke-width="4.5"/>
</g>

<!-- 2. POINTED BOTANICAL LEAFLET SPRAYS (Arranged along arching canes) -->

<!-- Left Cane Leaflets -->
<g fill="url(#br-fol-mid)">
  <!-- Outer Left Tip Spray -->
  <path d="M 95,95 C 75,90 65,70 80,55 C 98,72 105,85 95,95 Z"/>
  <path d="M 95,95 C 110,80 125,72 135,88 C 120,98 105,100 95,95 Z"/>
  <path d="M 95,95 C 80,105 72,122 88,130 C 98,115 100,102 95,95 Z"/>

  <!-- Mid-Left Cane Sprays -->
  <path d="M 135,70 C 115,62 108,42 125,30 C 140,48 145,60 135,70 Z"/>
  <path d="M 135,70 C 150,55 168,50 175,65 C 160,75 145,78 135,70 Z"/>
  <path d="M 165,125 C 145,115 138,95 155,85 C 170,102 175,115 165,125 Z"/>
  <path d="M 165,125 C 180,110 198,105 205,120 C 190,130 175,132 165,125 Z"/>
  <path d="M 195,175 C 175,165 168,145 185,135 C 200,152 205,165 195,175 Z"/>
</g>

<!-- Right Cane Leaflets -->
<g fill="url(#br-fol-mid)">
  <!-- Outer Right Tip Spray -->
  <path d="M 415,95 C 435,90 445,70 430,55 C 412,72 405,85 415,95 Z"/>
  <path d="M 415,95 C 400,80 385,72 375,88 C 390,98 405,100 415,95 Z"/>
  <path d="M 415,95 C 430,105 438,122 422,130 C 412,115 410,102 415,95 Z"/>

  <!-- Mid-Right Cane Sprays -->
  <path d="M 375,70 C 395,62 402,42 385,30 C 370,48 365,60 375,70 Z"/>
  <path d="M 375,70 C 360,55 342,50 335,65 C 350,75 365,78 375,70 Z"/>
  <path d="M 345,125 C 365,115 372,95 355,85 C 340,102 335,115 345,125 Z"/>
  <path d="M 345,125 C 330,110 312,105 305,120 C 320,130 335,132 345,125 Z"/>
  <path d="M 315,175 C 335,165 342,145 325,135 C 310,152 305,165 315,175 Z"/>
</g>

<!-- Center Leader Sprays -->
<g fill="url(#br-fol-mid)">
  <path d="M 252,38 C 235,25 240,5 255,2 C 270,8 268,25 252,38 Z"/>
  <path d="M 252,38 C 230,35 220,48 232,60 C 245,55 250,45 252,38 Z"/>
  <path d="M 252,38 C 272,35 282,48 270,60 C 258,55 255,45 252,38 Z"/>
  <path d="M 250,95 C 228,85 225,68 242,60 C 255,75 258,88 250,95 Z"/>
  <path d="M 250,95 C 272,85 275,68 258,60 C 245,75 242,88 250,95 Z"/>
  <path d="M 248,155 C 225,145 220,125 238,118 C 252,132 255,145 248,155 Z"/>
  <path d="M 248,155 C 270,145 278,125 260,118 C 245,132 242,145 248,155 Z"/>
</g>

<!-- Sunlit Highlights on Leaf Tops -->
<g fill="url(#br-fol-sun)" opacity="0.85">
  <path d="M 95,95 C 80,90 72,75 82,62 C 95,75 100,88 95,95 Z"/>
  <path d="M 135,70 C 120,62 115,48 128,38 C 138,50 142,62 135,70 Z"/>
  <path d="M 375,70 C 390,62 395,48 382,38 C 372,50 368,62 375,70 Z"/>
  <path d="M 252,38 C 240,28 245,12 255,8 C 265,15 262,28 252,38 Z"/>
</g>

<!-- Meadow Buttercup Blossoms -->
<g fill="#FFD54F">
  <circle cx="95" cy="95" r="4.5"/>
  <circle cx="95" cy="95" r="2.2" fill="#FFFDE7"/>
  <circle cx="415" cy="95" r="4.5"/>
  <circle cx="415" cy="95" r="2.2" fill="#FFFDE7"/>
  <circle cx="252" cy="38" r="5"/>
  <circle cx="252" cy="38" r="2.5" fill="#FFFDE7"/>
  <circle cx="165" cy="125" r="4.5"/>
  <circle cx="165" cy="125" r="2.2" fill="#FFFDE7"/>
  <circle cx="345" cy="125" r="4.5"/>
  <circle cx="345" cy="125" r="2.2" fill="#FFFDE7"/>
</g>
</svg>