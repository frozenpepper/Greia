<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="woodland-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="birch-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E5D8C4"/>
    <stop offset="35%" stop-color="#CBB69A"/>
    <stop offset="70%" stop-color="#9E8264"/>
    <stop offset="100%" stop-color="#6E5236"/>
  </linearGradient>
  <linearGradient id="birch-deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E5E24"/>
    <stop offset="100%" stop-color="#0A2C10"/>
  </linearGradient>
  <linearGradient id="birch-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#60C452"/>
    <stop offset="50%" stop-color="#3CA034"/>
    <stop offset="100%" stop-color="#1C6C22"/>
  </linearGradient>
  <linearGradient id="birch-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#B2EA7C"/>
    <stop offset="50%" stop-color="#76D25A"/>
    <stop offset="100%" stop-color="#42AC3C"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="240" cy="460" rx="90" ry="15" fill="#241B12" opacity="0.20" filter="url(#woodland-sh)"/>
<ellipse cx="240" cy="456" rx="65" ry="9" fill="#140D07" opacity="0.35"/>

<!-- 1. DEEP SHADOW LAYER BEHIND BRANCH FORKS (Airy separate clusters) -->
<path d="M 98,240 C 82,215 88,180 115,165 C 142,150 178,158 190,182 C 202,208 190,242 162,255 C 135,265 112,255 98,240 Z" fill="url(#birch-deep)"/>
<path d="M 292,230 C 275,198 295,162 330,150 C 365,138 405,152 415,182 C 425,215 405,250 375,262 C 342,272 308,258 292,230 Z" fill="url(#birch-deep)"/>
<path d="M 172,112 C 155,70 190,28 238,22 C 285,18 325,45 332,82 C 340,120 308,155 268,158 C 228,162 188,142 172,112 Z" fill="url(#birch-deep)"/>

<!-- 2. SLENDER CURVED TRUNK & AIRY FORKED LIMBS -->
<g fill="url(#birch-bark)">
  <path d="M 210,456 C 220,453 228,440 230,395 C 232,350 230,305 224,265
           C 205,245 170,220 132,195 C 122,188 128,180 138,182 C 172,195 208,220 226,245
           C 228,220 232,182 238,140
           C 225,120 205,100 185,85 C 180,80 188,74 195,76 C 215,88 232,108 240,128
           C 242,105 245,80 250,55 C 255,58 254,72 250,95
           C 258,120 285,145 335,160 C 345,162 342,172 330,170 C 292,160 262,140 248,118
           C 242,165 240,220 242,270
           C 260,250 295,240 330,238 C 338,240 336,248 325,250 C 295,255 268,268 252,288
           C 248,340 248,395 252,435 C 258,450 270,454 285,456 L 210,456 Z"/>
  <!-- Birch Lenticel Notches -->
  <path d="M 228,385 L 248,385" stroke="#3A2514" stroke-width="2" stroke-linecap="round"/>
  <path d="M 226,335 L 246,336" stroke="#3A2514" stroke-width="2" stroke-linecap="round"/>
  <path d="M 225,285 L 242,285" stroke="#3A2514" stroke-width="1.8" stroke-linecap="round"/>
</g>

<!-- 3. AIRY FORE CANOPY LEAF CLUSTERS (Scalloped leafy sprays with negative space) -->

<!-- Cluster 1: Lower Left Spray -->
<g>
  <path d="M 95,230 C 78,205 88,172 118,155 C 148,140 182,150 195,172 C 205,198 195,230 170,245 C 140,258 112,250 95,230 Z" fill="url(#birch-mid)"/>
  <path d="M 108,205 C 98,182 108,158 132,148 C 158,138 182,148 188,168 C 178,190 155,212 128,215 L 108,205 Z" fill="url(#birch-sun)"/>
</g>

<!-- Cluster 2: Mid Right Spray -->
<g>
  <path d="M 302,220 C 285,188 305,152 342,142 C 378,130 415,142 425,172 C 435,202 418,238 385,250 C 352,262 315,248 302,220 Z" fill="url(#birch-mid)"/>
  <path d="M 318,195 C 305,168 322,142 358,135 C 388,128 415,138 420,162 C 405,188 380,210 352,212 L 318,195 Z" fill="url(#birch-sun)"/>
</g>

<!-- Cluster 3: Upper Left Sub-Cluster -->
<g>
  <path d="M 150,115 C 135,85 152,52 185,42 C 215,32 248,45 258,68 C 268,92 252,125 225,135 C 198,145 165,135 150,115 Z" fill="url(#birch-mid)"/>
  <path d="M 162,92 C 150,70 165,48 192,40 C 218,35 240,48 248,65 C 235,88 215,108 190,110 L 162,92 Z" fill="url(#birch-sun)"/>
</g>

<!-- Cluster 4: Top Crown Cluster -->
<g>
  <path d="M 215,85 C 198,48 232,15 278,10 C 322,6 358,30 365,65 C 372,100 342,132 305,135 C 268,138 230,118 215,85 Z" fill="url(#birch-mid)"/>
  <path d="M 228,62 C 215,32 245,12 282,10 C 318,8 345,26 352,55 C 342,80 320,102 290,105 L 228,62 Z" fill="url(#birch-sun)"/>
</g>
</svg>