<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="oak-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="oak-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A26A40"/>
    <stop offset="35%" stop-color="#804B26"/>
    <stop offset="70%" stop-color="#5A3014"/>
    <stop offset="100%" stop-color="#381B08"/>
  </linearGradient>
  <linearGradient id="oak-deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1B5620"/>
    <stop offset="100%" stop-color="#0B2B0E"/>
  </linearGradient>
  <linearGradient id="oak-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#52B246"/>
    <stop offset="55%" stop-color="#358C2E"/>
    <stop offset="100%" stop-color="#185C1C"/>
  </linearGradient>
  <linearGradient id="oak-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9CD872"/>
    <stop offset="45%" stop-color="#62BE48"/>
    <stop offset="100%" stop-color="#368C2E"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="256" cy="460" rx="165" ry="20" fill="#241B12" opacity="0.22" filter="url(#oak-sh)"/>
<ellipse cx="256" cy="456" rx="125" ry="12" fill="#140D07" opacity="0.38"/>

<!-- 1. DEEP UNDER-CANOPY SHADOW (Scalloped organic cloud silhouette) -->
<path d="M 65,265 C 50,240 55,205 75,185 C 65,160 78,130 105,115 C 120,105 140,110 155,100 C 175,70 215,55 255,65 C 285,45 330,42 365,60 C 395,45 440,55 460,90 C 485,120 480,165 465,195 C 482,225 478,268 450,295 C 430,315 398,322 372,312 C 350,332 315,338 285,325 C 260,340 220,342 190,328 C 160,342 120,335 95,310 C 75,302 65,285 65,265 Z" fill="url(#oak-deep)"/>

<!-- 2. HEAVY GNARLED TRUNK & LOAD-BEARING BOUGHS -->
<g fill="url(#oak-bark)">
  <!-- Massive trunk spreading into wide buttress roots and 3 strong boughs -->
  <path d="M 145,456 C 165,453 192,444 205,418 C 218,388 218,340 205,295
           C 182,275 145,255 105,238 C 95,234 98,225 112,228 C 155,235 195,258 212,280
           C 220,245 235,205 260,168 C 268,172 265,182 258,205
           C 280,185 322,172 370,168 C 382,170 378,178 365,182 C 325,192 292,218 280,252
           C 305,242 352,240 392,245 C 402,248 398,255 385,258 C 345,265 310,280 292,305
           C 308,352 318,402 338,428 C 352,448 375,454 398,456
           C 355,458 320,455 256,456 C 195,455 172,458 145,456 Z"/>
</g>

<!-- 3. FORE CANOPY BILLOWING LEAF MASSES (Multi-scalloped organic storybook volumes) -->

<!-- Lower-Left Canopy Mass -->
<g>
  <path d="M 68,250 C 52,225 60,190 85,172 C 105,158 132,162 148,152 C 172,142 202,155 212,180 C 222,205 215,238 192,258 C 168,278 135,282 108,275 C 85,270 72,262 68,250 Z" fill="url(#oak-mid)"/>
  <path d="M 80,225 C 70,202 82,178 105,165 C 128,152 158,158 172,178 C 160,202 135,225 108,230 L 80,225 Z" fill="url(#oak-sun)"/>
</g>

<!-- Lower-Right Canopy Mass -->
<g>
  <path d="M 305,275 C 285,240 305,195 345,178 C 375,165 412,172 432,192 C 455,215 465,250 445,278 C 425,305 388,318 355,310 C 328,305 310,292 305,275 Z" fill="url(#oak-mid)"/>
  <path d="M 325,245 C 312,218 330,188 362,175 C 392,162 425,175 438,198 C 420,225 390,250 358,255 L 325,245 Z" fill="url(#oak-sun)"/>
</g>

<!-- Upper-Left Canopy Mass -->
<g>
  <path d="M 108,142 C 90,110 112,68 152,55 C 185,45 220,58 238,82 C 255,108 250,142 228,165 C 202,188 165,192 135,180 C 115,170 105,158 108,142 Z" fill="url(#oak-mid)"/>
  <path d="M 122,115 C 110,88 132,62 165,52 C 195,45 222,60 230,85 C 215,112 185,135 152,138 L 122,115 Z" fill="url(#oak-sun)"/>
</g>

<!-- Upper-Right Dominant Crown Mass -->
<g>
  <path d="M 235,128 C 215,82 250,32 305,20 C 355,10 405,32 422,75 C 438,118 418,162 375,182 C 330,202 280,192 250,165 C 238,152 232,140 235,128 Z" fill="url(#oak-mid)"/>
  <path d="M 255,95 C 238,62 268,28 312,18 C 355,10 392,30 405,65 C 392,98 360,128 322,132 L 255,95 Z" fill="url(#oak-sun)"/>
</g>
</svg>