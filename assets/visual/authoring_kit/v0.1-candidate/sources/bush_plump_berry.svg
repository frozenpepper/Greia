<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="bush-sh-a" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="bush-a-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9AE888"/>
    <stop offset="50%" stop-color="#56C65E"/>
    <stop offset="100%" stop-color="#2E9440"/>
  </linearGradient>
  <linearGradient id="bush-a-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#58C862"/>
    <stop offset="55%" stop-color="#329B42"/>
    <stop offset="100%" stop-color="#1A6E2C"/>
  </linearGradient>
  <linearGradient id="bush-a-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#288235"/>
    <stop offset="60%" stop-color="#185A24"/>
    <stop offset="100%" stop-color="#0E3C16"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="256" cy="228" rx="200" ry="18" fill="#2E2015" opacity="0.18" filter="url(#bush-sh-a)"/>
<ellipse cx="256" cy="226" rx="160" ry="10" fill="#1C120A" opacity="0.30"/>

<!-- Back Shadow Mass (Flat Ground Line) -->
<path d="M65 226 C50 180 68 128 110 112 C135 75 188 68 225 85 C258 60 318 65 350 95 C388 80 438 105 448 152 C462 188 448 215 425 226 L65 226 Z" fill="url(#bush-a-dark)"/>

