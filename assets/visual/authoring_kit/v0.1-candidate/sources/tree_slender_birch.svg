    <stop offset="50%" stop-color="#40A238"/>
    <stop offset="100%" stop-color="#1E6C22"/>
  </linearGradient>
  <linearGradient id="b-leaf-sun" x1="0.3" y1="0" x2="0.7" y2="1">
