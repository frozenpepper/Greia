<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="shadow-birch" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="birch-trunk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C59B70"/>
    <stop offset="35%" stop-color="#A57A50"/>
    <stop offset="70%" stop-color="#805630"/>
    <stop offset="100%" stop-color="#5E381A"/>
  </linearGradient>
  <linearGradient id="birch-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#BAF494"/>
    <stop offset="50%" stop-color="#7ADB6A"/>
    <stop offset="100%" stop-color="#46AE48"/>
  </linearGradient>
  <linearGradient id="birch-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#6ED464"/>
    <stop offset="55%" stop-color="#42AC45"/>
    <stop offset="100%" stop-color="#247C2B"/>
  </linearGradient>
  <linearGradient id="birch-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#34943A"/>
    <stop offset="60%" stop-color="#1E6824"/>
    <stop offset="100%" stop-color="#104415"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="260" cy="456" rx="110" ry="18" fill="#2E2015" opacity="0.18" filter="url(#shadow-birch)"/>
<ellipse cx="260" cy="454" rx="80" ry="10" fill="#1C120A" opacity="0.30"/>

<!-- Airy Upright Foliage Silhouette (Distinct from Oak) -->
<!-- High Cluster Left -->
<path d="M150 180 C130 135 158 90 205 82 C235 78 262 95 272 120 C258 152 225 180 188 182 C168 182 155 178 150 180 Z" fill="url(#birch-mid)"/>
<!-- High Cluster Right -->
<path d="M285 160 C278 120 310 88 348 92 C380 95 405 118 402 150 C398 178 370 200 342 202 C315 202 290 185 285 160 Z" fill="url(#birch-mid)"/>
<!-- Tall Crown Cluster -->
<path d="M215 105 C200 60 240 22 288 18 C325 15 365 38 375 72 C400 68 430 85 432 118 C435 148 412 178 380 185 C345 192 308 185 282 168 C248 178 215 155 212 122 C210 115 212 108 215 105 Z" fill="url(#birch-sun)"/>

<!-- Slender Graceful Bowed Trunk with Visible Sky Windows -->
<g>
  <path d="M205 455 C222 452 238 442 244 395 C248 340 245 285 220 230 C240 245 258 272 265 305 C272 258 285 210 315 165 C300 200 295 240 298 285 C302 342 308 400 318 440 C322 452 338 454 355 455 L205 455 Z" fill="url(#birch-trunk)"/>
  <path d="M205 455 C218 453 232 448 240 435 C244 415 244 385 244 350" fill="none" stroke="#D8A878" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M355 455 C342 453 330 448 324 435 C318 415 316 385 314 350" fill="none" stroke="#48240D" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- Slender Branches Framing Crown -->
  <path d="M238 250 C210 225 178 215 140 215 C172 208 205 210 232 228 Z" fill="#805630"/>
  <path d="M298 215 C330 190 368 180 405 182 C372 174 336 176 308 195 Z" fill="#5E381A"/>
</g>

<!-- Soft Matte Sunlit Sheen on Crown -->
<g fill="#E3FED4" opacity="0.45">
  <ellipse cx="285" cy="48" rx="42" ry="18" transform="rotate(-6 285 48)"/>
  <ellipse cx="198" cy="112" rx="30" ry="14" transform="rotate(-12 198 112)"/>
  <ellipse cx="360" cy="102" rx="30" ry="14" transform="rotate(10 360 102)"/>
</g>
</svg>