<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="r-sh-b-blur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="shelf-top-grad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#D6E0E3"/>
    <stop offset="50%" stop-color="#A5B7BC"/>
    <stop offset="100%" stop-color="#728488"/>
  </linearGradient>
  <linearGradient id="shelf-side-grad" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#647579"/>
    <stop offset="60%" stop-color="#3E4E52"/>
    <stop offset="100%" stop-color="#202C2E"/>
  </linearGradient>
  <linearGradient id="shelf-moss-grad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#9AE288"/>
    <stop offset="50%" stop-color="#52BE55"/>
    <stop offset="100%" stop-color="#2C8435"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="256" cy="228" rx="210" ry="18" fill="#1C2324" opacity="0.20" filter="url(#r-sh-b-blur)"/>
<ellipse cx="256" cy="226" rx="170" ry="10" fill="#0F1415" opacity="0.35"/>

<!-- Base Stone Tier (Flat Base $y=226$) -->
<path d="M52 226 C50 185 70 162 105 158 C160 150 360 150 410 158 C445 162 462 185 460 226 L52 226 Z" fill="url(#shelf-side-grad)"/>
<path d="M58 185 C68 165 92 158 120 156 L395 156 C422 158 445 165 452 185 C420 190 85 190 58 185 Z" fill="url(#shelf-top-grad)"/>

<!-- Middle Stepped Ledge Tier -->
<path d="M98 185 C95 140 118 112 155 108 C198 102 320 102 360 108 C398 112 418 140 415 185 L98 185 Z" fill="url(#shelf-side-grad)"/>
<path d="M105 142 C115 122 138 114 168 112 L345 112 C375 114 398 122 408 142 C375 148 135 148 105 142 Z" fill="url(#shelf-top-grad)"/>

<!-- Top Natural Rock Plateau -->
<path d="M148 142 C145 92 172 65 210 60 C242 55 275 55 305 60 C342 65 370 92 368 142 L148 142 Z" fill="url(#shelf-side-grad)"/>
<path d="M155 98 C168 76 195 66 225 64 L290 64 C320 66 348 76 360 98 C330 104 185 104 155 98 Z" fill="url(#shelf-top-grad)"/>

<!-- Integrated Velvet Moss -->
<g fill="url(#shelf-moss-grad)">
  <path d="M190 66 C210 58 240 58 260 66 C245 74 225 74 210 78 C200 78 192 72 190 66 Z"/>
  <path d="M130 116 C150 108 185 110 205 118 C185 124 152 124 138 130 C132 130 128 122 130 116 Z"/>
  <path d="M310 116 C330 108 365 110 382 118 C365 124 338 124 322 130 C315 130 312 122 310 116 Z"/>
</g>
</svg>