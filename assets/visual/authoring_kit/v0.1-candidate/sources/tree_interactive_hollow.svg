<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="sh-hollow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="h-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9E6238"/>
    <stop offset="35%" stop-color="#7C4825"/>
    <stop offset="70%" stop-color="#5C3116"/>
    <stop offset="100%" stop-color="#3E1E0A"/>
  </linearGradient>
  <linearGradient id="cavity-depth" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#241005"/>
    <stop offset="40%" stop-color="#120602"/>
    <stop offset="100%" stop-color="#020000"/>
  </linearGradient>
  <linearGradient id="h-fol-back" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#246A28"/>
    <stop offset="100%" stop-color="#0E3812"/>
  </linearGradient>
  <linearGradient id="h-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#58B84E"/>
    <stop offset="55%" stop-color="#389234"/>
    <stop offset="100%" stop-color="#1E6422"/>
  </linearGradient>
  <linearGradient id="h-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9AD876"/>
    <stop offset="50%" stop-color="#64BE4E"/>
    <stop offset="100%" stop-color="#388E34"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="458" rx="150" ry="20" fill="#2E2015" opacity="0.20" filter="url(#sh-hollow)"/>
<ellipse cx="256" cy="455" rx="115" ry="11" fill="#1C120A" opacity="0.35"/>

<!-- 1. DEEP UNDER-CANOPY SHADOW SILHOUETTE -->
<path d="M115 240 C80 190 100 132 152 112 C185 68 250 50 302 65 C345 40 415 60 432 118 C468 138 475 198 442 248 C458 288 422 332 365 335 C325 338 285 322 252 330 C210 340 155 325 128 290 C105 268 100 248 115 240 Z" fill="url(#h-fol-back)"/>

<!-- 2. ANCIENT GNARLY TRUNK WITH HOLLOW -->
<g>
  <!-- Trunk with Outward Base Flare and Spreading Boughs Framing Canopy -->
  <path d="M150 455 C175 452 200 440 205 385 C208 335 198 280 168 230
           C195 245 218 270 228 300 C235 255 250 210 282 165 C295 142 310 125 328 110
           C315 138 312 168 315 200 C320 235 332 260 348 282 C368 252 395 230 428 212
           C402 242 382 278 368 318 C358 355 358 395 365 435 C370 448 390 452 410 455 L150 455 Z" fill="url(#h-bark)"/>

  <!-- THE INTERACTIVE HOLLOW (Constructed Architectural Cavity) -->
  <!-- Outer Wood Lip / Bark Rim Contour -->
  <path d="M214 310 C202 338 200 380 214 410 C226 432 276 436 292 412 C305 382 302 338 290 312 C276 290 228 288 214 310 Z" fill="#2E1405"/>
  <!-- Thick Wooden Rim Bevel (Outer Chamfer) -->
  <path d="M218 314 C208 340 206 378 218 405 C228 428 274 430 288 408 C298 380 296 342 284 318 C272 298 230 296 218 314 Z" fill="#52280E"/>
  <!-- Deep Inner Cavity (Pitch Black Falloff) -->
  <path d="M222 320 C214 344 212 374 222 400 C230 420 270 422 282 402 C292 376 290 345 280 322 C268 304 232 302 222 320 Z" fill="url(#cavity-depth)"/>
  <!-- Top Rim Wood Highlight (Direct Sunlight Rim) -->
  <path d="M228 304 C248 296 270 298 282 308 C270 304 248 304 234 312 Z" fill="#C88E5E" opacity="0.85"/>
  <!-- Bottom Rim Shelf (Seating Platform for Hiding Gameplay) -->
  <path d="M222 400 C242 414 268 416 282 404 C268 410 240 408 226 396 Z" fill="#754320" opacity="0.8"/>
</g>

<!-- 3. SHELTERING CANOPY LOBES (Positioned so the trunk hollow remains 100% visible) -->
<!-- Left Lobe -->
<g>
  <path d="M98 235 C75 195 92 148 135 132 C170 118 210 130 225 158 C238 185 232 222 212 248 C192 272 155 282 125 275 C105 270 98 255 98 235 Z" fill="url(#h-fol-mid)"/>
  <path d="M112 205 C98 175 110 142 142 130 C170 118 200 128 212 150 C195 178 172 205 138 210 L112 205 Z" fill="url(#h-fol-sun)"/>
</g>

<!-- Right Lobe -->
<g>
  <path d="M312 255 C295 218 312 172 355 158 C392 145 435 158 448 192 C460 225 448 262 418 285 C385 305 338 295 312 255 Z" fill="url(#h-fol-mid)"/>
  <path d="M330 228 C318 198 332 168 368 155 C398 145 430 155 438 178 C422 205 395 230 362 235 L330 228 Z" fill="url(#h-fol-sun)"/>
</g>

<!-- Overhead Sheltering Crown -->
<g>
  <path d="M165 172 C140 115 180 58 240 45 C278 38 320 50 345 75 C380 55 430 68 445 105 C458 142 440 188 408 212 C370 242 310 248 260 238 C212 228 175 202 165 172 Z" fill="url(#h-fol-mid)"/>
  <path d="M185 128 C168 88 202 48 252 40 C290 34 328 45 348 70 C335 98 300 122 260 128 C222 132 192 125 185 128 Z" fill="url(#h-fol-sun)"/>
  <path d="M335 105 C330 68 368 38 408 42 C438 45 458 72 452 102 C445 128 422 148 392 150 C362 152 338 130 335 105 Z" fill="url(#h-fol-sun)"/>
</g>
</svg>