  <path d="M105 250 C82 212 100 168 140 152 C170 140 205 150 222 170 C236 190 238 220 225 245 C210 272 172 290 142 285 C118 282 108 268 105 250 Z"/>
  <path d="M315 278 C300 240 318 198 355 180 C388 165 428 175 445 205 C460 235 450 270 422 295 C392 318 342 310 315 278 Z"/>
