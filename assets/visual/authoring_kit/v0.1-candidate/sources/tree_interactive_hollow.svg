<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="shadow-hollow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="hollow-trunk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9C5E35"/>
    <stop offset="35%" stop-color="#7B4522"/>
    <stop offset="70%" stop-color="#5B2F14"/>
    <stop offset="100%" stop-color="#3E1D09"/>
  </linearGradient>
  <linearGradient id="cavity-depth" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#241005"/>
    <stop offset="40%" stop-color="#120602"/>
    <stop offset="100%" stop-color="#040101"/>
  </linearGradient>
  <linearGradient id="hollow-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9CE27C"/>
    <stop offset="50%" stop-color="#5CC052"/>
    <stop offset="100%" stop-color="#369234"/>
  </linearGradient>
  <linearGradient id="hollow-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#56BA4E"/>
    <stop offset="55%" stop-color="#328E30"/>
    <stop offset="100%" stop-color="#1A601E"/>
  </linearGradient>
  <linearGradient id="hollow-dark" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0%" stop-color="#267428"/>
    <stop offset="60%" stop-color="#164E18"/>
    <stop offset="100%" stop-color="#0C340E"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="456" rx="150" ry="20" fill="#2E2015" opacity="0.20" filter="url(#shadow-hollow)"/>
<ellipse cx="256" cy="454" rx="115" ry="11" fill="#1C120A" opacity="0.35"/>

<!-- Back Shadow Canopy -->
<path d="M135 220 C100 175 125 115 172 102 C192 65 248 50 292 65 C330 42 395 62 410 110 C448 125 458 182 430 230 C445 270 410 312 360 318 C325 322 288 310 258 318 C220 328 170 315 142 285 C118 260 118 235 135 220 Z" fill="url(#hollow-dark)"/>

<!-- Ancient Gnarly Trunk with Integrated Interactive Hollow -->
<g>
