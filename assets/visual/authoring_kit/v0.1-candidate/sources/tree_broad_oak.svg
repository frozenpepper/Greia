<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="sh-oak" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="oak-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A86E42"/>
    <stop offset="35%" stop-color="#88522C"/>
    <stop offset="70%" stop-color="#663618"/>
    <stop offset="100%" stop-color="#46220B"/>
  </linearGradient>
  <linearGradient id="oak-fol-back" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#246A28"/>
    <stop offset="100%" stop-color="#0E3812"/>
  </linearGradient>
  <linearGradient id="oak-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#58B84E"/>
    <stop offset="55%" stop-color="#389234"/>
    <stop offset="100%" stop-color="#1E6422"/>
  </linearGradient>
  <linearGradient id="oak-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#9AD876"/>
    <stop offset="50%" stop-color="#64BE4E"/>
    <stop offset="100%" stop-color="#388E34"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="458" rx="145" ry="20" fill="#2E2015" opacity="0.20" filter="url(#sh-oak)"/>
<ellipse cx="256" cy="455" rx="110" ry="11" fill="#1C120A" opacity="0.35"/>

<!-- 1. DEEP UNDER-CANOPY SHADOW SILHOUETTE -->
<path d="M110 240 C75 190 95 130 150 110 C182 65 248 48 302 62 C345 38 418 58 435 115 C472 135 480 195 448 245 C462 288 425 330 368 335 C328 338 288 322 255 330 C212 340 158 325 130 292 C108 268 102 248 110 240 Z" fill="url(#oak-fol-back)"/>

<!-- 2. HEAVY TRUNK & SPREADING BOUGHS (Emerging visibly under the canopy) -->
<g fill="url(#oak-bark)">
  <!-- Trunk rising with buttress root flare and branching into strong boughs -->
  <path d="M165 455 C190 452 215 440 220 380 C225 335 220 295 195 260
           C165 240 128 230 102 232 C115 224 135 222 162 228 C192 238 215 258 228 275
           C235 240 248 200 272 160 C278 165 275 178 270 198
           C292 180 322 170 358 165 C350 172 340 178 320 188 C298 200 285 220 280 245
           C305 235 338 230 375 230 C368 238 355 242 332 248 C310 255 298 272 292 292
           C312 340 322 390 332 435 C338 450 358 453 395 455 L165 455 Z"/>
</g>

<!-- 3. FORE CANOPY MASSES (Sheltering on top of the boughs) -->
<!-- Left Spreading Lobe -->
<g>
  <path d="M92 235 C70 195 88 148 132 132 C168 118 208 130 225 158 C238 185 232 222 212 248 C192 272 152 282 122 275 C102 270 92 255 92 235 Z" fill="url(#oak-fol-mid)"/>
  <path d="M108 205 C92 175 105 142 138 130 C168 118 198 128 210 150 C195 178 170 205 135 210 L108 205 Z" fill="url(#oak-fol-sun)"/>
</g>

<!-- Right Spreading Lobe -->
<g>
  <path d="M312 255 C295 218 312 172 355 158 C392 145 435 158 448 192 C460 225 448 262 418 285 C385 305 338 295 312 255 Z" fill="url(#oak-fol-mid)"/>
  <path d="M330 228 C318 198 332 168 368 155 C398 145 430 155 438 178 C422 205 395 230 362 235 L330 228 Z" fill="url(#oak-fol-sun)"/>
</g>

<!-- Center Broad Crown -->
<g>
  <path d="M162 175 C138 118 178 60 238 48 C275 40 318 52 342 78 C378 58 428 70 442 108 C455 145 438 190 405 215 C368 245 308 250 258 240 C210 230 172 205 162 175 Z" fill="url(#oak-fol-mid)"/>
  <path d="M182 132 C165 90 198 50 248 42 C285 36 322 48 342 72 C330 100 298 125 258 130 C220 135 190 128 182 132 Z" fill="url(#oak-fol-sun)"/>
  <path d="M332 110 C328 70 365 40 405 45 C435 48 455 75 448 105 C442 132 418 152 388 155 C358 158 335 135 332 110 Z" fill="url(#oak-fol-sun)"/>
</g>

<!-- Subtle leaf edge details -->
<path d="M245 42 C255 35 268 36 272 44 C262 46 252 46 245 42 Z" fill="#D8FCD0" opacity="0.6"/>
<path d="M388 42 C398 36 412 38 415 46 C405 48 395 48 388 42 Z" fill="#D8FCD0" opacity="0.6"/>
</svg>