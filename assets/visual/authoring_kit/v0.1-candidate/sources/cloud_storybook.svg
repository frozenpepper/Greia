<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256">
<defs>
  <filter id="cloud-ambient" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="cloud-sun-crest" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#FAFDFE"/>
    <stop offset="100%" stop-color="#E2F2FA"/>
  </linearGradient>
  <linearGradient id="cloud-body-mid" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#F2FAFD"/>
    <stop offset="55%" stop-color="#DAEEF8"/>
    <stop offset="100%" stop-color="#BADDF0"/>
  </linearGradient>
  <linearGradient id="cloud-shadow-base" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#D0E9F6"/>
    <stop offset="55%" stop-color="#B2DAEE"/>
    <stop offset="100%" stop-color="#90C5E2"/>
  </linearGradient>
</defs>

<!-- Ambient Shadow -->
<ellipse cx="320" cy="208" rx="225" ry="20" fill="#6B9CB8" opacity="0.14" filter="url(#cloud-ambient)"/>

<!-- Underbelly Shadow Base -->
<path d="M115 190 C95 155 118 115 155 110 C170 70 215 50 255 65 C285 30 345 28 382 62 C422 45 470 65 485 105 C520 110 545 140 538 175 C535 205 505 224 475 222 L160 222 C135 222 118 208 115 190 Z" fill="url(#cloud-shadow-base)"/>

