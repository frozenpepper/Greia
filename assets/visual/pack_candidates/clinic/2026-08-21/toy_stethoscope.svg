<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320">
<defs>
  <filter id="steth-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="bell-pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBCFE8"/>
    <stop offset="60%" stop-color="#F472B6"/>
    <stop offset="100%" stop-color="#BE185D"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="140" cy="285" rx="75" ry="16" fill="#2E1B0E" opacity="0.22" filter="url(#steth-sh)"/>
<ellipse cx="140" cy="283" rx="50" ry="8" fill="#1A0D05" opacity="0.35"/>

<!-- Binaural Metal/Plastic Bow Headset (Chunky yellow) -->
<path d="M 85,75 C 85,150 195,150 195,75" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>

<!-- Soft Rounded Ear Tips -->
<circle cx="85" cy="70" r="14" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
<circle cx="195" cy="70" r="14" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>

<!-- Y-Joint Junction -->
<rect x="128" y="138" width="24" height="24" rx="6" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>

<!-- Flexible Silicone Tubing (Thick mint green tube, 14px thick so it never vanishes at 64px) -->
<path d="M 140,155 C 140,240 70,220 70,260 C 70,290 140,290 140,250" fill="none" stroke="#34D399" stroke-width="14" stroke-linecap="round"/>
<!-- Tubing Highlight Stripe -->
<path d="M 140,155 C 140,240 70,220 70,260 C 70,290 140,290 140,250" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round"/>

<!-- Heart Chest-Piece Stethoscope Head (Friendly & Tactile) -->
<g transform="translate(140, 240)">
  <ellipse cx="0" cy="0" rx="36" ry="32" fill="url(#bell-pink)" stroke="#9D174D" stroke-width="3"/>
  <ellipse cx="0" cy="-2" rx="28" ry="24" fill="#FDF2F8"/>
  <!-- Embossed Red/Pink Heart Center -->
  <path d="M 0,-12 C -6,-20 -20,-20 -20,-8 C -20,2 0,16 0,16 C 0,16 20,2 20,-8 C 20,-20 6,-20 0,-12 Z" fill="#F472B6" stroke="#BE185D" stroke-width="1.5"/>
</g>
</svg>