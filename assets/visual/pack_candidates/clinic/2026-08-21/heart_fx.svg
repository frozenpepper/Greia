<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260">
<defs>
  <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <linearGradient id="h-pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBCFE8"/>
    <stop offset="50%" stop-color="#F472B6"/>
    <stop offset="100%" stop-color="#DB2777"/>
  </linearGradient>
</defs>

<!-- Main Large Floating Care Heart -->
<g transform="translate(100, 70)">
  <path d="M 30,12 C 23,0 7,0 3,14 C 0,30 30,52 30,52 C 30,52 60,30 57,14 C 53,0 37,0 30,12 Z" fill="url(#h-pink)" stroke="#BE185D" stroke-width="2" filter="url(#h-glow)"/>
  <path d="M 30,12 C 23,0 7,0 3,14 C 0,30 30,52 30,52 C 30,52 60,30 57,14 C 53,0 37,0 30,12 Z" fill="url(#h-pink)"/>
  <ellipse cx="20" cy="18" rx="6" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(-30, 20, 18)"/>
</g>

<!-- Secondary Medium Heart Floating Top-Left -->
<g transform="translate(35, 30)">
  <path d="M 18,7 C 14,0 4,0 2,8 C 0,17 18,30 18,30 C 18,30 36,17 34,8 C 32,0 22,0 18,7 Z" fill="#F472B6" stroke="#BE185D" stroke-width="1.5"/>
  <circle cx="12" cy="10" r="2" fill="#FFFFFF" opacity="0.75"/>
</g>

<!-- Tertiary Small Heart Floating Bottom-Right -->
<g transform="translate(185, 150)">
  <path d="M 12,5 C 9,0 3,0 1,6 C 0,12 12,20 12,20 C 12,20 24,12 23,6 C 21,0 15,0 12,5 Z" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
</g>

<!-- Gentle Sparkle Stars -->
<g fill="#FDE047" stroke="#CA8A04" stroke-width="1">
  <!-- Sparkle 1 -->
  <polygon points="175,45 178,52 185,55 178,58 175,65 172,58 165,55 172,52"/>
  <!-- Sparkle 2 -->
  <polygon points="75,185 77,190 82,192 77,194 75,199 73,194 68,192 73,190"/>
</g>
</svg>