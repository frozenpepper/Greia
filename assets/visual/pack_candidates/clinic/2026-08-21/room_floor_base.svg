<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 200">
<defs>
  <linearGradient id="floor-oak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E2B77E"/>
    <stop offset="50%" stop-color="#C58E52"/>
    <stop offset="100%" stop-color="#9E6932"/>
  </linearGradient>
</defs>

<!-- Main Floor Base -->
<rect x="0" y="0" width="1024" height="200" fill="url(#floor-oak)"/>

<!-- Horizontal Plank Lines -->
<line x1="0" y1="50" x2="1024" y2="50" stroke="#784A1A" stroke-width="2.5"/>
<line x1="0" y1="100" x2="1024" y2="100" stroke="#784A1A" stroke-width="2.5"/>
<line x1="0" y1="150" x2="1024" y2="150" stroke="#784A1A" stroke-width="2.5"/>

<!-- Staggered Plank Butt Joints -->
<line x1="220" y1="0" x2="220" y2="50" stroke="#784A1A" stroke-width="2"/>
<line x1="740" y1="0" x2="740" y2="50" stroke="#784A1A" stroke-width="2"/>
<line x1="460" y1="50" x2="460" y2="100" stroke="#784A1A" stroke-width="2"/>
<line x1="920" y1="50" x2="920" y2="100" stroke="#784A1A" stroke-width="2"/>
<line x1="160" y1="100" x2="160" y2="150" stroke="#784A1A" stroke-width="2"/>
<line x1="680" y1="100" x2="680" y2="150" stroke="#784A1A" stroke-width="2"/>
<line x1="380" y1="150" x2="380" y2="200" stroke="#784A1A" stroke-width="2"/>
<line x1="840" y1="150" x2="840" y2="200" stroke="#784A1A" stroke-width="2"/>
</svg>