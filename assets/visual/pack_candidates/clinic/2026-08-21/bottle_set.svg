<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260">
<defs>
  <filter id="bt-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="cork-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#DEB07A"/>
    <stop offset="100%" stop-color="#9E6932"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="170" cy="235" rx="140" ry="18" fill="#2E1B0E" opacity="0.22" filter="url(#bt-sh)"/>
<ellipse cx="170" cy="233" rx="110" ry="9" fill="#1A0D05" opacity="0.35"/>

<!-- Left Bottle (Rose Pink Syrup) -->
<g transform="translate(50, 60)">
  <!-- Cork Bung -->
  <polygon points="18,12 42,12 46,0 14,0" fill="url(#cork-grad)" stroke="#5B3308" stroke-width="1.5"/>
  <rect x="16" y="12" width="28" height="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <!-- Bottle Body -->
  <rect x="0" y="30" width="60" height="135" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/>
  <!-- Pink Liquid Fill Level -->
  <rect x="4" y="65" width="52" height="96" rx="8" fill="#F472B6" opacity="0.85"/>
  <!-- Paper Label -->
  <rect x="8" y="80" width="44" height="50" rx="4" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="1.5"/>
  <circle cx="30" cy="98" r="8" fill="#F472B6"/>
  <line x1="16" y1="118" x2="44" y2="118" stroke="#BE185D" stroke-width="2"/>
  <!-- Specular Glass Highlight -->
  <rect x="6" y="36" width="6" height="120" rx="3" fill="#FFFFFF" opacity="0.6"/>
</g>

<!-- Center Tall Bottle (Mint Vitamin Tincture) -->
<g transform="translate(135, 30)">
  <!-- Cork Bung -->
  <polygon points="22,14 48,14 52,0 18,0" fill="url(#cork-grad)" stroke="#5B3308" stroke-width="1.5"/>
  <rect x="20" y="14" width="30" height="20" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <!-- Bottle Body -->
  <rect x="0" y="34" width="70" height="160" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <!-- Mint Liquid Fill Level -->
  <rect x="5" y="75" width="60" height="114" rx="10" fill="#34D399" opacity="0.85"/>
  <!-- Paper Label -->
  <rect x="10" y="95" width="50" height="60" rx="5" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="35" cy="115" r="10" fill="#10B981"/>
  <!-- Measurement Hash Marks -->
  <line x1="56" y1="85" x2="62" y2="85" stroke="#047857" stroke-width="2"/>
  <line x1="54" y1="105" x2="62" y2="105" stroke="#047857" stroke-width="2"/>
  <line x1="56" y1="125" x2="62" y2="125" stroke="#047857" stroke-width="2"/>
  <line x1="54" y1="145" x2="62" y2="145" stroke="#047857" stroke-width="2"/>
  <!-- Specular Glass Highlight -->
  <rect x="8" y="40" width="8" height="145" rx="4" fill="#FFFFFF" opacity="0.6"/>
</g>

<!-- Right Bottle (Honey Amber Elixir) -->
<g transform="translate(230, 80)">
  <!-- Cork Bung -->
  <polygon points="16,10 38,10 42,0 12,0" fill="url(#cork-grad)" stroke="#5B3308" stroke-width="1.5"/>
  <rect x="14" y="10" width="26" height="16" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <!-- Bottle Body -->
  <rect x="0" y="26" width="54" height="115" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <!-- Amber Liquid Fill Level -->
  <rect x="4" y="55" width="46" height="82" rx="7" fill="#FBBF24" opacity="0.85"/>
  <!-- Paper Label -->
  <rect x="8" y="70" width="38" height="42" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <polygon points="27,78 29,83 34,83 30,86 31,91 27,88 23,91 24,86 20,83 25,83" fill="#F59E0B"/>
  <!-- Specular Glass Highlight -->
  <rect x="6" y="32" width="6" height="102" rx="3" fill="#FFFFFF" opacity="0.6"/>
</g>
</svg>