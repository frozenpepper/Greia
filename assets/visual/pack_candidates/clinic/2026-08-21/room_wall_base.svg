<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 420">
<defs>
  <linearGradient id="wall-plaster" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FAF8F5"/>
    <stop offset="100%" stop-color="#F3EFEA"/>
  </linearGradient>
  <linearGradient id="wainscot-mint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D1FAE5"/>
    <stop offset="100%" stop-color="#A7F3D0"/>
  </linearGradient>
  <linearGradient id="chair-rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E2B77E"/>
    <stop offset="100%" stop-color="#B47E43"/>
  </linearGradient>
</defs>

<!-- Upper Warm Plaster Wall -->
<rect x="0" y="0" width="1024" height="260" fill="url(#wall-plaster)"/>

<!-- Horizontal Chair Rail Molding -->
<rect x="0" y="252" width="1024" height="16" fill="url(#chair-rail)" stroke="#784A1A" stroke-width="1"/>

<!-- Lower Pastel Mint Beadboard Wainscoting -->
<rect x="0" y="268" width="1024" height="152" fill="url(#wainscot-mint)"/>

<!-- Beadboard Vertical Grooves -->
<g stroke="#6EE7B7" stroke-width="1.5" opacity="0.6">
  <line x1="64" y1="268" x2="64" y2="420"/>
  <line x1="128" y1="268" x2="128" y2="420"/>
  <line x1="192" y1="268" x2="192" y2="420"/>
  <line x1="256" y1="268" x2="256" y2="420"/>
  <line x1="320" y1="268" x2="320" y2="420"/>
  <line x1="384" y1="268" x2="384" y2="420"/>
  <line x1="448" y1="268" x2="448" y2="420"/>
  <line x1="512" y1="268" x2="512" y2="420"/>
  <line x1="576" y1="268" x2="576" y2="420"/>
  <line x1="640" y1="268" x2="640" y2="420"/>
  <line x1="704" y1="268" x2="704" y2="420"/>
  <line x1="768" y1="268" x2="768" y2="420"/>
  <line x1="832" y1="268" x2="832" y2="420"/>
  <line x1="896" y1="268" x2="896" y2="420"/>
  <line x1="960" y1="268" x2="960" y2="420"/>
</g>
</svg>