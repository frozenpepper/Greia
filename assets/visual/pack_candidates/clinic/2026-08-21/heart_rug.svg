<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360">
<defs>
  <filter id="rg-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="rug-pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBCFE8"/>
    <stop offset="50%" stop-color="#F472B6"/>
    <stop offset="100%" stop-color="#DB2777"/>
  </linearGradient>
</defs>

<!-- Rug Drop Shadow -->
<path d="M 230,85 C 190,20 60,20 40,120 C 15,225 230,340 230,340 C 230,340 445,225 420,120 C 400,20 270,20 230,85 Z" fill="#2E1B0E" opacity="0.18" filter="url(#rg-sh)"/>

<!-- Outer Rug Body -->
<path d="M 230,80 C 190,15 60,15 40,115 C 15,220 230,335 230,335 C 230,335 445,220 420,115 C 400,15 270,15 230,80 Z" fill="url(#rug-pink)" stroke="#BE185D" stroke-width="3"/>

<!-- Concentric Braided Inner Band -->
<path d="M 230,105 C 200,50 95,50 80,130 C 60,210 230,305 230,305 C 230,305 400,210 380,130 C 365,50 260,50 230,105 Z" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>

<!-- Decorative Stitched Outline -->
<path d="M 230,105 C 200,50 95,50 80,130 C 60,210 230,305 230,305 C 230,305 400,210 380,130 C 365,50 260,50 230,105 Z" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5"/>

<!-- Center Warm Peach Inlay -->
<path d="M 230,130 C 210,85 135,85 125,145 C 110,200 230,270 230,270 C 230,270 350,200 335,145 C 325,85 250,85 230,130 Z" fill="#FFE4E6" opacity="0.9"/>
</svg>