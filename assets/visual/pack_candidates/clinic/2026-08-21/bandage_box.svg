<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240">
<defs>
  <filter id="bx-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="tin-cream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFBEB"/>
    <stop offset="60%" stop-color="#FEF3C7"/>
    <stop offset="100%" stop-color="#FDE68A"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="140" cy="210" rx="95" ry="16" fill="#2E1B0E" opacity="0.22" filter="url(#bx-sh)"/>
<ellipse cx="140" cy="208" rx="70" ry="8" fill="#1A0D05" opacity="0.35"/>

<!-- Bandage Strips Spilling from Tin -->
<!-- Left Pink Band-aid Strip -->
<g transform="translate(60, 140) rotate(-20)">
  <rect x="0" y="0" width="70" height="26" rx="13" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
  <!-- Middle Gauze Pad -->
  <rect x="22" y="3" width="26" height="20" rx="3" fill="#FFFFFF"/>
  <!-- Star Print -->
  <polygon points="35,7 37,12 42,12 38,15 39,20 35,17 31,20 32,15 28,12 33,12" fill="#F472B6"/>
</g>

<!-- Right Mint Band-aid Strip -->
<g transform="translate(150, 155) rotate(15)">
  <rect x="0" y="0" width="70" height="26" rx="13" fill="#A7F3D0" stroke="#059669" stroke-width="1.5"/>
  <rect x="22" y="3" width="26" height="20" rx="3" fill="#FFFFFF"/>
  <!-- Heart Print -->
  <path d="M 35,9 C 33,6 29,6 28,9 C 27,12 35,17 35,17 C 35,17 43,12 42,9 C 41,6 37,6 35,9 Z" fill="#10B981"/>
</g>

<!-- Main Tin Bandage Box Body -->
<rect x="60" y="80" width="160" height="110" rx="12" fill="url(#tin-cream)" stroke="#D97706" stroke-width="2.5"/>

<!-- Tin Lid Rim -->
<rect x="52" y="70" width="176" height="22" rx="7" fill="#FDE047" stroke="#B45309" stroke-width="2"/>

<!-- Decorative Tin Print Graphic (Star + Heart) -->
<circle cx="140" cy="135" r="24" fill="#FEE2E2" stroke="#F87171" stroke-width="1.5"/>
<path d="M 140,123 C 137,117 127,117 125,123 C 123,130 140,143 140,143 C 140,143 157,130 155,123 C 153,117 143,117 140,123 Z" fill="#EF4444"/>
</svg>