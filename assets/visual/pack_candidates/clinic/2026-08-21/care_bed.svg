<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
<defs>
  <filter id="bed-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="wood-frame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E2B77E"/>
    <stop offset="60%" stop-color="#C29053"/>
    <stop offset="100%" stop-color="#8F5E28"/>
  </linearGradient>
  <linearGradient id="quilt-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E0F2FE"/>
    <stop offset="50%" stop-color="#BAE6FD"/>
    <stop offset="100%" stop-color="#7DD3FC"/>
  </linearGradient>
  <linearGradient id="mattress-white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#EDE8DF"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="250" cy="290" rx="210" ry="24" fill="#2E1B0E" opacity="0.22" filter="url(#bed-sh)"/>
<ellipse cx="250" cy="288" rx="170" ry="12" fill="#1A0D05" opacity="0.35"/>

<!-- Bed Frame - Back Legs -->
<rect x="55" y="160" width="22" height="110" rx="6" fill="#8F5E28"/>
<rect x="425" y="160" width="22" height="110" rx="6" fill="#8F5E28"/>

<!-- Headboard (Arched Soft Wood with Heart Cutout) -->
<path d="M 40,80 Q 75,50 110,80 L 110,230 L 40,230 Z" fill="url(#wood-frame)" stroke="#784A1A" stroke-width="2.5"/>
<circle cx="75" cy="95" r="14" fill="#F8FAFC" opacity="0.8"/>
<path d="M 75,90 C 73,86 67,86 66,91 C 65,96 75,102 75,102 C 75,102 85,96 84,91 C 83,86 77,86 75,90 Z" fill="#F472B6"/>

<!-- Footboard (Lower Wood Arch) -->
<path d="M 390,130 Q 425,110 460,130 L 460,250 L 390,250 Z" fill="url(#wood-frame)" stroke="#784A1A" stroke-width="2.5"/>

<!-- Base Rail & Slats -->
<rect x="70" y="210" width="360" height="30" rx="6" fill="url(#wood-frame)" stroke="#784A1A" stroke-width="2"/>

<!-- Mattress -->
<rect x="75" y="170" width="350" height="48" rx="10" fill="url(#mattress-white)" stroke="#D4C9BA" stroke-width="2"/>

<!-- Fluffy Pillow -->
<path d="M 85,150 C 85,130 165,130 175,150 C 185,170 170,185 85,185 Z" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
<ellipse cx="130" cy="155" rx="30" ry="10" fill="#FFFBEB" opacity="0.6"/>

<!-- Folded Cozy Quilt / Blanket -->
<path d="M 140,165 C 190,160 410,160 425,175 L 425,225 C 410,235 160,235 140,225 Z" fill="url(#quilt-grad)" stroke="#38BDF8" stroke-width="2"/>
<!-- Folded Top Edge (Peach/Coral Accent) -->
<path d="M 138,165 C 160,158 200,158 210,168 L 205,225 C 180,230 145,228 138,225 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>

<!-- Quilt Stitch Grid Pattern -->
<g stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="4 4">
  <line x1="230" y1="165" x2="230" y2="225"/>
  <line x1="280" y1="165" x2="280" y2="225"/>
  <line x1="330" y1="165" x2="330" y2="225"/>
  <line x1="380" y1="165" x2="380" y2="225"/>
  <line x1="210" y1="195" x2="425" y2="195"/>
</g>

<!-- Front Turned Legs -->
<rect x="50" y="190" width="26" height="95" rx="7" fill="url(#wood-frame)" stroke="#784A1A" stroke-width="2"/>
<rect x="425" y="190" width="26" height="95" rx="7" fill="url(#wood-frame)" stroke="#784A1A" stroke-width="2"/>
</svg>