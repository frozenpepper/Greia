<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="handShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Large Red Pointer Hand -->
  <polygon points="60,60 56,62 102,22 106,26" fill="#DC2626" filter="url(#handShadow)" />
  <circle cx="102" cy="24" r="4" fill="#EF4444" />

  <!-- Short Black Hour Hand -->
  <polygon points="60,60 62,63 26,38 28,34" fill="#1E293B" filter="url(#handShadow)" />
  <circle cx="28" cy="37" r="3.5" fill="#475569" />

  <!-- Straight Brass Indicator Needle -->
  <polygon points="60,60 58,61 60,105 62,61" fill="#D97706" filter="url(#handShadow)" />

  <!-- Center Brass Axle Nut -->
  <circle cx="60" cy="60" r="10" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" filter="url(#handShadow)" />
  <circle cx="60" cy="60" r="4" fill="#451A03" />
  <circle cx="58" cy="58" r="2" fill="#FEF08A" />
</svg>