<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ingBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="ingDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Door Escutcheon Backplate -->
  <rect x="25" y="15" width="26" height="90" rx="6" fill="url(#ingBrass)" stroke="#78350F" stroke-width="1.5" filter="url(#ingDrop)" />
  <!-- Screw holes -->
  <circle cx="38" cy="25" r="2.5" fill="#451A03" />
  <circle cx="38" cy="95" r="2.5" fill="#451A03" />
  <!-- Keyhole -->
  <circle cx="38" cy="72" r="3.5" fill="#451A03" />
  <polygon points="36,72 40,72 41,82 35,82" fill="#451A03" />

  <!-- Round Knob -->
  <circle cx="38" cy="48" r="14" fill="url(#ingBrass)" stroke="#92400E" stroke-width="2" filter="url(#ingDrop)" />
  <circle cx="34" cy="44" r="5" fill="#FEF08A" opacity="0.8" />

  <!-- Butterfly Hinge Right -->
  <rect x="75" y="30" width="30" height="60" rx="3" fill="#78350F" stroke="#451A03" stroke-width="1.5" filter="url(#ingDrop)" />
  <rect x="88" y="25" width="4" height="70" rx="2" fill="#D97706" />
  <circle cx="82" cy="42" r="2.5" fill="#FDE68A" />
  <circle cx="82" cy="78" r="2.5" fill="#FDE68A" />
  <circle cx="98" cy="42" r="2.5" fill="#FDE68A" />
  <circle cx="98" cy="78" r="2.5" fill="#FDE68A" />
</svg>