<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gearAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="gearTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="pairShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Mounting Plate Background -->
  <rect x="20" y="20" width="240" height="160" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#pairShadow)" />
  <!-- Plate Corner Screws -->
  <circle cx="35" cy="35" r="4" fill="#78350F" />
  <circle cx="245" cy="35" r="4" fill="#78350F" />
  <circle cx="35" cy="165" r="4" fill="#78350F" />
  <circle cx="245" cy="165" r="4" fill="#78350F" />

  <!-- Large Left Gear (10-tooth, cx: 95, cy: 100, r: 55) -->
  <g filter="url(#pairShadow)">
    <circle cx="95" cy="100" r="52" fill="url(#gearAmber)" stroke="#78350F" stroke-width="2" />
    <!-- 8 teeth perimeter blocks -->
    <rect x="87" y="40" width="16" height="12" rx="2" fill="#D97706" />
    <rect x="87" y="148" width="16" height="12" rx="2" fill="#D97706" />
    <rect x="35" y="92" width="12" height="16" rx="2" fill="#D97706" />
    <rect x="143" y="92" width="12" height="16" rx="2" fill="#D97706" />
    <rect x="52" y="57" width="14" height="14" rx="2" transform="rotate(45 59 64)" fill="#D97706" />
    <rect x="124" y="129" width="14" height="14" rx="2" transform="rotate(45 131 136)" fill="#D97706" />
    <rect x="52" y="129" width="14" height="14" rx="2" transform="rotate(-45 59 136)" fill="#D97706" />
    <rect x="124" y="57" width="14" height="14" rx="2" transform="rotate(-45 131 64)" fill="#D97706" />

    <circle cx="95" cy="100" r="32" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.6" />
    <!-- Cutouts -->
    <circle cx="95" cy="76" r="6" fill="#78350F" opacity="0.8" />
    <circle cx="95" cy="124" r="6" fill="#78350F" opacity="0.8" />
    <circle cx="71" cy="100" r="6" fill="#78350F" opacity="0.8" />
    <circle cx="119" cy="100" r="6" fill="#78350F" opacity="0.8" />
    <!-- Brass Pivot -->
    <circle cx="95" cy="100" r="14" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" />
    <circle cx="95" cy="100" r="6" fill="#451A03" />
  </g>

  <!-- Small Right Gear (Interlocking at x: 145, cx: 185, cy: 100, r: 38) -->
  <g filter="url(#pairShadow)">
    <circle cx="185" cy="100" r="36" fill="url(#gearTeal)" stroke="#064E3B" stroke-width="2" />
    <!-- 6 teeth -->
    <rect x="179" y="58" width="12" height="10" rx="2" fill="#10B981" />
    <rect x="179" y="132" width="12" height="10" rx="2" fill="#10B981" />
    <rect x="144" y="94" width="10" height="12" rx="2" fill="#10B981" />
    <rect x="216" y="94" width="10" height="12" rx="2" fill="#10B981" />
    <rect x="156" y="70" width="10" height="10" rx="2" transform="rotate(45 161 75)" fill="#10B981" />
    <rect x="204" y="118" width="10" height="10" rx="2" transform="rotate(45 209 123)" fill="#10B981" />

    <circle cx="185" cy="100" r="22" fill="none" stroke="#A7F3D0" stroke-width="1.5" opacity="0.7" />
    <!-- Brass Pivot -->
    <circle cx="185" cy="100" r="12" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" />
    <circle cx="185" cy="100" r="5" fill="#451A03" />
  </g>
</svg>