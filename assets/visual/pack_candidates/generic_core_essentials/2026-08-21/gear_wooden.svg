<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="gearWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <radialGradient id="gearDrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.3)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="gShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <ellipse cx="90" cy="95" rx="75" ry="75" fill="url(#gearDrop)" opacity="0.4" />

  <!-- 8-Tooth Gear Path -->
  <g filter="url(#gShadow)">
    <path d="
      M 80,15 L 100,15 L 102,32 A 65 65 0 0 1 123,41 L 137,29 L 151,43 L 139,57 A 65 65 0 0 1 148,78 L 165,80 L 165,100 L 148,102 A 65 65 0 0 1 139,123 L 151,137 L 137,151 L 123,139 A 65 65 0 0 1 102,148 L 100,165 L 80,165 L 78,148 A 65 65 0 0 1 57,139 L 43,151 L 29,137 L 41,123 A 65 65 0 0 1 32,102 L 15,100 L 15,80 L 32,78 A 65 65 0 0 1 41,57 L 29,43 L 43,29 L 57,41 A 65 65 0 0 1 78,32 Z"
      fill="url(#gearWood)" stroke="#78350F" stroke-width="2" />
    
    <!-- Outer Bevel Ring -->
    <circle cx="90" cy="90" r="50" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.6" />

    <!-- 4 Circular Weight-Relief Cutouts -->
    <circle cx="90" cy="55" r="10" fill="#78350F" opacity="0.85" />
    <circle cx="90" cy="125" r="10" fill="#78350F" opacity="0.85" />
    <circle cx="55" cy="90" r="10" fill="#78350F" opacity="0.85" />
    <circle cx="125" cy="90" r="10" fill="#78350F" opacity="0.85" />

    <!-- Center Hub & Axle Hole -->
    <circle cx="90" cy="90" r="22" fill="#B45309" stroke="#78350F" stroke-width="1.5" />
    <circle cx="90" cy="90" r="14" fill="#451A03" />
    <circle cx="87" cy="87" r="4" fill="#FDE68A" opacity="0.7" />
  </g>
</svg>