<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="100%" height="100%">
  <defs>
    <linearGradient id="plateRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="plateWellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="plateFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.25)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <ellipse cx="110" cy="95" rx="95" ry="14" fill="url(#plateFloorShadow)" />

  <!-- Outer Plate Rim -->
  <ellipse cx="110" cy="55" rx="95" ry="38" fill="url(#plateRimGrad)" filter="url(#plateShadow)" />

  <!-- Delicate Decorative Pastel Teal Accent Ring -->
  <ellipse cx="110" cy="55" rx="80" ry="31" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.7" />

  <!-- Inner Dished Plate Well -->
  <ellipse cx="110" cy="57" rx="68" ry="24" fill="url(#plateWellGrad)" />
  <ellipse cx="110" cy="58" rx="60" ry="20" fill="#F8FAFC" />

  <!-- Specular Ceramic Gloss Glints -->
  <path d="M 50,45 Q 110,32 170,45" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="65" cy="52" rx="10" ry="3" fill="#FFFFFF" opacity="0.8" />
</svg>