<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%">
  <defs>
    <radialGradient id="stackDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.3)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <ellipse cx="110" cy="185" rx="90" ry="10" fill="url(#stackDropShadow)" />

  <!-- Book 1 (Bottom, Crimson Cloth - Large) -->
  <g filter="url(#bookShadow)">
    <rect x="25" y="145" width="170" height="32" rx="4" fill="#991B1B" />
    <rect x="35" y="148" width="156" height="26" rx="2" fill="#FEF3C7" />
    <!-- Spine Left -->
    <rect x="25" y="145" width="18" height="32" rx="3" fill="#B91C1C" />
    <!-- Gold Spine Ribs -->
    <line x1="25" y1="152" x2="43" y2="152" stroke="#FDE047" stroke-width="1.5" />
    <line x1="25" y1="168" x2="43" y2="168" stroke="#FDE047" stroke-width="1.5" />
  </g>

  <!-- Book 2 (Teal Linen, Slightly Angled) -->
  <g transform="rotate(-2 110 125)" filter="url(#bookShadow)">
    <rect x="32" y="115" width="155" height="28" rx="4" fill="#0D9488" />
    <rect x="42" y="118" width="141" height="22" rx="2" fill="#F8FAFC" />
    <rect x="32" y="115" width="16" height="28" rx="3" fill="#14B8A6" />
    <line x1="32" y1="122" x2="48" y2="122" stroke="#CCFBF1" stroke-width="1.5" />
    <line x1="32" y1="135" x2="48" y2="135" stroke="#CCFBF1" stroke-width="1.5" />
  </g>

  <!-- Book 3 (Golden Honey Leather) -->
  <g transform="rotate(3 110 90)" filter="url(#bookShadow)">
    <rect x="40" y="85" width="140" height="26" rx="4" fill="#D97706" />
    <rect x="50" y="88" width="126" height="20" rx="2" fill="#FEF3C7" />
    <rect x="40" y="85" width="15" height="26" rx="3" fill="#F59E0B" />
    <circle cx="47.5" cy="98" r="3" fill="#FEF08A" />
  </g>

  <!-- Book 4 (Top, Indigo Pocket Book) -->
  <g transform="rotate(-1 110 65)" filter="url(#bookShadow)">
    <rect x="52" y="55" width="115" height="26" rx="4" fill="#312E81" />
    <rect x="60" y="58" width="103" height="20" rx="2" fill="#FFFBEB" />
    <rect x="52" y="55" width="14" height="26" rx="3" fill="#4338CA" />
    <!-- Ribbon bookmark tail extending out -->
    <path d="M 155,68 Q 170,85 180,120 L 174,122 Q 165,85 152,70 Z" fill="#EF4444" />
  </g>
</svg>