<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="coverBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <radialGradient id="bookDropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.25)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </radialGradient>
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <ellipse cx="140" cy="165" rx="120" ry="10" fill="url(#bookDropShadow)" />

  <!-- Hardcover Base Edges -->
  <path d="M 18,145 Q 140,165 262,145 L 265,152 Q 140,172 15,152 Z" fill="url(#coverBlue)" />

  <!-- Stacked Page Thickness Layers -->
  <path d="M 22,140 Q 140,158 258,140 L 260,146 Q 140,164 20,146 Z" fill="#E2E8F0" />
  <path d="M 24,136 Q 140,154 256,136 L 258,141 Q 140,159 22,141 Z" fill="#F1F5F9" />

  <!-- Left Open Page (Curved arc) -->
  <path d="M 140,145 Q 80,150 25,130 Q 25,35 80,25 Q 120,20 140,35 Z" fill="url(#pageGrad)" filter="url(#pageShadow)" />

  <!-- Right Open Page (Curved arc) -->
  <path d="M 140,145 Q 200,150 255,130 Q 255,35 200,25 Q 160,20 140,35 Z" fill="url(#pageGrad)" filter="url(#pageShadow)" />

  <!-- Center Gutter Shadow -->
  <path d="M 136,35 L 136,145 L 144,145 L 144,35 Z" fill="rgba(120,53,15,0.2)" />

  <!-- Left Page Content: Abstract Soft Illustration Shapes (No text) -->
  <!-- Sun & Hill -->
  <circle cx="65" cy="55" r="14" fill="#FDE047" opacity="0.8" />
  <path d="M 35,115 Q 65,75 105,115 Z" fill="#86EFAC" />
  <path d="M 75,120 Q 105,85 130,120 Z" fill="#4ADE80" />
  <circle cx="85" cy="80" r="5" fill="#FB7185" />

  <!-- Right Page Content: Abstract Decorative Picture Motif (No text) -->
  <path d="M 175,60 Q 200,40 225,60 Q 245,85 200,120 Q 155,85 175,60 Z" fill="#F472B6" opacity="0.75" />
  <circle cx="200" cy="78" r="8" fill="#FBBF24" />
  <circle cx="170" cy="100" r="3" fill="#60A5FA" />
  <circle cx="230" cy="100" r="3" fill="#60A5FA" />

  <!-- Ribbon Bookmark -->
  <path d="M 140,35 Q 148,80 155,160 L 145,158 Q 140,80 138,35 Z" fill="#DC2626" />
</svg>