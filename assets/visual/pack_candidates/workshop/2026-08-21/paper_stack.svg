<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <filter id="pap-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="stack-base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EDE4D4"/>
    <stop offset="100%" stop-color="#C8B89E"/>
  </linearGradient>
  <linearGradient id="sheet-top" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="85%" stop-color="#FAF6EE"/>
    <stop offset="100%" stop-color="#EDE2CE"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="200" cy="240" rx="150" ry="25" fill="#241B12" opacity="0.22" filter="url(#pap-sh)"/>
<ellipse cx="200" cy="238" rx="120" ry="10" fill="#140D07" opacity="0.35"/>

<!-- Thick Stack Body (Ream of heavy watercolor paper) -->
<polygon points="75,130 325,120 335,225 85,235" fill="url(#stack-base)" stroke="#A6947C" stroke-width="2"/>

<!-- Individual Layer Stepped Lines on Edge -->
<g stroke="#96826A" stroke-width="1.5">
  <line x1="83" y1="150" x2="333" y2="140"/>
  <line x1="81" y1="170" x2="331" y2="160"/>
  <line x1="79" y1="190" x2="329" y2="180"/>
  <line x1="77" y1="210" x2="327" y2="200"/>
</g>

<!-- Top Active Drawing Sheet (Crisp cream paper with curled top-right corner) -->
<g>
  <polygon points="70,120 305,110 325,135 320,225 65,225" fill="url(#sheet-top)" stroke="#BDB09A" stroke-width="2"/>
  <!-- Folded / Curled Corner Top-Right -->
  <polygon points="305,110 325,135 305,135" fill="#E6D6C0" stroke="#BDB09A" stroke-width="1.5"/>
  <!-- Graphite Meadow / Sun Sketch on Top Sheet -->
  <path d="M 120,185 C 150,160 190,200 230,165 C 250,180 270,160 280,175" stroke="#8D7E6C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"/>
  <circle cx="160" cy="150" r="12" stroke="#8D7E6C" stroke-width="2" fill="none" opacity="0.5"/>
  <line x1="160" y1="132" x2="160" y2="126" stroke="#8D7E6C" stroke-width="1.5" opacity="0.5"/>
  <line x1="178" y1="150" x2="184" y2="150" stroke="#8D7E6C" stroke-width="1.5" opacity="0.5"/>
</g>
</svg>