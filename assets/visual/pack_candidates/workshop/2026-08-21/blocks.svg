<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <filter id="bl-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<!-- Ground Shadow -->
<ellipse cx="200" cy="270" rx="140" ry="16" fill="#241B12" opacity="0.20" filter="url(#bl-sh)"/>
<ellipse cx="200" cy="268" rx="100" ry="9" fill="#140D07" opacity="0.35"/>

<!-- Base Green Arch Block -->
<path d="M 110,268 L 110,190 L 290,190 L 290,268 L 245,268 C 245,225 155,225 155,268 Z" fill="#43A047" stroke="#2E7D32" stroke-width="3"/>
<path d="M 110,190 L 290,190" stroke="#A5D6A7" stroke-width="3" opacity="0.8"/>

<!-- Red Cube (Center Left) -->
<rect x="135" y="115" width="70" height="75" rx="4" fill="#E53935" stroke="#C62828" stroke-width="3"/>
<line x1="137" y1="117" x2="203" y2="117" stroke="#FFCDD2" stroke-width="3" opacity="0.8"/>

<!-- Yellow Cylinder (Center Right) -->
<rect x="220" y="115" width="55" height="75" rx="8" fill="#FDD835" stroke="#F9A825" stroke-width="3"/>
<ellipse cx="247.5" cy="120" rx="27.5" ry="8" fill="#FFF59D"/>

<!-- Blue Triangular Prism (Top) -->
<polygon points="170,115 240,40 310,115" fill="#1E88E5" stroke="#1565C0" stroke-width="3"/>
<line x1="240" y1="42" x2="173" y2="114" stroke="#90CAF9" stroke-width="3" opacity="0.8"/>
</svg>