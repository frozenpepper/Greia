<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430">
<defs>
  <filter id="wb-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="oak-top" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E2B278"/>
    <stop offset="35%" stop-color="#C68E54"/>
    <stop offset="100%" stop-color="#8E5828"/>
  </linearGradient>
  <linearGradient id="oak-leg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A66C38"/>
    <stop offset="50%" stop-color="#7E4A1E"/>
    <stop offset="100%" stop-color="#582C0E"/>
  </linearGradient>
  <linearGradient id="oak-drawer" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#BA8048"/>
    <stop offset="100%" stop-color="#7C4A1E"/>
  </linearGradient>
  <linearGradient id="brass-knob" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFE888"/>
    <stop offset="60%" stop-color="#CFA034"/>
    <stop offset="100%" stop-color="#785012"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadow -->
<ellipse cx="350" cy="405" rx="260" ry="20" fill="#24180E" opacity="0.22" filter="url(#wb-sh)"/>
<ellipse cx="350" cy="403" rx="200" ry="10" fill="#140A04" opacity="0.38"/>

<!-- Back Legs -->
<polygon points="175,190 155,395 190,395 205,190" fill="#582C0E"/>
<polygon points="525,190 545,395 510,395 495,190" fill="#582C0E"/>
<!-- Back Cross Stretcher -->
<rect x="170" y="325" width="360" height="22" rx="4" fill="#46220A"/>

<!-- Front Legs (Splayed Craftsman Joinery) -->
<polygon points="120,180 95,400 145,400 165,180" fill="url(#oak-leg)"/>
<polygon points="580,180 605,400 555,400 535,180" fill="url(#oak-leg)"/>
<!-- Front Lower Tool Stretcher / Footrest -->
<rect x="115" y="335" width="470" height="26" rx="5" fill="url(#oak-top)"/>
<line x1="115" y1="335" x2="585" y2="335" stroke="#FFE0A0" stroke-width="2" opacity="0.8"/>

<!-- Center Storage Drawer Box & Drawer Face -->
<rect x="200" y="195" width="300" height="95" rx="8" fill="#4E280C"/>
<rect x="210" y="202" width="280" height="80" rx="6" fill="url(#oak-drawer)" stroke="#4A260A" stroke-width="2.5"/>
<!-- Brass Turned Knob -->
<circle cx="350" cy="242" r="13" fill="url(#brass-knob)"/>
<circle cx="350" cy="242" r="5" fill="#FFE888" opacity="0.8"/>

<!-- Thick Bevel-Edged Workbench Top Slab -->
<rect x="60" y="125" width="580" height="65" rx="14" fill="url(#oak-top)" stroke="#6A3C16" stroke-width="3"/>
<!-- Sunlit Top Surface Chamfer -->
<path d="M 72,132 L 628,132" stroke="#FFF0C0" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
<line x1="60" y1="188" x2="640" y2="188" stroke="#3A1C06" stroke-width="3"/>
</svg>