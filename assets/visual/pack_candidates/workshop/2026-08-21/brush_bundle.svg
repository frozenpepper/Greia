<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
<defs>
  <filter id="br-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#CFD8DC"/>
    <stop offset="50%" stop-color="#ECEFF1"/>
    <stop offset="100%" stop-color="#90A4AE"/>
  </linearGradient>
  <linearGradient id="handle-wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C28E54"/>
    <stop offset="50%" stop-color="#9E6838"/>
    <stop offset="100%" stop-color="#6E4018"/>
  </linearGradient>
  <linearGradient id="band-strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8D5528"/>
    <stop offset="50%" stop-color="#6D3814"/>
    <stop offset="100%" stop-color="#4A2208"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="150" cy="375" rx="85" ry="16" fill="#241B12" opacity="0.22" filter="url(#br-sh)"/>
<ellipse cx="150" cy="373" rx="60" ry="8" fill="#140D07" opacity="0.38"/>

<!-- Clustered Brush Handles (5 brushes tightly bundled) -->
<!-- Back Left Brush (Green tip) -->
<g transform="translate(130, 25) rotate(-10)">
  <polygon points="5,110 15,110 13,340 7,340" fill="url(#handle-wood)"/>
  <rect x="3" y="70" width="14" height="40" rx="2" fill="url(#ferrule)"/>
  <path d="M 3,70 C 1,35 10,20 10,20 C 10,20 19,35 17,70 Z" fill="#43A047"/>
  <path d="M 8,20 C 9,35 10,50 10,60" stroke="#C8E6C9" stroke-width="1.5" fill="none"/>
</g>

<!-- Back Right Brush (Purple tip) -->
<g transform="translate(150, 25) rotate(10)">
  <polygon points="5,110 15,110 13,340 7,340" fill="url(#handle-wood)"/>
  <rect x="3" y="70" width="14" height="40" rx="2" fill="url(#ferrule)"/>
  <path d="M 3,70 C 1,35 10,20 10,20 C 10,20 19,35 17,70 Z" fill="#8E24AA"/>
  <path d="M 8,20 C 9,35 10,50 10,60" stroke="#E1BEE7" stroke-width="1.5" fill="none"/>
</g>

<!-- Front Left Brush (Red tip) -->
<g transform="translate(125, 45) rotate(-5)">
  <polygon points="6,110 18,110 16,320 8,320" fill="url(#handle-wood)"/>
  <rect x="4" y="65" width="16" height="45" rx="2" fill="url(#ferrule)"/>
  <path d="M 4,65 C 2,30 12,10 12,10 C 12,10 22,30 20,65 Z" fill="#E53935"/>
  <path d="M 10,10 C 11,25 12,40 12,55" stroke="#FFCDD2" stroke-width="1.5" fill="none"/>
</g>

<!-- Front Right Brush (Yellow tip) -->
<g transform="translate(155, 45) rotate(5)">
  <polygon points="6,110 18,110 16,320 8,320" fill="url(#handle-wood)"/>
  <rect x="4" y="65" width="16" height="45" rx="2" fill="url(#ferrule)"/>
  <path d="M 4,65 C 2,30 12,10 12,10 C 12,10 22,30 20,65 Z" fill="#FDD835"/>
  <path d="M 10,10 C 11,25 12,40 12,55" stroke="#FFF9C4" stroke-width="1.5" fill="none"/>
</g>

<!-- Center Tall Hero Brush (Ultramarine Blue tip) -->
<g transform="translate(140, 10)">
  <polygon points="7,110 21,110 19,355 9,355" fill="url(#handle-wood)"/>
  <rect x="5" y="60" width="18" height="50" rx="2" fill="url(#ferrule)"/>
  <path d="M 5,60 C 3,20 14,0 14,0 C 14,0 25,20 23,60 Z" fill="#1E88E5"/>
  <path d="M 12,0 C 13,18 14,35 14,50" stroke="#BBDEFB" stroke-width="2" fill="none"/>
</g>

<!-- Leather / Twine Binding Strap around the bundle -->
<g transform="translate(105, 235)">
  <rect x="0" y="0" width="90" height="28" rx="6" fill="url(#band-strap)" stroke="#381804" stroke-width="2"/>
  <ellipse cx="45" cy="14" rx="42" ry="12" fill="none" stroke="#D4A06A" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Brass Buckle Stud -->
  <circle cx="45" cy="14" r="5" fill="#FFE082" stroke="#B28020" stroke-width="1.5"/>
</g>
</svg>