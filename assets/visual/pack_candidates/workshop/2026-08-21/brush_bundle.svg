<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
<defs>
  <filter id="br-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#CFD8DC"/>
    <stop offset="50%" stop-color="#ECEFF1"/>
    <stop offset="100%" stop-color="#90A4AE"/>
  </linearGradient>
  <linearGradient id="handle-wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B57C48"/>
    <stop offset="50%" stop-color="#8D5528"/>
    <stop offset="100%" stop-color="#5C3212"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="150" cy="375" rx="80" ry="14" fill="#241B12" opacity="0.20" filter="url(#br-sh)"/>

<!-- Brush 1 (Red Tip, angled left) -->
<g transform="translate(110, 20) rotate(-12 150 200)">
  <polygon points="146,140 154,140 152,350 148,350" fill="url(#handle-wood)"/>
  <rect x="144" y="95" width="12" height="45" rx="2" fill="url(#ferrule)"/>
  <path d="M 144,95 C 142,65 150,45 150,45 C 150,45 158,65 156,95 Z" fill="#D32F2F"/>
  <path d="M 148,45 C 149,55 150,65 150,75" stroke="#FFCDD2" stroke-width="1.5" fill="none"/>
</g>

<!-- Brush 2 (Blue Tip, center tall) -->
<g transform="translate(0, 0)">
  <polygon points="146,120 154,120 152,365 148,365" fill="url(#handle-wood)"/>
  <rect x="144" y="75" width="12" height="45" rx="2" fill="url(#ferrule)"/>
  <path d="M 144,75 C 142,40 150,20 150,20 C 150,20 158,40 156,75 Z" fill="#1976D2"/>
  <path d="M 148,20 C 149,35 150,50 150,60" stroke="#BBDEFB" stroke-width="1.5" fill="none"/>
</g>

<!-- Brush 3 (Yellow Tip, angled right) -->
<g transform="translate(-110, 20) rotate(12 150 200)">
  <polygon points="146,140 154,140 152,350 148,350" fill="url(#handle-wood)"/>
  <rect x="144" y="95" width="12" height="45" rx="2" fill="url(#ferrule)"/>
  <path d="M 144,95 C 142,65 150,45 150,45 C 150,45 158,65 156,95 Z" fill="#FBC02D"/>
  <path d="M 148,45 C 149,55 150,65 150,75" stroke="#FFF9C4" stroke-width="1.5" fill="none"/>
</g>
</svg>