<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
<defs>
  <filter id="pb-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="pb-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F2DEC2"/>
    <stop offset="100%" stop-color="#D6B894"/>
  </linearGradient>
</defs>

<!-- Wall Shadow -->
<rect x="50" y="45" width="410" height="420" rx="10" fill="#241B12" opacity="0.18" filter="url(#pb-sh)"/>

<!-- Main Pegboard Panel -->
<rect x="40" y="35" width="420" height="430" rx="8" fill="url(#pb-wood)" stroke="#7A5630" stroke-width="3.5"/>

<!-- Neat Grid of Peg Holes -->
<g fill="#4A3018">
<circle cx="80" cy="75" r="5"/>
<circle cx="135" cy="75" r="5"/>
<circle cx="190" cy="75" r="5"/>
<circle cx="245" cy="75" r="5"/>
<circle cx="300" cy="75" r="5"/>
<circle cx="355" cy="75" r="5"/>
<circle cx="410" cy="75" r="5"/>
<circle cx="80" cy="130" r="5"/>
<circle cx="135" cy="130" r="5"/>
<circle cx="190" cy="130" r="5"/>
<circle cx="245" cy="130" r="5"/>
<circle cx="300" cy="130" r="5"/>
<circle cx="355" cy="130" r="5"/>
<circle cx="410" cy="130" r="5"/>
<circle cx="80" cy="185" r="5"/>
<circle cx="135" cy="185" r="5"/>
<circle cx="190" cy="185" r="5"/>
<circle cx="245" cy="185" r="5"/>
<circle cx="300" cy="185" r="5"/>
<circle cx="355" cy="185" r="5"/>
<circle cx="410" cy="185" r="5"/>
<circle cx="80" cy="240" r="5"/>
<circle cx="135" cy="240" r="5"/>
<circle cx="190" cy="240" r="5"/>
<circle cx="245" cy="240" r="5"/>
<circle cx="300" cy="240" r="5"/>
<circle cx="355" cy="240" r="5"/>
<circle cx="410" cy="240" r="5"/>
<circle cx="80" cy="295" r="5"/>
<circle cx="135" cy="295" r="5"/>
<circle cx="190" cy="295" r="5"/>
<circle cx="245" cy="295" r="5"/>
<circle cx="300" cy="295" r="5"/>
<circle cx="355" cy="295" r="5"/>
<circle cx="410" cy="295" r="5"/>
<circle cx="80" cy="350" r="5"/>
<circle cx="135" cy="350" r="5"/>
<circle cx="190" cy="350" r="5"/>
<circle cx="245" cy="350" r="5"/>
<circle cx="300" cy="350" r="5"/>
<circle cx="355" cy="350" r="5"/>
<circle cx="410" cy="350" r="5"/>
<circle cx="80" cy="405" r="5"/>
<circle cx="135" cy="405" r="5"/>
<circle cx="190" cy="405" r="5"/>
<circle cx="245" cy="405" r="5"/>
<circle cx="300" cy="405" r="5"/>
<circle cx="355" cy="405" r="5"/>
<circle cx="410" cy="405" r="5"/>
</g>

<!-- Hanging Tools on Wooden Pegs -->
<!-- Hanging Wooden Ruler -->
<g transform="translate(135, 120)">
  <circle cx="0" cy="0" r="7" fill="#CFA034"/>
  <rect x="-10" y="0" width="20" height="160" rx="3" fill="#E8CCA0" stroke="#684218" stroke-width="1.5"/>
  <g stroke="#684218" stroke-width="1">
    <line x1="-10" y1="20" x2="-2" y2="20"/><line x1="-10" y1="40" x2="-2" y2="40"/>
    <line x1="-10" y1="60" x2="-2" y2="60"/><line x1="-10" y1="80" x2="-2" y2="80"/>
    <line x1="-10" y1="100" x2="-2" y2="100"/><line x1="-10" y1="120" x2="-2" y2="120"/>
  </g>
</g>

<!-- Hanging Small Craft Mallet -->
<g transform="translate(300, 125)">
  <circle cx="0" cy="0" r="7" fill="#CFA034"/>
  <!-- Handle -->
  <rect x="-6" y="0" width="12" height="140" rx="3" fill="#A8723C" stroke="#4E2E10" stroke-width="1.5"/>
  <!-- Wooden Head -->
  <rect x="-35" y="15" width="70" height="35" rx="6" fill="#C68E54" stroke="#4E2E10" stroke-width="2"/>
</g>

<!-- Hanging Twine Coil -->
<g transform="translate(245, 240)">
  <circle cx="0" cy="0" r="7" fill="#CFA034"/>
  <ellipse cx="0" cy="45" rx="28" ry="38" fill="none" stroke="#C4A87C" stroke-width="10"/>
  <ellipse cx="0" cy="45" rx="28" ry="38" fill="none" stroke="#9E8256" stroke-width="2" stroke-dasharray="4 3"/>
</g>
</svg>