<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350">
<defs>
  <filter id="pb-note-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="cork-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#DCA86E"/>
    <stop offset="50%" stop-color="#C28C52"/>
    <stop offset="100%" stop-color="#9E6A36"/>
  </linearGradient>
</defs>

<!-- Cork Background Board Fragment -->
<rect x="35" y="35" width="280" height="280" rx="14" fill="url(#cork-bg)" stroke="#6E441E" stroke-width="3"/>
<!-- Cork Texture Specks -->
<g fill="#7A481C" opacity="0.4">
  <circle cx="65" cy="70" r="3"/><circle cx="120" cy="55" r="2.5"/><circle cx="250" cy="80" r="3"/>
  <circle cx="80" cy="270" r="2.5"/><circle cx="280" cy="250" r="3"/><circle cx="170" cy="290" r="2.5"/>
</g>

<!-- Pinned Square Sketch Note (Slightly tilted) -->
<g transform="translate(175, 175) rotate(6) translate(-175, -175)">
  <!-- Note Shadow -->
  <rect x="75" y="75" width="200" height="200" rx="3" fill="#24180E" opacity="0.22" filter="url(#pb-note-sh)"/>
  <!-- Note Paper -->
  <rect x="75" y="75" width="200" height="200" rx="3" fill="#FFFBE6" stroke="#D8CA9C" stroke-width="1.5"/>
  <!-- Child-friendly Star & Smile Doodle -->
  <polygon points="175,120 183,142 206,142 188,156 195,178 175,164 155,178 162,156 144,142 167,142" fill="#FDD835" stroke="#F57F17" stroke-width="2"/>
  <path d="M 155,210 C 165,225 185,225 195,210" stroke="#37474F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Red Pushpin -->
  <ellipse cx="175" cy="80" rx="10" ry="10" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
  <circle cx="172" cy="77" r="3" fill="#FF8A80"/>
</g>
</svg>