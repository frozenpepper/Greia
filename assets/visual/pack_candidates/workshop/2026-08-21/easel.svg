<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650">
<defs>
  <filter id="es-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="easel-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#DCA86C"/>
    <stop offset="50%" stop-color="#B27A42"/>
    <stop offset="100%" stop-color="#78481E"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="225" cy="620" rx="160" ry="20" fill="#241B12" opacity="0.22" filter="url(#es-sh)"/>
<ellipse cx="225" cy="618" rx="110" ry="10" fill="#140D07" opacity="0.38"/>

<!-- Back Strut Leg -->
<polygon points="220,90 230,90 228,615 222,615" fill="#5A3414"/>

<!-- Center Mast Spine -->
<rect x="215" y="45" width="20" height="570" rx="4" fill="#8E5A2A" stroke="#4A280C" stroke-width="2"/>

<!-- Left Splayed A-Leg -->
<polygon points="215,90 230,90 100,620 80,620" fill="url(#easel-wood)" stroke="#4A280C" stroke-width="2.5"/>
<!-- Right Splayed A-Leg -->
<polygon points="220,90 235,90 370,620 350,620" fill="url(#easel-wood)" stroke="#4A280C" stroke-width="2.5"/>

<!-- Lower Horizontal Cross Brace -->
<rect x="115" y="510" width="220" height="18" rx="4" fill="url(#easel-wood)" stroke="#4A280C" stroke-width="2"/>

<!-- Stretched Artist Canvas on Tray -->
<g transform="translate(100, 160)">
  <!-- Canvas Shadow on Mast -->
  <rect x="0" y="0" width="250" height="200" rx="4" fill="#241B12" opacity="0.15" filter="url(#es-sh)"/>
  <!-- Canvas Body -->
  <rect x="0" y="0" width="250" height="200" rx="4" fill="#FAF6EE" stroke="#C4B8A0" stroke-width="2.5"/>
  <!-- Painted Meadow Artwork on Canvas -->
  <path d="M 0,130 C 60,110 120,140 180,120 C 210,110 230,125 250,115 L 250,200 L 0,200 Z" fill="#66BB6A"/>
  <circle cx="190" cy="65" r="22" fill="#FDD835"/>
  <ellipse cx="65" cy="80" rx="25" ry="12" fill="#E0F2FE"/>
</g>

<!-- Adjustable Lower Canvas Shelf Tray -->
<rect x="75" y="355" width="300" height="24" rx="5" fill="url(#easel-wood)" stroke="#4A280C" stroke-width="3"/>
<line x1="80" y1="357" x2="370" y2="357" stroke="#FFE2A8" stroke-width="2.5" opacity="0.8"/>
<!-- Brass Clamping Knob -->
<circle cx="225" cy="367" r="9" fill="#CFA034" stroke="#684210" stroke-width="2"/>
</svg>