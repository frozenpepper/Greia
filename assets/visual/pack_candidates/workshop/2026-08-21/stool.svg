<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450">
<defs>
  <filter id="st-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <linearGradient id="stool-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E2B278"/>
    <stop offset="50%" stop-color="#BF864C"/>
    <stop offset="100%" stop-color="#845224"/>
  </linearGradient>
</defs>

<!-- Ground Shadow -->
<ellipse cx="175" cy="420" rx="110" ry="18" fill="#241B12" opacity="0.22" filter="url(#st-sh)"/>
<ellipse cx="175" cy="418" rx="80" ry="9" fill="#140D07" opacity="0.38"/>

<!-- Rear Leg -->
<polygon points="170,180 180,180 178,410 172,410" fill="#583212"/>

<!-- Leg Cross Stretchers -->
<line x1="105" y1="310" x2="245" y2="310" stroke="#7A481C" stroke-width="12" stroke-linecap="round"/>
<line x1="120" y1="240" x2="230" y2="240" stroke="#7A481C" stroke-width="10" stroke-linecap="round"/>

<!-- Left Splayed Leg -->
<polygon points="120,180 135,180 95,415 80,415" fill="url(#stool-wood)" stroke="#583212" stroke-width="2"/>
<!-- Right Splayed Leg -->
<polygon points="230,180 215,180 255,415 270,415" fill="url(#stool-wood)" stroke="#583212" stroke-width="2"/>

<!-- Circular Dished Seat Slab -->
<ellipse cx="175" cy="180" rx="105" ry="32" fill="url(#stool-wood)" stroke="#583212" stroke-width="3"/>
<ellipse cx="175" cy="176" rx="95" ry="26" fill="#F0C68C"/>
<ellipse cx="175" cy="176" rx="75" ry="18" fill="#E2B278"/>
</svg>