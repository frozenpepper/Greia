<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="ninoBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="229" rx="55" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character">
    <!-- Ear Tufts -->
    <g id="ear_tufts">
      <path d="M84 79 L76 42 L105 68 Z" fill="#92400E" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M151 68 L181 42 L172 79 Z" fill="#92400E" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bean Body -->
    <g id="body">
      <path d="M128 58 C163 58 184 84 182 119 C180 148 190 176 171 199 C159 214 143 220 128 220 C112 220 94 214 84 199 C67 174 76 149 74 120 C72 85 94 58 128 58 Z" fill="url(#ninoBody)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wings -->
    <g id="wings">
      <path d="M82 125 C60 136 59 168 79 184 C87 168 91 147 82 125 Z" fill="#92400E" stroke="#4B372F" stroke-width="2.5"/>
        <path d="M174 125 C196 136 197 168 177 184 C169 168 165 147 174 125 Z" fill="#92400E" stroke="#4B372F" stroke-width="2.5"/>
        <path d="M70 151 Q79 148 85 154 M171 154 Q179 148 187 151" stroke="#D97706" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Belly -->
    <g id="belly">
      <path d="M128 108 C151 108 166 129 163 163 C160 192 146 207 128 207 C109 207 95 191 93 163 C91 132 105 108 128 108 Z" fill="#FEF3C7" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Face Mask -->
    <g id="face_mask">
      <path d="M83 106 C91 81 110 72 128 84 C146 72 166 81 173 106 C162 125 148 132 128 127 C108 132 94 125 83 106 Z" fill="#FFFBEB"/>
    </g>

    <!-- Eyes -->
    <g id="eyes">
      <circle cx="108" cy="108" r="17" fill="#FFFDF7" stroke="#4B372F" stroke-width="1.5"/>
        <circle cx="148" cy="108" r="17" fill="#FFFDF7" stroke="#4B372F" stroke-width="1.5"/>
        <circle cx="108" cy="109" r="9" fill="#342C35"/>
        <circle cx="148" cy="109" r="9" fill="#342C35"/>
        <circle cx="111" cy="106" r="3" fill="#FFFFFF"/>
        <circle cx="151" cy="106" r="3" fill="#FFFFFF"/>
        <circle cx="106" cy="112" r="1.5" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="146" cy="112" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Beak & Smile -->
    <g id="beak">
      <path d="M119 125 L137 125 L128 136 Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.5"/>
        <path d="M112 147 Q128 156 144 147" stroke="#72513F" stroke-width="2.7" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Feet -->
    <g id="feet">
      <path d="M103 211 Q112 202 121 211 Q112 218 103 211Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.5"/>
      <path d="M135 211 Q144 202 153 211 Q144 218 135 211Z" fill="#F59E0B" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Bookish Feather Badge -->
    <g id="badge">
      <path d="M153 166 C164 157 172 162 168 171 C165 178 157 181 150 178 C154 174 155 171 153 166 Z" fill="#14B8A6" stroke="#0F766E" stroke-width="1"/>
    </g>
  </g>
</svg>