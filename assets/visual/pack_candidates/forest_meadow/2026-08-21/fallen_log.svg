<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="log-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="log-bark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9E6638"/>
    <stop offset="50%" stop-color="#6E401E"/>
    <stop offset="100%" stop-color="#3A1C08"/>
  </linearGradient>
  <linearGradient id="log-end" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#DCA470"/>
    <stop offset="60%" stop-color="#A56D42"/>
    <stop offset="100%" stop-color="#6E401E"/>
  </linearGradient>
  <linearGradient id="log-moss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#84CE5A"/>
    <stop offset="100%" stop-color="#24601A"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="200" ry="16" fill="#241B12" opacity="0.20" filter="url(#log-sh)"/>
<ellipse cx="256" cy="226" rx="160" ry="9" fill="#140D07" opacity="0.35"/>

<!-- Log Main Cylinder -->
<path d="M 95,226 C 90,195 92,165 95,145 C 190,140 320,142 435,160 L 440,226 Z" fill="url(#log-bark)"/>

<!-- Log Cut End Face on Left -->
<ellipse cx="95" cy="185" rx="35" ry="42" fill="url(#log-end)"/>
<!-- Growth Rings -->
<ellipse cx="95" cy="185" rx="24" ry="28" fill="none" stroke="#582A0E" stroke-width="2.5"/>
<ellipse cx="95" cy="185" rx="12" ry="14" fill="none" stroke="#582A0E" stroke-width="2"/>
<circle cx="95" cy="185" r="4" fill="#3A1806"/>

<!-- Longitudinal Bark Fissures -->
<g stroke="#240E04" stroke-width="2.5" stroke-linecap="round" fill="none">
  <path d="M 130,165 C 210,160 310,162 420,178"/>
  <path d="M 130,195 C 220,192 320,195 435,208"/>
</g>

<!-- Moss Layer on Top Ridge of Log -->
<path d="M 125,148 C 175,138 260,138 340,145 C 315,155 240,152 185,158 C 150,158 135,152 125,148 Z" fill="url(#log-moss)"/>
<path d="M 345,145 C 375,148 410,154 430,162 C 410,168 380,164 355,160 Z" fill="url(#log-moss)"/>
</svg>