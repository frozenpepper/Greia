<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="fern-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="fern-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#86D654"/>
    <stop offset="45%" stop-color="#4E9E32"/>
    <stop offset="100%" stop-color="#1C5816"/>
  </linearGradient>
  <linearGradient id="fern-stem" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9EE066"/>
    <stop offset="100%" stop-color="#3A721E"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="140" ry="14" fill="#241B12" opacity="0.18" filter="url(#fern-sh)"/>
<ellipse cx="256" cy="226" rx="100" ry="8" fill="#140D07" opacity="0.32"/>

<!-- Arching Fern Fronds with Pinnate Leaflets -->
<g fill="url(#fern-grad)" stroke="url(#fern-stem)" stroke-linecap="round">
  <!-- Left Sprawling Frond -->
  <path d="M 240,226 C 210,180 150,140 70,130 C 120,150 170,185 240,226 Z" stroke-width="1.5"/>
  <path d="M 100,135 L 85,115 L 115,138 Z"/>
  <path d="M 130,145 L 120,120 L 145,150 Z"/>
  <path d="M 165,160 L 160,132 L 180,165 Z"/>

  <!-- Mid-Left Upright Frond -->
  <path d="M 248,226 C 235,160 195,95 140,55 C 185,85 225,145 248,226 Z" stroke-width="2"/>
  <path d="M 160,65 L 145,42 L 175,70 Z"/>
  <path d="M 185,85 L 175,60 L 200,90 Z"/>
  <path d="M 210,115 L 205,88 L 225,120 Z"/>

  <!-- Center Tall Frond -->
  <path d="M 256,226 C 254,145 252,75 256,25 C 262,75 264,145 256,226 Z" stroke-width="2.2"/>
  <path d="M 256,25 L 242,5 L 256,35 Z"/>
  <path d="M 256,55 L 235,38 L 256,65 Z"/>
  <path d="M 256,55 L 277,38 L 256,65 Z"/>
  <path d="M 256,90 L 232,70 L 256,100 Z"/>
  <path d="M 256,90 L 280,70 L 256,100 Z"/>
  <path d="M 256,130 L 228,110 L 256,140 Z"/>
  <path d="M 256,130 L 284,110 L 256,140 Z"/>

  <!-- Mid-Right Upright Frond -->
  <path d="M 264,226 C 277,160 317,95 372,55 C 327,85 287,145 264,226 Z" stroke-width="2"/>
  <path d="M 352,65 L 367,42 L 337,70 Z"/>
  <path d="M 327,85 L 337,60 L 312,90 Z"/>
  <path d="M 302,115 L 307,88 L 287,120 Z"/>

  <!-- Right Sprawling Frond -->
  <path d="M 272,226 C 302,180 362,140 442,130 C 392,150 342,185 272,226 Z" stroke-width="1.5"/>
  <path d="M 412,135 L 427,115 L 397,138 Z"/>
  <path d="M 382,145 L 392,120 L 367,150 Z"/>
  <path d="M 347,160 L 352,132 L 332,165 Z"/>
</g>
</svg>