<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="fl-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="fl-turf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#72D648"/>
    <stop offset="50%" stop-color="#46A82C"/>
    <stop offset="100%" stop-color="#1E6216"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="200" ry="18" fill="#241B12" opacity="0.20" filter="url(#fl-sh)"/>
<ellipse cx="256" cy="226" rx="160" ry="10" fill="#140D07" opacity="0.35"/>

<!-- Lush Meadow Turf Mounds & Blade Clusters -->
<g fill="url(#fl-turf)">
  <!-- Base Turf Cushion -->
  <path d="M 80,226 C 90,180 130,165 170,180 C 210,160 260,160 300,175 C 340,155 400,170 432,226 Z"/>
  <!-- Arching Blades -->
  <path d="M 110,226 C 105,170 85,130 60,105 C 80,135 98,175 108,226 Z"/>
  <path d="M 130,226 C 135,165 125,120 105,85 C 122,125 138,170 140,226 Z"/>
  <path d="M 220,226 C 215,160 190,115 165,80 C 188,120 208,168 218,226 Z"/>
  <path d="M 256,226 C 254,150 248,95 240,55 C 252,105 260,160 258,226 Z"/>
  <path d="M 290,226 C 298,160 320,115 345,80 C 322,120 302,168 292,226 Z"/>
  <path d="M 380,226 C 375,165 385,120 405,85 C 388,125 372,170 370,226 Z"/>
  <path d="M 400,226 C 405,170 425,130 450,105 C 430,135 412,175 402,226 Z"/>
</g>

<!-- Bold Golden Buttercup Blossoms -->
<g id="buttercups" fill="#FFD54F">
  <circle cx="105" cy="85" r="10"/><circle cx="105" cy="85" r="5" fill="#FFFDE7"/>
  <circle cx="165" cy="80" r="11"/><circle cx="165" cy="80" r="5.5" fill="#FFFDE7"/>
  <circle cx="240" cy="55" r="12"/><circle cx="240" cy="55" r="6" fill="#FFFDE7"/>
  <circle cx="345" cy="80" r="11"/><circle cx="345" cy="80" r="5.5" fill="#FFFDE7"/>
  <circle cx="405" cy="85" r="10"/><circle cx="405" cy="85" r="5" fill="#FFFDE7"/>
  <circle cx="195" cy="130" r="9"/><circle cx="195" cy="130" r="4.5" fill="#FFFDE7"/>
  <circle cx="315" cy="130" r="9"/><circle cx="315" cy="130" r="4.5" fill="#FFFDE7"/>
</g>

<!-- Crisp White Daisy Blossoms -->
<g id="daisies">
  <!-- Daisy 1 -->
  <g fill="#FFFFFF">
    <ellipse cx="140" cy="120" rx="4" ry="11"/>
    <ellipse cx="140" cy="120" rx="11" ry="4"/>
    <ellipse cx="140" cy="120" rx="4" ry="11" transform="rotate(45 140 120)"/>
    <ellipse cx="140" cy="120" rx="11" ry="4" transform="rotate(45 140 120)"/>
  </g>
  <circle cx="140" cy="120" r="5.5" fill="#FFA000"/>

  <!-- Daisy 2 -->
  <g fill="#FFFFFF">
    <ellipse cx="370" cy="120" rx="4" ry="11"/>
    <ellipse cx="370" cy="120" rx="11" ry="4"/>
    <ellipse cx="370" cy="120" rx="4" ry="11" transform="rotate(45 370 120)"/>
    <ellipse cx="370" cy="120" rx="11" ry="4" transform="rotate(45 370 120)"/>
  </g>
  <circle cx="370" cy="120" r="5.5" fill="#FFA000"/>

  <!-- Center Daisy -->
  <g fill="#FFFFFF">
    <ellipse cx="256" cy="115" rx="5" ry="13"/>
    <ellipse cx="256" cy="115" rx="13" ry="5"/>
    <ellipse cx="256" cy="115" rx="5" ry="13" transform="rotate(45 256 115)"/>
    <ellipse cx="256" cy="115" rx="13" ry="5" transform="rotate(45 256 115)"/>
  </g>
  <circle cx="256" cy="115" r="6.5" fill="#FFA000"/>
</g>
</svg>