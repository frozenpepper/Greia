<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
<defs>
  <filter id="fl-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <linearGradient id="fl-grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8AE058"/>
    <stop offset="100%" stop-color="#246A18"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="228" rx="180" ry="16" fill="#241B12" opacity="0.18" filter="url(#fl-sh)"/>
<ellipse cx="256" cy="226" rx="140" ry="9" fill="#140D07" opacity="0.32"/>

<!-- Meadow Grass Tufts & Clover -->
<g fill="url(#fl-grass)">
  <path d="M 120,226 C 115,190 98,160 80,140 C 95,168 108,195 118,226 Z"/>
  <path d="M 135,226 C 138,185 130,150 115,125 C 130,155 142,190 145,226 Z"/>
  <path d="M 230,226 C 225,180 205,145 185,120 C 205,150 220,185 228,226 Z"/>
  <path d="M 256,226 C 254,175 250,130 245,95 C 255,135 260,180 258,226 Z"/>
  <path d="M 280,226 C 288,180 305,145 325,120 C 305,150 292,185 285,226 Z"/>
  <path d="M 375,226 C 372,185 382,150 398,125 C 382,155 372,190 370,226 Z"/>
  <path d="M 390,226 C 398,190 415,160 435,140 C 418,168 405,195 395,226 Z"/>
</g>

<!-- Buttercups & Daisies -->
<g id="buttercups" fill="#FFD54F">
  <circle cx="115" cy="125" r="7"/>
  <circle cx="115" cy="125" r="3.5" fill="#FFFDE7"/>
  <circle cx="245" cy="95" r="8"/>
  <circle cx="245" cy="95" r="4" fill="#FFFDE7"/>
  <circle cx="398" cy="125" r="7"/>
  <circle cx="398" cy="125" r="3.5" fill="#FFFDE7"/>
  <circle cx="185" cy="155" r="6"/>
  <circle cx="185" cy="155" r="3" fill="#FFFDE7"/>
  <circle cx="325" cy="155" r="6"/>
  <circle cx="325" cy="155" r="3" fill="#FFFDE7"/>
</g>

<g id="daisies">
  <!-- White Daisy Petals -->
  <g fill="#FFFFFF">
    <ellipse cx="185" cy="120" rx="3.5" ry="9"/>
    <ellipse cx="185" cy="120" rx="9" ry="3.5"/>
    <ellipse cx="325" cy="120" rx="3.5" ry="9"/>
    <ellipse cx="325" cy="120" rx="9" ry="3.5"/>
  </g>
  <circle cx="185" cy="120" r="4" fill="#FFA000"/>
  <circle cx="325" cy="120" r="4" fill="#FFA000"/>
</g>
</svg>