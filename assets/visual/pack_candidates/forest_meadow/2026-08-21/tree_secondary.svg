  <linearGradient id="b-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#58BA4A"/>
    <stop offset="50%" stop-color="#3A9630"/>
    <stop offset="100%" stop-color="#1A621C"/>
  </linearGradient>
  <linearGradient id="b-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#AEE676"/>
    <stop offset="50%" stop-color="#72CE54"/>
    <stop offset="100%" stop-color="#3E9E34"/>
  </linearGradient>
</defs>

