<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="w-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="w-bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8C5832"/>
    <stop offset="50%" stop-color="#5A3416"/>
    <stop offset="100%" stop-color="#321606"/>
  </linearGradient>
  <linearGradient id="w-fol-deep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E5224"/>
    <stop offset="100%" stop-color="#08220A"/>
  </linearGradient>
  <linearGradient id="w-fol-mid" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#64B850"/>
    <stop offset="55%" stop-color="#3E8E30"/>
    <stop offset="100%" stop-color="#1C5C1E"/>
  </linearGradient>
  <linearGradient id="w-fol-sun" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#B8F07C"/>
    <stop offset="50%" stop-color="#7ADB5A"/>
    <stop offset="100%" stop-color="#46AC3A"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="460" rx="140" ry="18" fill="#241B12" opacity="0.20" filter="url(#w-sh)"/>
<ellipse cx="256" cy="456" rx="100" ry="10" fill="#140D07" opacity="0.38"/>

<!-- Stout Gnarled Willow Trunk with Sprawling Buttresses -->
<path d="M 180,456 C 200,452 215,420 220,360 C 224,310 215,250 200,200
         C 220,210 240,215 256,215 C 272,215 292,210 312,200
         C 297,250 288,310 292,360 C 297,420 312,452 332,456 Z" fill="url(#w-bark)"/>
<path d="M 230,380 C 235,320 240,260 232,210" stroke="#1A0701" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="M 270,380 C 265,320 262,260 270,210" stroke="#1A0701" stroke-width="3" stroke-linecap="round" fill="none"/>

<!-- Deep Background Under-Canopy -->
<path d="M 100,180 C 80,100 160,50 256,45 C 352,50 432,100 412,180 C 370,260 300,240 256,220 C 212,240 142,260 100,180 Z" fill="url(#w-fol-deep)"/>

<!-- Cascading Drooping Fronds (Left Tier) -->
<g fill="url(#w-fol-mid)">
  <path d="M 90,170 C 85,250 110,330 130,380 C 145,340 140,260 135,170 Z"/>
  <path d="M 140,160 C 145,240 165,310 180,360 C 190,320 185,240 175,160 Z"/>
  <path d="M 180,150 C 190,230 205,300 220,340 C 230,290 225,220 215,150 Z"/>
</g>

<!-- Cascading Drooping Fronds (Right Tier) -->
<g fill="url(#w-fol-mid)">
  <path d="M 422,170 C 427,250 402,330 382,380 C 367,340 372,260 377,170 Z"/>
  <path d="M 372,160 C 367,240 347,310 332,360 C 322,320 327,240 337,160 Z"/>
  <path d="M 332,150 C 322,230 307,300 292,340 C 282,290 287,220 297,150 Z"/>
</g>

<!-- Crown Crests & Cascading Sunlit Tips -->
<g fill="url(#w-fol-sun)">
  <ellipse cx="256" cy="110" rx="140" ry="65"/>
  <path d="M 115,175 C 110,230 125,290 135,330 C 145,290 142,230 138,175 Z"/>
  <path d="M 397,175 C 402,230 387,290 377,330 C 367,290 370,230 374,175 Z"/>
</g>
</svg>