<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <filter id="h-sh-v3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <linearGradient id="h-bark-v3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9E5E32"/>
    <stop offset="30%" stop-color="#7B4520"/>
    <stop offset="70%" stop-color="#552B10"/>
    <stop offset="100%" stop-color="#351605"/>
  </linearGradient>
  <linearGradient id="cavity-falloff-v3" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#241005"/>
    <stop offset="35%" stop-color="#120501"/>
    <stop offset="100%" stop-color="#020000"/>
  </linearGradient>
  <linearGradient id="h-fol-deep-v3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#184C1C"/>
    <stop offset="100%" stop-color="#08220A"/>
  </linearGradient>
  <linearGradient id="h-fol-mid-v3" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#4EAC42"/>
    <stop offset="55%" stop-color="#32882A"/>
    <stop offset="100%" stop-color="#16561A"/>
  </linearGradient>
  <linearGradient id="h-fol-sun-v3" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#98D46E"/>
    <stop offset="50%" stop-color="#5EBA44"/>
    <stop offset="100%" stop-color="#32862A"/>
  </linearGradient>
</defs>

<!-- Ground Contact Shadows -->
<ellipse cx="256" cy="460" rx="175" ry="20" fill="#241B12" opacity="0.22" filter="url(#h-sh-v3)"/>
<ellipse cx="256" cy="456" rx="135" ry="12" fill="#140D07" opacity="0.38"/>

