# ALIAS DECISION (main agent): one drawing per animal. prop.vocab.{cat, dog, bear, frog, mouse, butterfly, snail, turtle, whale, octopus, crab} deliberately declare the SAME source+output as the
# creature default variant (the builder allows identical source/output/size across IDs; nothing is rendered twice): cat->creature.pet.kitten, dog->creature.pet.puppy, bear->creature.woodland.bear, frog->creature.woodland.frog, mouse->creature.woodland.mouse, butterfly->creature.woodland.butterfly, snail->creature.woodland.snail, turtle->creature.marine.turtle, whale->creature.marine.whale, octopus->creature.marine.octopus, crab->creature.marine.crab.
# HUD: icon.hud.broom is an alias of the shipped icon.hud.clear (consumers map the noun; no second file).

# art-props catalogue entries for assets/catalog/shared_visuals_v1_source.toml (append under [[visuals]]).
# Sources: assets/visual/props/<family>/v0.1/*.svg ; runtime: assets/visual/runtime/v1/props/<family>/*.png (rendered with rsvg-convert at the declared size).
# Evidence: SOURCE + DESKTOP VISUAL REVIEW (contact sheet ~/.cache/greia-art-review/art-props.png). Not yet consumed by any Activity.
# Baked contact shadow: vocab/food/everyday/instrument and grounded nature props. NO baked shadow: prop.blocks.* (they stack; tight canvas = block bounds),
#   prop.shape.* (flower heads/stamps, centred), sky nature props (sun, cloud, raindrop, snowflake, rainbow), moon/star/kite/umbrella.
# prop.vocab alias map (one picture per noun; consumers map nouns to these IDs, no duplicate art):
#   sun/sole -> prop.nature.sun; apple/mela, fish/pesce, strawberry/fragola, banana, carrot/carota, cherry/ciliegia, cookie/biscotto,
#   cupcake, chocolate/cioccolato, milk/latte, blueberry/mirtillo -> prop.food.*; sock/calzino, book/libro, ball/palla, spoon/cucchiaio,
#   leaf/foglia, duck/anatra, key/chiave, stone/sasso, shell/conchiglia, cup/tazza, pencil/matita, feather/piuma -> prop.everyday.*;
#   flower/fiore, mushroom/fungo, acorn/ghianda, cloud/nuvola, rainbow/arcobaleno, snowflake, raindrop/goccia -> prop.nature.*;
#   heart/cuore, star (flat) -> prop.shape.* ; drum/tamburo, bells, trumpet -> prop.instrument.*.

