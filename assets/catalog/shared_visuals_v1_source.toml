# art-biomes — W1 layered biome scene kits + wallpapers (2026-10-15).
# Format: assets/catalog/shared_visuals_v1_source.toml. All 1024x600; base layers (sky/water/wall/wallpaper) opaque,
# other layers transparent and meant to be stacked in the listed order: sky -> [stars] -> far -> mid -> ground -> [foreground].
# indoor_room: one wall_* (opaque) + one floor_* (floor owns y >= 432). stage: wall_dark -> boards -> curtains -> valance.
# Interaction-critical area x112-912 kept calm in every layer. Runtime PNGs already rendered with rsvg-convert 2.40.20.

