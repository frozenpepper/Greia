# Greia core semantic icons v1.
#
# IDs, file names and 64/128/256 RGBA PNG sizes are a stable contract:
# saved profiles store avatar IDs and Collections store icon IDs. This
# catalogue is hand-maintained; no tool rewrites it.
#
# Every icon is a flat Greia vector master authored under
# docs/design/GREIA_SVG_AUTHORING_RULES.md (core semantic icon: 256 viewBox,
# transparent, no tile), stored at assets/<source_svg> (assets/source/** is
# excluded from target images). The avatar IDs unicorn/robot/owl/green_monster
# are the canonical cast Lilli/Dani/Leo/Momo (happy state copied verbatim from
# assets/visual/characters/canonical/v0.1); dinosaur and wizard are non-cast
# Bean creatures.
#
# Build the PNGs from the repository root (rsvg-convert >= 2.40, Debian
# librsvg2-bin; the 2026-10-15 renders used 2.40.20):
#
#   python3 tools/build_core_icons.py            # `make assets`
#   python3 tools/build_core_icons.py --check    # `make assets-check`, writes nothing
#
# Review new or changed masters at 256/64/48 on cream and navy (rules
# sections 12/13). History: v1.0.0 was extracted from a glossy raster sheet
# (retired 2026-10-15 with tools/extract_core_icons.py; git history only);
# v1.2.0 retired ten never-referenced IDs (potions, treasure_chest, map,
# coin_bag, cup_trophy, medal, puzzle_trophy, pouch, small_heart, pink_star).
catalog_id = "greia.core-icons.v1"
catalog_version = "1.2.0"

[[icons]]
id = "book"
category = "literacy"
alt_key = "asset.book"
path_64 = "icons/core/v1/64/book.png"
path_128 = "icons/core/v1/128/book.png"
path_256 = "icons/core/v1/256/book.png"
source_svg = "source/icons/core/v1/book.svg"

