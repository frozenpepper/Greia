<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lilli pose_wave: canonical v0.1 paths verbatim; one appendage raised high about its root on the viewer's right with two motion arcs, slight lean, canonical eyes and canonical open smile. Greeting / Activity intro. -->
  <defs>
    <linearGradient id="lilliBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#FFF5E8"/>
      <stop offset="100%" stop-color="#FCE7D6"/>
    </linearGradient>
    <linearGradient id="lilliHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="226" rx="61" ry="10" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character" transform="rotate(3 128 214)">
    <!-- Ears -->
    <g id="ears">
      <path d="M81 78 C67 54 71 38 88 53 C99 62 102 74 99 85 Z" fill="#FFF3E9" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M84 72 C78 59 80 52 87 58 C92 63 94 70 94 77 Z" fill="#FDA4AF"/>
      <path d="M164 79 C174 52 190 43 190 62 C189 73 182 82 171 89 Z" fill="#FFF3E9" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M169 74 C175 61 183 57 182 66 C181 72 177 77 173 80 Z" fill="#FDA4AF"/>
    </g>

    <!-- Golden Horn -->
    <g id="horn">
      <path d="M128 73 L141 26 L151 77 Z" fill="url(#lilliHorn)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M133 55 L145 50 M136 44 L147 40" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Main Puff Body -->
    <g id="body">
      <path d="M128 72 C169 69 196 95 198 133 C199 161 184 188 157 201 C142 209 119 210 101 205 C71 198 55 174 57 142 C59 112 72 91 96 80 C105 75 116 72 128 72 Z" fill="url(#lilliBody)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M76 181 C89 193 99 197 111 198 C109 207 98 210 88 204 C82 200 78 191 76 181 Z" fill="#F7E6D4" opacity="0.65"/>
      <path d="M174 182 C163 196 152 200 140 201 C143 209 155 211 164 203 C169 198 173 190 174 182 Z" fill="#F7E6D4" opacity="0.55"/>
    </g>

    <!-- Hooves -->
    <g id="hooves">
      <ellipse cx="101" cy="207" rx="14" ry="9" fill="#FB7185" stroke="#4B372F" stroke-width="2.5"/>
      <ellipse cx="153" cy="207" rx="14" ry="9" fill="#FB7185" stroke="#4B372F" stroke-width="2.5" transform="translate(53 -92) rotate(-62 153 207)"/>
      <path d="M92 204 C98 201 104 201 111 204" stroke="#FFE4E6" stroke-width="2.5" fill="none"/>
      <path d="M144 204 C150 201 156 201 163 204" stroke="#FFE4E6" stroke-width="2.5" fill="none" transform="translate(53 -92) rotate(-62 153 207)"/>
    </g>

    <!-- Rainbow Forelock Tuft -->
    <g id="forelock">
      <path d="M92 91 C103 66 127 64 146 76 C132 77 119 87 111 100 C104 93 99 90 92 91 Z" fill="#F43F5E" stroke="#4B372F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M111 99 C123 75 150 71 163 88 C148 84 136 93 128 109 C122 104 117 101 111 99 Z" fill="#8B5CF6" stroke="#4B372F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M129 108 C143 87 168 90 174 108 C160 101 149 110 143 124 C139 117 135 112 129 108 Z" fill="#06B6D4" stroke="#4B372F" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Face Panel & Muzzle -->
    <g id="face">
      <ellipse cx="127" cy="146" rx="46" ry="39" fill="#FFFFFF" opacity="0.85"/>
      
      <!-- Cheeks -->
      <g id="cheeks">
        <ellipse cx="90" cy="158" rx="10" ry="6" fill="#FDA4AF" opacity="0.6"/>
        <ellipse cx="166" cy="158" rx="10" ry="6" fill="#FDA4AF" opacity="0.6"/>
      </g>

      <!-- Eyes -->
      <g id="eyes">
        <ellipse cx="108" cy="137" rx="9.5" ry="13" fill="#3E3048"/>
        <ellipse cx="148" cy="137" rx="9.5" ry="13" fill="#3E3048"/>
        <ellipse cx="111" cy="133" rx="3.2" ry="4.2" fill="#FFFFFF"/>
        <ellipse cx="151" cy="133" rx="3.2" ry="4.2" fill="#FFFFFF"/>
        <circle cx="105" cy="142" r="1.5" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="145" cy="142" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      </g>

      <!-- Nose & Mouth -->
      <g id="mouth">
        <path d="M123 153 Q128 157 133 153 Q130 162 128 163 Q126 162 123 153Z" fill="#B66C79"/>
        <path d="M112 163 Q128 182 144 163 Z" fill="#E11D48"/>
        <path d="M118 172 Q128 180 138 172" fill="#FB7185"/>
      </g>
    </g>

    <!-- Flank Star Identity Mark -->
    <g id="flank_star">
      <path d="M175 155 l3.2 6.6 7.3 1.1-5.3 5.2 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.2 7.3-1.1z" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    </g>
  </g>
  <g id="fx" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <path d="M222 100 Q230 114 222 128" fill="none" stroke-width="6.5"/>
    <path d="M222 100 Q230 114 222 128" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
    <path d="M232 92 Q244 114 232 136" fill="none" stroke-width="6.5"/>
    <path d="M232 92 Q244 114 232 136" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
  </g>
</svg>