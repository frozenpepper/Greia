<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dani pose_wave: canonical v0.1 paths verbatim; one appendage raised high about its root on the viewer's right with two motion arcs, slight lean, canonical eyes and canonical open smile. Greeting / Activity intro. -->
  <defs>
    <linearGradient id="daniBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="daniBulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="228" rx="56" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character" transform="rotate(3 128 213)">
    <!-- Top Antenna with Glowing Light Bulb -->
    <g id="antenna">
      <path d="M128 62 L128 34" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="128" cy="28" r="9" fill="url(#daniBulb)" stroke="#4B372F" stroke-width="2.5"/>
      <circle cx="125" cy="25" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Side Jointed Arms -->
    <g id="arms">
      <rect x="52" y="132" width="14" height="26" rx="7" ry="7" fill="#0284C7" stroke="#4B372F" stroke-width="2.5"/>
        <rect x="190" y="132" width="14" height="26" rx="7" ry="7" fill="#0284C7" stroke="#4B372F" stroke-width="2.5" transform="translate(2 -4) rotate(-162 197 136)"/>
    </g>

    <!-- Soft Rounded Robot Casing / Body -->
    <g id="body">
      <rect x="66" y="62" width="124" height="136" rx="34" ry="34" fill="url(#daniBody)" stroke="#4B372F" stroke-width="3.5"/>
      <!-- Subtle top bevel highlight -->
      <path d="M96 68 Q128 64 160 68" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Front Face Display Screen (Cream/Ice White Panel) -->
    <g id="face_screen">
      <rect x="80" y="86" width="96" height="96" rx="20" ry="20" fill="#F8FAFC" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Robot Feet Pads / Rollers -->
    <g id="feet">
      <rect x="94" y="198" width="24" height="15" rx="7" ry="7" fill="#0369A1" stroke="#4B372F" stroke-width="2.5"/>
      <rect x="138" y="198" width="24" height="15" rx="7" ry="7" fill="#0369A1" stroke="#4B372F" stroke-width="2.5"/>
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Soft Pink Cheek Lights -->
      <g id="cheeks">
        <circle cx="94" cy="148" r="6" fill="#FDA4AF" opacity="0.6"/>
        <circle cx="162" cy="148" r="6" fill="#FDA4AF" opacity="0.6"/>
      </g>

      <!-- Digital/Display Eyes -->
      <g id="eyes">
        <ellipse cx="106" cy="132" rx="8.5" ry="12" fill="#0284C7"/>
        <ellipse cx="150" cy="132" rx="8.5" ry="12" fill="#0284C7"/>
        <ellipse cx="109" cy="128" rx="2.8" ry="3.8" fill="#FFFFFF"/>
        <ellipse cx="153" cy="128" rx="2.8" ry="3.8" fill="#FFFFFF"/>
        <circle cx="104" cy="135" r="1.4" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="148" cy="135" r="1.4" fill="#FFFFFF" opacity="0.8"/>
      </g>

      <!-- Digital Smile -->
      <g id="mouth">
        <path d="M114 153 Q128 174 142 153 Z" fill="#0284C7"/>
        <path d="M118 163 Q128 170 138 163" fill="#38BDF8"/>
      </g>
    </g>

    <!-- Side Ear Cogs / Dials -->
    <g id="ear_dials">
      <rect x="58" y="104" width="8" height="18" rx="3" ry="3" fill="#FBBF24" stroke="#4B372F" stroke-width="1.8"/>
      <rect x="190" y="104" width="8" height="18" rx="3" ry="3" fill="#FBBF24" stroke="#4B372F" stroke-width="1.8"/>
    </g>
  </g>
  <g id="fx" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <path d="M220 90 Q228 104 220 118" fill="none" stroke-width="6.5"/>
    <path d="M220 90 Q228 104 220 118" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
    <path d="M230 82 Q242 104 230 126" fill="none" stroke-width="6.5"/>
    <path d="M230 82 Q242 104 230 126" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
  </g>
</svg>