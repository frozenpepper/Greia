<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Flash pose_wave: canonical v0.1 paths verbatim; one appendage raised high about its root on the viewer's right with two motion arcs, slight lean, canonical eyes and canonical open smile. Greeting / Activity intro. -->
  <defs>
    <linearGradient id="flashFur" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="flashShirt" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="flashBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <g id="shadow">
    <ellipse cx="128" cy="227" rx="58" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>

  <g id="character" transform="rotate(3 128 215)">
    <!-- Small Round Rabbit Pom-Pom Tail behind -->
    <g id="tail">
      <circle cx="184" cy="178" r="15" fill="url(#flashFur)" stroke="#4B372F" stroke-width="3"/>
    </g>

    <!-- Long Rabbit Ears -->
    <g id="ears">
      <path d="M88 85 C68 45 62 18 80 14 C98 10 105 38 102 82 Z" fill="url(#flashFur)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M84 75 C74 48 70 26 80 23 C90 20 95 38 95 72 Z" fill="#FDA4AF"/>
        <path d="M154 82 C151 38 158 10 176 14 C194 18 188 45 168 85 Z" fill="url(#flashFur)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M161 72 C161 38 166 20 176 23 C186 26 182 48 172 75 Z" fill="#FDA4AF"/>
    </g>

    <!-- Main White Rabbit Body -->
    <g id="body_fur">
      <path d="M128 68 C168 68 194 94 195 131 C196 163 178 192 153 203 C134 211 110 208 94 201 C67 189 55 164 59 134 C64 95 89 68 128 68 Z" fill="url(#flashFur)" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Coral / Raspberry Shirt on Torso -->
    <g id="shirt">
      <!-- Curved Shirt Body mapping to lower torso -->
      <path d="M82 165 C88 152 106 146 128 146 C150 146 168 152 174 165 C178 178 172 195 152 203 C134 211 110 208 94 201 C82 194 78 178 82 165 Z" fill="url(#flashShirt)" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
      <!-- Soft collar scoop line -->
      <path d="M102 152 Q128 160 154 152" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Golden Lightning Bolt Emblem -->
    <g id="lightning_bolt">
      <path d="M132 156 L118 176 L128 176 L124 196 L140 174 L130 174 Z" fill="url(#flashBolt)" stroke="#4B372F" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- White Rabbit Paws -->
    <g id="paws">
      <ellipse cx="102" cy="207" rx="13" ry="8.5" fill="url(#flashFur)" stroke="#4B372F" stroke-width="2.5"/>
      <ellipse cx="154" cy="207" rx="13" ry="8.5" fill="url(#flashFur)" stroke="#4B372F" stroke-width="2.5" transform="translate(50 -94) rotate(-62 154 207)"/>
    </g>

    <!-- Face Features -->
    <g id="face">
      <!-- Rosy Cheeks -->
      <g id="cheeks">
        <ellipse cx="91" cy="140" rx="8.5" ry="5.5" fill="#FDA4AF" opacity="0.65"/>
        <ellipse cx="165" cy="140" rx="8.5" ry="5.5" fill="#FDA4AF" opacity="0.65"/>
      </g>

      <!-- Eyes -->
      <g id="eyes">
        <ellipse cx="106" cy="122" rx="9" ry="12.5" fill="#3C2D33"/>
        <ellipse cx="150" cy="122" rx="9" ry="12.5" fill="#3C2D33"/>
        <ellipse cx="109" cy="118" rx="3.2" ry="4" fill="#FFFFFF"/>
        <ellipse cx="153" cy="118" rx="3.2" ry="4" fill="#FFFFFF"/>
        <circle cx="104" cy="126" r="1.5" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="148" cy="126" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      </g>

      <!-- Nose & Mouth -->
      <g id="mouth">
        <path d="M123 137 Q128 133 133 137 Q130 144 128 146 Q126 144 123 137Z" fill="#BE123C"/>
        <path d="M112 148 Q128 170 144 148 Z" fill="#BE123C"/>
        <path d="M118 158 Q128 166 138 158" fill="#FDA4AF"/>
        <rect x="125" y="148" width="6" height="5" rx="1" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Mint Micro-Accent (Energetic head tuft cue) -->
    <g id="accent">
      <path d="M128 67 C124 57 129 52 133 54 C136 60 133 65 128 67 Z" fill="#10B981"/>
    </g>
  </g>
  <g id="fx" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <path d="M220 98 Q228 112 220 126" fill="none" stroke-width="6.5"/>
    <path d="M220 98 Q228 112 220 126" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
    <path d="M230 90 Q242 112 230 134" fill="none" stroke-width="6.5"/>
    <path d="M230 90 Q242 112 230 134" fill="none" stroke="#FDE68A" stroke-width="2.8"/>
  </g>
</svg>