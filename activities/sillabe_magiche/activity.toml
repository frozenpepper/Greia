[activity]
id = "org.greia.sillabe-magiche"
legacy_ids = []
title_key = "activity.sillabe_magiche.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["learn", "play"]
discovery_tags = ["words", "puzzles"]

[education]
# Leo's Syllable Train: a picture word arrives on a train with one wagon per
# beat. Italian: clap the word's beats on the drum (each clap says its
# syllable), then build every wagon - vowel after the given consonant, then
# whole syllable tiles, then the word from one shared tile pool - and the train
# blends "LU... NA... luna!". English (no syllabary, no letters): choose the
# picture whose word fits a train of 1 or 2 beats, then clap its beats.
# Adaptive stages 1-3 of the same loop; wrong choices are eliminated.
categories = ["language", "phonological_awareness", "syllables", "phonics"]
difficulty = 2
recommended_age_min = 5
recommended_age_max = 6
difficulty_min = 1
difficulty_max = 3
adaptive_difficulty = true
skills = [
  { id = "language.phonological_awareness", weight = 3 },
  { id = "language.syllable_blending", weight = 3 },
  { id = "language.listening_comprehension", weight = 2 },
]
events = [
  { id = "syllable.word_completed", kind = "milestone" },
  { id = "syllable.train_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "navigation"

[requirements]
required_capabilities = ["display", "audio.basic"]
optional_capabilities = ["pointer", "touch", "keyboard"]

[permissions]
requested = []

[storage]
schema_version = 1
