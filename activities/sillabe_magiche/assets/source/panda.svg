<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sillabe Magiche picture "panda" (EN two beats: PAN-DA): a sitting panda, front view. Shared-library candidate prop.vocab.panda. Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
  <defs>
    <!-- cream -> sand step -->
    <linearGradient id="panda_coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF5"/>
      <stop offset="1" stop-color="#EFE5CF"/>
    </linearGradient>
    <!-- charcoal light -> charcoal -->
    <linearGradient id="panda_patch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5F66"/>
      <stop offset="1" stop-color="#30343A"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="228" rx="76" ry="12" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="ears" fill="url(#panda_patch)" stroke="#4B372F" stroke-width="3.5">
    <circle cx="80" cy="60" r="22"/>
    <circle cx="176" cy="60" r="22"/>
  </g>
  <g id="body">
    <path d="M68 200 C62 160 92 136 128 136 C164 136 194 160 188 200 C186 218 164 226 128 226 C92 226 70 218 68 200 Z" fill="url(#panda_coat)" stroke="#4B372F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80 152 C58 162 54 196 72 206 C88 214 102 196 100 172 C98 162 90 150 80 152 Z" fill="url(#panda_patch)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M176 152 C198 162 202 196 184 206 C168 214 154 196 156 172 C158 162 166 150 176 152 Z" fill="url(#panda_patch)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="102" cy="218" rx="22" ry="12" fill="url(#panda_patch)" stroke="#4B372F" stroke-width="3.5"/>
    <ellipse cx="154" cy="218" rx="22" ry="12" fill="url(#panda_patch)" stroke="#4B372F" stroke-width="3.5"/>
  </g>
  <g id="head">
    <ellipse cx="128" cy="102" rx="60" ry="52" fill="url(#panda_coat)" stroke="#4B372F" stroke-width="4.5"/>
    <ellipse cx="104" cy="66" rx="20" ry="8" fill="#FFFFFF" opacity="0.8" transform="rotate(-16 104 66)"/>
    <ellipse cx="102" cy="102" rx="15" ry="20" fill="url(#panda_patch)" transform="rotate(28 102 102)"/>
    <ellipse cx="154" cy="102" rx="15" ry="20" fill="url(#panda_patch)" transform="rotate(-28 154 102)"/>
  </g>
  <g id="face">
    <circle cx="104" cy="100" r="7" fill="#FFFBEB"/>
    <circle cx="152" cy="100" r="7" fill="#FFFBEB"/>
    <circle cx="105" cy="101" r="4" fill="#342C35"/>
    <circle cx="151" cy="101" r="4" fill="#342C35"/>
    <ellipse cx="128" cy="124" rx="10" ry="7" fill="#30343A" stroke="#4B372F" stroke-width="2"/>
    <path d="M128 131 V136 M128 136 C124 142 117 142 114 138 M128 136 C132 142 139 142 142 138" fill="none" stroke="#72513F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="88" cy="128" rx="9" ry="5" fill="#FDA4AF" opacity="0.55"/>
    <ellipse cx="168" cy="128" rx="9" ry="5" fill="#FDA4AF" opacity="0.55"/>
  </g>
</svg>
