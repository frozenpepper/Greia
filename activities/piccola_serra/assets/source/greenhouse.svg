    <path d="M-10 440 L1034 440 M-10 476 L1034 476 M-10 512 L1034 512" stroke="#D9C59E" stroke-width="2.5"/>
    <path d="M-10 404 L1034 404 L1034 416 L-10 416 Z" fill="#FFF6E3" stroke="#4B372F" stroke-width="3"/>
  </g>
  <g id="shelf">
    <ellipse cx="910" cy="352" rx="86" ry="6" fill="#6A5147" opacity="0.14"/>
    <rect x="820" y="330" width="184" height="14" rx="5" fill="url(#greenhouse_wood)" stroke="#4B372F" stroke-width="3"/>
    <path d="M838 344 L846 362 M986 344 L978 362" stroke="#4B372F" stroke-width="3" stroke-linecap="round"/>
    <path d="M848 288 C836 270 846 254 860 262 C866 246 886 248 888 264 C902 258 910 274 898 288 Z" fill="#7CC889" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M846 290 L900 290 L894 330 L852 330 Z" fill="#E9875C" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M842 286 L904 286 L904 296 L842 296 Z" fill="#F2A27A" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M938 300 C930 280 944 270 952 282 C956 266 974 266 974 282 C984 274 994 290 982 300 Z" fill="#59B86A" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="950" cy="286" r="5" fill="#F46F61" stroke="#4B372F" stroke-width="2"/><circle cx="968" cy="282" r="5" fill="#FFC234" stroke="#4B372F" stroke-width="2"/>
    <path d="M934 300 L986 300 L980 330 L940 330 Z" fill="#E9875C" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M854 302 L860 322 M944 308 L948 324" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g id="floor">
    <path d="M-10 540 L1034 540 L1034 610 L-10 610 Z" fill="url(#greenhouse_floor)" stroke="#4B372F" stroke-width="3"/>
    <path d="M-10 572 L1034 572 M96 540 L80 572 M256 540 L248 572 M416 540 L414 572 M608 540 L610 572 M768 540 L776 572 M928 540 L944 572 M60 572 L40 600 M220 572 L206 600 M512 572 L512 600 M800 572 L816 600 M970 572 L990 600" stroke="#CF936B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="bench">
    <ellipse cx="512" cy="552" rx="420" ry="10" fill="#6A5147" opacity="0.14"/>
    <path d="M150 500 L176 500 L172 552 L154 552 Z M848 500 L874 500 L870 552 L852 552 Z" fill="#C98E58" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M100 486 L924 486 L920 508 L104 508 Z" fill="#C98E58" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <rect x="86" y="466" width="852" height="22" rx="8" fill="url(#greenhouse_wood)" stroke="#4B372F" stroke-width="3.5"/>
    <path d="M110 472 L360 472" stroke="#F3D3A8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
