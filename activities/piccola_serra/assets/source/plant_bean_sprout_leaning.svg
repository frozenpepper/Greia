<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia prop: prop.plant.bean_sprout (leaning). Piccola Serra plant stage; flat Greia vector (GREIA_SVG_AUTHORING_RULES).
