<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Greia prop: prop.plant.bean_sprout (droopy). Piccola Serra plant stage; flat Greia vector (GREIA_SVG_AUTHORING_RULES).
       Base (soil mound top) at x128 y212 so every stage stacks on the same pot spot. -->
  <defs>
