<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Faccine di Momo private prop: wrapped gift with a bow (shared-library candidate prop.everyday.gift). Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
  <defs>
    <!-- coral light (mix 35% white) -> coral -->
    <linearGradient id="gift_box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A198"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
    <!-- sunshine light -> sunshine -->
    <linearGradient id="gift_ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA85"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="232" rx="84" ry="13" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="bow">
    <path d="M126 98 C104 96 70 86 72 64 C74 44 104 50 126 92 Z" fill="url(#gift_ribbon)" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M130 98 C152 96 186 86 184 64 C182 44 152 50 130 92 Z" fill="url(#gift_ribbon)" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M92 66 C100 66 110 74 118 86" fill="none" stroke="#E0A21F" stroke-width="3" stroke-linecap="round"/>
    <path d="M164 66 C156 66 146 74 138 86" fill="none" stroke="#E0A21F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="box">
    <rect x="54" y="122" width="148" height="106" rx="8" fill="url(#gift_box)" stroke="#4B372F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M58 132 L198 132" fill="none" stroke="#C9584D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <rect x="114" y="122" width="28" height="106" fill="url(#gift_ribbon)" stroke="#4B372F" stroke-width="4"/>
    <rect x="42" y="94" width="172" height="34" rx="9" fill="url(#gift_box)" stroke="#4B372F" stroke-width="5" stroke-linejoin="round"/>
    <rect x="112" y="94" width="32" height="34" fill="url(#gift_ribbon)" stroke="#4B372F" stroke-width="4"/>
    <circle cx="128" cy="94" r="13" fill="#FFC234" stroke="#4B372F" stroke-width="4.5"/>
    <ellipse cx="74" cy="170" rx="7" ry="26" fill="#FFFFFF" opacity="0.5"/>
    <ellipse cx="66" cy="106" rx="12" ry="4.5" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
