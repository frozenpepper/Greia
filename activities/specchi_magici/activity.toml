[activity]
id = "org.greia.specchi-magici"
legacy_ids = []
title_key = "activity.specchi_magici.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["learn"]
discovery_tags = ["puzzles", "making"]

[education]
# Half a mosaic is laid on one side of Lilli's magic mirror line; the child
# builds the reflection on the glass from a small tile kit (shape, colour and,
# from rung 3, orientation). The kit always mixes the needed tiles with near
# misses and, for turned tiles, the unmirrored copy, so every placement is a
# decision about what the mirror image is and where it goes. Five mosaics per
# set; the ladder adapts between sets: vertical mirror with tiles at the line
# -> more tiles and colours, picture on either side -> turned triangles and
# half circles -> water (horizontal) mirror -> both mirrors at once.
categories = ["geometry", "spatial_reasoning", "symmetry"]
difficulty = 2
recommended_age_min = 5
recommended_age_max = 7
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "math.geometry.symmetry", weight = 3 },
  { id = "math.geometry.shape_recognition", weight = 2 },
  { id = "cognition.spatial_rotation", weight = 2 },
]
events = [
  { id = "mirror.mosaic_completed", kind = "milestone" },
  { id = "mirror.gallery_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer"]
optional_capabilities = ["keyboard", "touch", "audio.basic"]

[permissions]
requested = []

[storage]
schema_version = 1
