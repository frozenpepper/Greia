<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background card -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  
  <!-- Mirror frame / plate -->
  <rect x="36" y="36" width="184" height="184" rx="20" fill="#2e1065" stroke="#c084fc" stroke-width="4"/>
  
  <!-- Central Glowing Mirror Beam -->
  <rect x="123" y="44" width="10" height="168" rx="5" fill="url(#mirror)"/>
  
  <!-- Left Shapes -->
  <!-- Red Circle -->
  <circle cx="78" cy="80" r="22" fill="#f43f5e" stroke="#fb7185" stroke-width="3"/>
  <!-- Gold Triangle pointing Right -->
  <polygon points="56,128 100,152 56,176" fill="#fbbf24" stroke="#fef08a" stroke-width="3"/>
  
  <!-- Right Shapes (Mirrored) -->
  <!-- Red Circle -->
  <circle cx="178" cy="80" r="22" fill="#f43f5e" stroke="#fb7185" stroke-width="3"/>
  <!-- Gold Triangle pointing Left (Mirrored!) -->
  <polygon points="200,128 156,152 200,176" fill="#fbbf24" stroke="#fef08a" stroke-width="3"/>
  
  <!-- Sparkles -->
  <circle cx="128" cy="56" r="4" fill="#ffffff"/>
  <circle cx="128" cy="200" r="4" fill="#ffffff"/>
  <circle cx="128" cy="128" r="6" fill="#ffffff"/>
</svg>
