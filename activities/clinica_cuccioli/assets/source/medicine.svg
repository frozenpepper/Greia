    <rect x="86" y="136" width="64" height="60" rx="10" fill="#FFFBEB" stroke="#4B372F" stroke-width="3"/>
    <path d="M118 182 C111 177 102 171 102 162 C102 156 107 153 111 153 C114 153 117 155 118 158 C119 155 122 153 125 153 C129 153 134 156 134 162 C134 171 125 177 118 182 Z" fill="#F46F61" stroke="#4B372F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M82 118 L82 208" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <rect x="94" y="80" width="48" height="24" rx="6" fill="#EEDDBA" stroke="#4B372F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 82 Q100 30 118 30 Q136 30 136 82 Z" fill="url(#medicine_bulb)" stroke="#4B372F" stroke-width="5" stroke-linejoin="round"/>
