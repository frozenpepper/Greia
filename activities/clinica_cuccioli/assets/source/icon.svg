<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <radialGradient id="badge" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="128" cy="220" rx="68" ry="12" fill="#CFD8DC" opacity="0.6"/>
  <!-- Puppy Ears -->
  <ellipse cx="64" cy="100" rx="24" ry="46" fill="#D7CCC8" transform="rotate(-20 64 100)"/>
  <ellipse cx="192" cy="100" rx="24" ry="46" fill="#D7CCC8" transform="rotate(20 192 100)"/>
  <!-- Head -->
  <circle cx="128" cy="122" r="68" fill="url(#fur)"/>
  <!-- Snout -->
  <ellipse cx="128" cy="142" rx="34" ry="24" fill="#FFF9C4"/>
  <ellipse cx="128" cy="130" rx="14" ry="10" fill="#37474F"/>
  <path d="M128 140 L128 152 M120 152 Q128 158 136 152" fill="none" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="102" cy="108" r="8" fill="#37474F"/>
  <circle cx="100" cy="106" r="3" fill="#FFFFFF"/>
  <circle cx="154" cy="108" r="8" fill="#37474F"/>
  <circle cx="152" cy="106" r="3" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="86" cy="132" r="10" fill="#FF8A80" opacity="0.6"/>
  <circle cx="170" cy="132" r="10" fill="#FF8A80" opacity="0.6"/>
  <!-- Vet Cross / Heart Badge -->
  <g transform="translate(160, 160)">
    <circle cx="28" cy="28" r="32" fill="url(#badge)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Medical Cross -->
    <rect x="23" y="10" width="10" height="36" rx="3" fill="#FFFFFF"/>
    <rect x="10" y="23" width="36" height="10" rx="3" fill="#FFFFFF"/>
  </g>
</svg>