<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Little Vet Clinic Activity icon: puppy patient with a plaster + a get-well heart, ocean (play) tile. GREIA_SVG_AUTHORING_RULES §7. -->
  <defs>
    <!-- ocean light (mix 35% white) -> ocean -->
    <linearGradient id="clinic_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
    <!-- sand light -> sand shade (shared puppy fur) -->
    <linearGradient id="clinic_fur" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#EBD3AE"/>
    </linearGradient>
    <!-- accent light -> accent (shared puppy ears) -->
    <linearGradient id="clinic_acc" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C48E66"/>
      <stop offset="1" stop-color="#9A6445"/>
    </linearGradient>
  </defs>
