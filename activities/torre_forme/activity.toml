[activity]
id = "org.greia.torre-forme"
legacy_ids = []
title_key = "activity.torre_forme.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["play"]
discovery_tags = ["building", "puzzles"]

[education]
# Silhouette fitting with real geometric blocks (square, rectangle, triangle,
# half circle, arch, cylinder). Each build (lighthouse, rocket, cat, car ...)
# is an outline on Dani's workbench; the child fills it exactly with blocks
# from a kit, turning them in quarter turns where needed. No falling pieces,
# no line clears, no clock. Five builds per set; the rung adapts between sets:
# one dashed slot per block, kit already turned -> one kind starts turned the
# wrong way -> random turns plus a kind that belongs nowhere -> only the outer
# silhouette (the child decomposes it) -> two kinds that belong nowhere.
categories = ["spatial", "geometry"]
difficulty = 2
recommended_age_min = 4
recommended_age_max = 7
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "spatial.composition", weight = 3 },
  { id = "math.geometry.shape_recognition", weight = 2 },
  { id = "cognition.spatial_rotation", weight = 2 },
]
events = [
  { id = "tower.build_completed", kind = "milestone" },
  { id = "tower.set_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer"]
optional_capabilities = ["keyboard", "touch", "controller", "audio.basic"]

[permissions]
requested = []

[storage]
schema_version = 1
