    <path d="M124 226 C126 182 122 142 128 94" fill="none" stroke="#F46F61" stroke-width="16.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M126 164 C140 150 150 132 152 108" fill="none" stroke="#F46F61" stroke-width="16.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M124 130 C112 120 106 106 108 92" fill="none" stroke="#F46F61" stroke-width="16.5" stroke-linejoin="round" stroke-linecap="round"/>
