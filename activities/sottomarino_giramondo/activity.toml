[activity]
id = "org.greia.sottomarino-giramondo"
legacy_ids = []
title_key = "activity.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["play", "explore"]
discovery_tags = ["sea", "nature", "action"]

[education]
categories = ["marine_life", "sensory_calm", "spatial_awareness", "cause_and_effect"]
difficulty = 1
recommended_age_min = 3
recommended_age_max = 8
skills = [
  { id = "lexicon.nature.marine", weight = 3 },
  { id = "language.listening_comprehension", weight = 2 },
  { id = "cognition.cause_and_effect", weight = 2 },
  { id = "sensory.visual_tracking.motion", weight = 1 },
  { id = "motor.pointer.target_selection", weight = 1 },
]
events = [
  { id = "submarine.instrument_used", kind = "milestone" },
  { id = "submarine.creature_discovered", kind = "milestone" },
  { id = "submarine.order_completed", kind = "milestone" },
  { id = "submarine.encounter_resolved", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
# Hybrid: game-style piloting (arrows / D-pad / left stick steer, surface and
# dive; Space / Enter / south sound the alarm) plus the cockpit focus ring
# (Tab / Shift+Tab or controller shoulder buttons; Space then presses the
# focused control). Pointer/touch use the cockpit directly.
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer", "audio.basic"]
optional_capabilities = ["keyboard", "touch", "controller"]

[permissions]
requested = []

[storage]
schema_version = 1
