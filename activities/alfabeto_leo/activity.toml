[activity]
id = "org.greia.alfabeto-leo"
legacy_ids = []
title_key = "activity.alfabeto_leo.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["learn", "play"]
discovery_tags = ["words"]

[education]
# Leo's Letter Garden: meet a capital letter (name + example picture), find it
# among 2-3 letter tiles, trace it in stroke order. Teaching groups of the same
# loop get harder (2 tiles -> 3 tiles -> look-alike decoys -> review gardens);
# a hard round repeats its group.
categories = ["language", "letter_knowledge", "fine_motor"]
difficulty = 2
recommended_age_min = 3
recommended_age_max = 5
difficulty_min = 1
difficulty_max = 4
adaptive_difficulty = true
skills = [
  { id = "language.letter_recognition", weight = 3 },
  { id = "language.letter_names", weight = 2 },
  { id = "motor.letter_formation", weight = 2 },
]
events = [
  { id = "letter.discovered", kind = "milestone" },
  { id = "alphabet.garden_completed", kind = "completion" },
  { id = "alphabet.parade_completed", kind = "milestone" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "audio.basic"]
optional_capabilities = ["pointer", "touch", "keyboard"]

[permissions]
requested = []

[storage]
schema_version = 1
