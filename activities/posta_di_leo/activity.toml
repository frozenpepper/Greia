[activity]
id = "org.greia.posta-di-leo"
legacy_ids = []
title_key = "activity.posta_di_leo.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["create", "learn"]
discovery_tags = ["writing", "stories"]

[education]
# One experience: make a picture postcard *for someone* (choose a friend,
# a card front, stickers, an optional short message) and send it; the
# friend receives it and reacts. Writing is optional, so pre-readers can
# make and send a picture card; 5+ writers add a message to their audience.
categories = ["creative_expression", "communication", "writing"]
difficulty = 2
recommended_age_min = 4
skills = [
  { id = "creativity.visual_composition", weight = 3 },
  { id = "language.communication.audience", weight = 2 },
  { id = "language.emergent_writing", weight = 2 },
]
events = [
  { id = "postcard.created", kind = "creation" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer"]
optional_capabilities = ["keyboard", "touch", "controller"]

[permissions]
requested = []

[storage]
schema_version = 1

[creations]
produces = ["image/png", "text/plain"]
consumes = ["image/png", "text/plain"]
