<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 256" width="232" height="256">
  <defs>
    <!-- cast cream → cream token: Wonder Match card face -->
    <linearGradient id="memory_face_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#F7EBCB"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <rect x="11" y="17" width="212" height="234" rx="28" fill="#6A5147" opacity="0.16"/>
  </g>
  <g id="card">
    <rect x="8" y="8" width="216" height="236" rx="28" fill="url(#memory_face_body)" stroke="#4B372F" stroke-width="4" stroke-linejoin="round"/>
    <rect x="20" y="20" width="192" height="212" rx="20" fill="#FFFDF7" stroke="#E6D3A8" stroke-width="2.5"/>
    <ellipse cx="60" cy="34" rx="26" ry="6" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
