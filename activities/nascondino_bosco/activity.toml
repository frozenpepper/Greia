[activity]
id = "org.greia.nascondino-bosco"
legacy_ids = []
title_key = "activity.nascondino_bosco.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["explore", "play"]
discovery_tags = ["nature", "puzzles"]

[education]
# Lilli's woodland hide-and-seek: find the asked friend among peeking
# friends (visual search), then see where it hid (position phrase with
# behind / under / in; spoken only once approved recordings exist). One
# loop; a five-rung ladder (more places, smaller and shorter peeks) adapts
# from the misses of each four-find round.
categories = ["visual_attention", "spatial_language", "nature_lexicon"]
difficulty = 1
recommended_age_min = 3
recommended_age_max = 5
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "cognition.observation.visual_search", weight = 3 },
  { id = "language.vocabulary.position_words", weight = 2 },
  { id = "lexicon.nature.animals", weight = 2 },
  { id = "motor.pointer.target_selection", weight = 1 },
]
events = [
  { id = "woodland.animal_found", kind = "milestone" },
  { id = "woodland.round_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer", "audio.basic"]
optional_capabilities = ["keyboard", "touch"]

[permissions]
requested = []

[storage]
schema_version = 1
