<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
  <!-- nascondino_bosco prop: snow drift ("under the snow"). Snow colours/contour derived from the
       shared woodland_snow scene kit drifts, one step deeper so the drift reads on snowy ground;
       recipe GREIA_SVG_AUTHORING_RULES.md. -->
  <defs>
    <!-- white -> sky shade (mix sky #CFEAF7 with ocean 15%) -->
    <linearGradient id="snow_drift_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E4F2"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="256" cy="232" rx="204" ry="15" fill="#6A5147" opacity="0.16"/>
  </g>
  <g id="twig">
    <path d="M378 140 L404 96 M394 114 L418 106" fill="none" stroke="#8A5A3B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="420" cy="104" r="7" fill="#F46F61" stroke="#4B372F" stroke-width="2"/>
    <circle cx="408" cy="94" r="6" fill="#F46F61" stroke="#4B372F" stroke-width="2"/>
  </g>
