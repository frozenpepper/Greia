    <path d="M56 232 C58 190 98 154 150 150 C170 116 230 98 276 112 C320 100 374 118 392 150 C434 160 458 196 458 232 Z" fill="url(#snow_drift_fill)" stroke="#7F98B8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286 232 C340 210 404 198 450 188 C456 204 458 218 458 232 Z" fill="#B9CCE2" opacity="0.85"/>
    <path d="M150 150 C176 140 204 140 226 150 M300 140 C326 132 352 134 372 146 M120 198 C150 188 180 188 206 196" fill="none" stroke="#A9BCD3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M176 126 C196 114 226 106 252 110" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 206 L104 196 L108 206 L118 210 L108 214 L104 224 L100 214 L90 210 Z" fill="#FFFFFF" stroke="#7F98B8" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>
