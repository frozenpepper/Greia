<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" width="140" height="110">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <!-- Chest Base -->
  <path d="M 20,45 L 120,45 L 115,95 L 25,95 Z" fill="url(#woodGrad)" stroke="#291102" stroke-width="3"/>
  <!-- Gold Bands on Base -->
  <rect x="23" y="45" width="12" height="50" fill="url(#goldGrad)" stroke="#291102" stroke-width="2"/>
  <rect x="105" y="45" width="12" height="50" fill="url(#goldGrad)" stroke="#291102" stroke-width="2"/>
  <!-- Planks Lines -->
  <line x1="22" y1="62" x2="118" y2="62" stroke="#291102" stroke-width="2"/>
  <line x1="24" y1="78" x2="116" y2="78" stroke="#291102" stroke-width="2"/>
  <!-- Arched Lid -->
  <path d="M 16,45 C 16,18 124,18 124,45 Z" fill="url(#woodGrad)" stroke="#291102" stroke-width="3"/>
  <!-- Gold Bands on Lid -->
  <path d="M 22,45 C 22,23 38,23 38,45 Z" fill="url(#goldGrad)" stroke="#291102" stroke-width="2"/>
  <path d="M 102,45 C 102,23 118,23 118,45 Z" fill="url(#goldGrad)" stroke="#291102" stroke-width="2"/>
  <!-- Keyhole Plate -->
  <rect x="62" y="40" width="16" height="20" rx="3" fill="url(#goldGrad)" stroke="#291102" stroke-width="2"/>
  <circle cx="70" cy="47" r="3" fill="#1c1917"/>
  <polygon points="68.5,47 71.5,47 72,55 68,55" fill="#1c1917"/>
</svg>