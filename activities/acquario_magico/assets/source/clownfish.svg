<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <radialGradient id="clownGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Tail Fin -->
  <path d="M 45,60 C 20,40 10,25 25,60 C 10,95 20,80 45,60 Z" fill="url(#finGrad)" stroke="#7c2d12" stroke-width="3"/>
  <ellipse cx="28" cy="60" rx="8" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- Dorsal Fin -->
  <path d="M 65,36 C 85,18 115,22 125,40 Z" fill="url(#finGrad)" stroke="#7c2d12" stroke-width="3"/>
  <!-- Pectoral Fin -->
  <ellipse cx="85" cy="75" rx="16" ry="10" transform="rotate(25 85 75)" fill="url(#finGrad)" stroke="#7c2d12" stroke-width="2.5"/>

  <!-- Body -->
  <ellipse cx="90" cy="60" rx="55" ry="38" fill="url(#clownGrad)" stroke="#7c2d12" stroke-width="4"/>

  <!-- White Stripes with Black Outlines -->
  <!-- Tail Stripe -->
  <path d="M 52,42 Q 46,60 52,78" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <path d="M 52,42 Q 46,60 52,78" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Middle Stripe -->
  <path d="M 85,24 Q 75,60 85,96" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  <path d="M 85,24 Q 75,60 85,96" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- Head Stripe -->
  <path d="M 120,28 Q 112,60 120,92" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120,28 Q 112,60 120,92" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="126" cy="50" r="10" fill="#ffffff" stroke="#7c2d12" stroke-width="2"/>
  <circle cx="128" cy="50" r="6" fill="#0f172a"/>
  <circle cx="130" cy="48" r="2.5" fill="#ffffff"/>
  <circle cx="126" cy="53" r="1.5" fill="#ffffff"/>

  <!-- Cute Mouth -->
  <path d="M 142,65 Q 146,68 142,72" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
</svg>