  <path d="M 58,310 C 30,300 10,270 25,250 C 40,270 55,295 58,310 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2.5"/>
  <path d="M 64,250 C 95,240 115,205 100,185 C 85,205 70,235 64,250 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2.5"/>
  <path d="M 54,200 C 22,190 5,155 20,135 C 38,155 52,185 54,200 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2.5"/>
  <path d="M 68,140 C 96,130 112,95 98,80 C 84,98 72,125 68,140 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2.5"/>
  <path d="M 58,90 C 32,80 18,50 32,35 C 46,52 56,76 58,90 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2.5"/>
  <path d="M 60,30 C 50,10 70,10 60,30 Z" fill="url(#leafNightGrad)" stroke="#3b0764" stroke-width="2"/>
</svg>