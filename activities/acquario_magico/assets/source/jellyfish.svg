  <path d="M 20,70 C 15,25 105,25 100,70 C 90,78 80,72 70,76 C 60,72 50,78 40,74 C 30,78 22,74 20,70 Z" fill="url(#jellyCap)" stroke="#581c87" stroke-width="3.5"/>
  <!-- Inner Glow Spots -->
