<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" width="140" height="110">
  <!-- acquario_magico treasure chest - open (pearl inside). Activity-private prop, flat Greia vector;
       shared-library candidate prop.sea.chest. -->
  <defs>
    <!-- orange shade 25% ink -> orange shade 45% ink (wood) -->
    <linearGradient id="chest_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98136"/>
      <stop offset="1" stop-color="#A76E34"/>
    </linearGradient>
    <!-- gold -> gold_deep -->
    <linearGradient id="chest_gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="chest_pearl_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="70" cy="100" rx="56" ry="8" fill="#6A5147" opacity="0.16"/>
  </g>
  <g id="lid_back">
    <path d="M18 46 C14 22 28 6 70 6 C112 6 126 22 122 46 Z" fill="url(#chest_wood)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M24 44 C22 26 30 12 40 10 L44 44 Z M116 44 C118 26 110 12 100 10 L96 44 Z" fill="url(#chest_gold)" stroke="#4B372F" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g id="inside">
    <path d="M20 46 C40 36 100 36 120 46 L120 54 L20 54 Z" fill="#5E4033" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="70" cy="34" r="30" fill="url(#chest_pearl_glow)"/>
    <path d="M38 48 a9 5 0 1 1 18 0 Z M84 48 a9 5 0 1 1 18 0 Z" fill="url(#chest_gold)" stroke="#4B372F" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="70" cy="38" r="12" fill="#F3EEFA" stroke="#4B372F" stroke-width="2.8"/>
    <ellipse cx="65.5" cy="33.5" rx="4.2" ry="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g id="base">
    <path d="M20 46 L120 46 L116 92 C116 95 114 96 111 96 L29 96 C26 96 24 95 24 92 Z" fill="url(#chest_wood)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M23 63 L117 63 M24 79 L116 79" fill="none" stroke="#7A4E2A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M24 47 L36 47 L35 95 L26 95 Z M104 47 L116 47 L114 95 L105 95 Z" fill="url(#chest_gold)" stroke="#4B372F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 52 L30 70" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <rect x="61" y="48" width="18" height="20" rx="4" fill="url(#chest_gold)" stroke="#4B372F" stroke-width="2.5"/>
    <path d="M70 53 a3 3 0 1 1 0.1 0 Z M68.6 57 L71.4 57 L72 63 L68 63 Z" fill="#342C35"/>
  </g>
  <g id="fx">
    <path d="M108 14 Q109.4 20.6 116 22 Q109.4 23.4 108 30 Q106.6 23.4 100 22 Q106.6 20.6 108 14 Z" fill="#FDE68A" stroke="#8A5A12" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
