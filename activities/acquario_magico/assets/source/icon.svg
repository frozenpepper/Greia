<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="water" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="60%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#0097A7"/>
    </radialGradient>
    <linearGradient id="fish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
  </defs>
  <!-- Fishbowl base -->
  <ellipse cx="128" cy="216" rx="60" ry="12" fill="#B0BEC5" opacity="0.6"/>
  <!-- Glass Bowl -->
  <circle cx="128" cy="132" r="88" fill="url(#water)"/>
  <circle cx="128" cy="132" r="88" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.8"/>
  <path d="M72 64 C90 56 166 56 184 64" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <!-- Seaweed -->
  <path d="M80 200 Q65 150 85 120 Q70 90 85 70" fill="none" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>
  <path d="M96 205 Q110 165 95 135 Q110 110 100 90" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round"/>
  <!-- Goldfish / Clownfish -->
  <g transform="translate(132, 130)">
    <!-- Tail -->
    <polygon points="40,0 68,-22 56,0 68,22" fill="#FF7043"/>
    <!-- Body -->
    <ellipse cx="12" cy="0" rx="36" ry="24" fill="url(#fish)"/>
    <!-- Stripes -->
    <path d="M12 -23 Q6 0 12 23" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M-8 -21 Q-14 0 -8 21" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Fin -->
    <path d="M8 2 Q22 18 12 22" fill="#FFAB91"/>
    <!-- Eye -->
    <circle cx="-14" cy="-7" r="6" fill="#FFFFFF"/>
    <circle cx="-16" cy="-7" r="3" fill="#212121"/>
  </g>
  <!-- Water Bubbles -->
  <circle cx="150" cy="80" r="7" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="162" cy="62" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="120" cy="74" r="5" fill="#FFFFFF" opacity="0.7"/>
</svg>