  </defs>

  <!-- Tentacles (Curling) -->
  <path d="M 40,85 Q 20,110 35,125 Q 48,125 45,100" fill="url(#octoGrad)" stroke="#831843" stroke-width="3"/>
  <path d="M 55,90 Q 45,120 60,130 Q 70,125 65,95" fill="url(#octoGrad)" stroke="#831843" stroke-width="3"/>
  <path d="M 75,95 Q 75,125 85,130 Q 95,120 85,90" fill="url(#octoGrad)" stroke="#831843" stroke-width="3"/>
  <path d="M 95,90 Q 115,115 100,128 Q 88,120 92,85" fill="url(#octoGrad)" stroke="#831843" stroke-width="3"/>

  <!-- Head / Mantle -->
  <ellipse cx="70" cy="55" rx="42" ry="46" fill="url(#octoGrad)" stroke="#831843" stroke-width="4"/>

  <!-- Giant Sparkling Anime Eyes -->
  <ellipse cx="54" cy="58" rx="10" ry="13" fill="#0f172a"/>
  <circle cx="51" cy="54" r="5" fill="#ffffff"/>
  <circle cx="56" cy="64" r="2.5" fill="#ffffff"/>

  <ellipse cx="86" cy="58" rx="10" ry="13" fill="#0f172a"/>
  <circle cx="83" cy="54" r="5" fill="#ffffff"/>
  <circle cx="88" cy="64" r="2.5" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="44" cy="72" r="6" fill="#fbcfe8" opacity="0.8"/>
  <circle cx="96" cy="72" r="6" fill="#fbcfe8" opacity="0.8"/>

  <!-- Happy Smile -->
  <path d="M 65,72 Q 70,78 75,72" fill="none" stroke="#831843" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Specular Highlight -->
