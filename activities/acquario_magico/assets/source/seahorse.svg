<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <defs>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Dorsal Fin -->
  <path d="M 32,55 C 15,50 15,75 32,80 Z" fill="url(#finGrad)" stroke="#881337" stroke-width="2.5"/>
  <!-- Curved Tail -->
  <path d="M 50,90 C 50,115 30,130 25,115 C 20,105 32,100 38,108" fill="none" stroke="url(#seaGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 50,90 C 50,115 30,130 25,115 C 20,105 32,100 38,108" fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round"/>
  <!-- Body / Belly -->
  <path d="M 45,35 C 45,35 68,50 68,75 C 68,95 45,100 45,100 C 45,100 35,90 35,65 C 35,45 45,35 45,35 Z" fill="url(#seaGrad)" stroke="#881337" stroke-width="3.5"/>
  <!-- Belly Ridges -->
  <path d="M 45,55 Q 60,60 52,70" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 44,70 Q 62,75 48,85" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Head & Snout -->
  <path d="M 45,35 C 42,20 55,10 65,18 C 75,25 88,25 90,30 C 90,36 78,38 70,35 C 65,45 50,45 45,35 Z" fill="url(#seaGrad)" stroke="#881337" stroke-width="3.5"/>
  <!-- Crown / Crest -->
  <path d="M 55,12 L 58,5 L 64,10 L 70,6 L 72,15 Z" fill="url(#finGrad)" stroke="#881337" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="62" cy="22" r="7" fill="#ffffff" stroke="#881337" stroke-width="2"/>
  <circle cx="64" cy="22" r="4" fill="#0f172a"/>
  <circle cx="66" cy="20" r="1.5" fill="#ffffff"/>
</svg>