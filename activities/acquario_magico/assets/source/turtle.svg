<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <radialGradient id="shellGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Back Flippers -->
  <ellipse cx="45" cy="40" rx="16" ry="8" transform="rotate(-30 45 40)" fill="url(#skinGrad)" stroke="#14532d" stroke-width="2.5"/>
  <ellipse cx="45" cy="80" rx="16" ry="8" transform="rotate(30 45 80)" fill="url(#skinGrad)" stroke="#14532d" stroke-width="2.5"/>

  <!-- Front Swimming Flippers -->
  <path d="M 95,35 C 115,10 140,15 130,40 C 115,48 100,42 95,35 Z" fill="url(#skinGrad)" stroke="#14532d" stroke-width="3"/>
  <path d="M 95,85 C 115,110 140,105 130,80 C 115,72 100,78 95,85 Z" fill="url(#skinGrad)" stroke="#14532d" stroke-width="3"/>

  <!-- Shell -->
  <ellipse cx="75" cy="60" rx="44" ry="34" fill="url(#shellGrad)" stroke="#14532d" stroke-width="4"/>
  <!-- Shell Scutes / Hexagons -->
  <polygon points="75,44 86,52 86,68 75,76 64,68 64,52" fill="#86efac" stroke="#166534" stroke-width="2.5"/>
  <polygon points="50,48 60,54 60,66 50,72 42,66 42,54" fill="#86efac" stroke="#166534" stroke-width="2"/>
  <polygon points="100,48 108,54 108,66 100,72 90,66 90,54" fill="#86efac" stroke="#166534" stroke-width="2"/>

  <!-- Head -->
  <ellipse cx="125" cy="60" rx="18" ry="14" fill="url(#skinGrad)" stroke="#14532d" stroke-width="3"/>
  <circle cx="132" cy="54" r="5" fill="#0f172a"/>
  <circle cx="133.5" cy="52.5" r="2" fill="#ffffff"/>
  <path d="M 136,65 Q 140,67 136,70" fill="none" stroke="#14532d" stroke-width="2.5" stroke-linecap="round"/>
</svg>