<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120">
  <defs>
    <linearGradient id="dolpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Tail Flukes -->
  <path d="M 30,55 C 10,35 5,45 15,60 C 5,75 10,85 30,65 Z" fill="url(#dolpGrad)" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Dorsal Fin -->
  <path d="M 75,32 Q 95,8 105,30 Z" fill="url(#dolpGrad)" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Pectoral Fin -->
  <path d="M 105,68 Q 95,95 115,88 Z" fill="url(#dolpGrad)" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Body -->
  <path d="M 28,60 C 45,45 75,28 115,30 C 145,32 165,48 172,55 C 178,60 172,66 155,66 C 130,85 85,85 28,60 Z" fill="url(#dolpGrad)" stroke="#1e3a8a" stroke-width="4"/>

  <!-- White Belly -->
  <path d="M 65,62 C 90,65 125,65 145,62 C 130,78 95,78 65,62 Z" fill="url(#bellyGrad)"/>

  <!-- Eye -->
  <circle cx="140" cy="46" r="6" fill="#0f172a"/>
  <circle cx="142" cy="44" r="2" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M 152,56 Q 158,60 162,56" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
</svg>