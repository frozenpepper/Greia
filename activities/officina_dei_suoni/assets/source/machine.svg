<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360">
  <!-- Officina dei Suoni: the Sound Machine. Pictures and letters go in the hopper, the brass horn plays the sound, the screen and the letter slots are filled by the Activity. Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
  <defs>
    <!-- orange light (mix 40% white) -> orange -->
    <linearGradient id="sound_machine_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C288"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- turquoise light (mix 40% white) -> turquoise -->
    <linearGradient id="sound_machine_hopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD4CE"/>
      <stop offset="1" stop-color="#44B8AE"/>
    </linearGradient>
    <!-- gold -> gold_deep -->
    <linearGradient id="sound_machine_horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="220" cy="349" rx="172" ry="9" fill="#6A5147" opacity="0.16"/>
  </g>
  <g id="feet">
    <rect x="106" y="304" width="58" height="40" rx="16" fill="#469C92" stroke="#4B372F" stroke-width="4"/>
    <rect x="276" y="304" width="58" height="40" rx="16" fill="#469C92" stroke="#4B372F" stroke-width="4"/>
  </g>
  <g id="hopper">
    <path d="M194 96 L194 74 L152 34 L288 34 L246 74 L246 96 Z" fill="url(#sound_machine_hopper)" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="138" y="16" width="164" height="26" rx="13" fill="url(#sound_machine_hopper)" stroke="#4B372F" stroke-width="4.5"/>
    <rect x="154" y="23" width="132" height="10" rx="5" fill="#469C92"/>
  </g>
  <g id="lamp">
    <path d="M92 82 L92 70" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
    <circle cx="92" cy="62" r="11" fill="#F46F61" stroke="#4B372F" stroke-width="4"/>
    <circle cx="88" cy="58" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g id="body">
    <rect x="60" y="80" width="320" height="242" rx="42" fill="url(#sound_machine_body)" stroke="#4B372F" stroke-width="5"/>
    <ellipse cx="96" cy="104" rx="20" ry="8" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 96 104)"/>
    <rect x="98" y="92" width="244" height="160" rx="32" fill="#CE8436" stroke="#4B372F" stroke-width="4"/>
    <rect x="110" y="102" width="220" height="140" rx="24" fill="#FFFBEB" stroke="#4B372F" stroke-width="4"/>
    <rect x="74" y="258" width="292" height="60" rx="22" fill="#CE8436" stroke="#4B372F" stroke-width="3"/>
    <circle cx="80" cy="200" r="7" fill="#F8C288" stroke="#4B372F" stroke-width="3"/>
    <circle cx="360" cy="200" r="7" fill="#F8C288" stroke="#4B372F" stroke-width="3"/>
  </g>
  <g id="horn">
    <path d="M367.8 92.8 C384 78 374 48 375.7 35.7 L432.3 92.3 C420 94 392 116 376.2 101.2 Z" fill="url(#sound_machine_horn)" stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="404" cy="64" rx="13" ry="40" fill="#C98136" stroke="#4B372F" stroke-width="4" transform="rotate(-45 404 64)"/>
    <ellipse cx="408" cy="60" rx="5" ry="26" fill="#F59E0B" transform="rotate(-45 408 60)"/>
    <circle cx="370" cy="99" r="11" fill="#FBBF24" stroke="#4B372F" stroke-width="4"/>
    <path d="M378 82 C380 72 380 62 379 52" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
