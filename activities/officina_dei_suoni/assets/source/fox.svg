<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Officina dei Suoni picture "fox" (EN /f/, FR renard): storybook fox standing in side view, deliberately unlike Tito's front-facing Puff. Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
