    <rect x="114" y="184" width="17" height="44" rx="8" fill="#976333" stroke="#4B372F" stroke-width="3.5"/>
    <rect x="160" y="184" width="17" height="44" rx="8" fill="#976333" stroke="#4B372F" stroke-width="3.5"/>
    <rect x="180" y="180" width="17" height="48" rx="8" fill="#976333" stroke="#4B372F" stroke-width="3.5"/>
