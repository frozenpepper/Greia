    <!-- orange light (mix 20% white) -> orange -->
    <linearGradient id="fox_fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5AE60"/>
      <stop offset="1" stop-color="#F39A38"/>
