    <path d="M70 182 C66 160 72 142 84 128" fill="none" stroke="#B9783E" stroke-width="7" stroke-linecap="round"/>
    <path d="M44 192 C90 168 140 134 200 86" fill="none" stroke="#DDA56E" stroke-width="4" stroke-linecap="round"/>
