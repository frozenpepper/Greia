  </g>
  <g id="wood">
    <path d="M28 206 C80 180 140 140 226 70" fill="none" stroke="#4B372F" stroke-width="26" stroke-linecap="round"/>
    <path d="M118 150 C134 112 140 88 136 52" fill="none" stroke="#4B372F" stroke-width="18" stroke-linecap="round"/>
    <path d="M70 182 C66 160 72 142 84 128" fill="none" stroke="#4B372F" stroke-width="15" stroke-linecap="round"/>
    <path d="M28 206 C80 180 140 140 226 70" fill="none" stroke="#B9783E" stroke-width="17" stroke-linecap="round"/>
