<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Officina dei Suoni picture "sea" (IT mare): open sea with rolling waves seen through a rounded frame. Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
  <defs>
    <clipPath id="sea_frame">
      <rect x="22" y="34" width="212" height="188" rx="40"/>
    </clipPath>
    <!-- ocean light (mix 35% white) -> ocean -->
    <linearGradient id="sea_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="236" rx="84" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="sea" clip-path="url(#sea_frame)">
    <rect x="22" y="34" width="212" height="188" fill="#CFEAF7"/>
    <path d="M22 110 L234 110 L234 222 L22 222 Z" fill="#9BC2EA"/>
    <path d="M22 132 C44 116 66 116 88 132 C110 148 132 148 154 132 C176 116 198 116 220 132 C226 136 230 138 234 138 L234 222 L22 222 Z" fill="url(#sea_water)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M22 176 C44 160 66 160 88 176 C110 192 132 192 154 176 C176 160 198 160 220 176 C226 180 230 182 234 182 L234 222 L22 222 Z" fill="#3E7BBA" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M70 124 C78 120 84 122 88 128 M136 140 C144 136 150 136 154 132 M198 124 C206 120 212 122 216 128" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 168 C52 164 58 166 62 172 M110 184 C118 180 124 180 128 176 M174 168 C182 164 188 166 192 172" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g id="frame">
    <rect x="22" y="34" width="212" height="188" rx="40" fill="none" stroke="#4B372F" stroke-width="5"/>
    <ellipse cx="62" cy="56" rx="18" ry="6" fill="#FFFFFF" opacity="0.7" transform="rotate(-12 62 56)"/>
  </g>
</svg>
