<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="sound_workshop_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#sound_workshop_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <g id="shadow">
    <ellipse cx="180" cy="220" rx="44" ry="7" fill="#8E5F33" opacity="0.18"/>
  </g>
  <!-- hero: a round, friendly open mouth saying the first sound -->
  <g id="subject_mouth" stroke="#4B372F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 104 C30 76 54 62 88 62 C122 62 146 76 146 104 C146 138 120 164 88 164 C56 164 30 138 30 104 Z" fill="#D85683"/>
    <path d="M50 104 C50 88 66 82 88 82 C110 82 126 88 126 104 C126 128 110 144 88 144 C66 144 50 128 50 104 Z" fill="#6A3040"/>
    <path d="M58 90 C70 84 106 84 118 90 L116 102 C102 106 74 106 60 102 Z" fill="#FFFBEB" stroke-width="3.5"/>
    <path d="M62 132 C68 118 108 118 114 132 C106 140 98 144 88 144 C78 144 70 140 62 132 Z" fill="#F46F61" stroke-width="3.5"/>
    <path d="M44 86 C50 78 58 74 66 72" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.6"/>
  </g>
  <!-- the sound travels out ... -->
  <g id="accent_waves" fill="none" stroke="#FFFBEB" stroke-width="8" stroke-linecap="round">
    <path d="M164 82 Q174 104 164 126"/>
    <path d="M184 68 Q200 104 184 140" opacity="0.8"/>
  </g>
  <!-- ... onto its wooden letter tile -->
  <g id="accent_tile" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <rect x="136" y="140" width="84" height="76" rx="14" fill="#B87735" stroke-width="4.5"/>
    <rect x="143" y="145" width="70" height="62" rx="10" fill="#EEDDBA" stroke="none"/>
    <path d="M157 196 L157 158 L178 184 L199 158 L199 196" fill="none" stroke="#4A91D8" stroke-width="10"/>
  </g>
</svg>
