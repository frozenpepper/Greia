[activity]
id = "org.greia.la-discesa-della-biglia"
legacy_ids = []
title_key = "activity.la_discesa_della_biglia.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
