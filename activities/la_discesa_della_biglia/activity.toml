skills = [
  { id = "physics.motion.gravity", weight = 3 },
  { id = "physics.collision.bounce", weight = 3 },
  { id = "spatial.planning.tool_placement", weight = 3 },
  { id = "motor.pointer.drag_and_drop", weight = 2 },
  { id = "cognition.cause_and_effect", weight = 2 },
]
events = [
  { id = "ramp.run_started", kind = "milestone" },
  { id = "ramp.tool_placed", kind = "milestone" },
  { id = "ramp.basket_hit", kind = "milestone" },
  { id = "ramp.basket_missed", kind = "milestone" },
  { id = "ramp.level_completed", kind = "completion" },
  { id = "ramp.personal_best", kind = "score", score_order = "lower_better" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
