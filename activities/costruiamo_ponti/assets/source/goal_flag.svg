<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="carrot_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="goal_sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#goal_sh)">
    <!-- Wooden Pole -->
    <rect x="20" y="20" width="10" height="160" rx="5" fill="#B45309" stroke="#451A03" stroke-width="3"/>
    <circle cx="25" cy="20" r="8" fill="#FACC15" stroke="#451A03" stroke-width="3"/>
    
    <!-- Golden Goal Flag Banner -->
    <polygon points="30,28 110,56 30,84" fill="#FACC15" stroke="#0F172A" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="32,36 96,56 32,76" fill="#FEF08A"/>
    
    <!-- Shiny Golden Carrot Trophy -->
    <g transform="translate(65, 110)">
      <!-- Green Leaves -->
      <path d="M 0 -12 C -8 -26, -18 -18, -4 -6" fill="#22C55E" stroke="#14532D" stroke-width="2.5"/>
      <path d="M 0 -12 C 0 -30, 10 -26, 2 -6" fill="#4ADE80" stroke="#14532D" stroke-width="2.5"/>
      <path d="M 0 -12 C 8 -26, 18 -18, 4 -6" fill="#22C55E" stroke="#14532D" stroke-width="2.5"/>
      
      <!-- Carrot Body -->
      <path d="M -18 -6 C -20 18, -6 38, 0 46 C 6 38, 20 18, 18 -6 Z" fill="url(#carrot_grad)" stroke="#0F172A" stroke-width="3.5"/>
      
      <!-- Ridge Lines -->
      <path d="M -10 6 Q 0 8 8 4 M -8 18 Q 0 20 6 16 M -4 30 Q 0 32 4 28" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Specular Highlight -->
      <circle cx="-6" cy="4" r="3.5" fill="#FED7AA"/>
    </g>
  </g>
</svg>