<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="bridge_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- ocean light -> ocean -->
    <linearGradient id="bridge_river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#bridge_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <g id="shadow">
