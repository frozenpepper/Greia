    <path d="M174 134 L216 134 C221 134 224 137 224 142 L224 152 L164 152 L164 144 C164 138 168 134 174 134 Z" fill="#59B86A"/>
    <path d="M42 140 L80 140 M176 140 L214 140" fill="none" stroke="#A4D8AD" stroke-width="4" stroke-linecap="round"/>
