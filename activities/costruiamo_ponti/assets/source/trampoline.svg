<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <defs>
    <linearGradient id="tramp_frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="tramp_bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="tramp_sh" x="-5%" y="-10%" width="110%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#tramp_sh)">
    <!-- Steel Legs / Spring Supports -->
    <path d="M 60 48 L 40 72 M 160 48 L 150 72 M 320 48 L 330 72 M 420 48 L 440 72" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="72" r="5" fill="#1E293B"/>
    <circle cx="150" cy="72" r="5" fill="#1E293B"/>
    <circle cx="330" cy="72" r="5" fill="#1E293B"/>
    <circle cx="440" cy="72" r="5" fill="#1E293B"/>
    
    <!-- Outer Bumper Frame -->
    <rect x="20" y="12" width="440" height="40" rx="20" fill="url(#tramp_frame)" stroke="#0F172A" stroke-width="5"/>
    
    <!-- Yellow Elastic Bounce Bed -->
    <rect x="44" y="20" width="392" height="24" rx="12" fill="url(#tramp_bed)" stroke="#B45309" stroke-width="2.5"/>
    
    <!-- Crosshatch Safety Stitching -->
    <line x1="80" y1="20" x2="80" y2="44" stroke="#D97706" stroke-width="2"/>
    <line x1="140" y1="20" x2="140" y2="44" stroke="#D97706" stroke-width="2"/>
    <line x1="200" y1="20" x2="200" y2="44" stroke="#D97706" stroke-width="2"/>
    <line x1="240" y1="20" x2="240" y2="44" stroke="#D97706" stroke-width="2.5"/>
    <line x1="280" y1="20" x2="280" y2="44" stroke="#D97706" stroke-width="2"/>
    <line x1="340" y1="20" x2="340" y2="44" stroke="#D97706" stroke-width="2"/>
    <line x1="400" y1="20" x2="400" y2="44" stroke="#D97706" stroke-width="2"/>
  </g>
</svg>