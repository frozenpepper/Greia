<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="stone_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="stone_top_bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="stone_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#stone_shadow)">
    <!-- Main Ashlar Stone Block -->
    <rect x="32" y="32" width="192" height="192" rx="36" fill="url(#stone_body)" stroke="#0F172A" stroke-width="6"/>
    
    <!-- 3D Beveled Top Facet -->
    <rect x="40" y="40" width="176" height="60" rx="24" fill="url(#stone_top_bevel)"/>
    
    <!-- Chiseled Brick Grooves -->
    <line x1="40" y1="128" x2="216" y2="128" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <line x1="40" y1="131" x2="216" y2="131" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <line x1="128" y1="40" x2="128" y2="128" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="130" y1="40" x2="130" y2="128" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <line x1="90" y1="128" x2="90" y2="216" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="128" x2="92" y2="216" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <line x1="170" y1="128" x2="170" y2="216" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="172" y1="128" x2="172" y2="216" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Weathered Stone Pitting -->
    <circle cx="70" cy="75" r="4" fill="#64748B" opacity="0.6"/>
    <circle cx="165" cy="85" r="5" fill="#475569" opacity="0.6"/>
    <circle cx="135" cy="170" r="4.5" fill="#1E293B" opacity="0.6"/>
    <circle cx="60" cy="180" r="3.5" fill="#1E293B" opacity="0.6"/>
  </g>
</svg>