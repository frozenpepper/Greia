[activity]
id = "org.greia.costruiamo-ponti"
legacy_ids = []
title_key = "activity.costruiamo_ponti.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["learn", "play"]
discovery_tags = ["building", "puzzles"]

[achievement_art]
emblems = [
  { id = "activity", asset = "assets/icon.png" },
]

[education]
# Bridge Builders: measuring and early engineering. A friend must cross a
# river to the picnic; the child compares plank lengths with the gap (one
# board = one unit of water), stands planks on the river's hinges, stands a
# pillar on a rock when a gap is too wide for any plank, and chooses a stone
# slab when the friend carries a heavy pumpkin. GO is the test: a short plank
# stops the friend at the edge, a thin plank bends under a heavy load. Four
# fixed sets of four crossings (long enough -> two rivers -> pillars -> heavy
# friends); no adaptive difficulty. Stops bring a demonstration, never a
# penalty, and nothing is timed.
categories = ["measurement", "physics_intuition", "construction"]
difficulty = 3
recommended_age_min = 5
recommended_age_max = 7
skills = [
  { id = "math.comparison.length_height", weight = 3 },
  { id = "math.measurement.non_standard_units", weight = 3 },
  { id = "math.comparison.weight", weight = 2 },
  { id = "physics.structure.support", weight = 2 },
  { id = "cognition.planning.test_and_fix", weight = 1 },
]
events = [
  { id = "bridge.plank_placed", kind = "milestone" },
  { id = "bridge.test_started", kind = "milestone" },
  { id = "bridge.level_completed", kind = "completion" },  # one crossing (platform star/achievement key)
  { id = "bridge.crossing_missed", kind = "milestone" },
  { id = "bridge.set_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
# Drag/tap on the river plus kit focus (arrows / D-pad / stick + Space /
# south button) over tray, spans, rocks and GO: every action works without a
# pointer.
profile = "hybrid"

[requirements]
required_capabilities = ["display"]
optional_capabilities = ["keyboard", "pointer", "touch", "audio.basic"]

[permissions]
requested = []

[storage]
# Platform save schema stays 1: the progress payload carries its own version
# (ponti_services.SCHEMA_VERSION) and keeps the first release's star count.
schema_version = 1
