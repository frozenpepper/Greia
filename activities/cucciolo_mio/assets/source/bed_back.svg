<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
  <!-- Cucciolo Mio prop.pet.bed (back layer): rim + cushion. The pet sits on it; bed_front covers its paws. -->
  <defs>
    <!-- coral light (mix 40% white) -> coral -->
    <linearGradient id="bed_back_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A9A0"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
    <!-- sky light -> sky -->
    <linearGradient id="bed_back_cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF6FC"/>
      <stop offset="1" stop-color="#CFEAF7"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="256" cy="234" rx="206" ry="14" fill="#6A5147" opacity="0.15"/>
  </g>
  <g id="bed_back">
    <ellipse cx="256" cy="148" rx="214" ry="82" fill="url(#bed_back_rim)" stroke="#4B372F" stroke-width="3.5"/>
    <path d="M104 92 Q176 70 252 68" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="256" cy="150" rx="176" ry="52" fill="url(#bed_back_cushion)" stroke="#4B372F" stroke-width="3"/>
    <path d="M142 132 Q256 116 370 132" fill="none" stroke="#A9CDE0" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
