<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="starGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>

  <!-- Outer Soft Glow -->
  <circle cx="50" cy="50" r="44" fill="#fef08a" opacity="0.4"/>

  <!-- 3D Faceted Golden Star -->
  <polygon points="50,10 62,36 90,38 68,58 75,86 50,71 25,86 32,58 10,38 38,36" fill="url(#starGlow)" stroke="#854d0e" stroke-width="3"/>

  <!-- Facet Highlight Lines -->
  <line x1="50" y1="10" x2="50" y2="71" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="90" y1="38" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="75" y1="86" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="25" y1="86" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="10" y1="38" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Center Specular Sparkle -->
  <circle cx="44" cy="40" r="5" fill="#ffffff"/>
</svg>