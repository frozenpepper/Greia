  <!-- Golden Goal Star at Center -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="22" fill="#FFFBEB" stroke="#FFA000" stroke-width="4"/>
    <polygon points="0,-15 4,-4 15,-4 7,3 10,14 0,7 -10,14 -7,3 -15,-4 -4,-4" fill="#FBBF24" stroke="#4B372F" stroke-width="2" stroke-linejoin="round"/>
  </g>
