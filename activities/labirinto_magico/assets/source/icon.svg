  <path d="M60 60 L196 60 L196 196 L60 196 Z" fill="none" stroke="#2E7D32" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M60 128 L160 128 L160 96 L96 96 L96 164 L160 164" fill="none" stroke="#43A047" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
