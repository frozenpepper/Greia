<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="maze_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <!-- Maze Ground Plate -->
  <rect x="28" y="28" width="200" height="200" rx="36" fill="url(#maze_bg)" stroke="#81C784" stroke-width="8"/>
