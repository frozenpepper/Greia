<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="word_forest_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- leaf light -> leaf -->
    <linearGradient id="word_forest_crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93D19E"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#word_forest_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <g id="shadow">
    <ellipse cx="104" cy="220" rx="58" ry="8" fill="#8E5F33" opacity="0.18"/>
  </g>
  <g id="subject_tree" stroke-linejoin="round" stroke-linecap="round">
    <path d="M92 220 C98 196 98 170 94 146 L118 146 C114 170 114 196 120 220 Z" fill="#B87735" stroke="#4B372F" stroke-width="4.5"/>
    <path d="M60 150 C34 150 26 118 46 104 C36 78 62 54 86 64 C96 38 136 38 146 62 C170 54 192 78 180 102 C198 118 188 150 164 150 Z" fill="url(#word_forest_crown)" stroke="#51714A" stroke-width="4.5"/>
    <ellipse cx="80" cy="82" rx="14" ry="8" fill="#FFFFFF" opacity="0.6" transform="rotate(-20 80 82)"/>
    <!-- small letter fruits still on the branches -->
    <g stroke="#4B372F" stroke-width="3.5">
      <circle cx="76" cy="122" r="12" fill="#D85683"/>
      <circle cx="106" cy="134" r="10" fill="#9464C9"/>
      <circle cx="132" cy="96" r="12" fill="#FFC234"/>
    </g>
  </g>
  <!-- the letter the child catches, dropping into the basket -->
  <g id="accent_motion" fill="none" stroke="#FFFBEB" stroke-width="6" stroke-linecap="round">
    <path d="M190 90 L193 102 M207 88 L209 99"/>
  </g>
  <g id="subject_letter" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="178" cy="138" r="30" fill="#FFFBEB" stroke-width="4.5"/>
    <ellipse cx="166" cy="123" rx="7" ry="4.5" fill="#FFFFFF" stroke="none" transform="rotate(-30 166 123)"/>
    <path d="M164 154 L178 119 L192 154 M169 143 L187 143" fill="none" stroke="#4A91D8" stroke-width="8"/>
  </g>
  <g id="subject_basket" stroke="#4B372F" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="182" cy="226" rx="50" ry="7" fill="#8E5F33" opacity="0.18" stroke="none"/>
    <path d="M136 188 L228 188 L218 220 C217 224 214 226 210 226 L154 226 C150 226 147 224 146 220 Z" fill="#B87735" stroke-width="4.5"/>
    <path d="M140 204 L224 204 M160 190 L163 224 M182 190 L182 224 M204 190 L201 224" fill="none" stroke="#976433" stroke-width="3"/>
    <rect x="128" y="176" width="108" height="18" rx="9" fill="#C98136" stroke-width="4.5"/>
    <path d="M140 182 L176 182" fill="none" stroke="#F6D9B0" stroke-width="4" opacity="0.85"/>
  </g>
</svg>
