[activity]
id = "org.greia.foresta-parole"
legacy_ids = []
title_key = "activity.foresta_parole.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["learn", "play"]
discovery_tags = ["words"]

[education]
# The Word Forest: action practice for letter names learnt in Leo's Letter
# Garden. A picture word is shown and spoken with its letter name ("B as Boat");
# letters drop from the canopy and the child steers a basket under the letter
# that starts the word. Stages of the same loop: faster drops, more decoys,
# then look-alike decoys; the next round adapts to how this one went. Letter
# sounds are not taught here (Dani's Sound Machine owns them).
categories = ["language", "letter_knowledge", "motor_skills"]
difficulty = 3
recommended_age_min = 5
recommended_age_max = 7
difficulty_min = 1
difficulty_max = 4
adaptive_difficulty = true
skills = [
  { id = "language.letter_recognition", weight = 3 },
  { id = "language.letter_names", weight = 2 },
  { id = "motor.coordination.hand_eye", weight = 2 },
]
events = [
  { id = "letter.matched", kind = "milestone" },
  { id = "forest.round_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "directional"

[requirements]
required_capabilities = ["display", "audio.basic"]
optional_capabilities = ["pointer", "touch", "keyboard"]

[permissions]
requested = []

[storage]
# Platform save schema stays 1: progress payload carries its own version
# (foresta_services.SCHEMA_VERSION) and reads older saves in place.
schema_version = 1
