<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
<!-- E4-A Elephant: afternoon savanna waterhole. The front ear and trunk are
     live page puppets (they flap / curl / spray), so the baked elephant stops
     at the head; flat body fills let the live parts match exactly. -->
<defs>
  <!-- sky light -> warm sand haze -->
  <linearGradient id="elephant_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D9E6"/><stop offset="1" stop-color="#F3E3B6"/></linearGradient>
  <!-- sand light -> sand/orange mix (dry grass plain) -->
  <linearGradient id="elephant_plain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D394"/><stop offset="1" stop-color="#D5B068"/></linearGradient>
  <!-- orange shade -> deeper earth -->
  <linearGradient id="elephant_ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFA261"/><stop offset="1" stop-color="#B98A50"/></linearGradient>
  <!-- ocean light -> ocean shade (waterhole) -->
  <linearGradient id="elephant_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC6E4"/><stop offset="1" stop-color="#4C88BE"/></linearGradient>
  <radialGradient id="elephant_sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7A3" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1024" height="600" fill="url(#elephant_sky)"/>
<g id="sun"><circle cx="352" cy="112" r="70" fill="url(#elephant_sun)"/><circle cx="352" cy="112" r="31" fill="#FFD25E"/><ellipse cx="343" cy="102" rx="11" ry="7" fill="#FFF3C4" opacity="0.8"/></g>
<g id="clouds" fill="#FFFDF4" opacity="0.85">
  <ellipse cx="610" cy="132" rx="46" ry="13"/><ellipse cx="632" cy="122" rx="26" ry="14"/>
  <ellipse cx="166" cy="168" rx="40" ry="11"/><ellipse cx="184" cy="160" rx="22" ry="12"/>
</g>
<g id="far_hills">
  <path d="M0 286 Q90 248 190 262 Q300 276 380 252 Q470 226 560 254 Q660 284 760 250 Q860 222 1024 258 V330 H0Z" fill="#C9D6AE"/>
  <path d="M0 304 Q140 280 260 294 Q420 312 560 290 Q720 268 860 290 Q950 302 1024 292 V340 H0Z" fill="#B8C998"/>
</g>
<g id="far_acacias" fill="#8EA77A">
  <path d="M146 300 L150 268 L155 268 L159 300Z"/><ellipse cx="152" cy="264" rx="46" ry="10"/><ellipse cx="140" cy="258" rx="24" ry="7"/>
  <path d="M884 306 L887 280 L891 280 L894 306Z"/><ellipse cx="889" cy="277" rx="36" ry="8"/>
  <path d="M676 296 L678 282 L681 282 L683 296Z"/><ellipse cx="680" cy="280" rx="20" ry="5"/>
</g>
<path id="plain" d="M0 312 Q160 300 330 310 Q520 322 700 306 Q870 294 1024 306 V600 H0Z" fill="url(#elephant_plain)"/>
<g id="plain_grass" stroke="#B9934E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
  <path d="M60 352 l-4 -12 M66 352 l2 -14 M72 352 l6 -10"/>
  <path d="M330 340 l-3 -10 M336 340 l1 -12 M342 340 l5 -9"/>
  <path d="M690 336 l-3 -10 M696 336 l1 -12 M702 336 l5 -9"/>
  <path d="M960 350 l-4 -12 M966 350 l2 -14 M972 350 l6 -10"/>
</g>
<path id="ground" d="M0 420 Q200 404 420 416 Q640 428 820 410 Q930 400 1024 408 V600 H0Z" fill="url(#elephant_ground)"/>
<g id="waterhole">
