  <ellipse cx="822" cy="474" rx="164" ry="40" fill="url(#elephant_water)" stroke="#6E5139" stroke-width="3"/>
  <g fill="none" stroke="#D7EEF6" stroke-width="3" stroke-linecap="round" opacity="0.8"><path d="M712 462 Q740 455 768 462"/><path d="M820 488 Q850 481 880 488"/><path d="M890 458 Q910 453 930 458"/></g>
  <g stroke="#5E8F52" stroke-width="3" stroke-linecap="round" fill="none"><path d="M660 470 Q656 444 648 430"/><path d="M668 470 Q668 440 672 424"/><path d="M676 472 Q682 450 692 438"/></g>
</g>
<g id="rocks">
