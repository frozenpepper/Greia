  </g>
  <path d="M474 404 q14 5 28 0 M564 404 q14 5 28 0" fill="none" stroke="#7C8794" stroke-width="2.5"/>
  <g fill="#FFFBEB" stroke-width="2"><ellipse cx="476" cy="452" rx="6" ry="4.5"/><ellipse cx="488" cy="453" rx="6" ry="4.5"/><ellipse cx="500" cy="452" rx="6" ry="4.5"/><ellipse cx="566" cy="452" rx="6" ry="4.5"/><ellipse cx="578" cy="453" rx="6" ry="4.5"/><ellipse cx="590" cy="452" rx="6" ry="4.5"/></g>
  <ellipse cx="535" cy="258" rx="24" ry="43" fill="#86929F" stroke-width="3"/>
  <circle cx="575" cy="275" r="58" fill="#A3AEBA" stroke-width="3.5"/>
  <path d="M538 248 Q552 226 580 222" fill="none" stroke="#D3DBE2" stroke-width="7" opacity="0.8"/>
  <path d="M602 302 Q626 312 641 322 Q637 329 628 325 Q612 317 598 311Z" fill="#FFFBEB" stroke-width="2.5"/>
  <ellipse cx="606" cy="288" rx="11" ry="7" fill="#FDA4AF" stroke="none" opacity="0.55"/>
  <path d="M588 244 Q597 238 606 244" fill="none" stroke-width="3"/>
  <ellipse cx="597" cy="263" rx="7" ry="9" fill="#342C35" stroke="none"/>
  <circle cx="599.5" cy="259" r="2.8" fill="#FFFFFF" stroke="none"/>
</g>
<g id="foreground_tufts" stroke="#7E8B4B" stroke-width="3" stroke-linecap="round" fill="none">
  <path d="M168 520 l-6 -18 M176 520 l0 -22 M184 520 l7 -16"/>
  <path d="M822 560 l-6 -18 M830 560 l0 -22 M838 560 l7 -16"/>
