  <!-- coral light -> coral -->
  <linearGradient id="mercury_glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F68C81"/><stop offset="1" stop-color="#F46F61"/></linearGradient>
</defs>
