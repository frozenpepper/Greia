<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
<defs>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
    <feOffset dy="8"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tightshadow" x="-10%" y="-10%" width="120%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dy="3"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <radialGradient id="spaceSky" cx="0.5" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#1a2240"/>
    <stop offset="0.6" stop-color="#0e1530"/>
    <stop offset="1" stop-color="#060a1a"/>
  </radialGradient>
  <radialGradient id="planetGrad" cx="0.4" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#f6d998"/>
    <stop offset="0.5" stop-color="#d2a05c"/>
    <stop offset="0.9" stop-color="#8a5a26"/>
    <stop offset="1" stop-color="#4e3010"/>
  </radialGradient>
  <radialGradient id="atmosphere">
    <stop offset="0" stop-color="#f5d998" stop-opacity="0.0"/>
    <stop offset="0.85" stop-color="#f5d998" stop-opacity="0.0"/>
    <stop offset="1" stop-color="#f5d998" stop-opacity="0.25"/>
  </radialGradient>
  <linearGradient id="rings" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e8c97a" stop-opacity="0.3"/>
    <stop offset="0.5" stop-color="#f6d998"/>
    <stop offset="1" stop-color="#e8c97a" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2b22"/>
    <stop offset="1" stop-color="#1a0f0a"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a4704a"/>
    <stop offset="1" stop-color="#5b3520"/>
  </linearGradient>
</defs>

<!-- Deep space sky with starfield -->
<rect width="1024" height="600" fill="url(#spaceSky)"/>
<g fill="#f1eecf">
  <circle cx="60" cy="80" r="1.4"/>
  <circle cx="150" cy="40" r="1"/>
  <circle cx="220" cy="110" r="1.6"/>
  <circle cx="320" cy="60" r="1.2"/>
  <circle cx="420" cy="100" r="1"/>
  <circle cx="510" cy="40" r="1.5"/>
  <circle cx="630" cy="90" r="1.2"/>
  <circle cx="730" cy="40" r="1.8"/>
  <circle cx="830" cy="120" r="1.2"/>
  <circle cx="900" cy="60" r="1"/>
  <circle cx="980" cy="100" r="1.5"/>
  <circle cx="80" cy="220" r="1"/>
  <circle cx="280" cy="200" r="1.2"/>
  <circle cx="600" cy="220" r="1.4"/>
  <circle cx="780" cy="210" r="1"/>
  <circle cx="960" cy="220" r="1.2"/>
</g>
<g fill="#9bb4dd">
  <circle cx="120" cy="60" r="2"/>
  <circle cx="700" cy="70" r="2"/>
  <circle cx="900" cy="160" r="2"/>
</g>
<!-- Small accent star -->
<g transform="translate(180 130)">
  <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#fff5d8" opacity="0.95"/>
</g>
<g transform="translate(800 200)">
  <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5Z" fill="#fff5d8" opacity="0.9"/>
</g>

<!-- Distant nebula glow -->
<ellipse cx="350" cy="180" rx="220" ry="60" fill="#7a5a9a" opacity="0.18"/>
<ellipse cx="780" cy="260" rx="180" ry="50" fill="#5a7a9a" opacity="0.16"/>

<!-- Ground (observatory floor) -->
<path d="M0 470 H1024 V600 H0Z" fill="url(#ground)"/>
<path d="M0 470 H1024" stroke="#5b3520" stroke-width="3" opacity="0.6"/>
<ellipse cx="512" cy="478" rx="380" ry="14" fill="#0a0500" opacity="0.4"/>

<!-- ============ Hero Saturn (centered, dominant) ============ -->
<g transform="translate(512 290)" filter="url(#softshadow)">
  <!-- Atmospheric halo -->
  <circle r="160" fill="url(#atmosphere)"/>
  <!-- Back ring (behind planet) -->
  <g transform="rotate(-18)">
    <ellipse rx="190" ry="32" fill="none" stroke="url(#rings)" stroke-width="14"/>
    <ellipse rx="190" ry="32" fill="none" stroke="#f0d58a" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Planet -->
  <circle r="118" fill="url(#planetGrad)"/>
  <!-- Banding detail -->
  <g fill="none" stroke="#8a5a26" stroke-width="2" opacity="0.55">
    <path d="M-110 -20 Q0 -28 110 -20"/>
    <path d="M-114 4 Q0 -4 114 4"/>
    <path d="M-110 30 Q0 22 110 30"/>
    <path d="M-104 56 Q0 50 104 56"/>
  </g>
  <g fill="none" stroke="#f6d998" stroke-width="2" opacity="0.5">
    <path d="M-108 -10 Q0 -16 108 -10"/>
    <path d="M-100 18 Q0 14 100 18"/>
    <path d="M-90 44 Q0 38 90 44"/>
  </g>
  <!-- Light highlight on planet -->
  <ellipse cx="-30" cy="-40" rx="60" ry="30" fill="#fff" opacity="0.18"/>
  <!-- Storm spot -->
  <ellipse cx="40" cy="34" rx="20" ry="8" fill="#a85a18" opacity="0.5"/>
  <!-- Front ring (in front of planet) -->
  <g transform="rotate(-18)">
    <path d="M-190 0 A190 32 0 0 0 190 0" fill="none" stroke="url(#rings)" stroke-width="14"/>
    <path d="M-190 0 A190 32 0 0 0 190 0" fill="none" stroke="#f0d58a" stroke-width="2" opacity="0.6"/>
    <!-- Cassini-like gap -->
    <path d="M-160 -2 A160 8 0 0 0 160 -2" fill="none" stroke="#1a0f0a" stroke-width="2" opacity="0.6"/>
  </g>
</g>

<!-- Telescope (left foreground) - bigger and Leo leans over it -->
<g transform="translate(228 360)" filter="url(#softshadow)">
  <!-- Tripod legs -->
  <line x1="-2" y1="20" x2="-46" y2="118" stroke="#5b3520" stroke-width="6" stroke-linecap="round"/>
  <line x1="0" y1="20" x2="48" y2="118" stroke="#5b3520" stroke-width="6" stroke-linecap="round"/>
  <line x1="-2" y1="20" x2="0" y2="118" stroke="#5b3520" stroke-width="6" stroke-linecap="round"/>
  <!-- Mount -->
  <rect x="-16" y="6" width="32" height="20" rx="4" fill="#7a4a2c" stroke="#3a2110" stroke-width="2"/>
  <!-- Telescope barrel -->
  <g transform="rotate(-22)">
    <rect x="-50" y="-12" width="100" height="24" rx="6" fill="url(#wood)" stroke="#3a2110" stroke-width="2"/>
    <rect x="-50" y="-12" width="14" height="24" rx="3" fill="#3a2110"/>
    <rect x="36" y="-12" width="14" height="24" rx="3" fill="#3a2110"/>
    <circle cx="-50" cy="0" r="8" fill="#5b8db0" stroke="#3a5e7a" stroke-width="2"/>
    <circle cx="-50" cy="0" r="5" fill="#3a5e7a"/>
  </g>
  <!-- Eyepiece -->
  <g transform="rotate(20) translate(0 22)">
    <rect x="-5" y="0" width="10" height="14" fill="#3a2110"/>
    <ellipse cx="0" cy="0" rx="6" ry="2" fill="#5b8db0"/>
  </g>
</g>

<!-- Star chart / table surface detail (foreground bottom-left) -->
<g transform="translate(120 510)" filter="url(#tightshadow)">
  <rect x="-40" y="-30" width="80" height="50" rx="3" fill="#e8c97a" stroke="#7a4a2c" stroke-width="2"/>
  <g fill="#5a2a08">
    <circle cx="-20" cy="-10" r="2"/>
    <circle cx="-10" cy="-15" r="1.5"/>
    <circle cx="0" cy="-5" r="2"/>
    <circle cx="14" cy="-12" r="1.8"/>
    <circle cx="22" cy="0" r="2"/>
    <circle cx="-25" cy="6" r="1.5"/>
    <circle cx="6" cy="10" r="1.8"/>
  </g>
  <g stroke="#5a2a08" stroke-width="1" fill="none" opacity="0.5">
    <line x1="-20" y1="-10" x2="0" y2="-5"/>
    <line x1="14" y1="-12" x2="22" y2="0"/>
  </g>
</g>

<!-- Star map compass on right side -->
<g transform="translate(880 200)" filter="url(#tightshadow)">
  <circle r="38" fill="#e8c97a" stroke="#7a4a2c" stroke-width="2"/>
  <circle r="30" fill="#fff5d8" stroke="#7a4a2c" stroke-width="1.5"/>
  <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="10" fill="#5a2a08" font-weight="bold">N</text>
  <text x="0" y="28" text-anchor="middle" font-family="Arial" font-size="9" fill="#5a2a08">S</text>
  <text x="-22" y="4" text-anchor="middle" font-family="Arial" font-size="9" fill="#5a2a08">W</text>
  <text x="22" y="4" text-anchor="middle" font-family="Arial" font-size="9" fill="#5a2a08">E</text>
  <line x1="-30" y1="0" x2="30" y2="0" stroke="#7a4a2c" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="-30" x2="0" y2="30" stroke="#7a4a2c" stroke-width="1" opacity="0.5"/>
  <g transform="rotate(45)">
    <polygon points="0,-26 3,-18 -3,-18" fill="#5a2a08"/>
  </g>
</g>

<!-- Subtle star-field grain overlay -->
<rect width="1024" height="600" filter="url(#grain)" opacity="0.5" pointer-events="none"/>
</svg>
