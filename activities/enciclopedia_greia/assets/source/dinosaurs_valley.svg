    <circle cx="662" cy="198" r="3.5" fill="#342C35"/>
    <path d="M668 207 q4 3 8 -1" fill="none" stroke="#342C35" stroke-width="2" stroke-linecap="round"/>
    <path d="M634 226 C632 246 632 266 636 284" fill="none" stroke="#C3ECE7" stroke-width="4" stroke-linecap="round"/>
    <g fill="#2E8C82"><circle cx="560" cy="318" r="7"/><circle cx="586" cy="330" r="5"/><circle cx="536" cy="326" r="5"/></g>
  </g>

  <g id="meat_eater">
    <!-- two-legged meat eater, front left -->
    <ellipse cx="398" cy="422" rx="66" ry="8" fill="#6A5147" opacity="0.18"/>
    <path d="M352 330 C370 318 392 330 390 352 C388 370 380 386 380 402 L392 418 L358 418 L362 400 C356 380 342 352 352 330 Z" fill="#4E9A5C" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300 350 C330 330 350 300 380 292 C400 286 418 282 430 268 C432 246 452 236 476 240 C496 242 508 252 508 266 L506 278 C504 284 498 288 490 288 L464 290 C456 302 448 318 434 334 C422 352 402 362 380 360 C356 358 328 356 300 350 Z" fill="url(#dinosaurs_valley_rex)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M392 322 C414 312 436 328 432 352 C430 372 420 388 418 404 L432 420 L396 420 L398 402 C392 380 380 344 392 322 Z" fill="#59B86A" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M400 330 C408 324 418 324 424 330" fill="none" stroke="#A8DCA5" stroke-width="4" stroke-linecap="round"/>
    <path d="M452 304 C460 306 466 312 466 320" fill="none" stroke="#4B372F" stroke-width="7" stroke-linecap="round"/>
    <path d="M452 304 C460 306 466 312 466 320" fill="none" stroke="#59B86A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M454 252 C462 246 474 244 484 246" fill="none" stroke="#C6EBCB" stroke-width="5" stroke-linecap="round"/>
    <circle cx="482" cy="258" r="6" fill="#FFFFFF" stroke="#4B372F" stroke-width="2"/>
    <circle cx="484" cy="258" r="3.5" fill="#342C35"/>
    <path d="M478 280 C488 284 498 282 504 276" fill="none" stroke="#4B372F" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#3F8F4E"><circle cx="372" cy="306" r="6"/><circle cx="350" cy="320" r="5"/><circle cx="394" cy="300" r="4"/></g>
  </g>

  <g id="three_horn">
    <!-- horned plant eater with a big neck frill, front right (faces left) -->
    <ellipse cx="626" cy="430" rx="78" ry="8" fill="#6A5147" opacity="0.18"/>
    <g fill="#D97F28" stroke="#4B372F" stroke-width="3">
      <rect x="664" y="396" width="20" height="32" rx="8"/>
      <rect x="590" y="398" width="20" height="30" rx="8"/>
    </g>
    <path d="M590 366 C610 346 664 344 692 360 C704 368 712 378 726 390 C712 392 704 392 700 398 C690 412 620 418 596 408 C584 398 582 380 590 366 Z" fill="url(#dinosaurs_valley_horn)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="#F39A38" stroke="#4B372F" stroke-width="3">
      <rect x="682" y="398" width="20" height="30" rx="8"/>
      <rect x="610" y="400" width="20" height="28" rx="8"/>
    </g>
    <path d="M610 360 C630 352 656 352 672 356" fill="none" stroke="#FCDDB5" stroke-width="5" stroke-linecap="round"/>
    <!-- frill, face, horns -->
    <path d="M598 384 C590 352 566 336 546 344 C532 350 534 372 548 394 Z" fill="#F46F61" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#F7A097"><circle cx="572" cy="356" r="4"/><circle cx="586" cy="366" r="4"/><circle cx="560" cy="350" r="3.5"/></g>
    <path d="M574 384 C566 368 546 366 532 376 C522 384 520 396 528 404 C540 412 566 410 576 400 Z" fill="#F8BE7D" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M556 374 L528 354 L558 368 Z M570 372 L548 346 L574 366 Z" fill="#FFFBEB" stroke="#4B372F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M530 386 L520 378 L534 382 Z" fill="#FFFBEB" stroke="#4B372F" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="550" cy="384" r="3.5" fill="#342C35"/>
    <path d="M532 398 C538 402 546 402 552 398" fill="none" stroke="#4B372F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g id="discovery_beds" stroke-linejoin="round">
    <!-- sky tokens on clouds, ground tokens on smooth river stones -->
    <g data-target="diversity" data-center="250,190" fill="#FFFDF6" stroke="#C9C0B8" stroke-width="2.5">
      <path d="M190 215 C176 215 172 197 186 193 C184 169 212 157 228 169 C240 147 276 149 282 171 C304 167 318 187 308 201 C322 207 318 223 302 223 L196 223 C190 223 188 219 190 215 Z"/>
    </g>
    <g data-target="time" data-center="755,190" fill="#FFFDF6" stroke="#C9C0B8" stroke-width="2.5">
      <path d="M695 215 C681 215 677 197 691 193 C689 169 717 157 733 169 C745 147 781 149 787 171 C809 167 823 187 813 201 C827 207 823 223 807 223 L701 223 C695 223 693 219 695 215 Z"/>
    </g>
    <g data-target="birds" data-center="250,420" fill="#D8CDB8" stroke="#4B372F" stroke-width="3">
      <ellipse cx="250" cy="424" rx="49" ry="45"/>
    </g>
    <g data-target="evidence" data-center="755,420" fill="#D8CDB8" stroke="#4B372F" stroke-width="3">
      <ellipse cx="755" cy="424" rx="49" ry="45"/>
    </g>
  </g>
</svg>
