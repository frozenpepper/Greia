    </g>
    <!-- cycad palm, right -->
    <path d="M872 400 C870 360 872 320 880 284" fill="none" stroke="#4B372F" stroke-width="12" stroke-linecap="round"/>
    <path d="M872 400 C870 360 872 320 880 284" fill="none" stroke="#9C6B43" stroke-width="7" stroke-linecap="round"/>
    <g fill="#59B86A" stroke="#3F6E3A" stroke-width="2.5" stroke-linejoin="round">
      <path d="M880 284 C860 264 830 262 808 276 C834 274 858 282 880 290 Z"/>
      <path d="M880 284 C876 256 856 238 834 236 C856 250 870 266 878 290 Z"/>
      <path d="M880 284 C894 256 918 246 942 250 C920 256 900 270 884 290 Z"/>
      <path d="M880 284 C904 272 932 276 950 292 C928 284 904 286 882 292 Z"/>
    </g>
    <!-- ferns -->
    <g fill="#6EC07C" stroke="#3F6E3A" stroke-width="2.5" stroke-linejoin="round">
      <path d="M300 440 C290 410 300 392 312 384 C312 404 318 420 316 440 Z"/>
      <path d="M318 440 C324 414 340 402 356 400 C346 414 336 428 330 442 Z"/>
      <path d="M690 446 C696 420 712 408 728 406 C718 420 708 434 702 448 Z"/>
    </g>
  </g>

