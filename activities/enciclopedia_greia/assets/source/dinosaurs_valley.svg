    <ellipse cx="572" cy="408" rx="92" ry="8" fill="#6A5147" opacity="0.15"/>
    <g fill="#36A397" stroke="#4B372F" stroke-width="3">
      <rect x="512" y="340" width="22" height="66" rx="9"/>
      <rect x="598" y="340" width="22" height="66" rx="9"/>
    </g>
    <path d="M488 330 C470 318 452 316 432 322 C452 306 478 298 500 302 C520 284 580 278 616 292 C626 266 624 236 628 214 C632 200 642 190 656 188 C674 186 684 196 680 206 C676 214 664 212 658 218 C650 236 648 266 660 300 C668 318 664 344 640 356 C600 370 520 368 496 352 C488 346 486 338 488 330 Z" fill="url(#dinosaurs_valley_neck)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="#44B8AE" stroke="#4B372F" stroke-width="3">
      <rect x="532" y="344" width="24" height="64" rx="10"/>
      <rect x="616" y="344" width="24" height="64" rx="10"/>
