<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <!-- Encyclopedia E4-E entry scene: Dinosaurs. Flattened opaque 1024x600 backdrop.
       A prehistoric valley showing three very different dinosaurs together:
       a two-legged meat eater (front left, feet ~y 420), a horned three-horn
       plant eater (front right, feet ~y 428) and a long-neck giant behind
       (feet ~y 405). The page's "diversity" discovery highlights one of them
       live; time / bird / evidence overlays stay live. Discovery beds sit
       exactly under the four semantic targets.
       Recipe: docs/design/GREIA_SVG_AUTHORING_RULES.md (scene). -->
  <defs>
    <!-- sky light -> peach light (warm hazy sky) -->
    <linearGradient id="dinosaurs_valley_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7EEF8"/>
      <stop offset="1" stop-color="#FCE9D6"/>
    </linearGradient>
    <!-- leaf light -> olive leaf (valley floor) -->
    <linearGradient id="dinosaurs_valley_ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD98F"/>
      <stop offset="1" stop-color="#93BF68"/>
    </linearGradient>
    <!-- leaf light -> leaf (meat eater) -->
    <linearGradient id="dinosaurs_valley_rex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD09C"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
    <!-- turquoise light -> turquoise (long neck) -->
    <linearGradient id="dinosaurs_valley_neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86D3CC"/>
      <stop offset="1" stop-color="#44B8AE"/>
    </linearGradient>
    <!-- orange light -> orange (three-horn) -->
    <linearGradient id="dinosaurs_valley_horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8BE7D"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
  </defs>

  <g id="sky">
    <rect width="1024" height="600" fill="url(#dinosaurs_valley_sky)"/>
  </g>

  <g id="far">
    <!-- volcano with a calm smoke puff, distant hills -->
    <path d="M40 330 L150 196 C160 186 186 186 196 196 L310 330 Z" fill="#C9B6A6" stroke="#9C8574" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M150 196 C160 210 186 210 196 196 L188 222 C178 230 164 228 158 220 Z" fill="#F39A38" stroke="#9C8574" stroke-width="2" stroke-linejoin="round"/>
    <path d="M160 176 C150 164 160 150 174 154 C178 138 200 136 206 150 C220 148 228 162 220 172 C214 180 168 182 160 176 Z" fill="#F4EEE6" stroke="#B9AFA6" stroke-width="2" stroke-linejoin="round"/>
    <path d="M600 330 C680 280 760 268 840 290 C900 270 970 272 1024 290 L1024 340 L600 340 Z" fill="#C8E3C2" stroke="#9CC394" stroke-width="2"/>
  </g>

  <g id="ground">
    <path d="M0 326 C160 316 320 320 512 326 C700 332 860 318 1024 324 L1024 600 L0 600 Z" fill="url(#dinosaurs_valley_ground)" stroke="#6F8F4A" stroke-width="2.5"/>
    <!-- small pond -->
    <ellipse cx="140" cy="512" rx="78" ry="20" fill="#7DB2E3" stroke="#4B372F" stroke-width="2.5"/>
    <path d="M100 506 H140" stroke="#CFEAF7" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#6F8F4A" stroke-width="2.5" stroke-linecap="round">
      <path d="M310 470 q8 -10 16 0"/><path d="M700 480 q8 -10 16 0"/><path d="M820 520 q8 -10 16 0"/><path d="M420 520 q8 -10 16 0"/>
    </g>
  </g>

  <g id="plants">
    <!-- cycad palm, left -->
    <path d="M128 420 C124 380 124 330 130 290" fill="none" stroke="#4B372F" stroke-width="12" stroke-linecap="round"/>
    <path d="M128 420 C124 380 124 330 130 290" fill="none" stroke="#9C6B43" stroke-width="7" stroke-linecap="round"/>
    <g fill="#59B86A" stroke="#3F6E3A" stroke-width="2.5" stroke-linejoin="round">
      <path d="M130 290 C110 270 80 268 58 282 C84 280 108 288 130 296 Z"/>
      <path d="M130 290 C126 262 106 244 84 242 C106 256 120 272 128 296 Z"/>
      <path d="M130 290 C144 262 168 252 192 256 C170 262 150 276 134 296 Z"/>
