<g fill="#355f31"><rect x="-5.5" y="-46.6" width="11" height="12" rx="2"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(30)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(60)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(90)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(120)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(150)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(180)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(210)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(240)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(270)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(300)"/><rect x="-5.5" y="-46.6" width="11" height="12" rx="2" transform="rotate(330)"/></g>
