<g transform="translate(180 80)" filter="url(#tightshadow)"><rect x="-44" y="0" width="88" height="56" fill="#2a4030" stroke="#5b3520" stroke-width="3"/><rect x="-40" y="4" width="80" height="48" fill="#1a3020"/><path d="M-30 12 L-20 18 L-10 10 L0 20 L10 14 L20 24" fill="none" stroke="#fff5d8" stroke-width="1.5"/><line x1="-30" y1="34" x2="20" y2="34" stroke="#fff5d8" opacity=".8"/></g>

<path d="M0 470 H1024 V600 H0Z" fill="url(#floor)"/>
