<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
<defs>
 <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="tightshadow" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="paperGrain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="17"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
 <linearGradient id="benchTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a07048"/><stop offset=".6" stop-color="#7a4a2c"/><stop offset="1" stop-color="#4e2a14"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b392e"/><stop offset="1" stop-color="#21130c"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3520"/><stop offset="1" stop-color="#2a1c14"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d8"/><stop offset="1" stop-color="#e8c97a"/></linearGradient>
</defs>
<rect width="1024" height="600" fill="url(#wall)"/>
<line x1="0" y1="180" x2="1024" y2="180" stroke="#6b4932" stroke-width="3" opacity=".7"/>
