<g transform="translate(78 230)" filter="url(#tightshadow)"><line x1="0" y1="-30" x2="0" y2="0" stroke="#6b4932" stroke-width="3"/><rect x="-10" y="0" width="20" height="36" rx="3" fill="#7a8a9a" stroke="#3a4452" stroke-width="2"/><path d="M-14 36 L-4 50 L4 50 L14 36Z" fill="#7a8a9a" stroke="#3a4452" stroke-width="2"/></g>
<g transform="translate(940 220)" filter="url(#tightshadow)"><line x1="0" y1="-30" x2="0" y2="-4" stroke="#6b4932" stroke-width="3"/><rect x="-3" y="-4" width="6" height="56" fill="#7a4a2c"/><rect x="-16" y="48" width="32" height="14" fill="#5b6a7a" stroke="#2a3340" stroke-width="2"/></g>
