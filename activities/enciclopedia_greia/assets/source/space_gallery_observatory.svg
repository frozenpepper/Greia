<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2340"/><stop offset="1" stop-color="#111424"/>
  </linearGradient>
  <radialGradient id="window" cx="50%" cy="44%" r="64%">
    <stop offset="0" stop-color="#243b72"/><stop offset="0.58" stop-color="#101a42"/><stop offset="1" stop-color="#090d25"/>
  </radialGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f1cf77"/><stop offset="0.48" stop-color="#b57a2c"/><stop offset="1" stop-color="#68421d"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b5735"/><stop offset="1" stop-color="#472a1d"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="23"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>

