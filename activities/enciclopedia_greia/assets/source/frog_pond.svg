<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
<!-- E4-A Frog: a quiet garden pond. The open water around (510,330) is the
     live life-cycle stage (eggs, tadpole, froglet, frog are page puppets). -->
<defs>
  <!-- sky light -> mint haze -->
  <linearGradient id="frog_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9E2EE"/><stop offset="1" stop-color="#E4F2D6"/></linearGradient>
  <!-- turquoise light -> ocean/turquoise shade (pond water) -->
  <linearGradient id="frog_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED8D2"/><stop offset="1" stop-color="#3F8E9A"/></linearGradient>
  <!-- leaf light -> leaf (banks) -->
  <linearGradient id="frog_bank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BCF86"/><stop offset="1" stop-color="#5FA25C"/></linearGradient>
  <!-- leaf -> leaf shade (lily pads) -->
  <linearGradient id="frog_pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC47A"/><stop offset="1" stop-color="#4F9655"/></linearGradient>
</defs>
<rect width="1024" height="600" fill="url(#frog_sky)"/>
<g id="clouds" fill="#FFFFFF" opacity="0.8"><ellipse cx="300" cy="118" rx="44" ry="12"/><ellipse cx="320" cy="109" rx="24" ry="13"/><ellipse cx="760" cy="96" rx="38" ry="10"/><ellipse cx="776" cy="89" rx="20" ry="10"/></g>
