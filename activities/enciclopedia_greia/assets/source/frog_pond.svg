  <ellipse data-target="cycle" data-center="255,200" cx="255" cy="247" rx="40" ry="6"/>
  <ellipse data-target="metamorphosis" data-center="750,200" cx="750" cy="247" rx="40" ry="6"/>
  <ellipse data-target="skin" data-center="255,415" cx="255" cy="462" rx="40" ry="6"/>
