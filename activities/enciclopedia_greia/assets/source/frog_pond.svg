  <path d="M0 210 Q40 160 90 176 Q130 140 180 166 Q230 150 260 186 Q330 170 380 196 Q460 180 520 200 Q600 176 660 196 Q720 158 780 180 Q840 150 900 176 Q960 160 1024 190 V260 H0Z" fill="#A7CC94"/>
  <path d="M0 236 Q120 214 250 230 Q400 246 540 228 Q700 210 850 230 Q950 240 1024 228 V280 H0Z" fill="#8DBE7E"/>
</g>
<path id="bank" d="M0 250 Q260 226 512 236 Q780 226 1024 250 V600 H0Z" fill="url(#frog_bank)"/>
<g id="pond">
  <path d="M96 352 Q110 262 300 250 Q512 236 730 250 Q930 262 940 356 Q930 452 720 470 Q512 486 300 470 Q100 452 96 352Z" fill="#7A6A4E"/>
  <path d="M108 352 Q122 270 304 260 Q512 248 726 260 Q918 272 928 356 Q918 444 716 460 Q512 476 304 460 Q118 444 108 352Z" fill="url(#frog_water)" stroke="#51714A" stroke-width="3"/>
  <g fill="none" stroke="#E2F5F1" stroke-width="3" stroke-linecap="round" opacity="0.75"><path d="M190 300 Q230 292 270 300"/><path d="M640 292 Q690 284 740 292"/><path d="M300 420 Q340 412 380 420"/><path d="M790 400 Q820 394 850 400"/></g>
  <g fill="#FFFFFF" opacity="0.35"><ellipse cx="420" cy="276" rx="60" ry="5"/><ellipse cx="610" cy="282" rx="40" ry="4"/></g>
</g>
<g id="lily_pads" stroke="#3F6E3A" stroke-width="2.5" stroke-linejoin="round" fill="url(#frog_pad)">
  <path d="M168 360 A54 18 0 1 1 222 378 L194 362Z"/>
  <path d="M830 330 A50 16 0 1 0 780 346 L806 332Z"/>
  <path d="M664 432 A44 14 0 1 1 708 446 L684 434Z"/>
  <path d="M352 296 A36 11 0 1 0 316 307 L334 298Z"/>
</g>
