  <path d="M326 484 Q330 458 362 456 Q392 452 404 470 Q412 484 400 486Z" fill="#B9AE9C"/>
  <path d="M394 486 Q398 468 420 468 Q440 468 444 486Z" fill="#A99D89"/>
  <path d="M344 466 Q356 460 372 462" fill="none" stroke="#E6DED0" stroke-width="4"/>
</g>
