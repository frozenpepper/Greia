    <path d="M-2 -10 L-4 -14 M2 -10 L4 -14" stroke="#1a1620" stroke-width="1.2"/>
  </g>
</g>

<!-- Penguin (430,410) - on a small ice floe by the water -->
<g data-target="penguin" data-center="430,410" transform="translate(390 360)" filter="url(#softshadow)">
  <ellipse cx="40" cy="100" rx="38" ry="6" fill="#2a1c14" opacity="0.25"/>
  <!-- ice floe -->
  <ellipse cx="40" cy="92" rx="44" ry="10" fill="#e0f0f5" stroke="#7e9aa6" stroke-width="1.5"/>
  <ellipse cx="20" cy="88" rx="10" ry="3" fill="#fff" opacity="0.8"/>
  <ellipse cx="56" cy="90" rx="8" ry="2" fill="#fff" opacity="0.6"/>
