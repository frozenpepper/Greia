<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
<defs>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
    <feOffset dy="8"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tightshadow" x="-10%" y="-10%" width="120%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dy="3"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="paperGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bce8e5"/>
    <stop offset="0.5" stop-color="#dff1c5"/>
    <stop offset="1" stop-color="#f0e2a4"/>
  </linearGradient>
  <linearGradient id="grassA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a6c98c"/>
    <stop offset="1" stop-color="#86b779"/>
  </linearGradient>
  <linearGradient id="grassB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7aac68"/>
    <stop offset="1" stop-color="#4f8d60"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fc1c5"/>
    <stop offset="1" stop-color="#3e8a9c"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c983"/>
    <stop offset="1" stop-color="#b88a55"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#fff5c2"/>
    <stop offset="0.55" stop-color="#ffd36a"/>
    <stop offset="1" stop-color="#e99a2d"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="1024" height="600" fill="url(#sky)"/>
<!-- Sun moved to top-LEFT corner, away from Back button area -->
<g transform="translate(86 78)">
  <circle r="38" fill="url(#sun)"/>
  <g stroke="#f5cf61" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="-52" y1="0" x2="-46" y2="0"/>
    <line x1="46" y1="0" x2="52" y2="0"/>
    <line x1="0" y1="-52" x2="0" y2="-46"/>
    <line x1="-36" y1="-36" x2="-32" y2="-32"/>
    <line x1="36" y1="36" x2="32" y2="32"/>
    <line x1="-36" y1="36" x2="-32" y2="32"/>
    <line x1="36" y1="-36" x2="32" y2="-32"/>
  </g>
</g>

<!-- Distant rolling hills (deeper depth bands) -->
<path d="M0 280 Q160 220 320 245 T640 235 T1024 215 V360 H0Z" fill="url(#grassA)"/>
<path d="M0 340 Q200 295 410 325 T780 320 T1024 305 V430 H0Z" fill="url(#grassB)"/>

<!-- Acacia tree (left) -->
<g transform="translate(74 218)" filter="url(#softshadow)">
  <ellipse cx="0" cy="60" rx="38" ry="5" fill="#2a1c14" opacity="0.2"/>
  <path d="M0 60 L-4 12 L4 12Z" fill="#6f4a32"/>
  <path d="M0 18 Q-22 4 -36 14 M0 20 Q22 0 38 8" fill="none" stroke="#6f4a32" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="0" cy="-4" rx="56" ry="22" fill="#5e8f52" stroke="#3f6e3a" stroke-width="2"/>
  <ellipse cx="-22" cy="2" rx="28" ry="14" fill="#6da15b"/>
  <ellipse cx="22" cy="2" rx="28" ry="14" fill="#6da15b"/>
</g>

<!-- Right pond -->
<path d="M520 432 Q700 392 880 422 Q970 432 1024 426 V500 H520 Q500 460 520 432Z" fill="url(#water)"/>
<path d="M540 448 Q700 412 880 432" fill="none" stroke="#b8e2d8" stroke-width="6" opacity="0.7"/>
<path d="M720 460 Q800 444 860 462" fill="none" stroke="#d8f0e7" stroke-width="4" opacity="0.55"/>
<!-- Reeds -->
<g transform="translate(908 380)" stroke="#3f6e3a" stroke-width="2.5" stroke-linecap="round">
  <line x1="0" y1="0" x2="-2" y2="-22"/>
  <line x1="4" y1="0" x2="2" y2="-26"/>
  <line x1="8" y1="0" x2="10" y2="-20"/>
  <line x1="-4" y1="0" x2="-6" y2="-18"/>
</g>

<!-- Foreground sand strip with grass tufts -->
<path d="M0 500 H1024 V600 H0Z" fill="url(#sand)"/>
<g transform="translate(60 540)" fill="#3f6e3a">
  <ellipse cx="0" cy="0" rx="22" ry="6"/>
  <path d="M-12 0 L-14 -10 M-4 0 L-6 -14 M6 0 L4 -12 M14 0 L16 -10" stroke="#3f6e3a" stroke-width="2"/>
</g>
<g transform="translate(180 558)" fill="#3f6e3a">
  <ellipse cx="0" cy="0" rx="18" ry="5"/>
  <path d="M-10 0 L-12 -8 M-2 0 L-4 -12 M6 0 L4 -10" stroke="#3f6e3a" stroke-width="2"/>
</g>
<g transform="translate(360 544)" fill="#3f6e3a">
  <ellipse cx="0" cy="0" rx="24" ry="6"/>
  <path d="M-14 0 L-16 -10 M-4 0 L-6 -14 M6 0 L4 -12 M14 0 L16 -10" stroke="#3f6e3a" stroke-width="2"/>
</g>
<g transform="translate(560 562)" fill="#3f6e3a">
  <ellipse cx="0" cy="0" rx="20" ry="5"/>
  <path d="M-10 0 L-12 -8 M0 0 L-2 -12 M10 0 L8 -10" stroke="#3f6e3a" stroke-width="2"/>
</g>
<g transform="translate(820 552)" fill="#3f6e3a">
  <ellipse cx="0" cy="0" rx="22" ry="6"/>
  <path d="M-12 0 L-14 -10 M-2 0 L-4 -14 M8 0 L6 -12" stroke="#3f6e3a" stroke-width="2"/>
</g>

<!-- ============ Animal tokens (scene-native, habitat cues) ============ -->

