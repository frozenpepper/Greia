  <ellipse cx="50" cy="106" rx="60" ry="8" fill="#2a1c14" opacity="0.28"/>
  <ellipse cx="50" cy="118" rx="68" ry="10" fill="#a88c66" stroke="#6e5a3e" stroke-width="2"/>
