    <circle cx="12" cy="-15" r="5" fill="#fff"/><circle cx="12" cy="-15" r="2.5" fill="#1a1620"/>
    <path d="M-12 4 Q0 12 12 4" fill="none" stroke="#3f6e3a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-22 24 L-26 32 M-10 28 L-10 34 M10 28 L10 34 M22 24 L26 32" stroke="#74a363" stroke-width="4" stroke-linecap="round"/>
  </g>
</g>

