  <ellipse cx="60" cy="116" rx="68" ry="8" fill="#2a1c14" opacity="0.28"/>
  <g transform="translate(60 64)">
    <ellipse cx="0" cy="6" rx="46" ry="32" fill="#9aa3b3" stroke="#5a5670" stroke-width="2.5"/>
    <ellipse cx="36" cy="-14" rx="22" ry="20" fill="#9aa3b3" stroke="#5a5670" stroke-width="2.5"/>
