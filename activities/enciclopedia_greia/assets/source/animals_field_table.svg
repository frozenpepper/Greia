  </g>
  <!-- bee -->
  <g transform="translate(28 40)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#f5cf3f" stroke="#7a4a04" stroke-width="1.5"/>
    <path d="M-7 -4 Q-3 0 -7 4 M0 -5 Q4 0 0 5 M7 -4 Q11 0 7 4" fill="none" stroke="#2a1c14" stroke-width="2"/>
