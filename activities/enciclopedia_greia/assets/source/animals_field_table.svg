    <ellipse cx="0" cy="10" rx="34" ry="20" fill="#74a363" stroke="#3f6e3a" stroke-width="2.5"/>
    <circle cx="-12" cy="-14" r="9" fill="#74a363" stroke="#3f6e3a" stroke-width="2"/>
