<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
<defs>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="8"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tightshadow" x="-10%" y="-10%" width="120%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="paperGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bce8e5"/><stop offset="0.5" stop-color="#dff1c5"/><stop offset="1" stop-color="#f0e2a4"/></linearGradient>
  <linearGradient id="grassA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6c98c"/><stop offset="1" stop-color="#86b779"/></linearGradient>
  <linearGradient id="grassB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aac68"/><stop offset="1" stop-color="#4f8d60"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc1c5"/><stop offset="1" stop-color="#3e8a9c"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c983"/><stop offset="1" stop-color="#b88a55"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff5c2"/><stop offset="0.55" stop-color="#ffd36a"/><stop offset="1" stop-color="#e99a2d"/></radialGradient>
</defs>

<rect width="1024" height="600" fill="url(#sky)"/>
<g transform="translate(86 78)"><circle r="38" fill="url(#sun)"/><g stroke="#f5cf61" stroke-width="3" stroke-linecap="round" opacity=".7"><line x1="-52" y1="0" x2="-46" y2="0"/><line x1="46" y1="0" x2="52" y2="0"/><line x1="0" y1="-52" x2="0" y2="-46"/><line x1="-36" y1="-36" x2="-32" y2="-32"/><line x1="36" y1="36" x2="32" y2="32"/><line x1="-36" y1="36" x2="-32" y2="32"/><line x1="36" y1="-36" x2="32" y2="-32"/></g></g>
<path d="M0 280 Q160 220 320 245 T640 235 T1024 215 V360 H0Z" fill="url(#grassA)"/>
<path d="M0 340 Q200 295 410 325 T780 320 T1024 305 V430 H0Z" fill="url(#grassB)"/>
<g transform="translate(74 218)" filter="url(#softshadow)"><ellipse cx="0" cy="60" rx="38" ry="5" fill="#2a1c14" opacity=".2"/><path d="M0 60 L-4 12 L4 12Z" fill="#6f4a32"/><path d="M0 18 Q-22 4 -36 14 M0 20 Q22 0 38 8" fill="none" stroke="#6f4a32" stroke-width="6" stroke-linecap="round"/><ellipse cx="0" cy="-4" rx="56" ry="22" fill="#5e8f52" stroke="#3f6e3a" stroke-width="2"/><ellipse cx="-22" cy="2" rx="28" ry="14" fill="#6da15b"/><ellipse cx="22" cy="2" rx="28" ry="14" fill="#6da15b"/></g>
<path d="M520 432 Q700 392 880 422 Q970 432 1024 426 V500 H520 Q500 460 520 432Z" fill="url(#water)"/>
<path d="M540 448 Q700 412 880 432" fill="none" stroke="#b8e2d8" stroke-width="6" opacity=".7"/>
<path d="M720 460 Q800 444 860 462" fill="none" stroke="#d8f0e7" stroke-width="4" opacity=".55"/>
<path d="M0 500 H1024 V600 H0Z" fill="url(#sand)"/>

<!-- LION: unmistakable full-body profile -->
<g data-target="lion" data-center="190,260" transform="translate(190 260)" filter="url(#softshadow)">
  <ellipse cx="2" cy="50" rx="70" ry="7" fill="#2a1c14" opacity=".25"/>
  <ellipse cx="18" cy="8" rx="48" ry="27" fill="#d99a46" stroke="#754019" stroke-width="3"/>
  <path d="M52 8 C76 2 82 -10 78 -24" fill="none" stroke="#d99a46" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="79" cy="-27" rx="6" ry="10" fill="#6a330d" transform="rotate(20 79 -27)"/>
  <path d="M-5 29 L-8 49 M18 31 L20 50 M40 28 L45 48" stroke="#b46f29" stroke-width="8" stroke-linecap="round"/>
  <circle cx="-36" cy="-5" r="33" fill="#7a3d10" stroke="#552707" stroke-width="3"/>
  <circle cx="-37" cy="-6" r="22" fill="#efa94e" stroke="#754019" stroke-width="2"/>
  <path d="M-52 -24 L-61 -34 L-45 -29 M-22 -24 L-13 -34 L-29 -29" fill="#efa94e" stroke="#754019" stroke-width="2"/>
  <circle cx="-44" cy="-10" r="2.8" fill="#2b2018"/><circle cx="-30" cy="-10" r="2.8" fill="#2b2018"/>
  <ellipse cx="-37" cy="2" rx="11" ry="8" fill="#f5c97b"/>
  <path d="M-41 -1 Q-37 4 -33 -1" fill="#5a2a08"/><path d="M-44 7 Q-37 12 -30 7" fill="none" stroke="#5a2a08" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="0" cy="55" rx="72" ry="9" fill="#a88c66" stroke="#6e5a3e" stroke-width="2"/>
</g>

<!-- ELEPHANT: cute cuddly body, big friendly ear, sweet eye, happy raised trunk -->
<g data-target="elephant" data-center="430,260" transform="translate(430 260)" filter="url(#softshadow)">
  <ellipse cx="0" cy="52" rx="76" ry="8" fill="#2a1c14" opacity=".25"/>
  <!-- Back legs -->
  <rect x="-36" y="24" width="18" height="32" rx="6" fill="#677786"/>
  <rect x="14" y="24" width="18" height="32" rx="6" fill="#677786"/>
  <!-- Tail -->
  <path d="M-52 8 Q-64 12 -62 26" fill="none" stroke="#677786" stroke-width="4" stroke-linecap="round"/>
  <circle cx="-62" cy="27" r="4" fill="#3D4A56"/>
  <!-- Cuddly Body -->
  <ellipse cx="-10" cy="6" rx="52" ry="34" fill="#8896A4" stroke="#4B5968" stroke-width="3"/>
  <!-- Front legs -->
  <rect x="-20" y="20" width="20" height="35" rx="7" fill="#8896A4" stroke="#4B5968" stroke-width="2.5"/>
  <circle cx="-16" cy="53" r="3" fill="#FFF"/><circle cx="-10" cy="53" r="3" fill="#FFF"/><circle cx="-4" cy="53" r="3" fill="#FFF"/>
  <rect x="28" y="20" width="20" height="35" rx="7" fill="#8896A4" stroke="#4B5968" stroke-width="2.5"/>
  <circle cx="32" cy="53" r="3" fill="#FFF"/><circle cx="38" cy="53" r="3" fill="#FFF"/><circle cx="44" cy="53" r="3" fill="#FFF"/>
  <!-- Round Head -->
  <circle cx="40" cy="-6" r="28" fill="#8896A4" stroke="#4B5968" stroke-width="3"/>
  <!-- Big Ear with soft pink interior -->
  <ellipse cx="18" cy="-8" rx="22" ry="28" fill="#8896A4" stroke="#4B5968" stroke-width="2.5"/>
  <ellipse cx="18" cy="-8" rx="14" ry="20" fill="#F8C4D0"/>
  <!-- Creamy curved tusk -->
  <path d="M46 14 Q58 20 62 10" fill="none" stroke="#FFF5E1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="62" cy="10" r="2.5" fill="#FFF5E1"/>
  <!-- Sweet eye with shiny catchlight -->
  <ellipse cx="44" cy="-14" rx="5" ry="6" fill="#FFF" stroke="#2B3640" stroke-width="1.5"/>
  <circle cx="45" cy="-14" r="3.5" fill="#1E2832"/>
  <circle cx="46" cy="-15" r="1.5" fill="#FFF"/>
  <!-- Cute trunk raised cheerfully -->
  <path d="M54 4 Q72 12 70 -6 Q68 -16 60 -18" fill="none" stroke="#8896A4" stroke-width="11" stroke-linecap="round"/>
  <path d="M54 4 Q72 12 70 -6 Q68 -16 60 -18" fill="none" stroke="#4B5968" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- OCTOPUS -->
<g data-target="octopus" data-center="670,260" transform="translate(670 260)" filter="url(#softshadow)">
  <ellipse cx="0" cy="52" rx="56" ry="7" fill="#2a1c14" opacity=".25"/>
  <ellipse cx="0" cy="-8" rx="32" ry="28" fill="#a96bb6" stroke="#6c3f7a" stroke-width="2.5"/>
  <circle cx="-10" cy="-12" r="4" fill="#fff"/><circle cx="-10" cy="-12" r="2" fill="#1a1620"/><circle cx="10" cy="-12" r="4" fill="#fff"/><circle cx="10" cy="-12" r="2" fill="#1a1620"/>
  <path d="M-3 0 Q0 4 3 0" fill="none" stroke="#6c3f7a" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="none" stroke="#a96bb6" stroke-width="10" stroke-linecap="round"><path d="M-25 12 Q-34 32 -22 42"/><path d="M-9 17 Q-15 38 -4 45"/><path d="M9 17 Q15 38 4 45"/><path d="M25 12 Q34 32 22 42"/></g>
  <ellipse cx="0" cy="52" rx="46" ry="8" fill="#c98a6a" stroke="#7e4920" stroke-width="2"/>
</g>

<!-- BEE -->
<g data-target="bee" data-center="190,410" transform="translate(190 410)" filter="url(#softshadow)">
  <ellipse cx="0" cy="50" rx="34" ry="6" fill="#2a1c14" opacity=".22"/>
  <line x1="20" y1="10" x2="20" y2="48" stroke="#3f6e3a" stroke-width="3"/>
  <g transform="translate(20 4)"><circle r="13" fill="#f3c14a"/><g fill="#fff5d8"><ellipse cx="0" cy="-12" rx="5" ry="9"/><ellipse cx="0" cy="12" rx="5" ry="9"/><ellipse cx="-12" cy="0" rx="9" ry="5"/><ellipse cx="12" cy="0" rx="9" ry="5"/></g><circle r="6" fill="#d9690a"/></g>
  <g transform="translate(-18 -12)"><ellipse rx="17" ry="11" fill="#f5cf3f" stroke="#6c4a06" stroke-width="2"/><path d="M-7 -9 V9 M2 -10 V10" stroke="#2a1c14" stroke-width="3"/><ellipse cx="-8" cy="-12" rx="10" ry="6" fill="#fff" opacity=".75"/><ellipse cx="10" cy="-12" rx="10" ry="6" fill="#fff" opacity=".75"/></g>
</g>

<!-- PENGUIN -->
<g data-target="penguin" data-center="430,410" transform="translate(430 410)" filter="url(#softshadow)">
  <ellipse cy="48" rx="42" ry="8" fill="#e0f0f5" stroke="#7e9aa6" stroke-width="1.5"/>
  <ellipse cy="-1" rx="22" ry="38" fill="#1a1f2c" stroke="#0a0d14" stroke-width="2"/>
  <ellipse cy="5" rx="14" ry="25" fill="#fff"/>
  <circle cx="-7" cy="-21" r="3" fill="#fff"/><circle cx="7" cy="-21" r="3" fill="#fff"/>
  <path d="M-4 -15 L0 -10 L4 -15Z" fill="#f3a020"/>
  <path d="M-10 34 L-14 43 M10 34 L14 43" stroke="#f3a020" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- FROG -->
<g data-target="frog" data-center="670,410" transform="translate(670 410)" filter="url(#softshadow)">
  <ellipse cy="44" rx="50" ry="11" fill="#5e8d50" stroke="#3f6e3a" stroke-width="2"/>
  <ellipse cy="8" rx="34" ry="21" fill="#74a363" stroke="#3f6e3a" stroke-width="2.5"/>
  <circle cx="-13" cy="-14" r="10" fill="#74a363" stroke="#3f6e3a" stroke-width="2"/><circle cx="13" cy="-14" r="10" fill="#74a363" stroke="#3f6e3a" stroke-width="2"/>
  <circle cx="-13" cy="-15" r="5" fill="#fff"/><circle cx="-13" cy="-15" r="2.5" fill="#1a1620"/><circle cx="13" cy="-15" r="5" fill="#fff"/><circle cx="13" cy="-15" r="2.5" fill="#1a1620"/>
  <path d="M-13 5 Q0 14 13 5" fill="none" stroke="#3f6e3a" stroke-width="2.5" stroke-linecap="round"/>
</g>

<g fill="#3f6e3a"><ellipse cx="60" cy="540" rx="22" ry="6"/><ellipse cx="180" cy="558" rx="18" ry="5"/><ellipse cx="360" cy="544" rx="24" ry="6"/><ellipse cx="560" cy="562" rx="20" ry="5"/><ellipse cx="820" cy="552" rx="22" ry="6"/></g>
<ellipse cx="478" cy="546" rx="50" ry="6" fill="#2a1c14" opacity=".22"/>
</svg>