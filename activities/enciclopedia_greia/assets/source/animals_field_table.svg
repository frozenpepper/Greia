  <!-- flower stem -->
  <g transform="translate(60 60)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#3f6e3a" stroke-width="3"/>
    <ellipse cx="-6" cy="20" rx="6" ry="2" fill="#3f6e3a"/>
    <g transform="translate(0 -6)">
      <circle r="14" fill="#f3c14a" stroke="#9a6c1a" stroke-width="1.5"/>
      <g fill="#fff5d8" stroke="#9a6c1a" stroke-width="1.5">
        <ellipse cx="0" cy="-12" rx="5" ry="9"/>
        <ellipse cx="0" cy="12" rx="5" ry="9"/>
        <ellipse cx="-12" cy="0" rx="9" ry="5"/>
        <ellipse cx="12" cy="0" rx="9" ry="5"/>
      </g>
      <circle r="6" fill="#d9690a" stroke="#7a3a04" stroke-width="1.5"/>
