<g id="near_ground"><path d="M0 446 Q240 432 512 444 Q790 456 1024 440 V600 H0Z" fill="#62A659"/></g>
<g id="flower_shadows" fill="#2F5A35" opacity="0.18"><ellipse cx="395" cy="456" rx="34" ry="6"/><ellipse cx="625" cy="456" rx="34" ry="6"/></g>
<g id="stems" stroke-linecap="round" fill="none">
