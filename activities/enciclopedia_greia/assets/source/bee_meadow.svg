  <g fill="#FFFBEB"><circle cx="828.0" cy="520.0" r="5"/><circle cx="824.0" cy="526.9" r="5"/><circle cx="816.0" cy="526.9" r="5"/><circle cx="812.0" cy="520.0" r="5"/><circle cx="816.0" cy="513.1" r="5"/><circle cx="824.0" cy="513.1" r="5"/></g><circle cx="820" cy="520" r="5" fill="#FBBF24"/>
  <g fill="#FFFBEB"><circle cx="183.0" cy="470.0" r="4.5"/><circle cx="179.5" cy="476.1" r="4.5"/><circle cx="172.5" cy="476.1" r="4.5"/><circle cx="169.0" cy="470.0" r="4.5"/><circle cx="172.5" cy="463.9" r="4.5"/><circle cx="179.5" cy="463.9" r="4.5"/></g><circle cx="176" cy="470" r="5" fill="#FBBF24"/>
</g>
