<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
<!-- E4-A Bee: a sunny flower meadow. The two hero flowers sit exactly on the
     page's pollination stops (395,355) and (625,355); the bee, its pollen and
     the second flower's ripened centre are live page overlays. -->
<defs>
  <!-- sky light -> sunshine haze -->
  <linearGradient id="bee_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B6E0F0"/><stop offset="1" stop-color="#F6EFC8"/></linearGradient>
  <!-- leaf light -> leaf (meadow) -->
  <linearGradient id="bee_meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D78C"/><stop offset="1" stop-color="#6BAE5E"/></linearGradient>
  <!-- coral light -> raspberry/coral (pink flower) -->
  <linearGradient id="bee_pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F49DB3"/><stop offset="1" stop-color="#DE6C88"/></linearGradient>
  <!-- grape light -> ocean/grape (blue flower) -->
  <linearGradient id="bee_blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9B3F2"/><stop offset="1" stop-color="#7D89DC"/></linearGradient>
  <radialGradient id="bee_sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7A3" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1024" height="600" fill="url(#bee_sky)"/>
<g id="sun"><circle cx="640" cy="124" r="66" fill="url(#bee_sun)"/><circle cx="640" cy="124" r="30" fill="#FFD25E"/><ellipse cx="631" cy="114" rx="10" ry="6" fill="#FFF3C4" opacity="0.8"/></g>
<g id="clouds" fill="#FFFFFF" opacity="0.85"><ellipse cx="190" cy="138" rx="46" ry="13"/><ellipse cx="212" cy="128" rx="25" ry="14"/><ellipse cx="860" cy="250" rx="40" ry="11"/><ellipse cx="878" cy="242" rx="22" ry="11"/></g>
<g id="far_hills">
  <path d="M0 300 Q120 250 260 272 Q380 290 470 262 Q580 232 700 266 Q820 296 920 262 Q980 246 1024 256 V360 H0Z" fill="#C3DDB0"/>
  <path d="M0 326 Q160 296 330 314 Q500 330 660 306 Q840 284 1024 312 V380 H0Z" fill="#B0D39A"/>
</g>
<g id="hedge" fill="#8DBE7E"><ellipse cx="140" cy="318" rx="70" ry="22"/><ellipse cx="196" cy="310" rx="44" ry="20"/><ellipse cx="880" cy="320" rx="80" ry="22"/><ellipse cx="820" cy="314" rx="40" ry="16"/></g>
<path id="meadow" d="M0 344 Q200 326 420 338 Q660 350 860 332 Q960 324 1024 330 V600 H0Z" fill="url(#bee_meadow)"/>
