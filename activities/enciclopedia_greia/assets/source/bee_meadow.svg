<g id="token_beds" fill="#2F5A35" opacity="0.13">
  <ellipse data-target="food" data-center="250,195" cx="250" cy="242" rx="40" ry="6"/>
  <ellipse data-target="pollen" data-center="755,195" cx="755" cy="242" rx="40" ry="6"/>
  <ellipse data-target="pollination" data-center="250,420" cx="250" cy="467" rx="40" ry="6"/>
