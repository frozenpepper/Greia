  <circle cx="625" cy="355" r="22" fill="#DCB546"/>
  <ellipse cx="618" cy="347" rx="7" ry="4.5" fill="#F3E3A6" stroke="none"/>
</g>
<g id="petal_light" fill="#FFFFFF" opacity="0.45"><ellipse cx="403" cy="327" rx="6" ry="4"/><ellipse cx="633" cy="327" rx="6" ry="4"/></g>
