<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
<defs>
  <!-- cream light -> peach/sand -->
  <linearGradient id="teeth_wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF2DD"/><stop offset="1" stop-color="#F3DABC"/></linearGradient>
  <!-- orange+ink 38% -> orange+ink 58% -->
  <linearGradient id="teeth_floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B37435"/><stop offset="1" stop-color="#926133"/></linearGradient>
  <!-- coral/raspberry light -> lip -->
  <linearGradient id="teeth_lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F09499"/><stop offset="1" stop-color="#EA666D"/></linearGradient>
  <!-- plum/raspberry -> plum shade -->
  <linearGradient id="teeth_inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#84446F"/><stop offset="1" stop-color="#533957"/></linearGradient>
  <!-- white -> cream (enamel) -->
  <linearGradient id="teeth_enamel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6EED8"/></linearGradient>
  <!-- turquoise light -> turquoise -->
  <linearGradient id="teeth_cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CCDC6"/><stop offset="1" stop-color="#44B8AE"/></linearGradient>
</defs>
