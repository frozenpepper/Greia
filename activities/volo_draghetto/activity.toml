[activity]
id = "org.greia.volo-draghetto"
legacy_ids = []
title_key = "activity.volo_draghetto.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["play", "explore"]
discovery_tags = ["action"]

[education]
# Four finite sky courses (about one minute each): steer through rainbow
# rings (checkpoints) and into star trails, choose over or under a bouncy
# cloud. Rings that are missed come back nearer and wider; rings widen for a
# course after a hard flight.
categories = ["fine_motor", "spatial_awareness", "reaction_time"]
difficulty = 2
recommended_age_min = 4
recommended_age_max = 7
difficulty_min = 1
difficulty_max = 4
adaptive_difficulty = true
skills = [
  { id = "motor.coordination.hand_eye", weight = 3 },
  { id = "spatial.position.up_down", weight = 2 },
  { id = "cognition.planning.path_choice", weight = 1 },
]
events = [
  { id = "flight.ring_passed", kind = "milestone" },
  { id = "flight.course_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "directional"

[requirements]
required_capabilities = ["display"]
optional_capabilities = ["keyboard", "pointer", "touch", "controller", "audio.basic"]

[permissions]
requested = []

[storage]
# Platform save schema stays 1: the progress payload carries its own version
# (dragon_services.SCHEMA_VERSION = 3) and migrates the endless-flight
# prototype's star count and score forward.
schema_version = 1
