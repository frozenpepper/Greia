<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- ocean light (mix 35% white) -> ocean -->
    <linearGradient id="colline_icon_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
    <!-- leaf light -> leaf -->
    <linearGradient id="colline_icon_hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AD6A3"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
    <!-- grape light -> grape (buggy) -->
    <linearGradient id="colline_icon_buggy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEA2DF"/>
      <stop offset="1" stop-color="#9464C9"/>
    </linearGradient>
    <linearGradient id="colline_icon_tito" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
