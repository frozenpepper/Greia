[activity]
id = "org.greia.colline-allegre"
legacy_ids = []
title_key = "activity.colline_allegre.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en", "es", "fr"]

[presentation]
categories = ["play", "explore"]
discovery_tags = ["action", "nature"]

[education]
# A motor-timing driving game. Tito drives his buggy over five finite
# courses (meadow, pond, autumn wood, snowy wood, hills above the clouds),
# each ending at a picnic where a friend waits. The courses are the ladder:
# 1 gentle rolling hills (the buggy rights itself in the air) -> 2 bigger
# hills, a jump and a bridge -> 3 mud that slows the buggy -> 4 steep drops
# behind a snail sign where the child must brake before the edge -> 5 high
# hills with bouncy mushrooms and drops. Three stars per course; a tumble
# goes back to the last flag (never game over). After a tumble at a drop the
# sign glows and BRAKE pulses; after two tumbles on a course the buggy slows
# itself at the signs. Between sets the hill size (rung 1-3) adapts to how
# many tumbles the last set had.
categories = ["motor_skills", "timing_coordination", "physics_intuition"]
difficulty = 1
recommended_age_min = 4
recommended_age_max = 7
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "motor.timing", weight = 3 },
  { id = "motor.coordination", weight = 2 },
  { id = "physics.momentum", weight = 2 },
]
events = [
  { id = "colline.course_finished", kind = "milestone" },
  { id = "colline.set_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "game"

[requirements]
required_capabilities = ["display"]
optional_capabilities = ["keyboard", "touch", "pointer", "controller", "audio.basic"]

[permissions]
requested = []

[storage]
# Platform save schema stays 1: the progress payload carries its own version
# (colline_services.SCHEMA_VERSION) and migrates the older distance save in place.
schema_version = 1
