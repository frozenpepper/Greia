[activity]
id = "org.greia.colline-allegre"
legacy_ids = []
title_key = "activity.colline_allegre.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["play", "explore"]
discovery_tags = ["action", "nature"]

[education]
categories = ["physics_intuition", "motor_skills", "timing_coordination"]
difficulty = 2
recommended_age_min = 3
recommended_age_max = 6
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "physics.momentum", weight = 3 },
  { id = "motor.timing", weight = 3 },
  { id = "motor.coordination", weight = 2 },
]
events = [
  { id = "colline.run_started", kind = "milestone" },
  { id = "colline.star_collected", kind = "milestone" },
  { id = "colline.perfect_landing", kind = "milestone" },
  { id = "colline.comical_flip", kind = "milestone" },
  { id = "colline.milestone_distance", kind = "milestone" },
  { id = "colline.course_completed", kind = "completion" },
  { id = "colline.best_distance", kind = "score", score_order = "higher_better" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "audio.basic"]
optional_capabilities = ["keyboard", "touch", "pointer", "controller"]

[permissions]
requested = []

[storage]
schema_version = 1
