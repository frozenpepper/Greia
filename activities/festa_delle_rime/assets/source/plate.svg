<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Festa delle Rime picture "plate" (IT rhyme gatto/piatto): dinner plate. Flat Greia vector (GREIA_SVG_AUTHORING_RULES). -->
  <defs>
    <!-- cream -> sand -->
    <linearGradient id="festa_plate_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#EEDDBA"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="128" cy="222" rx="100" ry="15" fill="#6A5147" opacity="0.14"/>
  </g>
  <g id="plate">
    <ellipse cx="128" cy="166" rx="110" ry="50" fill="#D9C59C" stroke="#4B372F" stroke-width="5"/>
    <ellipse cx="128" cy="156" rx="110" ry="48" fill="url(#festa_plate_top)" stroke="#4B372F" stroke-width="5"/>
    <ellipse cx="128" cy="156" rx="92" ry="38" fill="none" stroke="#4A91D8" stroke-width="8"/>
    <ellipse cx="128" cy="160" rx="62" ry="23" fill="#F3E6C8" stroke="#A8957A" stroke-width="2.5"/>
    <path d="M44 146 C56 128 82 118 110 115" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
