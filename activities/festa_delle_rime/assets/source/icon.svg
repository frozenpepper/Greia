<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="rhyme_festival_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- lantern glow (light source): cream -> transparent -->
    <radialGradient id="rhyme_festival_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFBEB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#rhyme_festival_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <!-- the two matching endings glow together -->
  <g id="fx_back">
    <ellipse cx="128" cy="170" rx="108" ry="46" fill="url(#rhyme_festival_glow)" opacity="0.85"/>
  </g>
  <g id="garland">
    <path d="M26 44 Q128 84 230 44" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- two lanterns: different tops, the very same bottom = same ending sound -->
  <g id="subject">
    <g stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M76 60 L76 88" fill="none" stroke-width="3.5"/>
      <rect x="56" y="80" width="40" height="14" rx="5" fill="#976433"/>
      <path d="M38 144 C38 102 54 92 76 92 C98 92 114 102 114 144 Z" fill="#4A91D8"/>
      <path d="M38 144 C38 186 54 196 76 196 C98 196 114 186 114 144 Z" fill="#44B8AE"/>
      <path d="M65 96 C58 118 58 170 65 192 M87 96 C94 118 94 170 87 192" fill="none" stroke-width="3"/>
      <rect x="56" y="192" width="40" height="14" rx="5" fill="#976433"/>
      <path d="M76 206 L76 222" fill="none" stroke="#FFC234" stroke-width="7"/>
      <ellipse cx="55" cy="114" rx="6" ry="10" fill="#FFFFFF" stroke="none" opacity="0.8" transform="rotate(25 55 114)"/>
    </g>
    <g stroke="#4B372F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M180 60 L180 88" fill="none" stroke-width="3.5"/>
      <rect x="160" y="80" width="40" height="14" rx="5" fill="#976433"/>
      <path d="M142 144 C142 102 158 92 180 92 C202 92 218 102 218 144 Z" fill="#D85683"/>
      <path d="M142 144 C142 186 158 196 180 196 C202 196 218 186 218 144 Z" fill="#44B8AE"/>
      <path d="M169 96 C162 118 162 170 169 192 M191 96 C198 118 198 170 191 192" fill="none" stroke-width="3"/>
      <rect x="160" y="192" width="40" height="14" rx="5" fill="#976433"/>
      <path d="M180 206 L180 222" fill="none" stroke="#FFC234" stroke-width="7"/>
      <ellipse cx="159" cy="114" rx="6" ry="10" fill="#FFFFFF" stroke="none" opacity="0.8" transform="rotate(25 159 114)"/>
    </g>
  </g>
  <g id="accent" fill="#FBBF24" stroke="#9A742A" stroke-width="3" stroke-linejoin="round">
    <path d="M128 132 Q131 148 146 151 Q131 154 128 170 Q125 154 110 151 Q125 148 128 132 Z"/>
  </g>
</svg>
