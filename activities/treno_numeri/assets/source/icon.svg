<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="loco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
  </defs>
  <!-- Track -->
  <line x1="20" y1="210" x2="236" y2="210" stroke="#78909C" stroke-width="8" stroke-linecap="round"/>
  <!-- Steam Cloud Puffs -->
  <circle cx="86" cy="62" r="16" fill="#ECEFF1" opacity="0.9"/>
  <circle cx="112" cy="46" r="22" fill="#ECEFF1" opacity="0.9"/>
  <circle cx="148" cy="38" r="16" fill="#ECEFF1" opacity="0.8"/>
  <!-- Chimney -->
  <polygon points="62,130 82,130 88,88 56,88" fill="#37474F"/>
  <!-- Engine Boiler Body -->
  <rect x="52" y="128" width="100" height="54" rx="10" fill="url(#loco)"/>
  <!-- Driver Cabin -->
  <rect x="136" y="96" width="66" height="86" rx="8" fill="#1E88E5"/>
  <rect x="148" y="108" width="42" height="32" rx="6" fill="#E1F5FE" stroke="#0D47A1" stroke-width="4"/>
  <!-- Number 1 on Boiler -->
  <circle cx="102" cy="154" r="18" fill="#FFD54F"/>
  <text x="102" y="163" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#D84315" text-anchor="middle">1</text>
  <!-- Wheels -->
  <circle cx="76" cy="194" r="18" fill="#37474F" stroke="#FFD54F" stroke-width="6"/>
  <circle cx="120" cy="194" r="18" fill="#37474F" stroke="#FFD54F" stroke-width="6"/>
  <circle cx="170" cy="190" r="22" fill="#37474F" stroke="#FFD54F" stroke-width="7"/>
  <!-- Connecting Rod -->
  <line x1="76" y1="194" x2="170" y2="190" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>
</svg>