<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Treno Numeri icon: a little train with a wagon of apples (learn tile = orange). -->
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="treno_icon_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BE81"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- coral light -> coral -->
    <linearGradient id="treno_icon_boiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A9A0"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
    <!-- ocean light -> ocean -->
    <linearGradient id="treno_icon_cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92BDE8"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#treno_icon_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <g id="shadow">
    <ellipse cx="128" cy="200" rx="100" ry="9" fill="#9A5F2C" opacity="0.18"/>
  </g>
  <g id="subject" stroke="#4B372F" stroke-linejoin="round">
    <circle cx="206" cy="62" r="11" fill="#FFFBEB" stroke-width="4"/>
    <circle cx="226" cy="42" r="8" fill="#FFFBEB" stroke-width="4"/>
    <path d="M196 124 L199 88 L192 78 H220 L213 88 L216 124 Z" fill="#6E7175" stroke-width="4.5"/>
    <circle cx="58" cy="112" r="15" fill="#F46F61" stroke-width="4.5"/>
    <circle cx="86" cy="108" r="15" fill="#F46F61" stroke-width="4.5"/>
    <circle cx="114" cy="112" r="15" fill="#F46F61" stroke-width="4.5"/>
    <path d="M86 93 C88 86 94 82 100 82" fill="none" stroke="#59B86A" stroke-width="5" stroke-linecap="round"/>
    <rect x="30" y="122" width="104" height="44" rx="12" fill="#59B86A" stroke-width="5"/>
    <path d="M42 132 H122" stroke="#9BD4A6" stroke-width="4" stroke-linecap="round"/>
    <rect x="176" y="118" width="54" height="52" rx="16" fill="url(#treno_icon_boiler)" stroke-width="5"/>
    <rect x="140" y="88" width="48" height="82" rx="10" fill="url(#treno_icon_cab)" stroke-width="5"/>
    <rect x="132" y="76" width="64" height="18" rx="8" fill="#4A7AAE" stroke-width="5"/>
    <rect x="150" y="104" width="28" height="24" rx="7" fill="#CFEAF7" stroke-width="4"/>
    <rect x="26" y="164" width="208" height="14" rx="6" fill="#253B59" stroke-width="4.5"/>
    <circle cx="58" cy="182" r="14" fill="#4B372F"/>
    <circle cx="58" cy="182" r="6" fill="#FFC234" stroke-width="3"/>
    <circle cx="106" cy="182" r="14" fill="#4B372F"/>
    <circle cx="106" cy="182" r="6" fill="#FFC234" stroke-width="3"/>
    <circle cx="164" cy="180" r="18" fill="#4B372F"/>
    <circle cx="164" cy="180" r="7.5" fill="#FFC234" stroke-width="3"/>
    <circle cx="208" cy="182" r="14" fill="#4B372F"/>
    <circle cx="208" cy="182" r="6" fill="#FFC234" stroke-width="3"/>
  </g>
  <g id="accent">
    <ellipse cx="52" cy="105" rx="4" ry="6" fill="#FFFFFF" opacity="0.8" stroke="none"/>
    <ellipse cx="80" cy="101" rx="4" ry="6" fill="#FFFFFF" opacity="0.8" stroke="none"/>
    <ellipse cx="108" cy="105" rx="4" ry="6" fill="#FFFFFF" opacity="0.8" stroke="none"/>
  </g>
</svg>
