<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Hitch Coupler -->
  <rect x="290" y="130" width="30" height="16" rx="4" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="305" cy="138" r="5" fill="#f8fafc"/>
  <rect x="0" y="130" width="30" height="16" rx="4" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="3"/>

  <!-- Chassis Underframe -->
  <rect x="15" y="125" width="290" height="22" rx="6" fill="url(#steelGrad)" stroke="#0f172a" stroke-width="4"/>

  <!-- Wooden Hopper Body -->
  <rect x="25" y="25" width="270" height="105" rx="12" fill="url(#woodGrad)" stroke="#451a03" stroke-width="5"/>

  <!-- Wood Planks Grooves -->
  <line x1="25" y1="58" x2="295" y2="58" stroke="#78350f" stroke-width="3"/>
  <line x1="25" y1="92" x2="295" y2="92" stroke="#78350f" stroke-width="3"/>

  <!-- Brass Corner Reinforcements -->
  <rect x="25" y="25" width="18" height="105" rx="4" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2"/>
  <rect x="277" y="25" width="18" height="105" rx="4" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2"/>
  <rect x="151" y="25" width="18" height="105" rx="4" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2"/>

  <!-- Rivets -->
  <circle cx="34" cy="38" r="3" fill="#451a03"/>
  <circle cx="34" cy="115" r="3" fill="#451a03"/>
  <circle cx="286" cy="38" r="3" fill="#451a03"/>
  <circle cx="286" cy="115" r="3" fill="#451a03"/>
  <circle cx="160" cy="38" r="3" fill="#451a03"/>
  <circle cx="160" cy="115" r="3" fill="#451a03"/>
</svg>