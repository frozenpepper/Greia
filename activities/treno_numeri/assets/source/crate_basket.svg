<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rimWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Crate Body -->
  <rect x="10" y="20" width="220" height="130" rx="18" fill="url(#crateWood)" stroke="#78350f" stroke-width="5"/>

  <!-- Planks Slats -->
  <rect x="18" y="28" width="204" height="28" rx="6" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <rect x="18" y="64" width="204" height="28" rx="6" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <rect x="18" y="100" width="204" height="28" rx="6" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>

  <!-- Corner Brackets -->
  <rect x="10" y="20" width="20" height="130" rx="6" fill="url(#rimWood)"/>
  <rect x="210" y="20" width="20" height="130" rx="6" fill="url(#rimWood)"/>
  <circle cx="20" cy="35" r="3" fill="#fef08a"/>
  <circle cx="20" cy="135" r="3" fill="#fef08a"/>
  <circle cx="220" cy="35" r="3" fill="#fef08a"/>
  <circle cx="220" cy="135" r="3" fill="#fef08a"/>
</svg>