<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 132" width="296" height="132">
  <!-- Treno Numeri: open wagon, back wall behind the cargo (leaf). Five bays = a five-frame. -->
  <defs>
    <!-- leaf light -> leaf -->
    <linearGradient id="wagon_back_leaf_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD4A6"/>
      <stop offset="1" stop-color="#59B86A"/>
    </linearGradient>
  </defs>
  <g id="wagon_back">
    <rect x="10" y="12" width="276" height="70" rx="14" fill="url(#wagon_back_leaf_wall)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="26" y="17" width="244" height="5" rx="2.5" fill="#FFFFFF" opacity="0.45"/>
    <rect x="20" y="28" width="256" height="52" rx="9" fill="#56985B" stroke="#51714A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g id="bays" fill="#9BD4A6" stroke="#51714A" stroke-width="2" stroke-linejoin="round">
    <rect x="64.6" y="25" width="6" height="56" rx="3"/>
    <rect x="118.2" y="25" width="6" height="56" rx="3"/>
    <rect x="171.8" y="25" width="6" height="56" rx="3"/>
    <rect x="225.4" y="25" width="6" height="56" rx="3"/>
  </g>
</svg>
