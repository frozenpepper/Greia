  <defs>
    <!-- orange light -> orange -->
    <linearGradient id="pesce_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C288"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
  </defs>
  <g id="tail" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round">
    <path d="M330 190 L210 96 C228 130 238 162 246 190 C238 220 228 252 210 286 Z" fill="#F46F61"/>
  </g>
  <g id="fins" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round" fill="#F46F61">
