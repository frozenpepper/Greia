<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372">
  <!-- Stelle Incantate: crossed-tail fish; stars tail top (210,96) belly (420,290) nose (610,190) back (420,92) tail bottom (210,286).
