    <path d="M396 286 C420 318 452 316 466 284 Z"/>
  </g>
  <g id="body" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round">
    <path d="M318 190 C336 128 376 92 420 92 C510 92 584 140 610 190 C584 242 510 290 420 290 C376 290 336 252 318 190 Z" fill="url(#pesce_body)"/>
