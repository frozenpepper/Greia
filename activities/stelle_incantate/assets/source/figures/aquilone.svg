<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372">
  <!-- Stelle Incantate: kite revealed by stars (380,36) (476,138) (380,262) (284,138) (536,334).
       Sky-local space = the Activity's sky play area; recipe docs/design/GREIA_SVG_AUTHORING_RULES.md. -->
  <defs>
    <!-- coral light -> coral -->
    <linearGradient id="aquilone_coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A9A0"/>
      <stop offset="1" stop-color="#F46F61"/>
    </linearGradient>
    <!-- sunshine light -> sunshine -->
    <linearGradient id="aquilone_sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDB85"/>
      <stop offset="1" stop-color="#FFC234"/>
    </linearGradient>
  </defs>
  <g id="tail" fill="none" stroke="#4B372F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 262 C404 296 436 270 458 300 C478 328 508 306 536 334"/>
  </g>
  <g id="bows" stroke="#4B372F" stroke-width="3" stroke-linejoin="round">
    <path d="M418 268 L440 280 L418 298 Z M462 292 L440 280 L462 270 Z" fill="#9464C9"/>
    <path d="M488 302 L506 318 L484 330 Z M526 330 L506 318 L528 304 Z" fill="#4A91D8"/>
  </g>
  <g id="kite" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round">
    <path d="M380 36 L380 138 L284 138 Z" fill="url(#aquilone_coral)"/>
    <path d="M380 36 L476 138 L380 138 Z" fill="url(#aquilone_sun)"/>
    <path d="M284 138 L380 138 L380 262 Z" fill="url(#aquilone_sun)"/>
    <path d="M380 138 L476 138 L380 262 Z" fill="url(#aquilone_coral)"/>
  </g>
  <g id="spars" fill="none" stroke="#976433" stroke-width="5" stroke-linecap="round">
    <path d="M380 46 L380 252"/>
    <path d="M296 138 L464 138"/>
  </g>
  <g id="highlight">
    <path d="M362 70 C346 88 332 104 320 122" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g id="face" fill="#342C35">
    <circle cx="358" cy="190" r="6"/>
    <circle cx="402" cy="190" r="6"/>
    <path d="M366 210 C374 218 386 218 394 210" fill="none" stroke="#342C35" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
