<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Berry Chase: canonical Momo (happy, path data verbatim) in a hedge garden with a strawberry. -->
  <defs>
    <!-- ocean light (mix 35% white) -> ocean (play tile) -->
    <linearGradient id="corsa_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
    <linearGradient id="momoBody" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <!-- flash cast red light -> red -->
    <linearGradient id="corsa_berry" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#corsa_tile)"/>
  </g>
  <g id="garden">
    <rect x="26" y="26" width="204" height="204" rx="34" fill="#EEDDBA" stroke="#4B372F" stroke-width="5"/>
    <!-- hedges: leaf fill, leaf-shade face, leaf contour, one light strip -->
    <path d="M128 26 L154 26 L154 112 Q154 124 141 124 Q128 124 128 112 Z" fill="#4E9A5D" stroke="#51714A" stroke-width="4" stroke-linejoin="round"/>
    <rect x="131" y="30" width="20" height="78" rx="10" fill="#59B86A"/>
    <rect x="135" y="34" width="6" height="58" rx="3" fill="#98D3A3"/>
    <path d="M178 150 L230 150 L230 176 L178 176 Q166 176 166 163 Q166 150 178 150 Z" fill="#4E9A5D" stroke="#51714A" stroke-width="4" stroke-linejoin="round"/>
    <rect x="170" y="152" width="58" height="18" rx="9" fill="#59B86A"/>
    <rect x="176" y="155" width="40" height="6" rx="3" fill="#98D3A3"/>
    <circle cx="146" cy="70" r="5" fill="#F46F61" stroke="#8A4A40" stroke-width="2"/>
    <circle cx="206" cy="160" r="5" fill="#FFFBEB" stroke="#8A7A60" stroke-width="2"/>
  </g>
  <g id="strawberry" transform="translate(162 40) scale(0.3)">
    <ellipse cx="128" cy="232" rx="70" ry="11.7" fill="#6A5147" opacity="0.14"/>
    <path d="M128 232 C94 220 48 174 42 124 C38 90 64 70 96 72 C110 73 120 78 128 84 C136 78 146 73 160 72 C192 70 218 90 214 124 C208 174 162 220 128 232 Z" fill="url(#corsa_berry)" stroke="#4B372F" stroke-width="12" stroke-linejoin="round"/>
    <ellipse cx="96" cy="120" rx="8" ry="12" fill="#FFDD8F"/>
    <ellipse cx="160" cy="120" rx="8" ry="12" fill="#FFDD8F"/>
    <ellipse cx="128" cy="168" rx="8" ry="12" fill="#FFDD8F"/>
    <ellipse cx="70" cy="126" rx="12" ry="22" fill="#FFFFFF" opacity="0.7" transform="rotate(20 70 126)"/>
    <path d="M128 92 C114 96 94 98 76 88 C90 80 102 78 112 76 C104 66 102 58 106 50 C118 56 124 64 128 72 C132 64 138 56 150 50 C154 58 152 66 144 76 C154 78 166 80 180 88 C162 98 142 96 128 92 Z" fill="#59B86A" stroke="#4B372F" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <g id="momo" transform="translate(6 62) scale(0.66)">
