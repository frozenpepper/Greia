    <ellipse cx="62" cy="140" rx="12" ry="21" fill="#7E22CE" stroke="#4B372F" stroke-width="4" transform="rotate(-35 62 140)"/>
    <ellipse cx="194" cy="138" rx="12" ry="21" fill="#7E22CE" stroke="#4B372F" stroke-width="4" transform="rotate(35 194 138)"/>
    <path d="M128 68 C144 64 155 72 163 83 C180 80 190 91 187 107 C203 116 202 132 190 142 C198 159 191 174 177 179 C176 194 164 205 149 203 C142 215 126 220 114 212 C98 218 84 211 79 198 C63 197 55 185 59 171 C45 160 46 145 58 136 C49 120 55 105 69 99 C68 84 82 75 96 80 C105 68 117 65 128 68 Z" fill="url(#momoBody)" stroke="#4B372F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="128" cy="145" rx="48" ry="44" fill="#E9D5FF" opacity="0.36"/>
    <ellipse cx="103" cy="209" rx="14" ry="8.5" fill="#2DD4BF" stroke="#4B372F" stroke-width="4"/>
    <ellipse cx="153" cy="209" rx="14" ry="8.5" fill="#2DD4BF" stroke="#4B372F" stroke-width="4"/>
    <ellipse cx="88" cy="154" rx="10" ry="6" fill="#FDA4AF" opacity="0.55"/>
    <ellipse cx="169" cy="153" rx="10" ry="6" fill="#FDA4AF" opacity="0.55"/>
    <path d="M97 132 Q107 120 117 132" stroke="#352B3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M140 130 Q149 118 158 130" stroke="#352B3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M106 158 Q128 186 150 158 Q148 190 128 193 Q108 188 106 158 Z" fill="#581C87" stroke="#352B3A" stroke-width="2"/>
    <path d="M125 159 L135 159 L130 171 Z" fill="#FFFBEB"/>
    <path d="M116 174 Q128 185 140 174" fill="#F43F5E"/>
    <circle cx="91" cy="105" r="5.5" fill="#F3E8FF" opacity="0.7"/>
  </g>
  <g id="accent">
    <!-- blueberries: ocean family, shade + one highlight each -->
    <ellipse cx="196" cy="216" rx="26" ry="4.5" fill="#6A5147" opacity="0.14"/>
    <circle cx="184" cy="200" r="14" fill="#4A6FC0" stroke="#4B372F" stroke-width="4"/>
    <circle cx="208" cy="202" r="14" fill="#3E5FAE" stroke="#4B372F" stroke-width="4"/>
    <circle cx="203" cy="197" r="3" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="179" cy="195" r="3.5" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
