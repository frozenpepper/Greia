[activity]
id = "org.greia.teatrino-fiabe"
legacy_ids = []
title_key = "activity.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["create", "play"]
discovery_tags = ["stories", "making"]

[education]
categories = ["creativity", "storytelling", "visual_composition"]
difficulty = 2
recommended_age_min = 3
skills = [
  { id = "creativity.narrative_expression", weight = 3 },
  { id = "creativity.visual_composition", weight = 2 },
]
events = [
  { id = "story.played", kind = "completion" },
  { id = "story.recorded", kind = "creation" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "pointer"

[requirements]
required_capabilities = ["display", "pointer", "audio.basic"]
optional_capabilities = ["touch"]

[permissions]
requested = []

[storage]
schema_version = 1

[creations]
consumes = ["image/png", "audio/wav"]
