<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Teatrino puppet: the little Dragon (non-canonical; section 20 grammar: one round mass,
       two wing flaps, 3 cues = gold horns, striped cream belly, spade tail). Rod puppet: no shadow. -->
  <defs>
    <!-- leaf light -> leaf -->
    <linearGradient id="draghetto_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD19B"/>
      <stop offset="1" stop-color="#4FA65F"/>
    </linearGradient>
  </defs>
  <g id="character">
