      <ellipse cx="111" cy="104" rx="2.8" ry="3.6" fill="#FFFFFF"/>
      <ellipse cx="151" cy="104" rx="2.8" ry="3.6" fill="#FFFFFF"/>
      <circle cx="120" cy="124" r="2" fill="#2F6B3C"/>
