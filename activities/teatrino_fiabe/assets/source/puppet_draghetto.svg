      <path d="M94 210 l0 -4 M102 211 l0 -4 M110 210 l0 -4 M146 210 l0 -4 M154 211 l0 -4 M162 210 l0 -4" stroke="#FFFBEB" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="body">
      <path d="M128 64 C170 64 194 94 194 132 C194 172 166 204 128 204 C90 204 62 172 62 132 C62 94 86 64 128 64 Z" fill="url(#draghetto_body)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="92" cy="96" rx="9" ry="16" fill="#FFFFFF" opacity="0.55" transform="rotate(32 92 96)"/>
    </g>
    <g id="belly">
