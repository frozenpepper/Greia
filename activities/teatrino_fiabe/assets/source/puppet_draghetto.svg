    </g>
    <g id="wings">
      <path d="M72 112 C46 88 30 104 36 126 C46 120 52 130 62 128 C60 138 68 144 76 140 Z" fill="#B996DE" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M184 112 C210 88 226 104 220 126 C210 120 204 130 194 128 C196 138 188 144 180 140 Z" fill="#B996DE" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
