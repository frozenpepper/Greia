<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Teatrino puppet: the little Knight (non-canonical; section 20 grammar: one round
       armour mass, a shield flap, 3 cues = plume, visor window, star shield). Rod puppet: no shadow. -->
  <defs>
    <!-- steel light (navy mix 85% white) -> steel (navy mix 62% white) -->
    <linearGradient id="cavaliere_steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E8EE"/>
      <stop offset="1" stop-color="#A9B4C2"/>
    </linearGradient>
    <!-- skin light -> skin -->
    <linearGradient id="cavaliere_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E8"/>
      <stop offset="1" stop-color="#FBDCC8"/>
    </linearGradient>
    <!-- ocean light -> ocean -->
    <linearGradient id="cavaliere_shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
  </defs>
  <g id="character">
    <g id="plume">
      <path d="M128 66 C122 48 128 30 146 24 C142 34 150 42 140 52 C150 52 150 62 140 66 Z" fill="#F46F61" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M134 56 C134 46 138 38 144 32" fill="none" stroke="#F8A9A0" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="feet">
      <ellipse cx="104" cy="208" rx="15" ry="9" fill="#7E8A99" stroke="#4B372F" stroke-width="2.5"/>
      <ellipse cx="152" cy="208" rx="15" ry="9" fill="#7E8A99" stroke="#4B372F" stroke-width="2.5"/>
    </g>
    <g id="body">
      <path d="M128 64 C168 64 192 92 192 130 C192 168 168 202 128 202 C88 202 64 168 64 130 C64 92 88 64 128 64 Z" fill="url(#cavaliere_steel)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M66 140 C96 150 160 150 190 140" fill="none" stroke="#7E8A99" stroke-width="3" stroke-linecap="round"/>
      <path d="M128 66 L128 92" stroke="#7E8A99" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="92" cy="96" rx="9" ry="16" fill="#FFFFFF" opacity="0.7" transform="rotate(30 92 96)"/>
    </g>
    <g id="visor">
      <rect x="92" y="98" width="72" height="40" rx="18" fill="url(#cavaliere_skin)" stroke="#4B372F" stroke-width="3.5"/>
    </g>
    <g id="face">
      <ellipse cx="104" cy="126" rx="7" ry="4.5" fill="#FDA4AF" opacity="0.55"/>
      <ellipse cx="152" cy="126" rx="7" ry="4.5" fill="#FDA4AF" opacity="0.55"/>
      <ellipse cx="114" cy="115" rx="6.5" ry="8.5" fill="#3C2D33"/>
      <ellipse cx="142" cy="115" rx="6.5" ry="8.5" fill="#3C2D33"/>
      <ellipse cx="116.2" cy="112" rx="2.2" ry="2.8" fill="#FFFFFF"/>
      <ellipse cx="144.2" cy="112" rx="2.2" ry="2.8" fill="#FFFFFF"/>
      <path d="M120 128 Q128 134 136 128" fill="none" stroke="#6D474D" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="emblem">
      <path d="M128 156 L134 168 L147 169 L137 177 L141 190 L128 183 L115 190 L119 177 L109 169 L122 168 Z" fill="#FFC234" stroke="#4B372F" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <g id="shield">
      <path d="M48 140 C60 146 74 146 84 140 C86 166 78 182 66 190 C54 182 46 166 48 140 Z" fill="url(#cavaliere_shield)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M66 152 L69 160 L77 160 L71 165 L73 173 L66 168 L59 173 L61 165 L55 160 L63 160 Z" fill="#FFF6E3" stroke="#4B372F" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g id="hand">
      <ellipse cx="190" cy="160" rx="11" ry="10" fill="#A9B4C2" stroke="#4B372F" stroke-width="3"/>
    </g>
  </g>
</svg>
