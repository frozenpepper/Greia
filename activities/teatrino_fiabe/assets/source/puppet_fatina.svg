      <path d="M158 168 L184 118" stroke="#D99A5E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M186 96 L191 107 L203 108 L194 116 L197 128 L186 121 L175 128 L178 116 L169 108 L181 107 Z" fill="#FFC234" stroke="#4B372F" stroke-width="2.8" stroke-linejoin="round"/>
