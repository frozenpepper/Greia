      <path d="M98 150 C76 156 58 172 68 184 C78 194 96 176 102 158 Z" fill="#E8DDF7" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
      <path d="M158 150 C180 156 198 172 188 184 C178 194 160 176 154 158 Z" fill="#E8DDF7" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
