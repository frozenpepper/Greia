      <ellipse cx="128" cy="106" rx="38" ry="36" fill="url(#fatina_skin)" stroke="#4B372F" stroke-width="3.5"/>
      <path d="M90 104 C92 82 108 70 128 70 C148 70 164 82 166 104 C156 94 146 90 136 92 C132 84 124 84 120 92 C110 90 100 94 90 104 Z" fill="#B9773F" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
