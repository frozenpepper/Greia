<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Teatrino puppet: the Fairy (non-canonical; section 20 grammar: one round dress mass,
       two flaps, 3 cues = wings, star wand, hair bun). Rod puppet: no shadow. -->
  <defs>
    <!-- leaf light (mix 55% white) -> leaf light (mix 30% white) -->
    <linearGradient id="fatina_dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6E8CC"/>
      <stop offset="1" stop-color="#8ACD96"/>
    </linearGradient>
    <!-- skin light -> skin -->
    <linearGradient id="fatina_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E8"/>
      <stop offset="1" stop-color="#FBDCC8"/>
    </linearGradient>
  </defs>
  <g id="character">
    <g id="wings">
      <path d="M100 132 C70 96 38 104 44 132 C48 152 74 156 100 144 Z" fill="#E8DDF7" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
