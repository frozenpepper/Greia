<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 96" width="112" height="96">
  <!-- Bottega delle Misure: crate of wooden unit blocks (tap to take one). -->
  <defs>
    <!-- orange shade light -> orange shade -->
    <linearGradient id="crate_slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7AE6E"/>
      <stop offset="1" stop-color="#C98136"/>
    </linearGradient>
    <!-- blocks: orange light steps -->
    <linearGradient id="crate_block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE3C2"/>
      <stop offset="1" stop-color="#F6B56C"/>
    </linearGradient>
  </defs>
  <g id="blocks" fill="url(#crate_block)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round">
    <rect x="14" y="14" width="30" height="30" rx="5" transform="rotate(-8 29 29)"/>
    <rect x="42" y="8" width="30" height="30" rx="5"/>
    <rect x="68" y="14" width="30" height="30" rx="5" transform="rotate(10 83 29)"/>
  </g>
  <g id="box" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round">
    <rect x="4" y="34" width="104" height="58" rx="8" fill="url(#crate_slat)"/>
    <path d="M6 53 H106 M6 72 H106" fill="none" stroke="#976433" stroke-width="2.5"/>
    <path d="M24 36 V90 M88 36 V90" fill="none" stroke="#976433" stroke-width="2.5"/>
    <path d="M12 42 H50" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
