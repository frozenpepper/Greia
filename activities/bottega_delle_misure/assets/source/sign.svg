<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 224" width="196" height="224">
  <!-- Bottega delle Misure: job card pinned over the workshop tool board; the goal pictogram is painted on the cream face (x 18-178, y 26-206) at runtime. -->
  <defs>
    <!-- orange light -> orange -->
    <linearGradient id="sign_frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C288"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
  </defs>
  <g id="board">
    <rect x="3" y="6" width="190" height="214" rx="24" fill="url(#sign_frame)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="16" y="24" width="164" height="184" rx="16" fill="#FFFBEB" stroke="#976433" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 14 H112" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g id="pins" fill="#F46F61" stroke="#4B372F" stroke-width="3">
    <circle cx="26" cy="16" r="7"/>
    <circle cx="170" cy="16" r="7"/>
  </g>
</svg>
