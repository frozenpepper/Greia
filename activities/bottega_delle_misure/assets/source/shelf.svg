<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 96" width="656" height="96">
  <!-- Bottega delle Misure: plain wall shelf (same footprint as the measuring board, no block groove) for lining parcels up. -->
  <defs>
    <!-- orange light -> orange light 2 (pine plank) -->
    <linearGradient id="shelf_plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CB98"/>
      <stop offset="1" stop-color="#E9A863"/>
    </linearGradient>
  </defs>
  <g id="brackets" fill="#C98136" stroke="#4B372F" stroke-width="3" stroke-linejoin="round">
    <path d="M40 40 L40 94 L86 40 Z"/>
    <path d="M616 40 L616 94 L570 40 Z"/>
  </g>
  <g id="plank">
    <rect x="2" y="2" width="652" height="40" rx="10" fill="url(#shelf_plank)" stroke="#4B372F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M14 11 H200" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M260 26 C330 22 420 30 520 25" fill="none" stroke="#C98A4C" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
