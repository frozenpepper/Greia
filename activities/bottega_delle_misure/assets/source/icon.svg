    <path d="M66 152 L66 196 M129 114 L129 196 M191 74 L191 196" fill="none" stroke="#FFFBEB" stroke-width="8"/>
    <rect x="34" y="142" width="64" height="16" rx="5" fill="#89B8E6"/><rect x="100" y="104" width="58" height="16" rx="5" fill="#93D19E"/><rect x="162" y="64" width="58" height="16" rx="5" fill="#E691AE"/>
    <path d="M45 168 L45 186 M111 130 L111 150 M173 90 L173 112" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.6"/>
