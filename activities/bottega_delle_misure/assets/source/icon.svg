<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  
  <!-- Parcel / Gift Box -->
  <rect x="52" y="56" width="152" height="100" rx="14" fill="url(#box)" stroke="#ca8a04" stroke-width="4"/>
  <!-- Ribbon Vertical -->
  <rect x="114" y="56" width="28" height="100" fill="#f43f5e"/>
  <!-- Ribbon Horizontal -->
  <rect x="52" y="94" width="152" height="24" fill="#f43f5e"/>
  <!-- Bow on top -->
  <ellipse cx="106" cy="48" rx="16" ry="10" fill="#fb7185"/>
  <ellipse cx="150" cy="48" rx="16" ry="10" fill="#fb7185"/>
  <circle cx="128" cy="48" r="8" fill="#e11d48"/>

  <!-- Wooden Ruler / Measuring Rail below -->
  <rect x="36" y="174" width="184" height="42" rx="8" fill="url(#wood)" stroke="#78350f" stroke-width="3"/>
  <!-- Ruler Unit Ticks & Blocks -->
  <!-- Block 1 -->
  <rect x="42" y="180" width="38" height="30" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="61" y="202" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">1</text>
  <!-- Block 2 -->
  <rect x="84" y="180" width="38" height="30" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="103" y="202" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">2</text>
  <!-- Block 3 -->
  <rect x="126" y="180" width="38" height="30" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="145" y="202" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">3</text>
  <!-- Empty rail slot 4 -->
  <rect x="168" y="180" width="46" height="30" rx="4" fill="#92400e" opacity="0.6"/>
</svg>
