<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Nanna delle Nuvolette: awake little cloud (soft round eyes, small smile). Cast eye/mouth vocabulary. -->
  <g id="face">
    <g id="cheeks">
      <ellipse cx="86" cy="142" rx="11" ry="6.5" fill="#FDA4AF" opacity="0.55"/>
      <ellipse cx="170" cy="142" rx="11" ry="6.5" fill="#FDA4AF" opacity="0.55"/>
    </g>
    <g id="eyes">
      <ellipse cx="105" cy="126" rx="7" ry="8" fill="#342C35"/>
      <ellipse cx="151" cy="126" rx="7" ry="8" fill="#342C35"/>
      <circle cx="102.5" cy="122.5" r="2.6" fill="#FFFFFF"/>
      <circle cx="148.5" cy="122.5" r="2.6" fill="#FFFFFF"/>
    </g>
    <g id="mouth">
      <path d="M120 142 Q128 149 136 142" fill="none" stroke="#72513F" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
