<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Nanna delle Nuvolette (Cloud Bedtime) icon: a sleepy little cloud tucked under a
       starry quilt, crescent moon. Tile hue = play -> ocean. Recipe: GREIA_SVG_AUTHORING_RULES. -->
  <defs>
    <!-- ocean light (mix 35% white) -> ocean -->
    <linearGradient id="nanna_icon_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89B8E6"/>
      <stop offset="1" stop-color="#4A91D8"/>
    </linearGradient>
    <!-- white -> lavender light -->
    <linearGradient id="nanna_icon_cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E2F4"/>
    </linearGradient>
    <!-- raspberry light (mix 35% white) -> raspberry -->
    <linearGradient id="nanna_icon_quilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E691AE"/>
      <stop offset="1" stop-color="#D85683"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#nanna_icon_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#253B59" opacity="0.28"/>
  </g>
  <g id="accent">
    <path d="M214 36 A28 28 0 1 0 214 88 A30 30 0 0 1 214 36 Z" fill="#FFF1C2" stroke="#9A742A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M62.0 45.0 L65.7 53.0 L74.4 54.0 L67.9 59.9 L69.6 68.5 L62.0 64.2 L54.4 68.5 L56.1 59.9 L49.6 54.0 L58.3 53.0 Z" fill="#FBBF24" stroke="#9A742A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="120" cy="44" r="4" fill="#FFFBEB" opacity="0.9"/>
  </g>
  <g id="subject" transform="translate(28 24) scale(0.78)">
    <path d="M58 206 C24 206 16 153 46 141 C40 98 76 74 104 93 C112 52 166 45 180 88 C210 79 238 108 226 144 C250 156 244 206 214 206 Z" fill="url(#nanna_icon_cloud)" stroke="#4B372F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M58 139 C62 120 74 108 88 105" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="86" cy="140" rx="12" ry="7" fill="#FDA4AF" opacity="0.6"/>
    <ellipse cx="170" cy="140" rx="12" ry="7" fill="#FDA4AF" opacity="0.6"/>
    <path d="M92 122 Q105 133 118 122 M138 122 Q151 133 164 122" fill="none" stroke="#342C35" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M30 170 Q128 146 226 170 Q238 174 238 186 L240 226 Q222 240 204 228 Q186 240 168 228 Q150 240 132 228 Q114 240 96 228 Q78 240 60 228 Q40 240 16 226 L18 186 Q18 174 30 170 Z" fill="url(#nanna_icon_quilt)" stroke="#4B372F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M18 192 Q128 168 238 192" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 178 Q60 170 80 166" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M96.0 197.0 L100.2 206.2 L110.3 207.4 L102.8 214.2 L104.8 224.1 L96.0 219.2 L87.2 224.1 L89.2 214.2 L81.7 207.4 L91.8 206.2 Z M160.0 197.0 L164.2 206.2 L174.3 207.4 L166.8 214.2 L168.8 224.1 L160.0 219.2 L151.2 224.1 L153.2 214.2 L145.7 207.4 L155.8 206.2 Z" fill="#FBBF24" stroke="#9A742A" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
