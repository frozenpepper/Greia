<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="#818cf8" stroke-width="12" />

  <!-- Crescent Moon in Top Right -->
  <path d="M 380 90 A 45 45 0 1 0 425 150 A 35 35 0 1 1 380 90 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3" />

  <!-- Floating Stars -->
  <polygon points="120,130 126,145 142,146 130,156 134,171 120,162 106,171 110,156 98,146 114,145" fill="#fde047" />
  <polygon points="280,100 284,112 296,113 287,121 290,133 280,126 270,133 273,121 264,113 276,112" fill="#fde047" />
  <polygon points="340,210 344,220 355,221 346,228 349,239 340,232 331,239 334,228 325,221 336,220" fill="#fde047" />

  <!-- Sleeping Cloud Group -->
  <g filter="url(#shadow)">
    <!-- Cloud Body -->
    <path d="M 170 340 C 130 340 100 310 100 270 C 100 235 125 205 160 200 C 175 160 215 130 265 130 C 320 130 365 165 375 210 C 405 215 430 240 430 275 C 430 315 395 340 355 340 Z" fill="url(#cloudGrad)" stroke="#c7d2fe" stroke-width="8" />

    <!-- Rosy Cheeks -->
    <ellipse cx="190" cy="270" rx="16" ry="10" fill="#fbcfe8" />
    <ellipse cx="320" cy="270" rx="16" ry="10" fill="#fbcfe8" />

    <!-- Sleeping Eyes (curved arcs) -->
    <path d="M 195 245 Q 210 258 225 245" fill="none" stroke="#4338ca" stroke-width="6" stroke-linecap="round" />
    <path d="M 285 245 Q 300 258 315 245" fill="none" stroke="#4338ca" stroke-width="6" stroke-linecap="round" />

    <!-- Sweet Smiling Mouth -->
    <path d="M 245 270 Q 255 280 265 270" fill="none" stroke="#4338ca" stroke-width="5" stroke-linecap="round" />

    <!-- Cozy Blanket wrapped across bottom of cloud -->
    <path d="M 110 290 C 110 290 140 280 255 280 C 370 280 410 290 410 290 C 410 290 420 370 360 380 C 300 390 210 390 150 380 C 100 370 110 290 110 290 Z" fill="url(#blanketGrad)" stroke="#f43f5e" stroke-width="6" />

    <!-- Blanket Star Patterns -->
    <polygon points="180,330 183,338 191,339 185,344 187,352 180,347 173,352 175,344 169,339 177,338" fill="#fef08a" />
    <polygon points="260,325 263,333 271,334 265,339 267,347 260,342 253,347 255,339 249,334 257,333" fill="#fef08a" />
    <polygon points="340,330 343,338 351,339 345,344 347,352 340,347 333,352 335,344 329,339 337,338" fill="#fef08a" />
  </g>
</svg>
