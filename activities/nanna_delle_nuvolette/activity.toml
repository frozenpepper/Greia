[activity]
id = "org.greia.nanna-delle-nuvolette"
legacy_ids = []
title_key = "activity.nanna_delle_nuvolette.title"
version = "0.2.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["play", "explore"]
discovery_tags = ["care", "nature"]

[education]
# A calm wind-down: three sleepy clouds each dream of a blanket (shown in a
# dream bubble). The child tucks every cloud in with the blanket it dreams
# of: same colour, and from the third rung on the same small number of stars
# (1-3, then 1-5; the dream shows the stars as a dice face, the blankets in a
# row, so the number is compared, not the picture). Blankets that are not
# dreamed of are declined kindly and stay in the tray. One finite night of
# three clouds; a five-rung ladder adapts from the misses of each night.
categories = ["color_shape_matching", "early_math", "sensory_calm"]
difficulty = 1
recommended_age_min = 3
difficulty_min = 1
difficulty_max = 5
adaptive_difficulty = true
skills = [
  { id = "cognition.matching.color", weight = 3 },
  { id = "math.small_sets", weight = 3 },
  { id = "math.quantity.subitizing", weight = 2 },
  { id = "sensory.calm_engagement", weight = 2 },
]
events = [
  { id = "cloud.rest_completed", kind = "completion" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "hybrid"

[requirements]
required_capabilities = ["display", "pointer"]
optional_capabilities = ["keyboard", "touch", "audio.basic"]

[permissions]
requested = []

[storage]
schema_version = 1
