<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="monster_fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Background sparkles -->
  <circle cx="48" cy="48" r="4" fill="#fef08a" opacity="0.8"/>
  <circle cx="208" cy="64" r="5" fill="#fef08a" opacity="0.8"/>
  <circle cx="36" cy="190" r="3" fill="#a78bfa" opacity="0.8"/>
  <circle cx="220" cy="180" r="4" fill="#a78bfa" opacity="0.8"/>

  <!-- Monster Horn -->
  <polygon points="128,32 112,88 144,88" fill="url(#horn)" filter="url(#shadow)"/>
  <line x1="118" y1="52" x2="138" y2="52" stroke="#d97706" stroke-width="2"/>
  <line x1="115" y1="70" x2="141" y2="70" stroke="#d97706" stroke-width="2"/>

  <!-- Monster fluffy body -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="148" r="68" fill="url(#monster_fur)"/>
    <circle cx="84" cy="130" r="28" fill="url(#monster_fur)"/>
    <circle cx="172" cy="130" r="28" fill="url(#monster_fur)"/>
    <circle cx="96" cy="180" r="24" fill="url(#monster_fur)"/>
    <circle cx="160" cy="180" r="24" fill="url(#monster_fur)"/>
  </g>

  <!-- Fluffy texture highlights -->
  <circle cx="128" cy="115" r="50" fill="#fbcfe8" opacity="0.3"/>

  <!-- Cute big eye (Cyclops with star highlight) -->
  <ellipse cx="128" cy="136" rx="26" ry="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="128" cy="138" r="14" fill="#1e1b4b"/>
  <circle cx="123" cy="132" r="5" fill="#ffffff"/>
  <circle cx="134" cy="144" r="2" fill="#ffffff"/>

  <!-- Rosy blush cheeks -->
  <ellipse cx="86" cy="154" rx="10" ry="7" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="170" cy="154" rx="10" ry="7" fill="#f43f5e" opacity="0.6"/>

  <!-- Cheerful mouth with tiny snaggle tooth -->
  <path d="M 112 174 Q 128 190 144 174" fill="none" stroke="#831843" stroke-width="4" stroke-linecap="round"/>
  <polygon points="120,176 126,176 123,183" fill="#ffffff"/>

  <!-- Golden bowtie -->
  <polygon points="112,216 128,222 112,228" fill="#f59e0b"/>
  <polygon points="144,216 128,222 144,228" fill="#f59e0b"/>
  <circle cx="128" cy="222" r="5" fill="#fbbf24"/>
</svg>
