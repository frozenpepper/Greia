[activity]
id = "org.greia.shape-garden"
legacy_ids = ["shape_garden"]
title_key = "activity.shape_garden.title"
version = "0.1.0"
icon = "package:assets/icon.png"
languages = ["*"]

[presentation]
categories = ["create", "learn"]
discovery_tags = ["drawing", "making"]

[education]
categories = ["creativity", "geometry", "fine_motor"]
difficulty = 2
recommended_age_min = 3
# Free composition with eight named shapes: the child chooses, drags, sizes,
# turns, recolours and layers each one; optional ghost pictures (house,
# flower, ...) ask for a shape by its outline. No right/wrong, no rounds.
skills = [
  { id = "creativity.visual_composition", weight = 3 },
  { id = "math.geometry.shape_recognition", weight = 2 },
  { id = "motor.pointer.control", weight = 2 },
]
events = [
  { id = "creation.completed", kind = "creation" },
]

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "pointer"

[requirements]
required_capabilities = ["display", "pointer"]
optional_capabilities = ["touch"]

[permissions]
requested = []

[storage]
schema_version = 1

[creations]
# Deliberate share publishes one flattened 1024x600 "composition" PNG;
# autosaved gardens stay private. A child's PNG from My Creations can become
# the garden backdrop (kept as an independent private copy).
produces = ["image/png"]
consumes = ["image/png"]
