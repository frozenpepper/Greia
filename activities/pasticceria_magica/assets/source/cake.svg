<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <!-- Pasticceria Magica private prop: plain round layer cake on a plate, the child's decorating surface.
       The frosting top is the ellipse cx 210 cy 110 rx 190 ry 70 (pasticceria_layout relies on it). -->
  <defs>
    <!-- orange light (mix 70% white) -> orange light (mix 45% white): sponge -->
    <linearGradient id="cake_sponge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCE6CC"/>
      <stop offset="1" stop-color="#F8C891"/>
    </linearGradient>
    <!-- raspberry light (mix 65% white) -> raspberry light (mix 45% white): frosting -->
    <linearGradient id="cake_icing_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9DCE6"/>
      <stop offset="1" stop-color="#F3BFD2"/>
    </linearGradient>
    <!-- sky light -> sky: plate -->
    <linearGradient id="cake_plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEFF9"/>
    </linearGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="210" cy="293" rx="176" ry="9" fill="#6A5147" opacity="0.14"/>
  </g>
