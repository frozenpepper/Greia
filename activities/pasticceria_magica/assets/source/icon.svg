<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pasticceria Magica Activity icon: learn Collection (orange tile), a frosted cake with three strawberries
       on top (counting toppings for a customer's order) and one sparkle. -->
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="bakery_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BE7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- orange light (70% white) -> orange light (45% white) -->
    <linearGradient id="bakery_sponge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCE6CC"/>
      <stop offset="1" stop-color="#F8C891"/>
    </linearGradient>
    <!-- raspberry light 65% -> 45% white -->
    <linearGradient id="bakery_icing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9DCE6"/>
      <stop offset="1" stop-color="#F3BFD2"/>
    </linearGradient>
    <!-- library strawberry light -> red -->
    <linearGradient id="bakery_berry" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
