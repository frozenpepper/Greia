[activity]
id = "org.greia.workshop-settings"
legacy_ids = ["workshop_settings"]
title_key = "activity.workshop_settings.title"
version = "0.3.0"
icon = "package:assets/icon.png"
languages = ["it", "en"]

[presentation]
categories = ["my_greia"]
discovery_tags = ["settings"]

[education]
categories = ["creativity", "self_expression", "digital_literacy"]
difficulty = 1
recommended_age_min = 3
skills = [
  { id = "independence.choice_making", weight = 2 },
  { id = "creativity.visual_design", weight = 2 },
  { id = "digital.settings.personalization", weight = 2 },
]
events = []

[runtime]
type = "python"
api_version = "0.1"
entrypoint = "main.py"

[input]
profile = "navigation"

[requirements]
required_capabilities = ["display"]
optional_capabilities = ["pointer", "keyboard", "touch", "controller", "audio.basic", "removable_media"]

[permissions]
requested = [
  "customization.manage",
  "profile.manage_own",
  "removable_media.read",
]

[storage]
schema_version = 1
