<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Il Bosco dei Numeri di Tito (Tito's Number Forest) Activity icon: a big numeral 3 half traced with the green start dot, beside a three-cell frame holding three acorns. Flat tile recipe (GREIA_SVG_AUTHORING_RULES §7, learn -> orange). -->
  <defs>
    <!-- orange light (mix 35% white) -> orange -->
    <linearGradient id="bosco_icon_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
    <!-- orange light -> orange (shared prop.nature.acorn nut) -->
    <linearGradient id="bosco_icon_nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BD7E"/>
      <stop offset="1" stop-color="#F39A38"/>
    </linearGradient>
  </defs>
  <g id="tile_bg">
    <rect width="256" height="256" rx="48" fill="url(#bosco_icon_tile)"/>
    <rect x="22" y="22" width="212" height="212" rx="34" fill="#FFF6E3" opacity="0.22"/>
  </g>
  <g id="shadow">
    <ellipse cx="96" cy="216" rx="58" ry="8" fill="#9A5F2C" opacity="0.18"/>
    <ellipse cx="201" cy="216" rx="30" ry="6" fill="#9A5F2C" opacity="0.18"/>
  </g>
  <g id="subject" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56.3 69.6 A40.5 37.5 0 1 1 93 123 A46.5 37.5 0 1 1 49.3 173.3" stroke="#4B372F" stroke-width="40"/>
    <path d="M56.3 69.6 A40.5 37.5 0 1 1 93 123 A46.5 37.5 0 1 1 49.3 173.3" stroke="#FFFBEB" stroke-width="29"/>
    <path d="M56.3 69.6 A40.5 37.5 0 1 1 93 123" stroke="#9464C9" stroke-width="19"/>
    <path d="M70 56 C80 49 96 49 106 54" stroke="#BE9FE0" stroke-width="5"/>
  </g>
  <g id="accent">
    <circle cx="93" cy="123" r="16" fill="#FFFBEB" stroke="#4B372F" stroke-width="4"/>
    <circle cx="93" cy="123" r="9" fill="#59B86A" stroke="#4B372F" stroke-width="3"/>
    <rect x="172" y="54" width="58" height="160" rx="14" fill="#C5AF97" stroke="#4B372F" stroke-width="4"/>
    <rect x="172" y="48" width="58" height="160" rx="14" fill="#EEDDBA" stroke="#4B372F" stroke-width="4"/>
    <rect x="179" y="56" width="44" height="44" rx="11" fill="#FFFBEB" stroke="#4B372F" stroke-width="3"/>
    <rect x="179" y="106" width="44" height="44" rx="11" fill="#FFFBEB" stroke="#4B372F" stroke-width="3"/>
    <rect x="179" y="156" width="44" height="44" rx="11" fill="#FFFBEB" stroke="#4B372F" stroke-width="3"/>
    <g id="acorn_1" transform="translate(201 81)">
      <path d="M-12 -1 C-12 10 -6 18 0 20 C6 18 12 10 12 -1 Z" fill="url(#bosco_icon_nut)" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -15 C0 -19 2 -22 5 -24" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
      <path d="M-16 -1 C-16 -10 -9 -15 0 -15 C9 -15 16 -10 16 -1 C16 2 12 3 0 3 C-12 3 -16 2 -16 -1 Z" fill="#B45309" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="acorn_2" transform="translate(201 131)">
      <path d="M-12 -1 C-12 10 -6 18 0 20 C6 18 12 10 12 -1 Z" fill="url(#bosco_icon_nut)" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -15 C0 -19 2 -22 5 -24" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
      <path d="M-16 -1 C-16 -10 -9 -15 0 -15 C9 -15 16 -10 16 -1 C16 2 12 3 0 3 C-12 3 -16 2 -16 -1 Z" fill="#B45309" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="acorn_3" transform="translate(201 181)">
      <path d="M-12 -1 C-12 10 -6 18 0 20 C6 18 12 10 12 -1 Z" fill="url(#bosco_icon_nut)" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -15 C0 -19 2 -22 5 -24" fill="none" stroke="#4B372F" stroke-width="4" stroke-linecap="round"/>
      <path d="M-16 -1 C-16 -10 -9 -15 0 -15 C9 -15 16 -10 16 -1 C16 2 12 3 0 3 C-12 3 -16 2 -16 -1 Z" fill="#B45309" stroke="#4B372F" stroke-width="3" stroke-linejoin="round"/>
