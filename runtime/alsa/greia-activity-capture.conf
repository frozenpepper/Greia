# Greia Activity capture-route composition (ADR 0031).
#
# Injected per-launch through ALSA_CONFIG_PATH for audio.basic launches whose
# effective microphone processing mode is not off. It composes the Activity's
# ALSA view so the SDL-enumerated capture device carries the Greia route:
# SDL cannot open arbitrary ALSA PCM names, and raw `hw:` hints resolve
# outside Greia's route boundary.
#
# Hook order matters: alsa.conf loads first, then the Greia overrides replace
# the enumeration-relevant definitions. Processing-off launches receive no
# injection at all and keep the raw system ALSA view.

@hooks [
	{ func load files [ "/usr/share/alsa/alsa.conf" ] }
	{ func load files [ "/opt/greia-os/runtime/alsa/greia-activity-overrides.conf" ] }
]
