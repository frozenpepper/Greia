# Greia Activity ALSA route overrides (ADR 0031).
#
# Loaded after alsa.conf by greia-activity-capture.conf. Inside routed
# Activity processes only:
#
# - extended name hints are disabled so SDL does not enumerate raw `hw:`
#   devices that would bypass the Greia route;
# - `sysdefault` becomes the Greia-routed device: capture flows through the
#   platform-owned lightweight denoise endpoint, playback stays on the
#   requested raw hardware.
#
# The physical capture slave below is Greia-owned configuration and must stay
# hidden behind the logical endpoint name; Activities only ever see the SDL
# device designated by the Greia Activity SDK.

defaults.namehint.extended off

pcm.!sysdefault {
	@args [ CARD DEV ]
	@args.CARD { default 0 }
	@args.DEV { default 0 }
	type asym
	playback.pcm {
		type plug
		slave.pcm {
			type hw
			CARD $CARD
			DEV $DEV
		}
	}
	capture.pcm {
		type plug
		slave.pcm {
			type greia_denoise
			slave {
				pcm "plughw:CARD=0,DEV=0"
			}
		}
	}
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "Greia routed capture"
	}
}
