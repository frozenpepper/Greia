# Greia Activity ALSA route overrides (ADR 0031).
#
# Loaded after alsa.conf by greia-activity-capture.conf. Inside routed
# Activity processes only:
#
# - extended name hints are disabled so SDL does not enumerate raw `hw:`
#   devices that would bypass the Greia route;
# - `default` resolves to one Greia-routed asymmetric PCM: capture flows
#   through the platform-owned lightweight denoise endpoint, playback stays
#   on the raw hardware. SDL/pygame can only open devices it enumerates by
#   display name, and its enumeration preference ends at the bare `default`
#   PCM — which is exactly the routed definition;
# - `sysdefault` resolves to the same route without generating a hint that
#   could shadow it.
#
# The capture side references the single Greia-owned `greia_mic_light`
# definition from /etc/asound.conf (alsa.conf loads it before this file), so
# the physical slave and the denoise stage are defined exactly once. Playback
# stays on the raw dmix of ALSA's default card, the same card the capture
# endpoint follows; no card index is hard-coded here.

defaults.namehint.extended off

pcm.!default {
	type asym
	playback.pcm {
		type plug
		slave.pcm {
			@func concat
			strings [ "dmix:CARD=" { @func refer name defaults.pcm.card } ]
		}
	}
	capture.pcm "greia_mic_light"
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "Greia routed audio"
	}
}

pcm.!sysdefault "greia_routed_audio"

pcm.greia_routed_audio {
	type asym
	playback.pcm {
		type plug
		slave.pcm {
			@func concat
			strings [ "dmix:CARD=" { @func refer name defaults.pcm.card } ]
		}
	}
	capture.pcm "greia_mic_light"
}
