schema_version = 1

# Per-Activity containment is adaptive on modern Greia. The byte value is the
# compatibility/minimum floor; the effective namespace quota is the larger of
# this floor and the fraction of the actual writable profile-data filesystem.
# The separate shared VolumeBudget remains the aggregate machine safety limit.
namespace_quota_bytes = 33554432       # 32 MiB minimum/fallback floor
namespace_quota_fraction = 0.25         # 2 GiB on an 8 GiB writable volume
max_kv_bytes = 2097152                  # 2 MiB
max_kv_value_bytes = 262144             # 256 KiB
max_key_bytes = 128
max_file_bytes = 16777216               # 16 MiB
max_files = 512
max_path_bytes = 512
protected_free_bytes = 67108864          # legacy schema-v1 field; machine headroom is owned by shared VolumeBudget (75% used ceiling + 512 MiB free floor)
max_rollback_snapshots = 2
