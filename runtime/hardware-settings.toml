schema_version = 1

[defaults]
# Tap-to-click is enabled for responsive navigation.
touchpad_tap = true
touchpad_speed = 0.5
mouse_speed = 0.5
natural_scrolling = false
resolution = "auto"
keyboard_layout = "us"
mic_gain = 2.0

[limits]
minimum_speed = -1.0
maximum_speed = 1.0
minimum_mic_gain = 0.5
maximum_mic_gain = 4.0
