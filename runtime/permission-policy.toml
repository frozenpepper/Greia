schema_version = 1

[build]
allowed_permissions = [
  "customization.manage",
  "profile.manage_own",
  "removable_media.read",
]

# Built-in privilege is origin + identity policy. A package must both be
# discovered from a BUILT_IN ActivitySource and match one of these stable IDs.
# External packages that copy these IDs receive no privileged grants.
[security.built_in]
"org.greia.workshop-settings" = [
  "customization.manage",
  "profile.manage_own",
  "removable_media.read",
]
