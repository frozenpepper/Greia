[runtime]
api_version = "0.1"

[python]
allowed_import_roots = [
  "__future__",
  "array",
  "bisect",
  "collections",
  "colorsys",
  "contextlib",
  "copy",
  "csv",
  "dataclasses",
  "datetime",
  "decimal",
  "enum",
  "fractions",
  "functools",
  "hashlib",
  "heapq",
  "html",
  "io",
  "itertools",
  "json",
  "locale",
  "math",
  "operator",
  "pathlib",
  "PIL",
  "pygame",
  "queue",
  "random",
  "re",
  "statistics",
  "string",
  "struct",
  "textwrap",
  "time",
  "tomllib",
  "typing",
  "unicodedata",
  "uuid",
  "wave",
  "xml",
  "zipfile",
  "greia_platform",
]
forbidden_import_roots = [
  "apt",
  "ctypes",
  "ensurepip",
  "importlib",
  "multiprocessing",
  "os",
  "pip",
  "pty",
  "resource",
  "shlex",
  "shutil",
  "signal",
  "site",
  "socket",
  "subprocess",
  "sysconfig",
  "venv",
]
forbidden_path_names = [
  "__pycache__",
  ".venv",
  "dist-packages",
  "site-packages",
  "venv",
  "wheels",
]
forbidden_suffixes = [
  ".egg",
  ".pyc",
  ".whl",
]
forbidden_file_names = [
  "Pipfile",
  "Pipfile.lock",
  "poetry.lock",
  "pyvenv.cfg",
  "pyproject.toml",
  "requirements.txt",
  "setup.cfg",
  "setup.py",
  "sitecustomize.py",
  "usercustomize.py",
]

[validation]
maximum_activity_bytes = 52428800
forbidden_path_names = [
  ".git",
  ".hg",
  ".svn",
  "node_modules",
  "vendor",
  "vendored",
]
forbidden_suffixes = [
  ".app",
  ".bash",
  ".bin",
  ".class",
  ".dll",
  ".dylib",
  ".exe",
  ".jar",
  ".run",
  ".sh",
  ".so",
  ".tar",
  ".zip",
]
forbidden_file_names = []

[capabilities]
allowed = [
  "audio.basic",
  "display",
  "keyboard",
  "network",
  "pointer",
  "power.controlled_shutdown",
  "removable_media",
  "touch",
]

[permissions]
allowed = [
  "customization.manage",
  "profile.manage_own",
  "removable_media.read",
]
