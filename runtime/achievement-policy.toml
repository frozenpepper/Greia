schema_version = 1
default_locale = "en"

# Achievements are Greia-owned milestones derived from trusted history.
# Activities only emit factual events declared in activity.toml; they never
# unlock a badge directly or write this policy/state. English is the safe
# platform fallback until a catalogue entry has copy for another device locale.
#
# Optional `art` admits one Activity-owned emblem declared in that Activity's
# [achievement_art] table. The Activity still does not choose the tier/frame,
# unlock semantics, localization, library behavior or profile state.
#
# Catalogue rules (docs/design/GREIA_ACHIEVEMENTS_AND_BADGE_LIBRARY.md):
# bronze = the first time a child does something, so the first badge can
# arrive in the first session; silver = a little persistence; gold = a rare
# Greia-wide milestone. No streaks, no time-in-app, no "come back" badges.
# Every criterion below names an event the Activity already emits.

