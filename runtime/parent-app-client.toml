# Frozen pin of the browser Parent client shipped in the image.
# `repository` names the in-repo source directory (frozenpepper/Greia:parent-app).
# `revision` is the Git TREE id of the committed `parent-app/` directory
# (`git rev-parse HEAD:parent-app`), not a commit id. Do not edit by hand: after
# committing parent-app/ run tools/update_parent_client_pin.py, which rewrites
# this file, the manifest and build/overlay/usr/share/greia-parent-app/ together.
schema_version = 1
api_version = 1
repository = "frozenpepper/Greia:parent-app"
revision = "7e01bdb42834ce910154267cd45a1e35059f3779"
runtime_root = "/usr/share/greia-parent-app"
integration_state = "vendored-image-integrity-enforced"

[client]
entrypoint = "index.html"
public_shell = true
same_origin_api = "/api/v1"

[security]
allow_runtime_network_fetch = false
allow_remote_javascript = false
require_integrity_checked_build_input = true
