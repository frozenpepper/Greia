schema_version = 1

# Global reward economics are Greia-owned policy. Activity packages only declare
# factual events. Greia Stars are deliberately awarded at most once per Activity
# session for a meaningful completion/creation fact: they reward participation
# and breadth, not repeated clicks or high-frequency event farming.

[[rules]]
id = "shape-garden-creation-star"
activity_id = "org.greia.shape-garden"
event_id = "creation.completed"
once_per_session = true
reward_id = "star"
reward_delta = 1

